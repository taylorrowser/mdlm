          test: requires exact stakeholder authority and blocks the gate on an immediate question
        evidence:
          facts: "source boundary before autonomous resolution: One current open empirical QST Revision and one kernel-finalized
            source-boundary BSL containing exactly that Revision."
          links: "source boundary before autonomous resolution: Exact baseline definition membership freezes the source QST;
            source-boundary evidence membership is empty."
        selectors:
          - current-open-question-sources@1
          - source-boundaries-for@1
          - source-boundary-evidence@1
        obligations:
          - source-boundary-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - freeze-source-boundary@1
        next:
          - assignment
        budget: "source boundary before autonomous resolution: Source freezing consumes no lifecycle Correction or
          question-disposition budget."
        disposition: source boundary before autonomous resolution yields assignment. Atomic publication freezes the exact source
          before its autonomous resolver becomes current; malformed publication writes nothing.
        reuse: "source boundary before autonomous resolution: The exact source boundary remains reusable only for that QST
          Revision; a later open Revision requires a new boundary."
  - id: question-immediate-attention
    phases:
      - phase-0-wayfinding@4
