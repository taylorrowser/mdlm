contract: mdlm-phase-hardening-matrix@1
scope: Reachable positive and negative outcome classes in the bundled Phase 0-2, pilot-assessment, and bounded change profile.
semantics: Routes are grouped only when they share the same package seam, participation shape, budget, disposition, and evidence-reuse rule.
rows:
  - id: phase-0-foundation-publication
    phases: [phase-0-wayfinding@4]
    routes: [greenfield MAP, PSP, STK, candidate creation, accepted intent]
    evidence:
      facts: Current reviewed MAP/PSP/STK Revisions and exact frozen candidate or acceptance members.
      links: Candidate definition membership; accepted baseline promotes the exact candidate.
    selectors: [phase-0-foundation-members@1, complete-phase-0-intent-candidates@1, phase-0-intent-approvals-for@1]
    obligations: [initial-wayfinding-map-required@1, product-specification-required@1, stakeholder-requirements-required@1, intent-candidate-required@2, intent-approval-required@1]
    participation: {mode: autonomous, policies: [], authority: kernel-autonomous}
    resolvers: [establish-initial-wayfinding-map@1, compile-psp@2, draft-stakeholder-requirements@2, create-phase-0-intent-candidate@1, accept-phase-0-intent@1]
    next: [assignment]
    budget: No lifecycle Correction cycle is consumed.
    disposition: Each valid proposal publishes atomically; invalid proposals publish nothing.
    reuse: Exact passing Reviews and unchanged candidate members remain reusable.
    executable: {file: test/mdlm-clean-pilot-contract.test.ts, test: binds each subsequent Assignment to the doctor-checked ordinary Git commit}

  - id: contextual-review
    phases: [phase-0-wayfinding@4, phase-1-product-assurance@5, phase-2-system-definition@8, phase-2-pilot-assessment@3, phase-7-change-control@4]
    routes: [fresh Review Context, passing independent Review, failed independent Review]
    evidence:
      facts: One exact subject, complete frozen Review Context, and an immutable REV judgment.
      links: REV reviews the exact subject and contextualizes the exact BSL.
    selectors: [valid-review-contexts-for@1, passing-reviews-for@1, failing-reviews-for@1]
    obligations: [review-context-required@2, passing-review-required@2]
    participation: {mode: package-delegated, policies: [contextual-review-participation@1], authority: independent-reviewer}
    resolvers: [create-review-context@1, review-datum-in-context@2]
    next: [assignment]
    budget: Review publication does not consume a Correction cycle.
    disposition: A contract-valid unfavorable judgment publishes unchanged; malformed judgment publishes nothing.
    reuse: A Review is reusable only while its exact subject and context dependencies remain current.
    executable: {file: test/mdlm-phase-1-assurance-correction.test.ts, test: bounds VSP correction before projecting attended escalation}

  - id: phase-0-foundation-correction
    phases: [phase-0-wayfinding@4]
    routes: [initial failure, first replacement, second replacement, stakeholder-owned failure, post-attended fresh cycles]
    evidence:
      facts: Immutable failed REVs with all Findings and same-lineage replacement history.
      links: Every replacement cites all applicable causes through corrects-review; attended scope DEC justifies its replacement.
    selectors: [foundation-review-failures-at-stage@1, foundation-correction-history@1, failed-phase-0-foundation-revisions@2]
    obligations: [foundation-review-correction-required@5, foundation-review-escalation-required@2]
    participation: {mode: autonomous-then-attended, policies: [], authority: kernel-autonomous then stakeholder}
    resolvers: [revise-foundation-after-review@5, escalate-foundation-review-correction@2]
    next: [assignment, attention-required]
    budget: Two autonomous replacement-and-fresh-Review cycles; stakeholder-owned work and exhaustion attend immediately.
    disposition: Passing replacement resumes reevaluation; continued failure remains live as Attention Required.
    reuse: Failed history is retained; unrelated exact evidence is reused; changed subject context and Review are replaced.
    executable: {file: test/evaluate-bootstrap-participation.test.ts, test: preserves both autonomous foundation cycles after an attended correction}

  - id: phase-0-simplification-correction
    phases: [phase-0-wayfinding@4]
    routes: [pass, member failure, candidate failure, stakeholder-owned failure, malformed blocker, exhausted candidate]
    evidence:
      facts: Exact candidate and MAP/PSP/STK members with one candidate-centered simplification REV.
      links: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history.
    selectors: [valid-product-simplification-reviews@1, product-simplification-blockers-for-candidate@1, invalid-product-simplification-blockers-for-review@1, failed-intent-candidates@1]
    obligations: [passing-review-required@2, foundation-review-correction-required@5, intent-candidate-review-correction-required@3]
    participation: {mode: delegated-then-autonomous-or-attended, policies: [contextual-review-participation@1, intent-candidate-correction-participation@1], authority: independent-reviewer then kernel-autonomous or stakeholder}
    resolvers: [review-datum-in-context@2, revise-foundation-after-review@5, revise-intent-candidate-after-review@3]
    next: [assignment, attention-required, invalid-proposal]
    budget: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation.
    disposition: Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
    reuse: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt.
    executable: {file: test/evaluate-bootstrap-participation.test.ts, test: routes blocking candidate simplification findings to the exact member correction}

  - id: question-resolution
    phases: [phase-0-wayfinding@4]
    routes: [immediate blocking, consolidated checkpoint, empirical answer, prototype answer, unavailable evidence, defer, cancel, preferential answer]
    evidence:
      facts: Frozen QST source plus exact QST replacement and, for consequential disposition, reviewed DEC.
      links: DEC resolves the exact source and replacement; prototype evidence binds the exact Question.
    selectors: [open-questions@1, general-open-questions@1, prototype-bound-open-questions@1, applicable-question-answers-for@1, applicable-question-dispositions-for@1]
    obligations: [open-question-resolution@3, prototype-question-resolution@1, passing-review-required@2]
    participation: {mode: policy-selected, policies: [question-participation@1, contextual-review-participation@1], authority: kernel-autonomous, evidence-provider, or stakeholder}
    resolvers: [resolve-question@2, resolve-question-with-prototype@2, review-datum-in-context@2]
    next: [assignment, attention-required]
    budget: Scheduling consumes no disposition or Correction budget; Decision correction remains separately bounded.
    disposition: Answer, reviewed deferral, and reviewed cancellation close explicitly; inability publishes nothing.
    reuse: Raw conversation is ephemeral; normalized exact QST/DEC/REV evidence is retained and later Questions are reevaluated serially.
    executable: {file: test/operator-outcome.test.ts, test: projects one complete checkpoint conversation and the first exact Assignment}

  - id: consequential-decision-correction
    phases: [phase-0-wayfinding@4, phase-7-change-control@4]
    routes: [failed Question Decision Review, failed gate Decision Review, failed change disposition Review]
    evidence:
      facts: Exact attended DEC, immutable failed REV, and same-lineage replacement DEC.
      links: Replacement cites every failed Review and preserves the exact justified or resolved scope.
    selectors: [failed-question-decisions@1, failed-gate-signoff-decisions@1, failed-change-dispositions@1]
    obligations: [question-decision-review-correction-required@1, gate-signoff-review-correction-required@2, change-disposition-review-correction-required@1]
    participation: {mode: attended, policies: [consequential-decision-participation@1], authority: stakeholder}
    resolvers: [revise-question-decision-after-review@1, revise-gate-signoff-after-review@2, revise-change-disposition-after-review@1]
    next: [attention-required, assignment]
    budget: Renewed stakeholder judgment is attended immediately; no autonomous semantic rewrite is allowed.
    disposition: No Decision applies until its fresh exact Review passes.
    reuse: Decision lineage and unaffected subject evidence remain; failed judgment and replacement history are immutable.
    executable: {file: test/evaluate-bootstrap-participation.test.ts, test: routes a failed Question Decision through exact attended correction}

  - id: phase-0-gate-rejection-return
    phases: [phase-0-wayfinding@4]
    routes: [approval, reviewed rejection, member correction, candidate correction, same-gate return]
    evidence:
      facts: Exact candidate, attended gate DEC, DEC Review, canonical blockers, corrected members, and superseding candidate.
      links: Gate DEC justifies and rejection blocks the candidate or member; replacements cite corrects-gate-rejection; candidate supersedes predecessor.
    selectors: [applicable-gate-signoffs-for@1, reviewed-gate-rejections-for-subject@1, gate-rejection-corrections-for-subject@1, complete-superseding-intent-candidates-for@1]
    obligations: [candidate-gate-signoff@3, foundation-review-correction-required@5, intent-candidate-review-correction-required@3, intent-approval-required@1]
    participation: {mode: attended-gate-with-autonomous-correction, policies: [gate-signoff-participation@1, intent-candidate-correction-participation@1], authority: stakeholder at gate}
    resolvers: [record-gate-signoff@3, revise-foundation-after-review@5, revise-intent-candidate-after-review@3, accept-phase-0-intent@1]
    next: [attention-required, assignment]
    budget: Rejection consumes no Review-correction cycle; autonomous replacement budget remains exact.
    disposition: Rejection is nonterminal and returns to the same gate after fresh evidence; stop/defer/cancel are not silently inferred.
    reuse: Rejection and unaffected candidate evidence remain immutable; implicated evidence is replaced and rereviewed.
    executable: {file: test/evaluate-bootstrap-participation.test.ts, test: routes a candidate-level Phase 0 rejection to causal candidate replacement}

  - id: phase-1-assurance
    phases: [phase-1-product-assurance@5]
    routes: [VSP creation, ENV qualification, pilot VER, pass, first and second correction, stakeholder-owned failure, malformed replacement, ambiguity boundary]
    evidence:
      facts: Exact requirement, VSP, ENV qualification chain, pilot VER, Review Context, and REV history.
      links: Same-lineage replacements cite all failed REVs and retain exact governs, environment, requirement, and activity bindings.
    selectors: [current-phase-1-verification-strategies@1, complete-environment-assurance-for-strategy@1, current-pilot-verification-activities@1, corrected-phase-1-assurance-reviews-for@1]
    obligations: [verification-strategy-required@1, environment-assurance-required@2, pilot-verification-activity-required@2, verification-strategy-review-correction-required@2, environment-review-correction-required@2, pilot-verification-activity-review-correction-required@2]
    participation: {mode: autonomous-then-attended, policies: [phase-1-assurance-correction-participation@1, contextual-review-participation@1], authority: kernel-autonomous, independent-reviewer, then stakeholder}
    resolvers: [define-verification-strategy@1, realize-verification-environment@1, write-verification-activity@1, revise-verification-strategy-after-review@2, revise-environment-assurance-after-review@2, revise-pilot-verification-activity-after-review@2]
    next: [assignment, attention-required, invalid-proposal, profile-boundary-reached]
    budget: Two autonomous replacement-and-Review cycles per exact assurance lineage before attended escalation.
    disposition: Malformed causal or boundary changes reject atomically; unsupported multiplicity reaches the declared Profile Boundary.
    reuse: Exact unaffected assurance remains reusable; corrected ENV qualification and changed exact dependencies are rebuilt.
    executable: {file: test/mdlm-phase-1-assurance-correction.test.ts, test: preserves the ENV correction budget while rebuilding qualification before attention}

  - id: phase-1-public-command-evidence
    phases: [phase-1-product-assurance@5]
    routes: [target registration, source-independent VAI, run, malformed command matrix, VAI correction, timeout aggregation]
    evidence:
      facts: Boundary-complete ART command matrix, exact VAI procedure, RUN/RES observations, and immutable failed Review history.
      links: ART binds requirement; VAI realizes exact VER and binds ENV/ART; replacement cites all failed REVs; RUN executes exact VAI.
    selectors: [current-pilot-targets-for-requirement@1, complete-pilot-implementations-for-activity@1, completed-runs-for-implementation@1, corrected-pilot-verification-implementation-revisions-for@1]
    obligations: [pilot-target-required@1, pilot-verification-implementation-required@1, pilot-vai-review-correction-required@1, verification-run-required@1]
    participation: {mode: autonomous-or-package-delegated, policies: [verification-implementation-participation@1, phase-1-assurance-correction-participation@1], authority: kernel-autonomous or verification-implementer}
    resolvers: [register-pilot-target@1, implement-verification-activity@1, revise-pilot-vai-after-review@1, execute-verification-run@1]
    next: [assignment, attention-required, invalid-proposal]
    budget: VAI has two autonomous correction cycles; malformed transport consumes no lifecycle cycle.
    disposition: Incomplete command/procedure evidence rejects atomically; timeout remains an exact aggregate execution observation.
    reuse: Prior RUN/RES remains immutable but cannot satisfy a corrected VAI; exact VER/ENV/ART may remain reusable.
    executable: {file: test/mdlm-phase-1-assurance-correction.test.ts, test: corrects failed pilot VAI procedures without reusing prior run evidence}

  - id: phase-2-definition-and-simplification
    phases: [phase-2-system-definition@8]
    routes: [DWP plan, SYS outputs, ASP, plural ICSP, earliest complete context, two simplification passes]
    evidence:
      facts: Exact planning DWP, complete SYS output set, one ASP, all ICSPs, one frozen context, and both simplification REVs.
      links: Canonical source-owned parent, architecture, interface, strategy, Review, and context links bind exact Revisions.
    selectors: [phase-2-definition-members-for-plan@1, review-context-members-for@1, valid-phase-2-simplification-review@1]
    obligations: [decomposition-planning-required@1, decomposition-execution-required@1, system-architecture-required@1, interface-control-specification-required@1, decomposition-simplification-required@1, architecture-interface-simplification-required@1]
    participation: {mode: autonomous-and-package-delegated, policies: [contextual-review-participation@1], authority: kernel-autonomous or independent-reviewer}
    resolvers: [define-decomposition-work-package@2, execute-decomposition-work-package@2, define-system-architecture@2, define-interface-control-specification@2, simplify-requirement-set@2, simplify-architecture-and-interfaces@2]
    next: [assignment]
    budget: No correction consumed on the positive route.
    disposition: Completion and candidate work stay blocked until both exact simplification judgments pass.
    reuse: Exact member Reviews remain reusable while members do not change.
    executable: {file: test/req-system-decomposition.test.ts, test: "moves one bounded decomposition through exact coverage, simplification, completion, and a reviewed SYS gate"}

  - id: phase-2-simplification-correction
    phases: [phase-2-system-definition@8]
    routes: [one SYS with several Findings, exact consistency set, scope reduction, complete removal inability, malformed blocker]
    evidence:
      facts: Failed simplification REV declares one exact subject or complete consistency set and all current Findings.
      links: Canonical blocks/removes links match the typed correction scope; every replacement cites the failed REV.
    selectors: [failed-phase-2-simplification-reviews-by-scope@1, phase-2-simplification-blockers-for-review@1, phase-2-removed-outputs-for-review@1]
    obligations: [phase-2-simplification-correction-required@1, phase-2-definition-consistency-correction-required@1, passing-review-required@2]
    participation: {mode: autonomous-then-independent-review, policies: [contextual-review-participation@1], authority: kernel-autonomous then independent-reviewer}
    resolvers: [revise-phase-2-subject-after-simplification@1, revise-phase-2-definition-set-after-simplification@1, review-datum-in-context@2]
    next: [assignment, invalid-proposal]
    budget: This bounded simplification route is evidence-scoped; ordinary Review correction budget is not consumed.
    disposition: Cross-subject, incomplete, or total-removal proposals reject atomically or return typed inability.
    reuse: Unchanged definition members remain reusable; corrected set receives fresh context and both simplification judgments.
    executable: {file: test/mdlm-phase-2-simplification.test.ts, test: "atomically corrects the exact set, removes obsolete scope, requires fresh evidence, and resumes completion"}

  - id: phase-2-review-correction-and-ambiguity
    phases: [phase-2-system-definition@8]
    routes: [SYS, ASP, ICSP, planning DWP, completion DWP, collateral Finding, single-valued ambiguity, exhausted correction]
    evidence:
      facts: Exact failed subject Review or competing current single-valued Revisions with complete context.
      links: Correction cites every failed REV; ambiguity DEC justifies the exact selected/cancelled subject.
    selectors: [phase-2-correctable-subjects@1, phase-2-review-flags-subject@1, ambiguous-phase-2-subjects@1, phase-2-ambiguity-decisions-for@1]
    obligations: [phase-2-review-correction-required@1, phase-2-ambiguity-resolution-required@1, passing-review-required@2]
    participation: {mode: autonomous-then-attended, policies: [phase-2-correction-participation@1, consequential-decision-participation@1], authority: kernel-autonomous then stakeholder}
    resolvers: [revise-phase-2-subject-after-review@1, resolve-phase-2-ambiguity@1, review-datum-in-context@2]
    next: [assignment, attention-required]
    budget: Two autonomous subject replacements before attended escalation; ambiguity is attended immediately.
    disposition: No arbitrary latest or interface-cardinality collapse; every unfinished route remains actionable.
    reuse: Unaffected definition and Review evidence remains reusable; corrected or cancelled exact subject evidence reevaluates.
    executable: {file: test/evaluate-bootstrap-participation.test.ts, test: projects attended exact disposition instead of choosing ambiguous Phase 2 architecture}

  - id: phase-2-candidate-gate-acceptance
    phases: [phase-2-system-definition@8]
    routes: [DWP completion, group candidate, level candidate, candidate Review correction, reviewed rejection, gate return, exact acceptance, progression]
    evidence:
      facts: Complete DWP account, reviewed group/level candidates, reviewed gate DEC, and flattened accepted baseline.
      links: Candidates preserve exact members/evidence and supersede predecessors; acceptance promotes exact level candidate.
    selectors: [valid-decomposition-completions-for-plan@1, complete-phase-2-group-candidates@1, complete-phase-2-level-candidates@1, applicable-gate-signoffs-for@1, system-acceptance-evidence-for-candidate@1]
    obligations: [decomposition-completion-required@1, decomposition-group-candidate-required@1, system-level-candidate-required@1, phase-2-candidate-correction-required@1, candidate-gate-signoff@3, system-acceptance-required@1]
    participation: {mode: autonomous-delegated-and-attended, policies: [phase-2-correction-participation@1, gate-signoff-participation@1, phase-progression-participation@1], authority: kernel-autonomous, independent-reviewer, or stakeholder}
    resolvers: [complete-decomposition-work-package@2, create-decomposition-group-candidate@1, create-system-level-candidate@1, revise-phase-2-candidate-after-review@1, record-gate-signoff@3, accept-phase-2-system@1]
    next: [assignment, attention-required]
    budget: Candidate correction/rejection shares two autonomous cycles before attended escalation.
    disposition: Reviewed rejection is nonterminal; malformed DWP accounts reject atomically; reviewed approval enables mechanical acceptance and progression.
    reuse: Exact unaffected membership/composition remains reusable; rejected or failed candidate lineage is retained.
    executable: {file: test/req-system-decomposition.test.ts, test: "moves one bounded decomposition through exact coverage, simplification, completion, and a reviewed SYS gate"}

  - id: accepted-stakeholder-change
    phases: [phase-0-wayfinding@4, phase-7-change-control@4]
    routes: [draft correction, exact accepted boundary, impact, CHG correction, approve, reject, defer, cancel, replacement, candidate, closure]
    evidence:
      facts: Exact accepted STK/baseline roots, complete CHG impact, reviewed disposition, same-lineage replacement, selective candidate, and closure DEC.
      links: CHG impacts exact roots; DEC justifies CHG; STK changed-under CHG; candidate and closure cite all exact downstream evidence.
    selectors: [accepted-intent-baselines-for-change@1, valid-stakeholder-change-impact@2, terminal-change-disposition-decisions-for@1, revised-requirements-for-change@3, stakeholder-change-closure-evidence-for@1]
    obligations: [foundation-review-correction-required@5, change-impact-required@1, stakeholder-change-review-correction-required@2, change-approval-required@2, change-revision-required@2, stakeholder-change-candidate-required@1, change-closure-required@2]
    participation: {mode: autonomous-delegated-and-attended, policies: [consequential-decision-participation@1, stakeholder-change-correction-participation@2, contextual-review-participation@1], authority: kernel-autonomous, independent-reviewer, or stakeholder}
    resolvers: [revise-foundation-after-review@5, analyze-change-impact@2, revise-stakeholder-change-after-review@2, approve-change-request@3, revise-requirement-under-change@3, create-stakeholder-change-candidate@1, close-change-request@4]
    next: [assignment, attention-required, profile-boundary-reached]
    budget: Review corrections get two autonomous cycles; disposition is attended; reject/defer/cancel terminate only that CHG.
    disposition: Wrong accepted roots and incomplete impact reject atomically; every attended disposition closes explicitly after Review.
    reuse: Accepted history remains immutable; affected evidence becomes Stale; materially unaffected exact evidence remains reusable.
    executable: {file: test/mdlm-stakeholder-change-control.test.ts, test: keeps failed replacement and candidate Reviews live through the same Correction interface}

  - id: shared-system-change
    phases: [phase-2-system-definition@8, phase-7-change-control@4]
    routes: [two exact consumers, draft replacement, serial draft reevaluation, accepted impact, approved replacement, serial accepted reevaluation, selective candidate, closure]
    evidence:
      facts: One SYS Stable Datum, two exact DWP consumers with separate coverage, accepted baseline/CHG evidence when applicable.
      links: Consumers decompose the exact SYS Revision; replacement changed-under CHG after acceptance; each consumer replacement binds the new exact SYS.
    selectors: [system-requirements-consumed-by@1, shared-system-consumers-for-change@1, outdated-shared-system-consumers@2, shared-system-change-contexts@1]
    obligations: [shared-system-consumer-reevaluation-required@1, change-impact-required@1, change-revision-required@2, stakeholder-change-candidate-required@1, change-closure-required@2]
    participation: {mode: autonomous-delegated-and-attended, policies: [consequential-decision-participation@1, contextual-review-participation@1], authority: kernel-autonomous, independent-reviewer, or stakeholder}
    resolvers: [reevaluate-shared-system-consumer@1, analyze-change-impact@2, revise-requirement-under-change@3, create-stakeholder-change-candidate@1, close-change-request@4]
    next: [assignment, attention-required, profile-boundary-reached]
    budget: Consumers update serially through the canonical single Assignment seam; accepted replacement requires attended CHG authority.
    disposition: No consumer may be omitted and no copied SYS lineage is accepted.
    reuse: Each affected consumer/context/Review is rebuilt; materially unrelated accepted evidence remains reusable.
    executable: {file: test/mdlm-shared-system-change-control.test.ts, test: "replaces a shared accepted SYS through attended approval, serial consumer updates, a selective candidate, and exact closure"}

  - id: pilot-assessment
    phases: [phase-2-pilot-assessment@3]
    routes: [observation, assessment context, PAS, passing Review, first correction, second correction, stakeholder-owned failure, exhausted correction]
    evidence:
      facts: One observation per complete level candidate, exact frozen assessment context, current PAS, and immutable Review history.
      links: PAS measures exact context; replacements preserve Stable identity and cite every failed REV.
    selectors: [complete-pilot-observations@1, complete-pilot-assessment-contexts@1, failed-current-pilot-assessments@1, corrected-pilot-assessments-for@1]
    obligations: [pilot-observation-required@1, pilot-assessment-context-required@1, pilot-assessment-required@1, pilot-assessment-review-correction-required@1]
    participation: {mode: autonomous-then-attended, policies: [pilot-assessment-correction-participation@1, contextual-review-participation@1], authority: kernel-autonomous, independent-reviewer, then stakeholder}
    resolvers: [record-pilot-observation@2, prepare-pilot-assessment-context@1, assess-phase-0-2-pilot@1, revise-pilot-assessment-after-review@2]
    next: [assignment, attention-required]
    budget: Two autonomous PAS replacement-and-Review cycles before attended escalation.
    disposition: No expansion result applies until the current PAS passes fresh independent Review.
    reuse: Exact observations/context remain reusable; failed PAS lineage and Reviews remain immutable.
    executable: {file: test/mdlm-pilot-assessment.test.ts, test: "keeps two PAS correction cycles autonomous, then escalates the unchanged exact context"}

  - id: expansion-decision-and-terminal-outcomes
    phases: [phase-2-pilot-assessment@3, phase-7-change-control@4]
    routes: [Decision awaiting Review, failed Decision Review, proceed, change, stop]
    evidence:
      facts: Current passing PAS and Review plus exact attended Expansion DEC and its fresh passing Review.
      links: DEC justifies PAS and relies-on-review its exact REV; replacement cites failed Decision REVs.
    selectors: [recorded-pilot-expansion-decisions-for@1, pilot-expansion-decisions-for@1, all-change-requests@1]
    obligations: [pilot-expansion-decision-required@1, pilot-expansion-decision-review-correction-required@1, passing-review-required@2]
    participation: {mode: attended-then-package-delegated, policies: [contextual-review-participation@1], authority: stakeholder then independent-reviewer}
    resolvers: [decide-pilot-expansion@2, revise-pilot-expansion-decision-after-review@1, review-datum-in-context@2]
    next: [assignment, attention-required, profile-boundary-reached, lifecycle-complete]
    budget: Expansion Decision correction requires renewed attended judgment; transport retries never alter lifecycle budget.
    disposition: Reviewed proceed reaches Profile Boundary; reviewed change drains bounded Phase 7 then reaches Profile Boundary; reviewed stop reaches Lifecycle Complete.
    reuse: PAS/context/Review evidence remains exact; failed Decision lineage is retained and no omitted phase output is fabricated.
    executable: {file: test/mdlm-pilot-assessment.test.ts, test: corrects a failed Expansion Decision Review before the result becomes applicable}
