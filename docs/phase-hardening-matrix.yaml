          links: "exhausted candidate: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history."
        selectors:
          - valid-product-simplification-reviews@1
          - product-simplification-blockers-for-candidate@1
          - invalid-product-simplification-blockers-for-review@1
          - failed-intent-candidates@1
        obligations:
