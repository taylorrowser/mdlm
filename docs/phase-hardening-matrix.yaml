          authority: stakeholder
        resolvers:
          - revise-intent-candidate-after-review@3
        next:
          - attention-required
        budget: "exhausted candidate: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation."
        disposition: exhausted candidate yields attention-required. Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
        reuse: "exhausted candidate: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt."
  - id: attended-question-source-boundary
    phases:
      - phase-0-wayfinding@4
      - phase-1-product-assurance@5
      - phase-2-system-definition@8
    routes:
      - route: source boundary before attended resolution
        executable:
          file: test/operator-outcome.test.ts
          test: returns immediate attended work with an exact Assignment and Authority Requirement
        evidence:
          facts: "source boundary before attended resolution: One current open QST Revision and one kernel-finalized source-boundary BSL containing exactly that Revision."
          links: "source boundary before attended resolution: Exact baseline definition membership freezes the source QST; source-boundary evidence membership is empty."
        selectors:
          - current-open-question-sources@1
          - source-boundaries-for@1
          - source-boundary-evidence@1
        obligations:
          - source-boundary-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - freeze-source-boundary@1
        next:
          - attention-required
        budget: "source boundary before attended resolution: Source freezing consumes no lifecycle Correction or question-disposition budget."
        disposition: source boundary before attended resolution yields attention-required. Atomic publication freezes the exact source before its attended resolver becomes current; malformed publication writes nothing.
        reuse: "source boundary before attended resolution: The exact source boundary remains reusable only for that QST Revision; a later open Revision requires a new boundary."
