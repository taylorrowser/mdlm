contract: mdlm-phase-hardening-matrix@1
scope: Reachable positive and negative outcome classes in the bundled Phase 0-2, pilot-assessment, and bounded change profile.
semantics: Every route is a complete proof record. Grouping is presentation-only and never supplies inherited participation, next-outcome, budget, disposition, or evidence-reuse semantics.
rows:
  - id: assignment-response-transport
    phases:
      - phase-0-wayfinding@4
      - phase-1-product-assurance@5
      - phase-2-system-definition@8
      - phase-2-pilot-assessment@3
    routes:
      - route: first malformed response
        executable:
          file: test/mdlm-assignment.test.ts
          test: preserves the same Assignment for one malformed-response correction that can publish
          assertions:
            - correction-required
            - correct-response
            - "automaticReplacement: false"
            - "malformedResponseCorrection: 0"
        evidence:
          facts: The exact Assignment lease records the first malformed response digest and diagnostics while retaining the same Assignment identity.
          links: No Lifecycle Data or lifecycle link is accepted because Assignment Response validation precedes Scenario execution and publication.
        selectors: []
        obligations: []
        participation:
          mode: assignment-transport
          policies: []
          authority: response-contract
        resolvers: []
        next:
          - assignment
        budget: The one malformed-response correction is lease-local transport state and consumes no package-authored lifecycle Correction cycle.
        disposition: The response returns correction-required, publishes no Lifecycle Data, keeps the lease active with zero corrections remaining, and permits only a corrected response for the same Assignment.
        reuse: The exact Assignment and all clean-head package evidence remain reusable; the malformed bytes and diagnostics remain ignored operational lease evidence only.
        transport:
          lifecyclePublication: none
          leaseDisposition: active
          orchestrationAction: correct-response
          automaticReplacement: false
      - route: second malformed response
        executable:
          file: test/mdlm-assignment.test.ts
          test: exhausts the Assignment on a second malformed response and reports the terminal disposition
          assertions:
            - exhausted
            - 'action: "stop"'
            - "automaticReplacement: false"
            - malformedResponses).toHaveLength(2)
        evidence:
          facts: The same exact Assignment lease records both malformed response attempts and changes its disposition to exhausted.
          links: No Lifecycle Data or lifecycle link is accepted; the exhausted lease remains ignored operational state rather than lifecycle evidence.
        selectors: []
        obligations: []
        participation:
          mode: assignment-transport
          policies: []
          authority: response-contract
        resolvers: []
        next:
          - assignment
        budget: The second malformed response exhausts only the lease-local transport allowance and consumes no package-authored lifecycle Correction cycle.
        disposition: The response returns exhausted and stop, publishes no Lifecycle Data, makes that Assignment unavailable, and allocates no replacement until a later deliberate mdlm next reevaluates unchanged lifecycle state.
        reuse: All clean-head package evidence remains reusable; the exhausted Assignment identity is never reused and a later deliberate next allocates a fresh identity.
        transport:
          lifecyclePublication: none
          leaseDisposition: exhausted
          orchestrationAction: stop
          automaticReplacement: false
  - id: phase-0-foundation-publication
    phases:
      - phase-0-wayfinding@4
    routes:
      - route: greenfield MAP
        executable:
          file: test/mdlm-clean-pilot-contract.test.ts
          test: binds each subsequent Assignment to the doctor-checked ordinary Git commit
          assertions:
            - establish-initial-wayfinding-map@1
            - assignment-stale
        evidence:
          facts: One fresh repository with no MAP and one newly published current MAP Revision.
          links: The initial MAP has no required incoming lifecycle link; its exact Revision becomes the foundation member.
        selectors:
          - phase-0-foundation-members@1
        obligations:
          - initial-wayfinding-map-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - establish-initial-wayfinding-map@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields the PSP Assignment; malformed publication writes nothing and preserves the MAP Assignment.
        reuse: The exact MAP Revision is retained for later Review Context and candidate membership.
      - route: PSP
        executable:
          file: test/phase-hardening-domain-contracts.test.ts
          test: proves Phase 0 foundation, question, Review, correction, and gate routes semantically
          assertions:
            - phase-0-foundation-publication::PSP
        evidence:
          facts: One current MAP and one newly published PSP Revision.
          links: The PSP is compiled from the exact current wayfinding foundation selected by the package.
        selectors:
          - phase-0-foundation-members@1
        obligations:
          - product-specification-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - compile-psp@2
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields the PSP Review Context Assignment; malformed publication writes nothing.
        reuse: The current MAP remains reusable; the exact PSP requires its own fresh Review Context and Review.
      - route: STK
        executable:
          file: test/phase-hardening-domain-contracts.test.ts
          test: proves Phase 0 foundation, question, Review, correction, and gate routes semantically
          assertions:
            - phase-0-foundation-publication::STK
        evidence:
          facts: One current reviewed PSP and the newly published STK Revision.
          links: The STK derived-from link names the exact governing PSP Stable Datum.
        selectors:
          - phase-0-foundation-members@1
        obligations:
          - stakeholder-requirements-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - draft-stakeholder-requirements@2
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields fresh Review work for the STK; malformed publication writes nothing.
        reuse: Reviewed MAP and PSP evidence remains reusable; the new STK receives fresh context and Review.
      - route: candidate creation
        executable:
          file: test/phase-hardening-domain-contracts.test.ts
          test: proves Phase 0 foundation, question, Review, correction, and gate routes semantically
          assertions:
            - phase-0-foundation-publication::candidate creation
        evidence:
          facts: The complete current passing MAP, PSP, and STK definition set and one frozen intent candidate.
          links: Candidate definition membership names every exact current foundation Revision.
        selectors:
          - complete-phase-0-intent-candidates@1
        obligations:
          - intent-candidate-required@2
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - create-phase-0-intent-candidate@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields the candidate simplification/Review Assignment; incomplete membership rejects atomically.
        reuse: Exact passing member Reviews are reused as candidate evidence while their subjects remain unchanged.
      - route: accepted intent
        executable:
          file: test/phase-hardening-domain-contracts.test.ts
          test: proves Phase 0 foundation, question, Review, correction, and gate routes semantically
          assertions:
            - phase-0-foundation-publication::accepted intent
        evidence:
          facts: One exact passing intent candidate, reviewed approving gate DEC, and newly published accepted baseline.
          links: The accepted baseline promotes the exact candidate and retains its exact gate and Review evidence.
        selectors:
          - phase-0-intent-approvals-for@1
        obligations:
          - intent-approval-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - accept-phase-0-intent@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful mechanical acceptance yields the first Phase 1 Assignment; invalid promotion evidence writes nothing.
        reuse: The accepted candidate membership and reviewed authority evidence remain immutable and reusable.
