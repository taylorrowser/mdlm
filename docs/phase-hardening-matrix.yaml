    phases:
      - phase-0-wayfinding@4
      - phase-1-product-assurance@5
      - phase-2-system-definition@8
    routes:
      - route: source boundary before autonomous resolution
        executable:
          file: test/req-prototype-question-routing.test.ts
          test: preserves repeated source boundaries through charting and prototype resolution
        evidence:
          facts: "source boundary before autonomous resolution: One current open empirical QST Revision and one kernel-finalized source-boundary BSL containing exactly that Revision."
          links: "source boundary before autonomous resolution: Exact baseline definition membership freezes the source QST; source-boundary evidence membership is empty."
        selectors:
          - current-open-question-sources@1
          - source-boundaries-for@1
          - source-boundary-evidence@1
        obligations:
          - source-boundary-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - freeze-source-boundary@1
        next:
          - assignment
        budget: "source boundary before autonomous resolution: Source freezing consumes no lifecycle Correction or question-disposition budget."
        disposition: source boundary before autonomous resolution yields assignment. Atomic publication freezes the exact source before its autonomous resolver becomes current; malformed publication writes nothing.
        reuse: "source boundary before autonomous resolution: The exact source boundary remains reusable only for that QST Revision; a later open Revision requires a new boundary."
  - id: question-immediate-attention
    phases:
      - phase-0-wayfinding@4
      - phase-1-product-assurance@5
      - phase-2-system-definition@8
    routes:
      - route: immediate blocking
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: requires exact stakeholder authority and blocks the gate on an immediate question
        evidence:
          facts: "immediate blocking: One source-bounded open preferential QST whose exact target cannot proceed without stakeholder intent."
          links: "immediate blocking: The QST blocks the exact candidate or Lifecycle Datum controlled by the answer."
        selectors:
          - general-open-questions@1
          - blocked-targets-for-question@1
          - open-blocking-questions@1
        obligations:
          - open-question-resolution@3
        participation:
          mode: attended-immediate
          policies:
            - question-participation@1
          authority: stakeholder
        resolvers:
          - resolve-question@2
        next:
          - attention-required
        budget: "immediate blocking: Immediate attention consumes no lifecycle Correction or disposition budget."
        disposition: immediate blocking yields attention-required. The QST remains open and its exact target blocked until one attended Assignment publishes a valid resolution.
        reuse: "immediate blocking: The frozen QST source remains immutable; no raw stakeholder conversation is retained."
  - id: question-checkpoint-attention
    phases:
      - phase-0-wayfinding@4
      - phase-2-system-definition@8
    routes:
      - route: consolidated checkpoint
        executable:
          file: test/operator-outcome.test.ts
          test: projects one complete checkpoint conversation and the first exact Assignment
        evidence:
          facts: "consolidated checkpoint: Every compatible source-bounded open preferential QST in one declared Consolidation Group at its ready checkpoint."
          links: "consolidated checkpoint: Each QST retains its exact declared lifecycle links while the package groups only presentation."
        selectors:
          - open-questions@1
          - general-open-questions@1
        obligations:
          - open-question-resolution@3
        participation:
          mode: attended-checkpoint
          policies:
            - question-participation@1
          authority: stakeholder
        resolvers:
          - resolve-question@2
        next:
          - attention-required
        budget: "consolidated checkpoint: Consolidated presentation consumes no lifecycle Correction or disposition budget."
        disposition: consolidated checkpoint yields attention-required. One conversation publishes nothing; the first still-applicable QST receives one exact serial Assignment.
        reuse: "consolidated checkpoint: Raw conversation is ephemeral; each normalized QST result is reevaluated before the next Assignment."
  - id: empirical-question-answer
    phases:
      - phase-0-wayfinding@4
      - phase-1-product-assurance@5
      - phase-2-system-definition@8
    routes:
      - route: empirical answer
        executable:
          file: test/req-command-alias.test.ts
          test: binds typed arguments to the same validated Scenario request as direct invocation
        evidence:
          facts: "empirical answer: One source-bounded open empirical QST with available exact evidence and one same-lineage answered Revision."
          links: "empirical answer: The answer preserves the QST Stable Datum lineage; no consequential DEC is required for an empirical answer."
        selectors:
          - general-open-questions@1
          - source-boundaries-for@1
        obligations:
          - open-question-resolution@3
        participation:
          mode: autonomous
          policies:
            - question-participation@1
          authority: evidence-authority
        resolvers:
          - resolve-question@2
        next:
