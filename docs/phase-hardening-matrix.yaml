contract: mdlm-phase-hardening-matrix@1
scope: Reachable positive and negative outcome classes in the bundled Phase 0-2, pilot-assessment, and bounded change profile.
semantics: Every route is a complete proof record. Grouping is presentation-only and never supplies inherited participation, next-outcome, budget, disposition, or evidence-reuse semantics.
rows:
  - id: phase-0-foundation-publication
    phases:
      - phase-0-wayfinding@4
    routes:
      - route: greenfield MAP
        executable:
          file: test/mdlm-clean-pilot-contract.test.ts
          test: binds each subsequent Assignment to the doctor-checked ordinary Git commit
        evidence:
          facts: One fresh repository with no MAP and one newly published current MAP Revision.
          links: The initial MAP has no required incoming lifecycle link; its exact Revision becomes the foundation member.
        selectors:
          - phase-0-foundation-members@1
        obligations:
          - initial-wayfinding-map-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - establish-initial-wayfinding-map@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields the PSP Assignment; malformed publication writes nothing and preserves the MAP Assignment.
        reuse: The exact MAP Revision is retained for later Review Context and candidate membership.
      - route: PSP
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: One current MAP and one newly published PSP Revision.
          links: The PSP is compiled from the exact current wayfinding foundation selected by the package.
        selectors:
          - phase-0-foundation-members@1
        obligations:
          - product-specification-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - compile-psp@2
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields the PSP Review Context Assignment; malformed publication writes nothing.
        reuse: The current MAP remains reusable; the exact PSP requires its own fresh Review Context and Review.
      - route: STK
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: One current reviewed PSP and the newly published STK Revision.
          links: The STK derived-from link names the exact governing PSP Stable Datum.
        selectors:
          - phase-0-foundation-members@1
        obligations:
          - stakeholder-requirements-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - draft-stakeholder-requirements@2
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields fresh Review work for the STK; malformed publication writes nothing.
        reuse: Reviewed MAP and PSP evidence remains reusable; the new STK receives fresh context and Review.
      - route: candidate creation
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: The complete current passing MAP, PSP, and STK definition set and one frozen intent candidate.
          links: Candidate definition membership names every exact current foundation Revision.
        selectors:
          - complete-phase-0-intent-candidates@1
        obligations:
          - intent-candidate-required@2
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - create-phase-0-intent-candidate@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful atomic publication yields the candidate simplification/Review Assignment; incomplete membership rejects atomically.
        reuse: Exact passing member Reviews are reused as candidate evidence while their subjects remain unchanged.
      - route: accepted intent
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: One exact passing intent candidate, reviewed approving gate DEC, and newly published accepted baseline.
          links: The accepted baseline promotes the exact candidate and retains its exact gate and Review evidence.
        selectors:
          - phase-0-intent-approvals-for@1
        obligations:
          - intent-approval-required@1
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - accept-phase-0-intent@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful mechanical acceptance yields the first Phase 1 Assignment; invalid promotion evidence writes nothing.
        reuse: The accepted candidate membership and reviewed authority evidence remain immutable and reusable.
  - id: contextual-review
    phases:
      - phase-0-wayfinding@4
      - phase-1-product-assurance@5
      - phase-2-system-definition@8
      - phase-2-pilot-assessment@3
      - phase-7-change-control@4
    routes:
      - route: fresh Review Context
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: One exact substantive subject and the minimum complete frozen Review Context.
          links: Baseline definition membership contains the exact subject and every package-selected context member.
        selectors:
          - valid-review-contexts-for@1
        obligations:
          - review-context-required@2
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - create-review-context@1
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: Successful context publication yields a package-delegated Review Assignment; malformed context writes nothing.
        reuse: The exact context is reusable only for its unchanged subject and context dependencies.
      - route: passing independent Review
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: One exact subject, its complete frozen Review Context, and one passing REV.
          links: The REV reviews the exact subject and contextualizes the exact Review Context.
        selectors:
          - passing-reviews-for@1
        obligations:
          - passing-review-required@2
        participation:
          mode: package-delegated
          policies:
            - contextual-review-participation@1
          authority: independent-reviewer
        resolvers:
          - review-datum-in-context@2
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: A contract-valid passing judgment publishes unchanged and reevaluation yields the next unfinished Assignment.
        reuse: The passing REV remains reusable only while subject and context dependencies remain current.
      - route: failed independent Review
        executable:
          file: test/mdlm-assignment.test.ts
          test: publishes a contract-valid unfavorable independent judgment unchanged
        evidence:
          facts: One exact subject, its complete frozen Review Context, and one failed REV with all Findings.
          links: The REV reviews the exact subject and contextualizes the exact Review Context.
        selectors:
          - failing-reviews-for@1
        obligations:
          - passing-review-required@2
        participation:
          mode: package-delegated
          policies:
            - contextual-review-participation@1
          authority: independent-reviewer
        resolvers:
          - review-datum-in-context@2
        next:
          - assignment
        budget: No lifecycle Correction cycle is consumed.
        disposition: A contract-valid unfavorable judgment publishes unchanged and yields exact Correction work; malformed judgment writes nothing.
        reuse: The failed subject, context, REV, and Findings remain immutable; unaffected evidence remains reusable.
  - id: phase-0-foundation-correction
    phases:
      - phase-0-wayfinding@4
    routes:
      - route: initial failure
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: routes a failed foundation Review to a replacement Revision and fresh Review work
        evidence:
          facts: "initial failure: one current failed foundation Revision, every applicable failed REV, and its same-lineage correction history."
          links: Every replacement preserves Stable Datum identity and cites every applicable failed REV through corrects-review.
        selectors:
          - foundation-review-failures-at-stage@1
          - foundation-correction-history@1
          - failed-phase-0-foundation-revisions@2
        obligations:
          - foundation-review-correction-required@5
        participation:
          mode: package-delegated
          policies:
            - contextual-review-participation@1
          authority: independent-reviewer
        resolvers:
          - revise-foundation-after-review@5
        next:
          - assignment
        budget: The initial failure opens two autonomous replacement-and-fresh-Review cycles.
        disposition: initial failure yields an autonomous revise-foundation-after-review@5 Assignment; invalid replacement writes nothing.
        reuse: Failed Revisions and Reviews remain immutable; unrelated exact evidence is reused; replacement context and Review are fresh.
      - route: first replacement
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: preserves both autonomous foundation cycles after an attended correction
        evidence:
          facts: "first replacement: one current failed foundation Revision, every applicable failed REV, and its same-lineage correction history."
          links: Every replacement preserves Stable Datum identity and cites every applicable failed REV through corrects-review.
        selectors:
          - foundation-review-failures-at-stage@1
          - foundation-correction-history@1
          - failed-phase-0-foundation-revisions@2
        obligations:
          - foundation-review-correction-required@5
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - revise-foundation-after-review@5
        next:
          - assignment
        budget: This route remains within the two autonomous replacement-and-fresh-Review cycles.
        disposition: first replacement yields an autonomous revise-foundation-after-review@5 Assignment; invalid replacement writes nothing.
        reuse: Failed Revisions and Reviews remain immutable; unrelated exact evidence is reused; replacement context and Review are fresh.
      - route: second replacement
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: preserves both autonomous foundation cycles after an attended correction
        evidence:
          facts: "second replacement: one current failed foundation Revision, every applicable failed REV, and its same-lineage correction history."
          links: Every replacement preserves Stable Datum identity and cites every applicable failed REV through corrects-review.
        selectors:
          - foundation-review-failures-at-stage@1
          - foundation-correction-history@1
          - failed-phase-0-foundation-revisions@2
        obligations:
          - foundation-review-correction-required@5
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - revise-foundation-after-review@5
        next:
          - assignment
        budget: This route remains within the two autonomous replacement-and-fresh-Review cycles.
        disposition: second replacement yields an autonomous revise-foundation-after-review@5 Assignment; invalid replacement writes nothing.
        reuse: Failed Revisions and Reviews remain immutable; unrelated exact evidence is reused; replacement context and Review are fresh.
      - route: stakeholder-owned failure
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: preserves both autonomous foundation cycles after an attended correction
        evidence:
          facts: One failed foundation REV whose structured correction_authority is stakeholder and its exact subject lineage.
          links: The Review reviews the exact stakeholder-owned subject; an attended replacement must be justified by exact DEC authority.
        selectors:
          - foundation-review-failures-at-stage@1
          - foundation-correction-history@1
          - failed-phase-0-foundation-revisions@2
        obligations:
          - foundation-review-escalation-required@2
        participation:
          mode: attended
          policies: []
          authority: stakeholder
        resolvers:
          - escalate-foundation-review-correction@2
        next:
          - attention-required
        budget: Stakeholder-owned work attends immediately and consumes none of the two later autonomous cycles.
        disposition: The unfinished route yields Attention Required for escalate-foundation-review-correction@2, never Process Dead End.
        reuse: Failed evidence remains immutable; the attended replacement later receives fresh context and Review.
      - route: post-attended fresh cycles
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: preserves both autonomous foundation cycles after an attended correction
        evidence:
          facts: "post-attended fresh cycles: one current failed foundation Revision, every applicable failed REV, and its same-lineage correction history."
          links: Every replacement preserves Stable Datum identity and cites every applicable failed REV through corrects-review.
        selectors:
          - foundation-review-failures-at-stage@1
          - foundation-correction-history@1
          - failed-phase-0-foundation-revisions@2
        obligations:
          - foundation-review-correction-required@5
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - revise-foundation-after-review@5
        next:
          - assignment
        budget: This route remains within the two autonomous replacement-and-fresh-Review cycles.
        disposition: post-attended fresh cycles yields an autonomous revise-foundation-after-review@5 Assignment; invalid replacement writes nothing.
        reuse: Failed Revisions and Reviews remain immutable; unrelated exact evidence is reused; replacement context and Review are fresh.
  - id: phase-0-simplification-correction
    phases:
      - phase-0-wayfinding@4
    routes:
      - route: pass
        executable:
          file: test/req-phase-0-wayfinding.test.ts
          test: moves one exact intent slice through contextual review and reviewed gate sign-off
        evidence:
          facts: "pass: Exact candidate and MAP/PSP/STK members with one candidate-centered simplification REV."
          links: "pass: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history."
        selectors:
          - valid-product-simplification-reviews@1
          - product-simplification-blockers-for-candidate@1
          - invalid-product-simplification-blockers-for-review@1
          - failed-intent-candidates@1
        obligations:
          - passing-review-required@2
        participation:
          mode: package-delegated
          policies:
            - contextual-review-participation@1
          authority: independent-reviewer
        resolvers:
          - review-datum-in-context@2
        next:
          - attention-required
        budget: "pass: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation."
        disposition: pass yields attention-required. Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
        reuse: "pass: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt."
      - route: member failure
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: routes blocking candidate simplification findings to the exact member correction
        evidence:
          facts: "member failure: Exact candidate and MAP/PSP/STK members with one candidate-centered simplification REV."
          links: "member failure: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history."
        selectors:
          - valid-product-simplification-reviews@1
          - product-simplification-blockers-for-candidate@1
          - invalid-product-simplification-blockers-for-review@1
          - failed-intent-candidates@1
        obligations:
          - foundation-review-correction-required@5
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - revise-foundation-after-review@5
        next:
          - assignment
        budget: "member failure: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation."
        disposition: member failure yields assignment. Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
        reuse: "member failure: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt."
      - route: candidate failure
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: escalates an exhausted candidate lineage through the same correction interface
        evidence:
          facts: "candidate failure: Exact candidate and MAP/PSP/STK members with one candidate-centered simplification REV."
          links: "candidate failure: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history."
        selectors:
          - valid-product-simplification-reviews@1
          - product-simplification-blockers-for-candidate@1
          - invalid-product-simplification-blockers-for-review@1
          - failed-intent-candidates@1
        obligations:
          - intent-candidate-review-correction-required@3
        participation:
          mode: autonomous
          policies: []
          authority: kernel-autonomous
        resolvers:
          - revise-intent-candidate-after-review@3
        next:
          - assignment
        budget: "candidate failure: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation."
        disposition: candidate failure yields assignment. Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
        reuse: "candidate failure: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt."
      - route: stakeholder-owned failure
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: attends stakeholder-owned candidate simplification without consuming its autonomous budget
        evidence:
          facts: "stakeholder-owned failure: Exact candidate and MAP/PSP/STK members with one candidate-centered simplification REV."
          links: "stakeholder-owned failure: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history."
        selectors:
          - valid-product-simplification-reviews@1
          - product-simplification-blockers-for-candidate@1
          - invalid-product-simplification-blockers-for-review@1
          - failed-intent-candidates@1
        obligations:
          - intent-candidate-review-correction-required@3
        participation:
          mode: attended
          policies:
            - intent-candidate-correction-participation@1
          authority: stakeholder
        resolvers:
          - revise-intent-candidate-after-review@3
        next:
          - attention-required
        budget: "stakeholder-owned failure: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation."
        disposition: stakeholder-owned failure yields attention-required. Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
        reuse: "stakeholder-owned failure: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt."
      - route: malformed blocker
        executable:
          file: test/resolve-type.test.ts
          test: binds Phase 0 simplification failure to one exact structured target
        evidence:
          facts: "malformed blocker: Exact candidate and MAP/PSP/STK members with one candidate-centered simplification REV."
          links: "malformed blocker: A failed simplification has exactly one canonical blocks link matching its structured target; replacement cites failed REV history."
        selectors:
          - valid-product-simplification-reviews@1
          - product-simplification-blockers-for-candidate@1
          - invalid-product-simplification-blockers-for-review@1
          - failed-intent-candidates@1
        obligations:
          - passing-review-required@2
        participation:
          mode: package-delegated
          policies:
            - contextual-review-participation@1
          authority: independent-reviewer
        resolvers:
          - review-datum-in-context@2
        next:
          - assignment
        budget: "malformed blocker: Member uses its foundation budget; candidate gets two autonomous cycles before attended escalation."
        disposition: malformed blocker yields assignment. Malformed, mismatched, or out-of-scope blockers reject atomically; passing evidence returns to the gate.
        reuse: "malformed blocker: Unchanged members and Reviews remain reusable; changed member/candidate evidence is rebuilt."
      - route: exhausted candidate
        executable:
          file: test/evaluate-bootstrap-participation.test.ts
          test: escalates an exhausted candidate lineage through the same correction interface
        evidence:
