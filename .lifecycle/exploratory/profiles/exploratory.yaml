kind: implementation-profile-definition
id: exploratory
version: 2
status: experimental
description: Prototype revisions with explicit stakeholder feedback after nominations.
enabled:
  types:
    - EXP
    - TRY
    - OBS
    - FDB
  phases:
    - phase-0-exploration
  obligation_statuses:
    - ready
    - blocked
disabled_capabilities:
  - product acceptance and requirements baselines
  - promotion and partial baselines
  - long-running services or TTY-dependent verification
  - resuming after explicit stop, keep or drop
terminal_outcomes:
  profile_boundary:
    condition: 'exists("current-observations@1", {}) && every("current-trials@2",
      {}, trial => exists("observations-for@1", {trial: trial})) &&
      every("current-observations@1", {}, obs => obs.payload.recommendation ==
      "keep" || obs.payload.recommendation == "drop" ||
      (obs.payload.recommendation == "nominate" && exists("feedback-for@1",
      {observation: obs}) && every("feedback-for@1", {observation: obs},
      feedback => feedback.payload.action == "stop")))'
    explanation: Exploration stopped with keep/drop or explicit stakeholder stop
      after a nomination. This is not product acceptance or a requirements
      baseline.
success_criteria:
  - The exact prototype and observations support a provisional next-step
    recommendation.
  - Revision preserves the original brief, source identity and observation
    history.
