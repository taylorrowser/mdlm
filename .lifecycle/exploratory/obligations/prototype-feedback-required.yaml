kind: obligation-definition
id: prototype-feedback-required
version: 1
description: prototype-feedback-required
phases:
  - phase-0-exploration
for_each: select("prototype-feedback@1", {})
subject_as: subject
satisfied_when: 'exists("trial-responses-for@1", {feedback: subject})'
status_rules:
  - status: ready
    priority: 100
    when: "true"
    reason: prototype-feedback-required
default_status: blocked
resolve_with:
  scenario: revise-prototype@1
  inputs:
    subject: 'one("trial-for-observation@1", {observation:
      one("observation-for-feedback@1", {feedback: subject})})'
    experiment: 'one("experiment-for-observation@1", {observation:
      one("observation-for-feedback@1", {feedback: subject})})'
    feedback: subject
waiver_policy_ref: waiver-applicability@1
