kind: obligation-definition
id: experiment-revision-required
version: 1
description: experiment-revision-required
phases:
  - phase-0-exploration
for_each: select("current-experiments@1", {})
subject_as: subject
satisfied_when: 'none("revision-observations@1", {experiment: subject})'
status_rules:
  - status: ready
    priority: 100
    when: "true"
    reason: experiment-revision-required
default_status: blocked
resolve_with:
  scenario: revise-experiment@2
  inputs:
    subject: subject
    observation: 'one("revision-observations@1", {experiment: subject})'
waiver_policy_ref: waiver-applicability@1
