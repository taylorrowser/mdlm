kind: selector-definition
id: experiment-for-observation
version: 1
description: experiment-for-observation
parameters:
  - name: observation
    kind: revision
    types:
      - OBS
result_kind: revision
query:
  from:
    relation: outgoing-links
    of: observation
    link: against
    emit: target
    types:
      - EXP
  as: item
  distinct: true
  order_by:
    - identity.revision_id
