kind: selector-definition
id: cited-gate-rejections-by-correction
version: 1
description: Reviewed gate rejections cited by a correction Revision or replacement candidate.
parameters:
  - {name: replacement, kind: revision, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, BSL]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: replacement, link: corrects-gate-rejection, emit: target, types: [DEC]}
  as: rejection
  where: >-
    rejection.payload.kind == "gate-signoff"
    && rejection.payload.gate_outcome == "reject"
    && state(rejection, "validity") == "valid"
    && exists("passing-reviews-for@1", {subject: rejection})
  distinct: true
  order_by: [identity.revision_id]
