kind: selector-definition
id: phase-6-qualified-environments-for-formal-implementation
version: 1
description: Exact current reviewed environment with complete passing qualification evidence used by one formal implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from:
    selector: environments-for-implementation@1
    arguments: {implementation: implementation}
  as: environment
  where: >-
    implementation.payload.kind == "formal"
    && count("complete-environment-qualification-for-environment@1",
      {environment: environment}) == 1
    && exists("passing-reviews-for@1", {subject: environment})
    && none("failing-reviews-for@1", {subject: environment})
  distinct: true
  order_by: [identity.revision_id]
