kind: selector-definition
id: change-requests-for-problem
version: 1
description: Exact Change Requests derived from one exact Problem Report.
parameters:
  - {name: problem, kind: revision, types: [PRB]}
result_kind: revision
query:
  from: {relation: incoming-links, of: problem, link: derived-from, emit: source, types: [CHG]}
  as: change
  where: 'none("newer-revisions-for@1", {subject: change})'
  distinct: true
  order_by: [identity.revision_id]
