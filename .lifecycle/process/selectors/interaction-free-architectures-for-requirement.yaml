kind: selector-definition
id: interaction-free-architectures-for-requirement
version: 1
description: Current exact architecture for a requirement that declares no interaction requiring an interface contract.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS]}
result_kind: revision
query:
  from:
    selector: current-architectures-for-requirement@1
    arguments: {requirement: requirement}
  as: architecture
  where: 'architecture.payload.controlled_boundaries == []'
  distinct: true
  order_by: [identity.revision_id]
