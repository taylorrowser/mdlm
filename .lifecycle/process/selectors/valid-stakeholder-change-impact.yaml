kind: selector-definition
id: valid-stakeholder-change-impact
version: 2
description: One exact accepted STK or shared SYS Change Request whose roots expose the complete package-derived impact set.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [CHG]}
  as: candidate
  where: >-
    candidate == change
    && candidate.payload.implementation_order == "requirements -> context -> reviews -> baselines -> verification"
    && count("impacted-requirements-for-change@3", {change: candidate}) == 1
    && (
      (every("impacted-requirements-for-change@3", {change: candidate}, requirement =>
          requirement.identity.type == "STK"
          && exists("accepted-intent-candidates-for-requirement@2", {requirement: requirement}))
        && count("accepted-intent-baselines-for-change@1", {change: candidate}) == 1)
      || (every("impacted-requirements-for-change@3", {change: candidate}, requirement =>
          requirement.identity.type == "SYS")
        && count("accepted-intent-baselines-for-change@1", {change: candidate}) == 1
        && count("shared-system-consumers-for-change@1", {change: candidate}) >= 2)
    )
  distinct: true
  order_by: [identity.revision_id]
