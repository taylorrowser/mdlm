kind: selector-definition
id: valid-stakeholder-change-impact
version: 1
description: One exact accepted-STK Change Request whose authored impact equals the complete directly traceable accepted-intent impact set.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [CHG]}
  as: candidate
  where: >-
    candidate == change
    && candidate.payload.implementation_order == "requirements -> context -> reviews -> baselines -> verification"
    && count("impacted-requirements-for-change@2", {change: candidate}) == 1
    && every("impacted-requirements-for-change@2", {change: candidate}, requirement =>
      exists("accepted-intent-candidates-for-requirement@2", {requirement: requirement}))
    && count("accepted-intent-baselines-for-change@1", {change: candidate}) == 1
  distinct: true
  order_by: [identity.revision_id]
