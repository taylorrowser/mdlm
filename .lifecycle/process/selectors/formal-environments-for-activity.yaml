kind: selector-definition
id: formal-environments-for-activity
version: 1
description: The singular qualified and independently reviewed environment realizing one formal activity's exact governing strategy.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {collection: revisions, types: [ENV]}
  as: environment
  where: >-
    count("strategies-for-verification-activity@1", {activity: activity}) == 1
    && count("environments-for-strategy@1",
      {strategy: one("strategies-for-verification-activity@1", {activity: activity})}) == 1
    && one("environments-for-strategy@1",
      {strategy: one("strategies-for-verification-activity@1", {activity: activity})}) == environment
    && exists("passing-qualification-results-for@1", {environment: environment})
    && exists("passing-reviews-for@1", {subject: environment})
  distinct: true
  order_by: [identity.revision_id]
