kind: selector-definition
id: change-dispositions-for-context
version: 1
description: Exact attended disposition Decisions structurally linked to one bounded Change Request for independent context.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "change-approval"
    && decision.payload.change_disposition in ["approve", "reject", "defer", "cancel"]
    && decision.payload.effective_scope == change.identity.revision_id
  distinct: true
  order_by: [identity.revision_id]
