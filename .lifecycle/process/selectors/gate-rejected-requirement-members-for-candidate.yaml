kind: selector-definition
id: gate-rejected-requirement-members-for-candidate
version: 1
description: Exact candidate design requirements named by any reviewed gate rejection.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity, types: [DES]}
  as: member
  where: 'exists("reviewed-gate-rejections-for-subject@1", {subject: member})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
