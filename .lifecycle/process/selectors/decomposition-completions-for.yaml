kind: selector-definition
id: decomposition-completions-for
version: 1
description: Current semantically complete exact DWP Revision in the supplied plan lineage; incomplete and failed predecessors remain immutable history.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: valid-decomposition-completions-for-plan@1
    arguments: {plan: plan}
  as: completion
  where: >-
    state(completion, "disposition") == "active"
    && state(completion, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: completion})
  distinct: true
  order_by: [identity.revision]
