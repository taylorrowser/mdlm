kind: selector-definition
id: phase-2-atomic-review-required-revisions
version: 1
description: Ordinary exact Phase 2 Revisions whose Review Context exists only for their immediate independent Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, DEC, PRB, CHG, PAS]}
  as: subject
  where: >-
    !every("review-required-revisions@1", {}, required => required != subject)
    && every("phase-1-assurance-review-required-revisions@1", {}, assurance => assurance != subject)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
