kind: selector-definition
id: phase-2-review-context-matches-plan
version: 1
description: The current exact definition Review Context when one simplification Review cites it.
parameters:
  - {name: review, kind: revision, types: [REV]}
  - {name: plan, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: review, link: contextualizes, emit: target, types: [BSL]}
  as: context
  where: >-
    count("decomposition-simplification-contexts-for@1", {plan: plan}) == 1
    && context == one("decomposition-simplification-contexts-for@1", {plan: plan})
  distinct: true
  order_by: [identity.revision_id]
