kind: selector-definition
id: definition-requirements-for-architecture
version: 1
description: Exact STK/SYS requirements governed by, or CMP requirements allocated to, one reusable architecture Revision.
parameters:
  - {name: architecture, kind: revision, types: [ASP]}
result_kind: revision
query:
  from: {collection: revisions, types: [STK, SYS, CMP]}
  as: requirement
  where: >-
    !every("requirements-governed-by-architecture@1", {architecture: architecture}, governed => governed != requirement)
    || (requirement.identity.type == "CMP"
      && !every("phase-2-system-architectures-for@1", {requirement: requirement}, allocated => allocated != architecture))
  distinct: true
  order_by: [identity.revision_id]
