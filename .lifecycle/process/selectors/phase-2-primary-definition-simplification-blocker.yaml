kind: selector-definition
id: phase-2-primary-definition-simplification-blocker
version: 1
description: The canonical Phase 2 definition blocker matching one failed Review's declared primary target.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: blocks, emit: target, types: [SYS, ASP, ICSP, DWP]}
  as: blocker
  where: 'blocker.identity.revision_id == review.payload.definition_simplification.primary_target'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
