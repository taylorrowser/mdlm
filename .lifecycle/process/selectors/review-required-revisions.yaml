kind: selector-definition
id: review-required-revisions
version: 1
description: Exact active revisions for which the machine-readable review policy requires independent review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, PSP, STK, SYS, BSL, DEC]}
  as: subject
  where: >-
    policy("review-applicability@1", {subject: subject}).required == true
    && state(subject, "disposition") == "active"
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
