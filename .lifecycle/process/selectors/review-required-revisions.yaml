kind: selector-definition
id: review-required-revisions
version: 1
description: Exact current active Revisions for which the machine-readable review policy requires independent Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, DEC, PRB, CHG, PAS]}
  as: subject
  where: >-
    policy("review-applicability@1", {subject: subject}).required == true
    && state(subject, "disposition") == "active"
    && (subject.identity.type != "DWP"
      || subject.payload.stage != "planning"
      || (state(subject, "validity") == "valid"
        && exists("planning-dwp-review-support-is-current@1", {plan: subject})))
    && none("newer-revisions-for@1", {subject: subject})
    && none("implemented-changes-impacting-revision@2", {subject: subject})
    && !(
      subject.identity.type == "DEC"
      && exists("applicable-product-answer-reviews-for-decision@1",
        {decision: subject})
    )
    && !(
      phase.id == "phase-0-wayfinding"
      && subject.identity.type in ["MAP", "PSP", "STK"]
      && !every("incorporated-product-answer-decisions-for-foundation-subject@1",
        {subject: subject}, decision =>
          none("pending-foundation-subjects-for-product-answer@1",
            {decision: decision}))
    )
    && !(
      phase.id == "phase-0-wayfinding"
      && subject.identity.type in ["MAP", "PSP", "STK"]
      && exists("failing-reviews-for@1", {subject: subject})
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
