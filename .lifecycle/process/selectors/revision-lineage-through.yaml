kind: selector-definition
id: revision-lineage-through
version: 1
description: Exact immutable Revision history in one Stable Datum lineage through the supplied Revision.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: revisions, of: subject, emit: entity}
  as: revision
  where: 'revision.identity.revision <= subject.identity.revision'
  distinct: true
  order_by: [identity.revision]
