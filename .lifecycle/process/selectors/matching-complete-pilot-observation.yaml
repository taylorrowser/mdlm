kind: selector-definition
id: matching-complete-pilot-observation
version: 1
description: The supplied DEC Revision when it is one current complete pilot observation.
parameters:
  - {name: observation, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    selector: complete-pilot-observations@1
    arguments: {}
  as: complete_observation
  where: 'complete_observation == observation'
  distinct: true
  order_by: [identity.revision_id]
