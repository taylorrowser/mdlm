kind: selector-definition
id: formal-preimplementation-targets
version: 1
description: Typed empty ART set preserving the shared verification-implementation Scenario before Phase 6 binds a formal VAI to product code.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {collection: revisions, types: [ART]}
  as: target
  where: 'activity.payload.kind == "formal" && false'
  distinct: true
  order_by: [identity.revision_id]
