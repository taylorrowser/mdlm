kind: selector-definition
id: change-requests-authoring-subject
version: 1
description: Exact Change Requests cited through changed-under by one replacement subject.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: outgoing-links, of: subject, link: changed-under, emit: target, types: [CHG]}
  as: change
  distinct: true
  order_by: [identity.revision_id]
