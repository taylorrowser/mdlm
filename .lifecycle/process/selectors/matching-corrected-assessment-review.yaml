kind: selector-definition
id: matching-corrected-assessment-review
version: 1
description: The supplied Review when the corrected PAS explicitly addresses it.
parameters:
  - {name: replacement, kind: revision, types: [PAS]}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from:
    selector: corrected-assessment-reviews-for@1
    arguments: {replacement: replacement}
  as: corrected_review
  where: 'corrected_review == review'
  distinct: true
  order_by: [identity.revision_id]
