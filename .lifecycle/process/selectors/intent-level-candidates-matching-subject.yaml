kind: selector-definition
id: intent-level-candidates-matching-subject
version: 1
description: The exact Phase 0 intent-level candidate when the supplied generic Review subject is that candidate.
parameters:
  - {name: subject, kind: revision}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && candidate.identity.revision_id == subject.identity.revision_id
  distinct: true
  order_by: [identity.revision_id]
