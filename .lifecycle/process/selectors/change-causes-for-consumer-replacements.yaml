kind: selector-definition
id: change-causes-for-consumer-replacements
version: 1
description: Every prior exact Change cause plus every exact accepted Change cause attached to current replacement SYS Revisions for one consumer.
parameters:
  - {name: consumer, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [CHG]}
  as: cause
  where: >-
    !every("changes-changed-under-subject@1", {subject: consumer}, owner => owner != cause)
    || !every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, replacement =>
      every("changes-changed-under-subject@1", {subject: replacement}, owner => owner != cause))
  distinct: true
  order_by: [identity.id, identity.revision]
