kind: selector-definition
id: stakeholder-change-requests
version: 1
description: Current exact Change Requests whose one accepted requirement root is STK.
parameters: []
result_kind: revision
query:
  from: {selector: all-change-requests@1, arguments: {}}
  as: change
  where: >-
    count("impacted-requirements-for-change@3", {change: change}) == 1
    && count("impacted-stakeholder-requirements-for-change@1", {change: change}) == 1
  distinct: true
  order_by: [identity.id, identity.revision]
