kind: selector-definition
id: phase-6-formal-result-contexts-for
version: 1
description: Frozen sibling contexts containing one exact formal result and all immutable direct support needed to judge that result.
parameters:
  - {name: subject, kind: revision, types: [RES]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: subject, emit: entity, types: [BSL]}
  as: context
  where: >-
    subject.payload.claim.kind == "formal"
    && subject.payload.assessment_state == "assessment-required"
    && context.payload.kind == "review-context"
    && context.payload.role == "review-context"
    && context.storage.frozen == true
    && state(context, "validity") == "valid"
    && context.provenance.process_ref == process.current_ref
    && context.provenance.scenario == "create-review-context@2"
    && none("newer-revisions-for@1", {subject: context})
    && every("formal-result-review-context-members-for@1", {result: subject}, support =>
      exists("review-context-contains-required-support@1",
        {subject: subject, context: context, required_support: support}))
  distinct: true
  order_by: [identity.revision_id]
