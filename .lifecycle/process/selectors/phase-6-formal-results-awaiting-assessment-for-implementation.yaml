kind: selector-definition
id: phase-6-formal-results-awaiting-assessment-for-implementation
version: 1
description: Exact completed formal pass or fail results that still need one independent human assessment.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from:
    selector: phase-6-formal-results-for-implementation@1
    arguments: {implementation: implementation}
  as: result
  where: >-
    result.payload.claim.outcome in ["pass", "fail"]
    && result.payload.assessment_state == "assessment-required"
    && every("formal-runs-producing-result@1", {result: result}, run =>
      run.payload.execution_state == "completed")
    && none("passing-reviews-for@1", {subject: result})
    && none("failing-reviews-for@1", {subject: result})
  distinct: true
  order_by: [identity.revision_id]
