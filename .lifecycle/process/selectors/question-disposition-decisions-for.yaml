kind: selector-definition
id: question-disposition-decisions-for
version: 1
description: Valid exact deferral or cancellation Decisions linked to one exact resulting QST Revision.
parameters:
  - {name: question, kind: revision, types: [QST]}
result_kind: revision
query:
  from: {relation: incoming-links, of: question, link: resolves, emit: source, types: [DEC]}
  as: decision
  where: >-
    (
      (
        decision.provenance.scenario == "resolve-question@2"
        && question.provenance.scenario == "resolve-question@2"
      )
      || decision.provenance.scenario ==
        "revise-question-decision-after-review@1"
    )
    && none("newer-revisions-for@1", {subject: decision})
    && (
      (
        question.payload.state == "deferred"
        && present(question.payload.reactivation_condition)
        && decision.payload.kind == "deferral"
      )
      || (
        question.payload.state == "cancelled"
        && decision.payload.kind == "cancellation"
      )
    )
    && decision.payload.effective_scope == question.identity.revision_id
    && state(decision, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
