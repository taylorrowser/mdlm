kind: selector-definition
id: recorded-pilot-expansion-decisions-for
version: 1
description: Exact valid pilot-expansion Decisions for one exact reviewed assessment, regardless of Decision Review completion.
parameters:
  - {name: assessment, kind: revision, types: [PAS]}
result_kind: revision
query:
  from: {relation: incoming-links, of: assessment, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "pilot-expansion"
    && decision.payload.effective_scope == "Phase 3–6 Example Process Package expansion"
    && state(decision, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: decision})
    && count("pilot-assessments-for-expansion-decision@1", {decision: decision}) == 1
    && one("pilot-assessments-for-expansion-decision@1", {decision: decision}) == assessment
    && count("pilot-assessment-reviews-for-expansion-decision@1", {decision: decision}) == 1
    && exists("passing-reviews-for@1", {subject: assessment})
    && none("failing-reviews-for@1", {subject: assessment})
  distinct: true
  order_by: [identity.id, identity.revision]
