kind: selector-definition
id: structural-initial-product-intent-targets-for-decision
version: 1
description: Exact answered product-intent Question structurally named by one Decision without Review-derived state.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: decision, link: resolves, emit: target, types: [QST]}
  as: question
  where: >-
    decision.payload.kind == "scope"
    && question.identity.revision_id == decision.payload.effective_scope
    && question.payload.kind == "preferential"
    && question.payload.intent_scope == "product"
    && question.payload.state == "answered"
    && question.provenance.scenario == "resolve-question@2"
    && question.provenance.process_ref == process.current_ref
    && question.integrity.scenario_execution_valid == true
  distinct: true
  order_by: [identity.revision_id]
