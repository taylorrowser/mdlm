kind: selector-definition
id: autonomously-correctable-foundation-review-failures
version: 1
description: Current Phase 0 foundation failures with autonomous replacement budget remaining.
parameters: []
result_kind: revision
query:
  from:
    selector: failed-phase-0-foundation-revisions@1
    arguments: {}
  as: subject
  where: >-
    none("stakeholder-owned-failing-reviews-for@1", {subject: subject})
    && count("correction-revisions-through@1", {subject: subject}) < 2
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
