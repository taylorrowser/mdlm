kind: selector-definition
id: passing-reviews-for
version: 1
description: Current valid passing reviews whose exact primary target is the supplied revision.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: incoming-links, of: subject, link: reviews, emit: source, types: [REV]}
  as: review
  where: >-
    review.payload.outcome == "pass"
    && state(review, "validity") == "valid"
    && review.provenance.process_ref == process.current_ref
    && count("current-exact-review-contexts-cited-by@1",
      {review: review, subject: subject}) == 1
    && (
      (exists("intent-candidates-matching-subject@1", {subject: subject})
        && (
          exists("valid-product-simplification-reviews@1", {review: review})
          || (
            review.provenance.scenario == "review-phase-0-candidate@1"
            && review.payload.review_kind == "phase-0-candidate"
            && review.integrity.scenario_execution_valid == true
          )
        ))
      || (exists("planning-dwp-matching-subject@1", {subject: subject})
        && exists("valid-dwp-product-simplification-reviews@1", {review: review}))
      || (none("intent-candidates-matching-subject@1", {subject: subject})
        && none("planning-dwp-matching-subject@1", {subject: subject})
        && review.payload.review_kind != "simplification-product-definition")
    )
  distinct: true
  order_by: [identity.revision_id]
