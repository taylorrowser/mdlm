kind: selector-definition
id: completions-for-level-candidate
version: 1
description: Exact DWP completion represented by one semantically complete level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity, types: [DWP]}
  as: completion
  where: >-
    completion.payload.stage == "completion"
    && exists("level-candidate-matches-completion@1",
      {candidate: candidate, completion: completion})
  distinct: true
  order_by: [identity.revision_id]
