kind: selector-definition
id: exercised-pilot-runs-for-implementation
version: 1
description: Valid completed pilot runs that produced exact suitable evidence of exercised success and discrimination behavior.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: incoming-links, of: implementation, link: executes, emit: source, types: [RUN]}
  as: run
  where: >-
    implementation.payload.kind == "pilot"
    && run.payload.kind == "pilot"
    && run.payload.execution_state == "completed"
    && state(run, "validity") == "valid"
    && exists("pilot-results-completing-run@1", {run: run})
  distinct: true
  order_by: [identity.revision_id]
