kind: selector-definition
id: corrected-pilot-assessments-for
version: 1
description: Valid newer pilot assessment Revisions preserving the failed assessment's exact evidence context.
parameters:
  - {name: assessment, kind: revision, types: [PAS]}
result_kind: revision
query:
  from: {relation: revisions, of: assessment, emit: entity, types: [PAS]}
  as: replacement
  where: >-
    replacement.identity.revision > assessment.identity.revision
    && state(replacement, "validity") == "valid"
    && replacement.payload.rationale != assessment.payload.rationale
    && every("failing-reviews-for@1", {subject: assessment}, review =>
      exists("matching-corrected-assessment-review@1",
        {replacement: replacement, review: review}))
    && none("unexpected-corrected-assessment-reviews@1",
      {assessment: assessment, replacement: replacement})
    && count("pilot-assessment-context-for@1", {assessment: assessment}) == 1
    && count("pilot-assessment-context-for@1", {assessment: replacement}) == 1
    && one("pilot-assessment-context-for@1", {assessment: replacement})
      == one("pilot-assessment-context-for@1", {assessment: assessment})
  distinct: true
  order_by: [identity.revision]
