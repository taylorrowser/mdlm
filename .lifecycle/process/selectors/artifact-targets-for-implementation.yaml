kind: selector-definition
id: artifact-targets-for-implementation
version: 1
description: Exact bounded ART target selected by one pilot verification implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: implementation, link: targets, emit: target, types: [ART]}
  as: target
  distinct: true
  order_by: [identity.revision_id]
