kind: selector-definition
id: complete-environment-assurance-for-environment
version: 1
description: The exact strategy whose singular profile, ENV payload, qualification VER, and qualification VAI form one complete assurance transaction for an ENV.
parameters:
  - {name: environment, kind: revision, types: [ENV]}
result_kind: revision
query:
  from:
    selector: strategies-for-environment@1
    arguments: {environment: environment}
  as: strategy
  where: >-
    count("strategies-for-environment@1", {environment: environment}) == 1
    && count("complete-environment-assurance-for-strategy@1", {strategy: strategy}) == 1
    && one("complete-environment-assurance-for-strategy@1", {strategy: strategy}) == environment
  distinct: true
  order_by: [identity.revision_id]
