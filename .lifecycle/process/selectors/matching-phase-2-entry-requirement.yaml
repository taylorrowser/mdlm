kind: selector-definition
id: matching-phase-2-entry-requirement
version: 1
description: The supplied requirement only when it remains a current accepted Phase 2 entry Revision.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from:
    selector: phase-2-entry-requirements@1
    arguments: {}
  as: candidate
  where: 'candidate == requirement'
  distinct: true
  order_by: [identity.revision_id]
