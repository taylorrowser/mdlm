kind: selector-definition
id: phase-2-interface-subjects-for
version: 1
description: Exact architecture, requirements, and decomposition plans governed by one Phase 2 interface Revision.
parameters:
  - {name: interface, kind: revision, types: [ICSP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: interface, link: defines-interface-for, emit: target, types: [ASP, SYS, DWP]}
  as: interface_subject
  where: 'true'
  distinct: true
  order_by: [identity.type, identity.revision_id]
