kind: selector-definition
id: non-phase-0-foundation-members-for
version: 1
description: Exact candidate definition members that are not current active Phase 0 MAP, PSP, or STK foundation Revisions.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity}
  as: member
  where: >-
    !(state(member, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: member})
    && (
      member.identity.type in ["MAP", "PSP"]
      || exists("current-product-specifications-for-requirement@1",
        {requirement: member})
    ))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
