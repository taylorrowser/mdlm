kind: selector-definition
id: completed-runs-for-implementation
version: 1
description: Immutable completed runs that execute one exact verification implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: incoming-links, of: implementation, link: executes, emit: source, types: [RUN]}
  as: run
  where: >-
    run.payload.execution_state == "completed"
    && state(run, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
