kind: selector-definition
id: component-requirements-for-completion
version: 1
description: Exact current CMP ancestry for one CMP or DES completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: formal-requirements-for-completion@1
    arguments: {completion: completion}
  as: requirement
  where: 'requirement.identity.type == "CMP"'
  distinct: true
  order_by: [identity.revision_id]
