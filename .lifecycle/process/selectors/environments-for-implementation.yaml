kind: selector-definition
id: environments-for-implementation
version: 1
description: Exact verification environment used by one implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: implementation, link: uses, emit: target, types: [ENV]}
  as: environment
  distinct: true
  order_by: [identity.revision_id]
