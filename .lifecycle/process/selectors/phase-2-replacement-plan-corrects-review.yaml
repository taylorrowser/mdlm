kind: selector-definition
id: phase-2-replacement-plan-corrects-review
version: 1
description: The supplied replacement DWP when it cites one exact failed simplification Review as its cause.
parameters:
  - {name: review, kind: revision, types: [REV]}
  - {name: replacement_plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: review, link: corrects-review, emit: source, types: [DWP]}
  as: correction
  where: 'correction == replacement_plan'
  distinct: true
  order_by: [identity.revision_id]
