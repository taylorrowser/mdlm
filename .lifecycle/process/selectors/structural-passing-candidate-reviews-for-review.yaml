kind: selector-definition
id: structural-passing-candidate-reviews-for-review
version: 1
description: Current structurally passing candidate Reviews for Review Context assembly without operational disposition recursion.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: candidate, link: reviews, emit: source, types: [REV]}
  as: review
  where: >-
    review.provenance.scenario == "review-datum-in-context@3"
    && review.payload.outcome == "pass"
    && (
      (
        candidate.payload.kind == "intent-level-candidate"
        && review.payload.review_kind == "simplification-product-definition"
        && !present(review.payload.simplification)
        && none("product-simplification-blockers-for-review@1", {review: review})
      )
      || (
        candidate.payload.kind == "level-candidate"
        && review.payload.review_kind != "simplification-product-definition"
        && count("structural-review-contexts-cited-by@1", {review: review}) == 1
        && every("structural-review-contexts-cited-by@1", {review: review}, context =>
          context.payload.scope == candidate.identity.revision_id
          && context.provenance.process_ref == process.current_ref
          && context.provenance.scenario == "create-review-context@2")
      )
    )
    && none("newer-revisions-for@1", {subject: review})
  distinct: true
  order_by: [identity.revision_id]
