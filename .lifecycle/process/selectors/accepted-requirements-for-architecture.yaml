kind: selector-definition
id: accepted-requirements-for-architecture
version: 1
description: Accepted Phase 2 requirement Revisions governed by one architecture Revision.
parameters:
  - {name: architecture, kind: revision, types: [ASP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: architecture, link: governs, emit: target, types: [STK]}
  as: requirement
  where: 'exists("matching-phase-2-entry-requirement@1", {requirement: requirement})'
  distinct: true
  order_by: [identity.revision_id]
