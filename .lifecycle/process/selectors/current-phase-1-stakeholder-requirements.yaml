kind: selector-definition
id: current-phase-1-stakeholder-requirements
version: 1
description: Current active stakeholder requirements inherited from the accepted Phase 0 product specification lineage.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [STK]}
  as: requirement
  where: >-
    state(requirement, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: requirement})
    && exists("current-product-specifications-for-requirement@1",
      {requirement: requirement})
  distinct: true
  order_by: [identity.id, identity.revision]
