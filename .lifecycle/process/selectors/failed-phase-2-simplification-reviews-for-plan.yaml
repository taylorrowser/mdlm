kind: selector-definition
id: failed-phase-2-simplification-reviews-for-plan
version: 1
description: Uncorrected valid failed simplification Reviews for one exact DWP plan and Review kind.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: review_kind, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {collection: revisions, types: [REV]}
  as: review
  where: >-
    review.payload.review_kind == review_kind
    && review.payload.decomposition_plan_revision == plan.identity.revision_id
    && review.payload.outcome == "fail"
    && state(review, "validity") == "valid"
    && count("phase-2-simplification-contexts-for-review@1", {review: review}) == 1
    && count("decomposition-simplification-contexts-for@1", {plan: plan}) == 1
    && one("phase-2-simplification-contexts-for-review@1", {review: review})
      == one("decomposition-simplification-contexts-for@1", {plan: plan})
    && none("phase-2-corrections-for-review@1", {review: review})
  distinct: true
  order_by: [identity.revision_id]
