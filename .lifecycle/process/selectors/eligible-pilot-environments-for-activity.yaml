kind: selector-definition
id: eligible-pilot-environments-for-activity
version: 1
description: The singular exactly realized, qualified, and independently reviewed environment governed by a pilot activity's strategy.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {collection: revisions, types: [ENV]}
  as: environment
  where: >-
    count("pilot-environments-for-activity@1", {activity: activity}) == 1
    && one("pilot-environments-for-activity@1", {activity: activity}) == environment
    && exists("passing-qualification-results-for@1", {environment: environment})
    && exists("passing-reviews-for@1", {subject: environment})
  distinct: true
  order_by: [identity.revision_id]
