kind: selector-definition
id: simplification-evidence-matches-plan
version: 1
description: The supplied Review only when it is current valid passing simplification evidence for one exact DWP plan Revision.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: evidence, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV]}
  as: review
  where: >-
    review == evidence
    && review.payload.outcome == "pass"
    && exists("valid-phase-2-simplification-review@1", {review: review, plan: plan})
    && none("failed-phase-2-simplification-reviews-by-scope@1",
      {plan: plan, correction_set: "subject"})
    && none("failed-phase-2-simplification-reviews-by-scope@1",
      {plan: plan, correction_set: "definition-consistency"})
  distinct: true
  order_by: [identity.revision_id]
