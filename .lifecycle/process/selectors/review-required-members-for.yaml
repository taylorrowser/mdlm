kind: selector-definition
id: review-required-members-for
version: 1
description: Exact definition members of a baseline for which review policy requires independent review.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity}
  as: member
  where: >-
    policy("review-applicability@1", {subject: member}).required == true
    && (none("phase-3-level-candidate-definition-members@1", {candidate: candidate})
      || (member.identity.type == "DWP"
        && member.payload.stage == "completion"
        && member.payload.target_child_type == "CMP"))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
