kind: selector-definition
id: foundation-review-failures-at-stage
version: 1
description: Current Phase 0 foundation failures classified by immutable correction evidence and stakeholder authority.
parameters:
  - {name: stage, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from:
    selector: failed-phase-0-foundation-revisions@2
    arguments: {}
  as: subject
  where: >-
    (
      stage == "stakeholder-intent"
      && (
        !every("failing-reviews-for@1", {subject: subject}, review =>
          review.payload.correction_authority == "package-evidence")
        || !every("product-simplification-reviews-blocking-subject@1",
          {subject: subject}, review =>
            review.payload.correction_authority == "package-evidence")
      )
    )
    || (
      stage == "escalation"
      && (
        !every("failing-reviews-for@1", {subject: subject}, review =>
          review.payload.correction_authority == "package-evidence")
        || !every("product-simplification-reviews-blocking-subject@1",
          {subject: subject}, review =>
            review.payload.correction_authority == "package-evidence")
        || count("foundation-correction-history@1",
          {subject: subject, view: "autonomous-corrections"}) >= 2
      )
    )
    || (
      every("failing-reviews-for@1", {subject: subject}, review =>
        review.payload.correction_authority == "package-evidence")
      && every("product-simplification-reviews-blocking-subject@1",
        {subject: subject}, review =>
          review.payload.correction_authority == "package-evidence")
      && (
        (stage == "initial" && count("foundation-correction-history@1",
          {subject: subject, view: "autonomous-corrections"}) == 0)
        || (stage == "first-replacement" && count("foundation-correction-history@1",
          {subject: subject, view: "autonomous-corrections"}) == 1)
        || (stage == "second-replacement" && count("foundation-correction-history@1",
          {subject: subject, view: "autonomous-corrections"}) == 2)
        || (stage == "exhausted" && count("foundation-correction-history@1",
          {subject: subject, view: "autonomous-corrections"}) >= 2)
        || (stage == "autonomous" && count("foundation-correction-history@1",
          {subject: subject, view: "autonomous-corrections"}) < 2)
      )
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
