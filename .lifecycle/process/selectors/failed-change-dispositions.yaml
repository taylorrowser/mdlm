kind: selector-definition
id: failed-change-dispositions
version: 1
description: Current exact attended disposition or change-correction authority Decisions whose required independent Review failed.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind in ["change-approval", "scope"]
    && (decision.payload.kind != "scope"
      || decision.provenance.scenario == "revise-stakeholder-change-after-review@2")
    && none("newer-revisions-for@1", {subject: decision})
    && exists("failing-reviews-for@1", {subject: decision})
    && exists("changes-controlling-stakeholder-change-subject@2", {subject: decision})
  distinct: true
  order_by: [identity.id, identity.revision]
