kind: selector-definition
id: valid-pilot-vai-environment-reconciliations
version: 1
description: The exact same-lineage ENV replacement and fresh qualification pair published to reconcile one failed pilot VAI Review.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
  - {name: environment, kind: revision, types: [ENV]}
  - {name: strategy, kind: revision, types: [VSP]}
  - {name: replacement, kind: revision, types: [ENV]}
  - {name: qualification_activity, kind: revision, types: [VER]}
  - {name: qualification_implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: revisions, of: environment, emit: entity, types: [ENV]}
  as: candidate
  where: >-
    candidate == replacement
    && candidate.identity.id == environment.identity.id
    && candidate.identity.revision > environment.identity.revision
    && candidate.payload.strategy_revision == strategy.identity.revision_id
    && candidate.payload.profile_id == strategy.payload.environment_profile.id
    && candidate.payload.capabilities == strategy.payload.environment_profile.capabilities
    && count("all-cited-reviews-by-correction@1", {replacement: candidate})
      == count("failing-reviews-for@1", {subject: implementation})
    && every("all-cited-reviews-by-correction@1", {replacement: candidate}, review =>
      exists("matching-failing-review-for@1",
        {subject: implementation, review: review}))
    && qualification_activity.payload.kind == "qualification"
    && qualification_activity.payload.claim.scope == "environment-capability"
    && qualification_implementation.payload.kind == "qualification"
    && qualification_implementation.payload.independence_mode
      == "environment-capability"
    && count("qualification-activities-for-environment@1", {environment: candidate}) == 1
    && one("qualification-activities-for-environment@1", {environment: candidate})
      == qualification_activity
    && count("qualification-implementations-for-environment@1", {environment: candidate}) == 1
    && one("qualification-implementations-for-environment@1", {environment: candidate})
      == qualification_implementation
    && count("verification-activities-for-implementation@1",
      {implementation: qualification_implementation}) == 1
    && one("verification-activities-for-implementation@1",
      {implementation: qualification_implementation}) == qualification_activity
  distinct: true
  order_by: [identity.revision]
