kind: selector-definition
id: corrected-phase-1-assurance-reviews-for
version: 1
description: Exact failed Reviews explicitly addressed by one corrected Phase 1 assurance Revision.
parameters:
  - {name: replacement, kind: revision, types: [VSP, ENV, VER, VAI]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: replacement, link: corrects-review, emit: target, types: [REV]}
  as: review
  distinct: true
  order_by: [identity.revision_id]
