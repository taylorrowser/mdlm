kind: selector-definition
id: eligible-pilot-targets-for-activity
version: 1
description: The singular current exact controlled target covering all requirements exercised by a pilot activity.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from:
    selector: current-pilot-targets-for-activity@1
    arguments: {activity: activity}
  as: target
  distinct: true
  order_by: [identity.revision_id]
