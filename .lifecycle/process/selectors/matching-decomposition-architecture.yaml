kind: selector-definition
id: matching-decomposition-architecture
version: 1
description: The supplied exact architecture when it is canonically linked by one DWP Revision.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: architecture, kind: revision, types: [ASP]}
result_kind: revision
query:
  from:
    selector: architectures-for-decomposition@1
    arguments: {plan: plan}
  as: linked
  where: 'linked == architecture'
  distinct: true
  order_by: [identity.revision_id]
