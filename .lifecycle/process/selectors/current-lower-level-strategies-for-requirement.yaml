kind: selector-definition
id: current-lower-level-strategies-for-requirement
version: 1
description: Current component or design strategy directly governing one exact SYS or CMP parent.
parameters:
  - {name: requirement, kind: revision, types: [SYS, CMP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: governs-revision, emit: source, types: [VSP]}
  as: strategy
  where: >-
    ((phase.id == "phase-2-system-definition" && strategy.payload.level == "system")
      || (phase.id == "phase-3-component-definition" && strategy.payload.level == "component")
      || (phase.id == "phase-4-design-definition" && strategy.payload.level == "design"))
    && state(strategy, "disposition") == "active"
    && state(strategy, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: strategy})
  distinct: true
  order_by: [identity.id, identity.revision]
