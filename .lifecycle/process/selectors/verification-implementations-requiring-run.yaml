kind: selector-definition
id: verification-implementations-requiring-run
version: 1
description: Current valid qualification, pilot, or Phase 6 formal implementations whose execution obligations are evaluated.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [VAI]}
  as: implementation
  where: >-
    ((phase.id == "phase-6-verification" && implementation.payload.kind == "formal")
      || (phase.id != "phase-6-verification"
        && implementation.payload.kind in ["qualification", "pilot"]))
    && state(implementation, "disposition") == "active"
    && state(implementation, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: implementation})
  distinct: true
  order_by: [identity.revision_id]
