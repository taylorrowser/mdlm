kind: selector-definition
id: current-questions-indexed-by-map
version: 1
description: Current exact Question Revisions referenced by stable indexes links in one MAP lineage.
parameters:
  - {name: subject, kind: revision, types: [MAP]}
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: question
  where: >-
    none("newer-revisions-for@1", {subject: question})
    && exists("map-lineage-revisions-indexing-question@1",
      {subject: subject, question: question})
  distinct: true
  order_by: [identity.id, identity.revision]
