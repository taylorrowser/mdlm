kind: selector-definition
id: matching-reviewed-gate-rejection-correction-for-subject
version: 1
description: The supplied same-lineage replacement when it cites every reviewed gate rejection for one exact Phase 2 subject and has fresh passing Review.
parameters:
  - {name: subject, kind: revision}
  - {name: replacement, kind: revision}
result_kind: revision
query:
  from:
    selector: reviewed-gate-rejection-corrections-for-subject@1
    arguments: {subject: subject}
  as: correction
  where: 'correction == replacement'
  distinct: true
  order_by: [identity.revision_id]
