kind: selector-definition
id: gate-decision-review-support-for
version: 1
description: Exact candidate, Decision lineage, and causal failed Reviews needed to judge one Phase 0 gate Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {collection: revisions, types: [DEC, REV, BSL]}
  as: support
  where: >-
    decision.payload.kind == "gate-signoff"
    && decision.provenance.scenario in [
      "record-gate-signoff@3",
      "revise-gate-signoff-after-review@2"
    ]
    && (
      !every("gate-candidates-for-decision@1",
        {decision: decision}, candidate => candidate != support)
      || (support.identity.id == decision.identity.id
        && support.identity.revision <= decision.identity.revision)
      || !every("cited-failing-reviews-by-correction@1",
        {replacement: decision}, review => review != support)
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
