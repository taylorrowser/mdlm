kind: selector-definition
id: design-acceptance-evidence-for-candidate
version: 1
description: Exact candidate and gate authority evidence plus every current passing implementation ART and formal-VAI Review for one design candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV, DEC]}
  as: evidence
  where: >-
    !every("level-acceptance-evidence-for-candidate@1", {candidate: candidate}, required => required != evidence)
    || !every("phase-5-implementation-reviews-for-candidate@1", {candidate: candidate}, required => required != evidence)
  distinct: true
  order_by: [identity.type, identity.revision_id]
