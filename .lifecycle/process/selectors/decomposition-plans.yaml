kind: selector-definition
id: decomposition-plans
version: 1
description: Exact active DWP planning Revisions for the active phase's declared child type.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: plan
  where: >-
    plan.payload.stage == "planning"
    && ((phase.id == "phase-2-system-definition" && plan.payload.target_child_type == "SYS")
      || (phase.id == "phase-3-component-definition" && plan.payload.target_child_type == "CMP")
      || (phase.id == "phase-4-design-definition" && plan.payload.target_child_type == "DES"))
    && state(plan, "disposition") == "active"
    && state(plan, "validity") == "valid"
    && exists("planning-dwp-review-support-is-current@1", {plan: plan})
    && none("newer-planning-revisions-for@1", {plan: plan})
  distinct: true
  order_by: [identity.id, identity.revision]
