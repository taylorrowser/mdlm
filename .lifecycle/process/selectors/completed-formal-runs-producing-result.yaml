kind: selector-definition
id: completed-formal-runs-producing-result
version: 1
description: Valid completed formal runs that produced one exact immutable result.
parameters:
  - {name: result, kind: revision, types: [RES]}
result_kind: revision
query:
  from: {relation: incoming-links, of: result, link: produces, emit: source, types: [RUN]}
  as: run
  where: >-
    run.payload.kind == "formal"
    && run.payload.execution_state == "completed"
    && state(run, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
