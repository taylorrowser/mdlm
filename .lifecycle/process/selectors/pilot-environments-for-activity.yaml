kind: selector-definition
id: pilot-environments-for-activity
version: 1
description: The singular exactly realized environment declared by the strategy governing one pilot activity, before qualification and Review gates.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {collection: revisions, types: [ENV]}
  as: environment
  where: >-
    count("strategies-for-verification-activity@1", {activity: activity}) == 1
    && count("complete-environment-assurance-for-strategy@1",
      {strategy: one("strategies-for-verification-activity@1", {activity: activity})}) == 1
    && one("complete-environment-assurance-for-strategy@1",
      {strategy: one("strategies-for-verification-activity@1", {activity: activity})}) == environment
  distinct: true
  order_by: [identity.revision_id]
