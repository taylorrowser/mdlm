kind: selector-definition
id: failed-reviewed-consequential-decisions
version: 1
description: Current pilot-expansion or product-acceptance Decisions with a failed independent Review and no valid replacement.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind in ["pilot-expansion", "product-acceptance"]
    && state(decision, "disposition") == "active"
    && state(decision, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: decision})
    && count("consequential-decision-correction-subjects-for@1",
      {decision: decision}) == 1
    && exists("failing-reviews-for@1", {subject: decision})
    && none("valid-reviewed-consequential-decision-replacements-for@1",
      {decision: decision})
  distinct: true
  order_by: [identity.id, identity.revision]
