kind: selector-definition
id: phase-2-scope-removal-reviews-for-output
version: 1
description: Current exact consistency-set simplification failures that declare one challenged SYS output removed.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: output, kind: revision, types: [SYS]}
  - {name: replacement_plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: output, link: removes, emit: source, types: [REV]}
  as: review
  where: >-
    review.payload.decomposition_plan_revision == plan.identity.revision_id
    && review.payload.outcome == "fail"
    && review.payload.definition_simplification.correction_set == "definition-consistency"
    && exists("phase-2-replacement-plan-corrects-review@1",
      {review: review, replacement_plan: replacement_plan})
  distinct: true
  order_by: [identity.revision_id]
