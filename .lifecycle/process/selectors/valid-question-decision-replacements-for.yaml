kind: selector-definition
id: valid-question-decision-replacements-for
version: 1
description: Current causal same-lineage replacements preserving one failed Question Decision's kind and exact scope.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    selector: newer-revisions-for@1
    arguments: {subject: decision}
  as: replacement
  where: >-
    replacement.identity.id == decision.identity.id
    && replacement.payload.kind == decision.payload.kind
    && replacement.payload.effective_scope == decision.payload.effective_scope
    && state(replacement, "disposition") == "active"
    && state(replacement, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: replacement})
    && exists("question-targets-for-decision@1", {decision: replacement})
    && count("cited-failing-reviews-by-correction@1", {replacement: replacement})
      == count("failing-reviews-for@1", {subject: decision})
    && every("failing-reviews-for@1", {subject: decision}, review =>
      exists("matching-cited-failing-review-by-correction@1",
        {replacement: replacement, review: review}))
  distinct: true
  order_by: [identity.revision]
