kind: selector-definition
id: current-formal-results-requiring-assessment
version: 1
description: Exact current formal passing results that need one fresh independent human assessment.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [RES]}
  as: result
  where: >-
    phase.id == "phase-6-verification"
    && result.payload.claim.kind == "formal"
    && result.payload.claim.scope == "requirement"
    && result.payload.claim.outcome in ["pass", "fail"]
    && result.payload.claim.formal_evidence_eligible == true
    && result.payload.assessment_state == "assessment-required"
    && state(result, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: result})
    && none("failing-reviews-for@1", {subject: result})
    && count("formal-runs-producing-result@1", {result: result}) == 1
  distinct: true
  order_by: [identity.revision_id]
