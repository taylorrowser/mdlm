kind: selector-definition
id: failed-current-pilot-verification-activities
version: 1
description: Current exact Phase 1 pilot verification activity Revisions with a valid failed Review.
parameters: []
result_kind: revision
query:
  from:
    selector: current-pilot-verification-activities@1
    arguments: {}
  as: activity
  where: 'exists("failing-reviews-for@1", {subject: activity})'
  distinct: true
  order_by: [identity.id, identity.revision]
