kind: selector-definition
id: current-active-phase-verification-strategies
version: 1
description: Current verification strategies applicable to the active assurance route.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [VSP]}
  as: strategy
  where: >-
    state(strategy, "disposition") == "active"
    && state(strategy, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: strategy})
    && (
      (phase.id == "phase-1-product-assurance"
        && strategy.payload.level == "stakeholder")
      || (phase.id == "phase-2-system-definition"
        && strategy.payload.level == "system")
    )
  distinct: true
  order_by: [identity.id, identity.revision]
