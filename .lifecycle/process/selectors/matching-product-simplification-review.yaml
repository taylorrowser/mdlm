kind: selector-definition
id: matching-product-simplification-review
version: 1
description: The supplied product-simplification Review when it exactly reviews the supplied intent candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from:
    selector: product-simplification-reviews-for@1
    arguments: {candidate: candidate, outcome: 'review.payload.outcome'}
  as: matching_review
  where: 'matching_review == review'
  distinct: true
  order_by: [identity.revision_id]
