kind: selector-definition
id: matching-product-simplification-review
version: 1
description: The supplied product-simplification Review when it exactly reviews the supplied intent candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: candidate, link: reviews, emit: source, types: [REV]}
  as: matching_review
  where: >-
    matching_review == review
    && matching_review.payload.review_kind == "simplification-product-definition"
    && matching_review.payload.outcome == review.payload.outcome
    && state(matching_review, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
