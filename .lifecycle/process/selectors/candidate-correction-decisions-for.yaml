kind: selector-definition
id: candidate-correction-decisions-for
version: 1
description: Exact valid scope-authority Decisions published atomically with one candidate Correction.
parameters:
  - {name: replacement, kind: revision, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: replacement, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    (
      decision.provenance.scenario == replacement.provenance.scenario
      || (
        replacement.payload.kind == "intent-level-candidate"
        && replacement.provenance.scenario == "revise-intent-candidate-after-review@3"
        && decision.provenance.scenario ==
          "revise-candidate-correction-decision-after-review@1"
      )
    )
    && decision.payload.kind == "scope"
    && decision.payload.effective_scope == replacement.identity.revision_id
    && none("newer-revisions-for@1", {subject: decision})
    && state(decision, "disposition") == "active"
    && state(decision, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
