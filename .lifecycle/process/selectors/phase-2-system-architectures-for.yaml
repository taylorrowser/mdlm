kind: selector-definition
id: phase-2-system-architectures-for
version: 1
description: Exact architecture allocated by one Phase 2 system requirement Revision.
parameters:
  - {name: requirement, kind: revision, types: [SYS]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: requirement, link: allocated-to, emit: target, types: [ASP]}
  as: architecture
  where: 'true'
  distinct: true
  order_by: [identity.revision_id]
