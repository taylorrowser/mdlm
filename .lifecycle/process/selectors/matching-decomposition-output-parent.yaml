kind: selector-definition
id: matching-decomposition-output-parent
version: 1
description: The supplied exact STK, SYS, or CMP parent Revision when one matching decomposition output canonically derives from it.
parameters:
  - {name: output, kind: revision, types: [SYS, CMP, DES]}
  - {name: parent, kind: revision, types: [STK, SYS, CMP]}
result_kind: revision
query:
  from:
    selector: decomposition-output-parents-for@1
    arguments: {output: output}
  as: linked
  where: 'linked.identity.revision_id == parent.identity.revision_id'
  distinct: true
  order_by: [identity.revision_id]
