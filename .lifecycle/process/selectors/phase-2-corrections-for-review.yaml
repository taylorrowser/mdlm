kind: selector-definition
id: phase-2-corrections-for-review
version: 1
description: Current valid Phase 2 definition Revisions that cite one failed simplification Review as their exact cause.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: review, link: corrects-review, emit: source, types: [SYS, ASP, ICSP, DWP]}
  as: correction
  where: 'state(correction, "validity") == "valid"'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
