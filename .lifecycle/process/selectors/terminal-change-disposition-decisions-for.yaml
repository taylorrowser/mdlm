kind: selector-definition
id: terminal-change-disposition-decisions-for
version: 1
description: Exact reviewed rejection, deferral, or cancellation Decisions closing one Change Request without implementation.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    selector: recorded-change-approval-decisions-for@2
    arguments: {change: change}
  as: decision
  where: >-
    decision.payload.change_disposition in ["reject", "defer", "cancel"]
    && exists("passing-reviews-for@1", {subject: decision})
  distinct: true
  order_by: [identity.revision_id]
