kind: selector-definition
id: phase-2-architecture-representative-requirements
version: 1
description: One deterministic accepted requirement representative for each current Phase 2 architecture.
parameters: []
result_kind: revision
query:
  from:
    selector: phase-2-entry-requirements@1
    arguments: {}
  as: requirement
  where: >-
    count("current-architectures-for-requirement@1", {requirement: requirement}) == 1
    && requirement == first("accepted-requirements-for-architecture@1",
      {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})})
  distinct: true
  order_by: [identity.revision_id]
