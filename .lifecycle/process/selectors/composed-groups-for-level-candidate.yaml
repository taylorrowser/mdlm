kind: selector-definition
id: composed-groups-for-level-candidate
version: 1
description: Exact group candidate Revisions composed by one level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: candidate, link: composes, emit: target, types: [BSL]}
  as: group
  where: 'group.payload.kind == "group-candidate" && group.storage.frozen == true'
  distinct: true
  order_by: [identity.revision_id]
