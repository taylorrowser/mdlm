kind: selector-definition
id: pilot-control-observations-match-target
version: 1
description: Prototype targets whose declared expected observations exactly match one completed pilot run.
parameters:
  - {name: run, kind: revision, types: [RUN]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: run, link: targets, emit: target, types: [ART]}
  as: target
  where: >-
    present(target.payload.prototype_controls)
    && run.payload.control_observations.known_good.exit_status == target.payload.prototype_controls.known_good.expected_observation.exit_status
    && run.payload.control_observations.known_bad.exit_status == target.payload.prototype_controls.known_bad.expected_observation.exit_status
    && run.payload.control_observations.known_good.stdout == target.payload.prototype_controls.known_good.expected_observation.stdout
    && run.payload.control_observations.known_bad.stdout == target.payload.prototype_controls.known_bad.expected_observation.stdout
    && run.payload.control_observations.known_good.stderr == target.payload.prototype_controls.known_good.expected_observation.stderr
    && run.payload.control_observations.known_bad.stderr == target.payload.prototype_controls.known_bad.expected_observation.stderr
  distinct: true
  order_by: [identity.revision_id]
