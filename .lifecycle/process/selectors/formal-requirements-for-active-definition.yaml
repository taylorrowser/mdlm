kind: selector-definition
id: formal-requirements-for-active-definition
version: 1
description: Exact requirement ancestry for every current lower-level completion in the active Phase 3 or Phase 4 definition slice.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [STK, SYS, CMP, DES]}
  as: requirement
  where: >-
    !every("current-decomposition-completions@1", {}, completion =>
      !(completion.payload.target_child_type in ["CMP", "DES"])
      || (phase.id == "phase-3-component-definition" && completion.payload.target_child_type != "CMP")
      || (phase.id == "phase-4-design-definition" && completion.payload.target_child_type != "DES")
      || every("formal-requirements-for-completion@1", {completion: completion}, required => required != requirement))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
