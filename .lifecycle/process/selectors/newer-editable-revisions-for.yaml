kind: selector-definition
id: newer-editable-revisions-for
version: 1
description: Later editable revisions of the same stable datum.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from:
    selector: newer-revisions-for@1
    arguments: {subject: subject}
  as: revision
  where: 'revision.storage.editable == true'
  distinct: true
  order_by: [identity.revision]
