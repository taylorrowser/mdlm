kind: selector-definition
id: phase-2-review-removes-output
version: 1
description: The supplied exact SYS output when one Phase 2 simplification Review declares it removed.
parameters:
  - {name: review, kind: revision, types: [REV]}
  - {name: output, kind: revision, types: [SYS]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: removes, emit: target, types: [SYS]}
  as: removed
  where: 'removed == output'
  distinct: true
  order_by: [identity.revision_id]
