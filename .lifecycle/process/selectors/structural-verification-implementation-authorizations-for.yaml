kind: selector-definition
id: structural-verification-implementation-authorizations-for
version: 1
description: Exact Scenario-valid authorization Decision structurally paired with one pilot or formal VAI without computed-state dependency.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: incoming-links, of: implementation, link: justifies, emit: source, types: [DEC]}
  as: authorization
  where: >-
    authorization.provenance.scenario == implementation.provenance.scenario
    && authorization.payload.kind in ["decision", "scope"]
    && authorization.payload.effective_scope == implementation.identity.revision_id
    && authorization.integrity.scenario_execution_valid == true
    && none("newer-revisions-for@1", {subject: authorization})
  distinct: true
  order_by: [identity.revision_id]
