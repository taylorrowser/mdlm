kind: selector-definition
id: phase-2-ambiguity-decisions-for
version: 1
description: Recorded or independently reviewed exact cancellation Decisions resolving one Phase 2 ambiguity subject.
parameters:
  - {name: subject, kind: revision, types: [ASP, VSP, DWP]}
  - {name: view, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {relation: incoming-links, of: subject, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "cancellation"
    && decision.payload.effective_scope == subject.identity.revision_id
    && state(decision, "validity") == "valid"
    && (view == "recorded"
      || (view == "applicable"
        && exists("passing-reviews-for@1", {subject: decision})))
  distinct: true
  order_by: [identity.revision_id]
