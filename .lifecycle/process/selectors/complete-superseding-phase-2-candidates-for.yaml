kind: selector-definition
id: complete-superseding-phase-2-candidates-for
version: 1
description: Same-lineage superseding Phase 2 candidates preserving every unaffected exact member, evidence item, and composed group.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: superseding-baselines-for@1
    arguments: {baseline: candidate}
  as: replacement
  where: >-
    replacement.identity.id == candidate.identity.id
    && replacement.payload.kind == candidate.payload.kind
    && replacement.payload.role == candidate.payload.role
    && replacement.payload.scope == candidate.payload.scope
    && replacement.payload.group == candidate.payload.group
    && replacement.storage.frozen == true
    && every("candidate-definition-members@1", {candidate: candidate}, member =>
      exists("candidate-members-matching@1",
        {candidate: replacement, required_member: member}))
    && every("candidate-definition-members@1", {candidate: replacement}, member =>
      exists("candidate-members-matching@1",
        {candidate: candidate, required_member: member}))
    && every("baseline-evidence@1", {baseline: candidate}, evidence =>
      exists("baseline-contains-evidence@1",
        {baseline: replacement, subject: evidence}))
    && every("baseline-evidence@1", {baseline: replacement}, evidence =>
      exists("baseline-contains-evidence@1",
        {baseline: candidate, subject: evidence}))
    && every("composed-groups-for-level-candidate@1", {candidate: candidate}, group =>
      exists("level-candidate-composes-group@1",
        {candidate: replacement, group: group}))
    && every("composed-groups-for-level-candidate@1", {candidate: replacement}, group =>
      exists("level-candidate-composes-group@1",
        {candidate: candidate, group: group}))
    && count("cited-failing-reviews-by-correction@1",
      {replacement: replacement})
      == count("failing-reviews-for@1", {subject: candidate})
    && count("cited-gate-rejections-by-correction@1",
      {replacement: replacement})
      == count("reviewed-gate-rejections-for-candidate@1",
        {candidate: candidate})
    && every("reviewed-gate-rejections-for-candidate@1", {candidate: candidate}, rejection =>
      exists("matching-cited-gate-rejection-by-correction@1",
        {replacement: replacement, rejection: rejection}))
  distinct: true
  order_by: [identity.revision]
