kind: selector-definition
id: review-context-members-for
version: 1
description: Exact supporting Revisions required beside one primary subject in its current Review Context.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, QST, DEC, ART, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS]}
  as: member
  where: >-
    member != subject
    && (
      !every("direct-review-support-for@1", {subject: subject}, support =>
        support != member)
      || (exists("intent-candidates-matching-subject@1", {subject: subject})
        && (
          exists("candidate-members-matching@1",
            {candidate: one("intent-candidates-matching-subject@1", {subject: subject}), required_member: member})
          || !every("phase-0-candidate-correction-support-for@1",
            {candidate: one("intent-candidates-matching-subject@1", {subject: subject})}, support => support != member)
          || !every("candidate-question-resolution-support-for@1",
            {candidate: one("intent-candidates-matching-subject@1", {subject: subject})}, support => support != member)
          || !every("candidate-correction-authority-decisions-for-review@1",
            {candidate: one("intent-candidates-matching-subject@1", {subject: subject})}, authority => authority != member)
          || !every("all-cited-reviews-by-correction@1",
            {replacement: one("intent-candidates-matching-subject@1", {subject: subject})}, review => review != member)
        ))
      || (subject.identity.type == "DEC"
        && (
          !every("candidate-correction-decision-review-support-for@1",
            {decision: subject}, support => support != member)
          || !every("gate-decision-review-support-for@1",
            {decision: subject}, support => support != member)
          || !every("gate-candidate-reviews-for-decision@1",
            {decision: subject}, review => review != member)
          || !every("gate-candidate-authority-support-for-decision@1",
            {decision: subject}, authority => authority != member)
          || !every("foundation-correction-causes-for-decision@1",
            {decision: subject}, cause => cause != member)
          || !every("prior-foundation-correction-decision-revisions-for@1",
            {decision: subject}, prior => prior != member)
          || !every("question-targets-for-decision@1",
            {decision: subject}, question => question != member)
          || !every("structural-initial-product-intent-sources-for-decision@1",
            {decision: subject}, source => source != member)
          || !every("initial-product-intent-boundaries-for-decision@1",
            {decision: subject}, boundary => boundary != member)
        ))
      || (subject.identity.type in ["MAP", "PSP", "STK"]
        && (
          exists("all-cited-reviews-by-correction@1", {replacement: subject})
          || exists("all-cited-gate-rejections-by-correction@1", {replacement: subject})
          || exists("foundation-correction-decisions-for@1", {replacement: subject})
        )
        && (
          !every("prior-foundation-revisions-for@1",
            {subject: subject}, revision => revision != member)
          || !every("all-cited-reviews-by-correction@1",
            {replacement: subject}, review => review != member)
          || !every("all-cited-gate-rejections-by-correction@1",
            {replacement: subject}, rejection => rejection != member)
          || !every("foundation-correction-decisions-for@1",
            {replacement: subject}, decision => decision != member)
        ))
      || (subject.identity.type == "STK"
        && member.identity.type == "PSP"
        && !every("stakeholder-requirements-for-review-context@1",
          {product_specification: member}, requirement => requirement != subject))
      || (subject.identity.type == "ENV"
        && (
          !every("strategies-for-environment@1", {environment: subject}, strategy =>
            strategy != member)
          || !every("environment-review-evidence-for@1", {environment: subject}, evidence =>
            evidence != member)
        ))
      || (subject.identity.type == "VER"
        && (
          !every("requirements-for-pilot-activity@1", {activity: subject}, requirement =>
            requirement != member)
          || !every("pilot-intent-support-for-activity@1",
            {activity: subject}, intent => intent != member)
          || !every("strategies-for-verification-activity@1", {activity: subject}, strategy =>
            strategy != member)
        ))
      || (subject.identity.type == "DWP"
        && subject.payload.stage == "planning"
        && !every("planning-dwp-review-support-for@1", {plan: subject}, support =>
          support != member))
      || (exists("change-level-candidates-matching-subject@1", {subject: subject})
        && exists("candidate-members-matching@1",
          {candidate: one("change-level-candidates-matching-subject@1", {subject: subject}), required_member: member}))
      || (subject.identity.type == "CHG"
        && every("impacted-requirements-for-change@3", {change: subject}, requirement =>
          requirement.identity.type == "SYS")
        && exists("valid-stakeholder-change-impact@2", {change: subject})
        && (
          !every("impacted-requirements-for-change@3", {change: subject}, requirement => requirement != member)
          || !every("accepted-intent-baselines-for-change@1", {change: subject}, accepted => accepted != member)
          || !every("accepted-shared-system-consumer-revisions-for-change@1", {change: subject}, consumer => consumer != member)
          || !every("shared-system-change-contexts@1", {change: subject}, context => context != member)
          || !every("shared-system-change-candidates@1", {change: subject}, candidate => candidate != member)
          || !every("shared-system-change-verification-evidence@1", {change: subject}, evidence => evidence != member)
          || !every("shared-system-change-contexts@1", {change: subject}, context =>
            every("revisions-tracing-subject@1", {subject: context}, review => review != member))
          || !every("shared-system-change-candidates@1", {change: subject}, candidate =>
            every("revisions-tracing-subject@1", {subject: candidate}, dependent =>
              dependent != member
              && every("revisions-tracing-subject@1", {subject: dependent}, downstream => downstream != member)))
        ))
      || (subject.identity.type == "DWP"
        && !every("system-requirements-consumed-by@1", {consumer: subject}, requirement =>
          requirement != member))
      || !every("changes-changed-under-subject@1", {subject: subject}, change =>
        change != member
        && every("change-approval-decisions-for-review-context@1", {change: change}, decision =>
          decision != member))
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
