kind: selector-definition
id: updated-shared-system-consumers-for-change
version: 1
description: Complete current consumer coverage Revisions for every original consumer affected by one shared-SYS Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: replacement
  where: >-
    none("newer-revisions-for@1", {subject: replacement})
    && replacement.payload.parent_coverage_status == "complete"
    && !every("changes-changed-under-subject@1", {subject: replacement}, owner => owner != change)
    && !every("shared-system-consumers-for-change@1", {change: change}, consumer =>
      consumer.identity.id != replacement.identity.id
      || consumer.payload.stage != replacement.payload.stage)
    && every("revised-requirements-for-change@3", {change: change}, requirement =>
      !every("system-requirements-consumed-by@1", {consumer: replacement}, parent =>
        parent != requirement))
  distinct: true
  order_by: [identity.id, identity.revision]
