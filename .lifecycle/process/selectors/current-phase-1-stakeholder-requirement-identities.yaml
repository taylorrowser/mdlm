kind: selector-definition
id: current-phase-1-stakeholder-requirement-identities
version: 1
description: Stable identities of the current active stakeholder requirements inherited from accepted Phase 0 intent.
parameters: []
result_kind: stable-datum
query:
  from: {collection: stable-data, types: [STK]}
  as: requirement
  where: >-
    !every("current-phase-1-stakeholder-requirements@1", {}, current =>
      current.identity.id != requirement.identity.id)
  distinct: true
  order_by: [identity.id]
