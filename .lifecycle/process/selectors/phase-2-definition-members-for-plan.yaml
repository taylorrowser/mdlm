kind: selector-definition
id: phase-2-definition-members-for-plan
version: 1
description: The complete current ASP, ICSP, planning DWP, and SYS definition set sharing the representative plan's architecture.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [SYS, ASP, ICSP, DWP]}
  as: member
  where: >-
    !every("decomposition-plans-sharing-architecture-with@1", {plan: plan}, sibling =>
      member != sibling)
    || (member.identity.type == "SYS"
      && !every("decomposition-plans-sharing-architecture-with@1", {plan: plan}, sibling =>
        none("matching-decomposition-output@1", {plan: sibling, output: member})))
    || (member.identity.type == "ASP"
      && count("architectures-for-decomposition@1", {plan: plan}) == 1
      && member == one("architectures-for-decomposition@1", {plan: plan}))
    || (member.identity.type == "ICSP"
      && !every("decomposition-plans-sharing-architecture-with@1", {plan: plan}, sibling =>
        none("matching-decomposition-interface@1", {plan: sibling, interface: member})))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
