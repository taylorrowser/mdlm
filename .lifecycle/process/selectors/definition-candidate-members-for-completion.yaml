kind: selector-definition
id: definition-candidate-members-for-completion
version: 1
description: Exact coherent lower-level definition members and complete reviewed formal VER set for one completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [CMP, DES, ASP, ICSP, DWP, VSP, VER]}
  as: member
  where: >-
    !every("definition-members-for-completion@1", {completion: completion}, definition => definition != member)
    || !every("formal-verification-activities-for-completion@1", {completion: completion}, activity => activity != member)
    || !every("representative-component-pilot-activities-for-completion@1", {completion: completion}, activity => activity != member)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
