kind: selector-definition
id: corrected-pilot-verification-implementation-revisions-for
version: 1
description: Valid newer pilot VAI Revisions preserving exact claim-class, activity, ENV, ART, and case bindings while citing every and only failed Review.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: revisions, of: implementation, emit: entity, types: [VAI]}
  as: replacement
  where: >-
    replacement.identity.revision > implementation.identity.revision
    && state(replacement, "validity") == "valid"
    && implementation.payload.kind == "pilot"
    && replacement.payload.kind == implementation.payload.kind
    && replacement.payload.independence_mode == implementation.payload.independence_mode
    && replacement.payload.activity_bindings == implementation.payload.activity_bindings
    && replacement.payload.target_behavior == implementation.payload.target_behavior
    && every("failing-reviews-for@1", {subject: implementation}, review =>
      exists("matching-corrected-phase-1-assurance-review@1",
        {subject: implementation, replacement: replacement, review: review}))
    && none("unexpected-corrected-phase-1-assurance-reviews@1",
      {subject: implementation, replacement: replacement})
    && count("verification-activities-for-implementation@1",
      {implementation: implementation}) == 1
    && count("verification-activities-for-implementation@1",
      {implementation: replacement}) == 1
    && one("verification-activities-for-implementation@1",
      {implementation: replacement})
      == one("verification-activities-for-implementation@1",
        {implementation: implementation})
    && count("environments-for-implementation@1",
      {implementation: implementation}) == 1
    && count("environments-for-implementation@1",
      {implementation: replacement}) == 1
    && one("environments-for-implementation@1", {implementation: replacement})
      == one("environments-for-implementation@1", {implementation: implementation})
    && count("artifact-targets-for-implementation@1",
      {implementation: implementation}) == 1
    && count("artifact-targets-for-implementation@1",
      {implementation: replacement}) == 1
    && one("artifact-targets-for-implementation@1", {implementation: replacement})
      == one("artifact-targets-for-implementation@1", {implementation: implementation})
    && exists("pilot-implementation-authorizations-for@1",
      {implementation: replacement})
  distinct: true
  order_by: [identity.revision]
