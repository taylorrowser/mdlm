kind: selector-definition
id: phase-5-formal-vai-review-anchor
version: 1
description: Deterministic first current formal VAI used only to scope one exact sibling Review Context.
parameters: []
result_kind: revision
query:
  from:
    selector: phase-5-formal-verification-implementations@1
    arguments: {}
  as: implementation
  where: >-
    implementation == first("phase-5-formal-verification-implementations@1", {})
    && exists("design-candidates-for-formal-vai@1", {implementation: implementation})
    && every("formal-activities-for-phase-5-candidate@1",
      {candidate: one("design-candidates-for-formal-vai@1", {implementation: implementation})}, activity =>
        count("structural-formal-implementations-for-activity@1", {activity: activity}) == 1)
  distinct: true
  order_by: [identity.id, identity.revision]
