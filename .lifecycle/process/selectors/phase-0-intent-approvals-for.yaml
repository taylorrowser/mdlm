kind: selector-definition
id: phase-0-intent-approvals-for
version: 1
description: Exact accepted intent baselines that faithfully promote one reviewed and approved Phase 0 candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: accepted
  where: >-
    exists("accepted-baseline-promotes-candidate@1",
      {accepted: accepted, candidate: candidate})
    && accepted.payload.kind == "intent-approved"
    && accepted.payload.role == "accepted"
    && accepted.payload.scope == candidate.payload.scope
    && accepted.payload.group == candidate.payload.group
    && accepted.storage.frozen == true
    && state(accepted, "validity") == "valid"
    && every("phase-0-foundation-members@1", {}, member =>
      exists("candidate-members-matching@1",
        {candidate: accepted, required_member: member}))
    && none("non-phase-0-foundation-members-for@1", {candidate: accepted})
    && every("passing-reviews-for@1", {subject: candidate}, review =>
      exists("baseline-contains-evidence@1",
        {baseline: accepted, subject: review}))
    && every("applicable-gate-signoffs-for@1", {candidate: candidate}, signoff =>
      exists("baseline-contains-evidence@1",
        {baseline: accepted, subject: signoff})
      && every("passing-reviews-for@1", {subject: signoff}, review =>
        exists("baseline-contains-evidence@1",
          {baseline: accepted, subject: review})))
  distinct: true
  order_by: [identity.revision_id]
