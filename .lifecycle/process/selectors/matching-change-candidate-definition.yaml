kind: selector-definition
id: matching-change-candidate-definition
version: 1
description: The supplied candidate definition when it is the exact replacement or an unaffected reusable accepted definition.
parameters:
  - {name: change, kind: revision, types: [CHG]}
  - {name: accepted, kind: baseline, types: [BSL]}
  - {name: definition, kind: revision}
result_kind: revision
query:
  from: {relation: baseline-members, of: accepted, emit: entity, types: [MAP, PSP, STK]}
  as: prior
  where: >-
    (none("change-impacts-revision@1", {change: change, impacted: prior})
      && prior == definition)
    || (exists("change-impacts-revision@1", {change: change, impacted: prior})
      && exists("revised-requirements-for-change@2", {change: change})
      && one("revised-requirements-for-change@2", {change: change}) == definition)
  distinct: true
  order_by: [identity.revision_id]
