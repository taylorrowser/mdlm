kind: selector-definition
id: phase-2-composed-group-predecessors-for
version: 1
description: Exact old composed groups preserved unchanged or replaced by a reviewed evidence-preserving gate Correction.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: replacement_group, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: composed-groups-for-level-candidate@1
    arguments: {candidate: candidate}
  as: prior
  where: >-
    (prior == replacement_group
      && none("reviewed-gate-rejections-affecting-phase-2-candidate@1",
        {candidate: prior}))
    || exists("matching-complete-superseding-phase-2-group@1",
      {group: prior, replacement: replacement_group})
  distinct: true
  order_by: [identity.revision_id]
