kind: selector-definition
id: reusable-change-evidence-for
version: 1
description: Exact accepted intent evidence whose declared identity is outside one bounded Change Request impact.
parameters:
  - {name: change, kind: revision, types: [CHG]}
  - {name: accepted, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-evidence, of: accepted, emit: entity}
  as: evidence
  where: 'none("change-impacts-revision@1", {change: change, impacted: evidence})'
  distinct: true
  order_by: [identity.type, identity.revision_id]
