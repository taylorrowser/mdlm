kind: selector-definition
id: applicable-product-answer-reviews-for-decision
version: 1
description: Passing Reviews of one product-answer Decision whose exact blocked lineages remain reviewed or now causally incorporate that Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    selector: structural-passing-product-answer-reviews-for-decision@1
    arguments: {decision: decision}
  as: review
  where: >-
    state(decision, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: decision})
    && decision.provenance.process_ref == process.current_ref
    && review.provenance.process_ref == process.current_ref
    && count("question-targets-for-decision@1", {decision: decision}) == 1
    && count("structural-review-contexts-cited-by@1", {review: review}) == 1
    && every("question-targets-for-decision@1", {decision: decision}, question =>
      question.payload.kind == "preferential"
      && question.payload.intent_scope == "product"
      && question.payload.state == "answered"
      && none("newer-revisions-for@1", {subject: question})
      && every("structural-review-contexts-cited-by@1", {review: review}, context =>
        context.provenance.process_ref == process.current_ref
        && context.provenance.scenario in [
          "create-review-context@2",
          "review-phase-0-foundation@1"
        ]
        && context.payload.scope == decision.identity.revision_id
        && exists("review-context-contains-member@1",
          {context: context, required_member: question})
        && every("question-blocked-targets-for-decision@1",
          {decision: decision}, target =>
            exists("review-context-contains-member@1",
              {context: context, required_member: target})
            || !every("incorporated-product-answer-decisions-for-foundation-subject@1",
              {subject: target}, incorporated => incorporated != decision))))
  distinct: true
  order_by: [identity.revision_id]
