kind: selector-definition
id: pilot-expansion-decisions-for
version: 1
description: Exact reviewed proceed, change, or stop Decisions justified by one reviewed pilot assessment.
parameters:
  - {name: assessment, kind: revision, types: [PAS]}
result_kind: revision
query:
  from:
    selector: recorded-pilot-expansion-decisions-for@1
    arguments: {assessment: assessment}
  as: decision
  where: 'exists("passing-reviews-for@1", {subject: decision})'
  distinct: true
  order_by: [identity.id, identity.revision]
