kind: selector-definition
id: gate-candidates-for-decision
version: 1
description: Exact candidate justified by one gate sign-off Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [BSL]}
  as: candidate
  where: 'candidate.identity.revision_id == decision.payload.effective_scope'
  distinct: true
  order_by: [identity.revision_id]
