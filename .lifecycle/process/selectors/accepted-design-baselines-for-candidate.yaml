kind: selector-definition
id: accepted-design-baselines-for-candidate
version: 1
description: Exact frozen design acceptance baselines promoted from one Phase 5 candidate with every and only definition and implementation evidence.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: accepted
  where: >-
    exists("accepted-baseline-promotes-candidate@1", {accepted: accepted, candidate: candidate})
    && candidate.payload.kind == "level-candidate"
    && accepted.payload.kind == "level-accepted"
    && accepted.payload.role == "accepted"
    && accepted.storage.frozen == true
    && every("definition-level-candidate-members@1", {candidate: candidate}, member =>
      exists("baseline-contains-definition@1", {baseline: accepted, subject: member}))
    && count("candidate-definition-members@1", {candidate: accepted})
      == count("definition-level-candidate-members@1", {candidate: candidate})
    && every("design-acceptance-evidence-for-candidate@1", {candidate: candidate}, evidence =>
      exists("baseline-contains-evidence@1", {baseline: accepted, subject: evidence}))
    && count("baseline-evidence@1", {baseline: accepted})
      == count("design-acceptance-evidence-for-candidate@1", {candidate: candidate})
  distinct: true
  order_by: [identity.revision_id]
