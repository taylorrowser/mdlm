kind: selector-definition
id: product-simplification-blockers-for-review
version: 1
description: Canonical exact blockers named by one product-simplification Review.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: blocks, emit: target, types: [MAP, PSP, STK, BSL]}
  as: blocker
  where: 'true'
  distinct: true
  order_by: [identity.revision_id]
