kind: selector-definition
id: product-simplification-blockers-for-review
version: 1
description: Exact Phase 0 foundation Revisions named as blockers by one product simplification Review.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: blocks, emit: target, types: [MAP, PSP, STK]}
  as: blocker
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
