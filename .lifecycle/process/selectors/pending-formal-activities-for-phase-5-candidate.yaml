kind: selector-definition
id: pending-formal-activities-for-phase-5-candidate
version: 1
description: Exact formal VERs in one Phase 5 candidate that have a singular compatible environment but no formal VAI yet.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: formal-activities-for-phase-5-candidate@1
    arguments: {candidate: candidate}
  as: activity
  where: >-
    none("complete-formal-implementations-for-activity@1", {activity: activity})
    && count("formal-environments-for-activity@1", {activity: activity}) == 1
  distinct: true
  order_by: [identity.revision_id]
