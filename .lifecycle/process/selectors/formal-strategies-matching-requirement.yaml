kind: selector-definition
id: formal-strategies-matching-requirement
version: 1
description: The supplied exact strategy when it is the one level-matching formal strategy for the requirement.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP, DES]}
  - {name: strategy, kind: revision, types: [VSP]}
result_kind: revision
query:
  from:
    selector: formal-strategies-for-requirement@1
    arguments: {requirement: requirement}
  as: candidate
  where: 'candidate == strategy'
  distinct: true
  order_by: [identity.revision_id]
