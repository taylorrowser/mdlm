kind: selector-definition
id: level-candidate-composes-group
version: 1
description: The exact group candidate composed by one level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: group, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: candidate, link: composes, emit: target, types: [BSL]}
  as: composed
  where: 'composed == group'
  distinct: true
  order_by: [identity.revision_id]
