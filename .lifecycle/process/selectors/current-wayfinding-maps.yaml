kind: selector-definition
id: current-wayfinding-maps
version: 1
description: Current active Phase 0 wayfinding map Revisions.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [MAP]}
  as: map
  where: >-
    state(map, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: map})
  distinct: true
  order_by: [identity.id, identity.revision]
