kind: selector-definition
id: formal-runs-producing-result
version: 1
description: Exact valid formal run that atomically produced one exact formal result.
parameters:
  - {name: result, kind: revision, types: [RES]}
result_kind: revision
query:
  from: {relation: incoming-links, of: result, link: produces, emit: source, types: [RUN]}
  as: run
  where: >-
    run.payload.kind == "formal"
    && state(run, "validity") == "valid"
    && run.integrity.scenario_execution_valid == true
  distinct: true
  order_by: [identity.revision_id]
