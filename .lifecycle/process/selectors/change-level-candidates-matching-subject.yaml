kind: selector-definition
id: change-level-candidates-matching-subject
version: 1
description: Exact changed-under level candidate matching one supplied BSL Revision.
parameters:
  - {name: subject, kind: revision}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.identity.revision_id == subject.identity.revision_id
    && candidate.payload.kind == "level-candidate"
    && count("changes-changed-under-subject@1", {subject: candidate}) == 1
  distinct: true
  order_by: [identity.revision_id]
