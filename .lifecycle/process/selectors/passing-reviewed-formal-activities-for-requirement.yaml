kind: selector-definition
id: passing-reviewed-formal-activities-for-requirement
version: 1
description: Current exact formal VER Revisions with a current passing independent Review.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP, DES]}
result_kind: revision
query:
  from:
    selector: formal-activities-for-requirement@1
    arguments: {requirement: requirement}
  as: activity
  where: >-
    exists("passing-reviews-for@1", {subject: activity})
    && none("failing-reviews-for@1", {subject: activity})
  distinct: true
  order_by: [identity.revision_id]
