kind: selector-definition
id: open-problem-reports
version: 1
description: Exact open Problem Reports awaiting bounded impact analysis.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [PRB]}
  as: problem
  where: 'problem.payload.disposition == "open" && state(problem, "validity") == "valid"'
  distinct: true
  order_by: [identity.revision_id]
