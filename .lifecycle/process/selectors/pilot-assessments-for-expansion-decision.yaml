kind: selector-definition
id: pilot-assessments-for-expansion-decision
version: 1
description: Exact PAS whose reviewed recommendation is adopted by one pilot-expansion Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [PAS]}
  as: assessment
  where: >-
    decision.payload.kind == "pilot-expansion"
    && decision.payload.decision == assessment.payload.recommendation
    && decision.payload.effective_scope == "Phase 3–6 Example Process Package expansion"
    && exists("passing-reviews-for@1", {subject: assessment})
    && none("failing-reviews-for@1", {subject: assessment})
    && none("newer-revisions-for@1", {subject: assessment})
  distinct: true
  order_by: [identity.revision_id]
