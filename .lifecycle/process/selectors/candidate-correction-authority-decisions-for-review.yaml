kind: selector-definition
id: candidate-correction-authority-decisions-for-review
version: 1
description: Current structural scope-authority Decisions published with one exact Phase 0 candidate Correction for Review Context construction.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: candidate, link: justifies, emit: source, types: [DEC]}
  as: authority
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && candidate.payload.role == "candidate"
    && candidate.provenance.scenario == "revise-intent-candidate-after-review@3"
    && authority.provenance.scenario in [
      candidate.provenance.scenario,
      "revise-candidate-correction-decision-after-review@1"
    ]
    && authority.payload.kind == "scope"
    && authority.payload.effective_scope == candidate.identity.revision_id
    && none("newer-revisions-for@1", {subject: authority})
  distinct: true
  order_by: [identity.id, identity.revision]
