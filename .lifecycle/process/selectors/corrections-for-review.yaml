kind: selector-definition
id: corrections-for-review
version: 1
description: Exact correction Revisions that cite one Review as their cause.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: review, link: corrects-review, emit: source}
  as: correction
  where: 'true'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
