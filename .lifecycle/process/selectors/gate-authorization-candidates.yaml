kind: selector-definition
id: gate-authorization-candidates
version: 1
description: Current frozen intent- and level-candidates that require consequential gate authorization.
parameters: []
result_kind: baseline
query:
  from:
    selector: candidate-baselines@1
    arguments: {}
  as: candidate
  where: >-
    (
      candidate.payload.kind == "intent-level-candidate"
      && none("open-phase-0-gate-product-questions@1", {})
      && none("answer-stale-foundation-members-for-candidate@1",
        {candidate: candidate})
    )
    || (candidate.payload.kind == "level-candidate"
      && count("completions-for-level-candidate@1", {candidate: candidate}) == 1)
  distinct: true
  order_by: [identity.revision_id]
