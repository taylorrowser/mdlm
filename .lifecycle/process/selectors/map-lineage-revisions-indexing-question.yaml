kind: selector-definition
id: map-lineage-revisions-indexing-question
version: 1
description: Exact Revisions in one MAP lineage whose stable indexes links reference one Question.
parameters:
  - {name: subject, kind: revision, types: [MAP]}
  - {name: question, kind: revision, types: [QST]}
result_kind: revision
query:
  from: {relation: revisions, of: subject, emit: entity}
  as: revision
  where: >-
    exists("revision-links-question@1",
      {subject: revision, question: question})
  distinct: true
  order_by: [identity.revision]
