kind: selector-definition
id: formal-verification-activities-for-completion
version: 1
description: Complete current passing-reviewed formal VER coverage for every exact requirement in one definition completion ancestry.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [VER]}
  as: activity
  where: >-
    !every("formal-requirements-for-completion@1", {completion: completion}, requirement =>
      every("passing-reviewed-formal-activities-for-requirement@1", {requirement: requirement}, candidate => candidate != activity))
  distinct: true
  order_by: [identity.revision_id]
