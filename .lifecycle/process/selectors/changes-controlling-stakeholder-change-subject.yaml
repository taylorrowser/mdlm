kind: selector-definition
id: changes-controlling-stakeholder-change-subject
version: 2
description: Current exact Change Request that owns one CHG, disposition, replacement requirement, consumer coverage, or replacement candidate Revision.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from:
    selector: all-change-requests@1
    arguments: {}
  as: change
  where: >-
    change == subject
    || !every("recorded-change-approval-decisions-for@2", {change: change}, decision =>
      decision != subject)
    || !every("revised-requirements-for-change@3", {change: change}, requirement =>
      requirement != subject)
    || !every("stakeholder-change-candidates-for@1", {change: change}, candidate =>
      candidate != subject)
    || !every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
      consumer != subject)
    || !every("shared-system-change-candidates-for@1", {change: change}, candidate =>
      candidate != subject)
    || !every("stakeholder-change-decision-targets@1", {decision: subject}, target =>
      target != change
      && every("revised-requirements-for-change@3", {change: change}, requirement =>
        requirement != target)
      && every("stakeholder-change-candidates-for@1", {change: change}, candidate =>
        candidate != target)
      && every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
        consumer != target)
      && every("shared-system-change-candidates-for@1", {change: change}, candidate =>
        candidate != target))
  distinct: true
  order_by: [identity.revision_id]
