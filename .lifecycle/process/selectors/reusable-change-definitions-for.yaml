kind: selector-definition
id: reusable-change-definitions-for
version: 1
description: Exact accepted intent definitions outside one bounded Change Request impact.
parameters:
  - {name: change, kind: revision, types: [CHG]}
  - {name: accepted, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: accepted, emit: entity, types: [MAP, PSP, STK]}
  as: definition
  where: 'none("change-impacts-revision@1", {change: change, impacted: definition})'
  distinct: true
  order_by: [identity.type, identity.revision_id]
