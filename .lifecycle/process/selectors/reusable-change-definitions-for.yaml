kind: selector-definition
id: reusable-change-definitions-for
version: 1
description: Exact accepted definitions outside one bounded accepted-requirement change and its shared-SYS consumers.
parameters:
  - {name: change, kind: revision, types: [CHG]}
  - {name: accepted, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: accepted, emit: entity, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP]}
  as: definition
  where: >-
    every("impacted-requirements-for-change@3", {change: change}, requirement =>
      requirement != definition)
    && every("accepted-shared-system-consumer-revisions-for-change@1", {change: change}, consumer =>
      consumer != definition)
  distinct: true
  order_by: [identity.type, identity.revision_id]
