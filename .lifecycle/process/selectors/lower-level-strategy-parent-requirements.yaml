kind: selector-definition
id: lower-level-strategy-parent-requirements
version: 1
description: Exact current SYS outputs in Phase 2, SYS parents in Phase 3, or CMP parents in Phase 4 that require one definition strategy.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [SYS, CMP]}
  as: requirement
  where: >-
    (phase.id == "phase-2-system-definition"
      && !every("current-decomposition-completions@1", {}, completion =>
        count("planning-revisions-for-completion@1", {completion: completion}) != 1
        || exists("complete-level-candidates-for-completion@1",
          {completion: completion})
        || every("decomposition-outputs-for@1",
          {plan: one("planning-revisions-for-completion@1", {completion: completion})},
          output => output != requirement)))
    || (phase.id == "phase-3-component-definition"
      && !every("phase-3-entry-requirements@1", {}, entry => entry != requirement))
    || (phase.id == "phase-4-design-definition"
      && !every("phase-4-entry-component-requirements@1", {}, entry => entry != requirement))
  distinct: true
  order_by: [identity.revision_id]
