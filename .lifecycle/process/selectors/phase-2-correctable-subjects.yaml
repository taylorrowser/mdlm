kind: selector-definition
id: phase-2-correctable-subjects
version: 1
description: Current Phase 2 definition Revisions carrying unresolved primary or collateral Review causes.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [SYS, ASP, ICSP, DWP]}
  as: subject
  where: >-
    state(subject, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: subject})
    && (subject.identity.type != "SYS"
      || none("accepted-system-baselines-for-requirement@1", {requirement: subject}))
    && exists("phase-2-correction-reviews-for-subject@1",
      {subject: subject, view: "local"})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
