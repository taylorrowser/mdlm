kind: selector-definition
id: current-phase-1-verification-strategies
version: 1
description: Current active verification strategies applicable to at least one current Phase 1 entry requirement.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [VSP]}
  as: strategy
  where: >-
    state(strategy, "disposition") == "active"
    && state(strategy, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: strategy})
    && !every("current-phase-1-stakeholder-requirements@1", {}, requirement =>
      none("matching-verification-strategies-for-requirement@1",
        {requirement: requirement, strategy: strategy}))
  distinct: true
  order_by: [identity.id, identity.revision]
