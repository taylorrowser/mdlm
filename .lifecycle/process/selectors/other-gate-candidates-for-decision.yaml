kind: selector-definition
id: other-gate-candidates-for-decision
version: 1
description: Candidate baselines justified by a gate Decision outside its declared exact effective scope.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [BSL]}
  as: candidate
  where: 'candidate.identity.revision_id != decision.payload.effective_scope'
  distinct: true
  order_by: [identity.revision_id]
