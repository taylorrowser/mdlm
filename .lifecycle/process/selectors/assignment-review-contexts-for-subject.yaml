kind: selector-definition
id: assignment-review-contexts-for-subject
version: 1
description: Latest frozen Review Context already established for an Assignment subject.
parameters:
  - {name: subject, kind: revision}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: context
  where: >-
    context.payload.kind == "review-context"
    && context.payload.role == "review-context"
    && (context.payload.scope == subject.identity.revision_id
      || (subject.identity.type == "VAI"
        && subject.payload.kind == "formal"
        && !every("phase-5-formal-vai-contexts-for@1", {subject: subject}, exact => exact != context))
      || (subject.identity.type == "RES"
        && subject.payload.claim.kind == "formal"
        && !every("phase-6-formal-result-contexts-for@1", {subject: subject}, exact => exact != context)))
    && context.storage.frozen == true
    && context.provenance.scenario in [
      "create-review-context@2",
      "review-phase-0-foundation@1",
      "review-phase-0-candidate@1",
      "review-phase-1-assurance@1",
      "review-phase-2-datum@1"
    ]
    && none("newer-revisions-for@1", {subject: context})
  distinct: true
  order_by: [identity.revision_id]
