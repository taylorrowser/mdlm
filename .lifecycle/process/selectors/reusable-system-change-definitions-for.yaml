kind: selector-definition
id: reusable-system-change-definitions-for
version: 1
description: Exact accepted system definitions outside the changed shared SYS and its two exact consumer coverage records.
parameters:
  - {name: change, kind: revision, types: [CHG]}
  - {name: accepted, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: accepted, emit: entity, types: [SYS, ASP, ICSP, DWP, VSP]}
  as: definition
  where: >-
    every("impacted-requirements-for-change@3", {change: change}, requirement => requirement != definition)
    && every("shared-system-consumers-for-change@1", {change: change}, consumer => consumer != definition)
  distinct: true
  order_by: [identity.type, identity.revision_id]
