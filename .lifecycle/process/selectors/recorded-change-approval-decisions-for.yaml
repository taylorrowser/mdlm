kind: selector-definition
id: recorded-change-approval-decisions-for
version: 1
description: Exact valid change-approval Decisions for one exact reviewed Change Request, regardless of Decision Review completion.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "change-approval"
    && decision.payload.effective_scope == change.identity.revision_id
    && state(decision, "validity") == "valid"
    && exists("passing-reviews-for@1", {subject: change})
  distinct: true
  order_by: [identity.revision_id]
