kind: selector-definition
id: structural-passing-product-answer-reviews-for-decision
version: 1
description: Current structurally passing Reviews of one product-answer Decision for Review Context assembly without operational validity recursion.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: incoming-links, of: decision, link: reviews, emit: source, types: [REV]}
  as: review
  where: >-
    review.provenance.scenario == "review-datum-in-context@2"
    && review.payload.outcome == "pass"
    && none("newer-revisions-for@1", {subject: review})
  distinct: true
  order_by: [identity.revision_id]
