kind: selector-definition
id: phase-0-foundation-stable-link-targets
version: 1
description: Latest exact Question Revisions referenced through Stable links by current Phase 0 foundation members.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: target
  where: >-
    none("newer-revisions-for@1", {subject: target})
    && !every("phase-0-foundation-members@1", {}, member =>
      none("revision-links-question@1", {subject: member, question: target}))
  distinct: true
  order_by: [identity.id, identity.revision]
