kind: selector-definition
id: valid-pilot-result-target-reconciliations
version: 1
description: Exact same-lineage ART replacement preserving behavior scope and citing one pilot implementation's unfavorable results.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
  - {name: target, kind: revision, types: [ART]}
  - {name: activity, kind: revision, types: [VER]}
  - {name: replacement, kind: revision, types: [ART]}
result_kind: revision
query:
  from: {relation: revisions, of: target, emit: entity, types: [ART]}
  as: candidate
  where: >-
    candidate == replacement
    && candidate.identity.id == target.identity.id
    && candidate.identity.revision > target.identity.revision
    && candidate.payload.kind == target.payload.kind
    && candidate.payload.supported_behavior == target.payload.supported_behavior
    && candidate.payload.unsupported_behavior == target.payload.unsupported_behavior
    && count("pilot-results-cited-by-correction@1", {replacement: candidate})
      == count("unfavorable-pilot-results-for-implementation@1",
        {implementation: implementation})
    && every("pilot-results-cited-by-correction@1", {replacement: candidate}, result =>
      !every("unfavorable-pilot-results-for-implementation@1",
        {implementation: implementation}, cause => cause != result))
    && count("current-pilot-targets-for-activity@1", {activity: activity}) == 1
    && one("current-pilot-targets-for-activity@1", {activity: activity}) == candidate
  distinct: true
  order_by: [identity.revision]
