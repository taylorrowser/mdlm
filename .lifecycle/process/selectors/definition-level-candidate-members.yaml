kind: selector-definition
id: definition-level-candidate-members
version: 1
description: Exact flattened CMP or DES definition and formal VER Revisions held by one direct level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [CMP, DES, ASP, ICSP, DWP, VSP, VER]}
  as: member
  where: 'exists("baseline-contains-definition@1", {baseline: candidate, subject: member})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
