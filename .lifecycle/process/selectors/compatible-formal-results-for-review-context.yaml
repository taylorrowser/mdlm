kind: selector-definition
id: compatible-formal-results-for-review-context
version: 1
description: Uncontexted judgment-required formal results in one complete exact product-and-dependency support class.
parameters:
  - {name: subject, kind: revision, types: [RES]}
result_kind: revision
query:
  from:
    selector: formal-results-in-review-context-class@1
    arguments: {subject: subject}
  as: result
  where: 'none("phase-6-formal-result-contexts-for@1", {subject: result})'
  distinct: true
  order_by: [identity.revision_id]
