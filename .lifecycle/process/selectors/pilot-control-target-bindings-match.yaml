kind: selector-definition
id: pilot-control-target-bindings-match
version: 1
description: One exact pilot ART whose disposable controls are preserved by the supplied VAI Revision.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
  - {name: target, kind: revision, types: [ART]}
result_kind: revision
query:
  from: {relation: revisions, of: target, emit: entity, types: [ART]}
  as: candidate
  where: >-
    candidate == target
    && (!present(candidate.payload.prototype_controls)
      || (implementation.payload.prototype_control_bindings.activity_ref
        == candidate.payload.prototype_controls.activity_ref
      && implementation.payload.prototype_control_bindings.known_good.argv
        == candidate.payload.prototype_controls.known_good.argv
      && implementation.payload.prototype_control_bindings.known_good.expected_verification_outcome
        == "pass"
      && implementation.payload.prototype_control_bindings.known_bad.argv
        == candidate.payload.prototype_controls.known_bad.argv
      && implementation.payload.prototype_control_bindings.known_bad.expected_verification_outcome
        == "fail"))
  distinct: true
  order_by: [identity.revision_id]
