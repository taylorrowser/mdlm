kind: selector-definition
id: requirements-for
version: 1
description: requirements for
parameters:
- name: implementation
  kind: revision
  types:
  - IMP
result_kind: revision
query:
  from:
    relation: outgoing-links
    of: implementation
    link: implements
    emit: target
    types:
    - RQS
  as: item
  where: 'state(item, "validity") == "valid" && none("newer-revisions@1", {subject: item})'
  distinct: true
  order_by:
  - identity.revision_id
