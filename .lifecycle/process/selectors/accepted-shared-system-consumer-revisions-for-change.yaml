kind: selector-definition
id: accepted-shared-system-consumer-revisions-for-change
version: 1
description: Historical exact DWP Revisions in the accepted system baseline that bind the impacted shared SYS Revision.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    relation: incoming-links
    of: 'one("impacted-requirements-for-change@3", {change: change})'
    link: decomposes
    emit: source
    types: [DWP]
  as: consumer
  where: >-
    !every("accepted-intent-baselines-for-change@1", {change: change}, accepted =>
      none("baseline-contains-definition@1", {baseline: accepted, subject: consumer}))
  distinct: true
  order_by: [identity.id, identity.revision]
