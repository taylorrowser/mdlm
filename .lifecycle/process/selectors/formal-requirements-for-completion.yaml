kind: selector-definition
id: formal-requirements-for-completion
version: 1
description: Exact current STK-to-output requirement ancestry requiring formal VER coverage for one CMP or DES completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [STK, SYS, CMP, DES]}
  as: requirement
  where: >-
    none("newer-revisions-for@1", {subject: requirement})
    && !every("planning-revisions-for-completion@1", {completion: completion}, plan =>
      every("decomposition-outputs-for@1", {plan: plan}, output =>
        output != requirement
        && every("requirement-parents-for@1", {requirement: output}, parent =>
          parent != requirement
          && every("requirement-parents-for@1", {requirement: parent}, grandparent =>
            grandparent != requirement
            && every("requirement-parents-for@1", {requirement: grandparent}, ancestor =>
              ancestor != requirement)))))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
