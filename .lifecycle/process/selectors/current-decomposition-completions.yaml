kind: selector-definition
id: current-decomposition-completions
version: 1
description: Current valid DWP completion Revisions for the active phase's declared child type.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: completion
  where: >-
    completion.payload.stage == "completion"
    && ((phase.id == "phase-2-system-definition" && completion.payload.target_child_type == "SYS")
      || (phase.id == "phase-3-component-definition" && completion.payload.target_child_type == "CMP"))
    && state(completion, "disposition") == "active"
    && state(completion, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: completion})
  distinct: true
  order_by: [identity.id, identity.revision]
