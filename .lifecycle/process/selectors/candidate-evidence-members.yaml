kind: selector-definition
id: candidate-evidence-members
version: 1
description: Exact evidence Revisions held by one candidate baseline.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity}
  as: evidence
  where: 'exists("baseline-contains-evidence@1", {baseline: candidate, subject: evidence})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
