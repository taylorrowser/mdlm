kind: selector-definition
id: design-requirements-implemented-by
version: 1
description: Exact DES Revisions linked from one controlled implementation artifact.
parameters:
  - {name: implementation, kind: revision, types: [ART]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: implementation, link: implements, emit: target, types: [DES]}
  as: requirement
  distinct: true
  order_by: [identity.id, identity.revision]
