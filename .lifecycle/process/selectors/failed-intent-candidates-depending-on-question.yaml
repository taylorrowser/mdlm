kind: selector-definition
id: failed-intent-candidates-depending-on-question
version: 1
description: Failed intent candidates whose exact definition members reference one Question.
parameters:
  - {name: question, kind: revision, types: [QST]}
result_kind: baseline
query:
  from:
    selector: failed-intent-candidates@1
    arguments: {}
  as: candidate
  where: >-
    exists("candidate-members-linking-question@1",
      {candidate: candidate, question: question})
  distinct: true
  order_by: [identity.id, identity.revision]
