kind: selector-definition
id: definition-candidate-evidence-for-completion
version: 1
description: Exact coherent-set Review, formal-VER Reviews, and one reusable component pilot evidence chain for a definition candidate.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV, ENV, ART, VAI, RUN, RES]}
  as: evidence
  where: >-
    !every("valid-definition-reviews-for-completion@1", {completion: completion}, review => review != evidence)
    || !every("formal-verification-reviews-for-completion@1", {completion: completion}, review => review != evidence)
    || !every("component-pilot-evidence-for-completion@1", {completion: completion}, pilot => pilot != evidence)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
