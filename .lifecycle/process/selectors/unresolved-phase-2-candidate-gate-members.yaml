kind: selector-definition
id: unresolved-phase-2-candidate-gate-members
version: 1
description: Exact direct candidate members implicated by reviewed gate rejection without one reviewed local same-lineage Correction.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: candidate-definition-members@1
    arguments: {candidate: candidate}
  as: member
  where: >-
    exists("reviewed-gate-rejections-for-subject@1", {subject: member})
    && none("reviewed-gate-rejection-corrections-for-subject@1", {subject: member})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
