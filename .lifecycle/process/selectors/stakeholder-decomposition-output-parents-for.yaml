kind: selector-definition
id: stakeholder-decomposition-output-parents-for
version: 1
description: Exact STK parents from which one SYS decomposition output derives.
parameters:
  - {name: output, kind: revision, types: [SYS]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: output, link: derived-from, emit: target, types: [STK]}
  as: parent
  where: 'true'
  distinct: true
  order_by: [identity.revision_id]
