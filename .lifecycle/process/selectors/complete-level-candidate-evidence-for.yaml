kind: selector-definition
id: complete-level-candidate-evidence-for
version: 1
description: Exact semantically complete group evidence composed by one level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: '"group-candidate"'}
  as: group
  where: >-
    exists("level-candidate-composes-group@1",
      {candidate: candidate, group: group})
    && count("completions-for-group-candidate@1", {group: group}) == 1
    && exists("level-candidate-matches-group@1",
      {candidate: candidate, group: group})
  distinct: true
  order_by: [identity.revision_id]
