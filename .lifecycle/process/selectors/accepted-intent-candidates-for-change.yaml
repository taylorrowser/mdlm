kind: selector-definition
id: accepted-intent-candidates-for-change
version: 1
description: Exact intent candidate promoted by the accepted baseline rooted in one bounded stakeholder Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: baseline
query:
  from:
    relation: outgoing-links
    of: 'one("accepted-intent-baselines-for-change@1", {change: change})'
    link: promotes
    emit: target
    types: [BSL]
  as: candidate
  where: 'candidate.payload.kind == "intent-level-candidate"'
  distinct: true
  order_by: [identity.revision_id]
