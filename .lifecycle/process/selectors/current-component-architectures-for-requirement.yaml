kind: selector-definition
id: current-component-architectures-for-requirement
version: 1
description: Current component architecture Revisions governing one exact accepted SYS Revision.
parameters:
  - {name: requirement, kind: revision, types: [SYS]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: governs, emit: source, types: [ASP]}
  as: architecture
  where: >-
    architecture.payload.level == "component"
    && state(architecture, "disposition") == "active"
    && state(architecture, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: architecture})
  distinct: true
  order_by: [identity.id, identity.revision]
