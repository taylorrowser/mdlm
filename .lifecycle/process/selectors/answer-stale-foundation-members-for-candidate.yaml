kind: selector-definition
id: answer-stale-foundation-members-for-candidate
version: 1
description: Exact PSP or STK members of one intent candidate that have not incorporated a later reviewed product answer affecting them.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity, types: [MAP, PSP, STK]}
  as: member
  where: 'exists("unincorporated-product-questions-for-foundation-subject@1", {subject: member})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
