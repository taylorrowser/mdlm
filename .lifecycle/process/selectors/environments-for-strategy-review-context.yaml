kind: selector-definition
id: environments-for-strategy-review-context
version: 1
description: Current valid environments structurally realizing one exact strategy for Review Context construction.
parameters:
  - {name: strategy, kind: revision, types: [VSP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: strategy, link: realizes, emit: source, types: [ENV]}
  as: environment
  where: >-
    state(environment, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: environment})
  distinct: true
  order_by: [identity.id, identity.revision]
