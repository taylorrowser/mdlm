kind: selector-definition
id: planning-revisions-for-completion
version: 1
description: Exact planning Revision explicitly named by one DWP completion Revision.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: completion, link: derived-from, emit: target, types: [DWP]}
  as: plan
  where: 'plan.payload.stage == "planning"'
  distinct: true
  order_by: [identity.revision_id]
