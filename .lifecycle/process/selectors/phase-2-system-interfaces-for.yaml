kind: selector-definition
id: phase-2-system-interfaces-for
version: 1
description: Exact interfaces governing one Phase 2 system requirement Revision.
parameters:
  - {name: requirement, kind: revision, types: [SYS]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: requirement, link: governed-by, emit: target, types: [ICSP]}
  as: interface
  where: 'true'
  distinct: true
  order_by: [identity.revision_id]
