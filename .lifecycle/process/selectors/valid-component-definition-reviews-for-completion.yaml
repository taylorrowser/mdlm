kind: selector-definition
id: valid-component-definition-reviews-for-completion
version: 1
description: Current passing coherent-set Reviews whose exact frozen context contains every and only member of one component definition completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: passing-reviews-for@1
    arguments: {subject: completion}
  as: review
  where: >-
    completion.payload.target_child_type == "CMP"
    && every("current-exact-review-contexts-cited-by@1", {review: review, subject: completion}, context =>
      count("review-context-members@1", {context: context})
        == count("component-definition-members-for-completion@1", {completion: completion})
      && every("component-definition-members-for-completion@1", {completion: completion}, member =>
        exists("review-context-contains-member@1", {context: context, required_member: member})))
  distinct: true
  order_by: [identity.revision_id]
