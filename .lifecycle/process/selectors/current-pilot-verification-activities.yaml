kind: selector-definition
id: current-pilot-verification-activities
version: 1
description: Current valid pilot activities covering one Phase 1 strategy or one representative requirement at later assurance levels.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [VER]}
  as: activity
  where: >-
    activity.payload.kind == "pilot"
    && state(activity, "disposition") == "active"
    && state(activity, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: activity})
    && (
      (phase.id == "phase-1-product-assurance"
        && count("strategies-for-verification-activity@1", {activity: activity}) == 1
        && exists("pilot-verification-activities-for-strategy@1",
          {strategy: one("strategies-for-verification-activity@1",
            {activity: activity})}))
      || (phase.id == "phase-2-system-definition"
        && count("requirements-for-pilot-activity@1", {activity: activity}) == 1
        && none("stakeholder-requirements-for-pilot-activity@1",
          {activity: activity})
        && exists("pilot-activity-matches-requirement@1",
          {activity: activity,
           requirement: one("requirements-for-pilot-activity@1", {activity: activity})}))
      || (phase.id == "phase-3-component-definition"
        && count("requirements-for-pilot-activity@1", {activity: activity}) == 1
        && exists("component-requirements-for-pilot-activity@1",
          {activity: activity})
        && exists("pilot-activity-matches-requirement@1",
          {activity: activity,
           requirement: one("requirements-for-pilot-activity@1", {activity: activity})}))
      || (phase.id == "phase-4-design-definition"
        && count("requirements-for-pilot-activity@1", {activity: activity}) == 1
        && !every("requirements-for-pilot-activity@1", {activity: activity},
          requirement => requirement.identity.type != "DES")
        && exists("pilot-activity-matches-requirement@1",
          {activity: activity,
           requirement: one("requirements-for-pilot-activity@1", {activity: activity})}))
    )
  distinct: true
  order_by: [identity.id, identity.revision]
