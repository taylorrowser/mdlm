kind: selector-definition
id: formal-verification-implementations-requiring-run
version: 1
description: Current valid Phase 6 formal implementations whose execution obligations are evaluated.
parameters: []
result_kind: revision
query:
  from: {selector: verification-implementations-requiring-run@1, arguments: {}}
  as: implementation
  where: 'implementation.payload.kind == "formal"'
  distinct: true
  order_by: [identity.revision_id]
