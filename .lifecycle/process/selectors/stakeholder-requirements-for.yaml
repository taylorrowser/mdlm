kind: selector-definition
id: stakeholder-requirements-for
version: 1
description: Current active stakeholder requirement Revisions derived from one product specification lineage.
parameters:
  - {name: product_specification, kind: revision, types: [PSP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: product_specification, link: derived-from, emit: source, types: [STK]}
  as: requirement
  where: >-
    state(requirement, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: requirement})
  distinct: true
  order_by: [identity.id, identity.revision]
