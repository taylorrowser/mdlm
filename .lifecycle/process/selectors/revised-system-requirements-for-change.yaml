kind: selector-definition
id: revised-system-requirements-for-change
version: 1
description: Exact current same-lineage SYS replacement authored under one Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: changed-under, emit: source, types: [SYS]}
  as: requirement
  where: 'none("newer-revisions-for@1", {subject: requirement})'
  distinct: true
  order_by: [identity.revision_id]
