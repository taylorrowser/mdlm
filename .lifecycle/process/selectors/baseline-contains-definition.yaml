kind: selector-definition
id: baseline-contains-definition
version: 1
description: The supplied frozen baseline when its exact definition membership contains one Revision.
parameters:
  - {name: baseline, kind: baseline, types: [BSL]}
  - {name: subject, kind: revision}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: subject, emit: entity, types: [BSL]}
  as: candidate
  where: >-
    candidate.identity.revision_id == baseline.identity.revision_id
    && candidate.storage.frozen == true
  distinct: true
  order_by: [identity.revision_id]
