kind: selector-definition
id: traceability-affected-change-evidence
version: 1
description: Exact non-baseline evidence directly tracing an STK impacted by one bounded Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    relation: incoming-links
    of: 'one("impacted-requirements-for-change@2", {change: change})'
    emit: source
    types: [REV, VER, VAI, RUN, RES, ASP, ICSP, VSP, ENV, ART]
  as: evidence
  distinct: true
  order_by: [identity.type, identity.revision_id]
