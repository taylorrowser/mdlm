kind: selector-definition
id: gate-rejection-blocked-review-evidence-for-candidate
version: 1
description: Candidate Review evidence whose exact subject is a member named by a reviewed gate rejection.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-evidence, of: candidate, emit: entity, types: [REV]}
  as: review
  where: >-
    !every("gate-rejection-blocked-members-for-candidate@1",
      {candidate: candidate}, blocked =>
        !exists("matching-passing-review-for@1",
          {subject: blocked, review: review}))
  distinct: true
  order_by: [identity.revision_id]
