kind: selector-definition
id: requirements-for-pilot-activity
version: 1
description: Exact stakeholder, system, component, or design requirement Revision exercised by one pilot or formal activity.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: activity, link: verifies-revision, emit: target, types: [STK, SYS, CMP, DES]}
  as: requirement
  distinct: true
  order_by: [identity.revision_id]
