kind: selector-definition
id: component-definition-members-for-completion
version: 1
description: Exact coherent CMP, architecture, interface, strategy, planning, and completion Revisions for one component slice.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [CMP, ASP, ICSP, DWP, VSP]}
  as: member
  where: >-
    member == completion
    || !every("planning-revisions-for-completion@1", {completion: completion}, plan =>
      member != plan
      && every("component-outputs-for-plan@1", {plan: plan}, output => output != member)
      && every("architectures-for-decomposition@1", {plan: plan}, architecture => architecture != member)
      && every("interfaces-for-decomposition@1", {plan: plan}, interface => interface != member)
      && every("strategies-for-decomposition@1", {plan: plan}, strategy => strategy != member))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
