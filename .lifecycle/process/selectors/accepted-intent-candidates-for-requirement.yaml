kind: selector-definition
id: accepted-intent-candidates-for-requirement
version: 1
description: Current exact accepted intent baselines containing one stakeholder requirement Revision.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: baseline
query:
  from:
    selector: accepted-intent-approvals-for-requirement@1
    arguments: {requirement: requirement}
  as: candidate
  distinct: true
  order_by: [identity.revision_id]
