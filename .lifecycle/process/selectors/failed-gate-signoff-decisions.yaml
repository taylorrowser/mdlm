kind: selector-definition
id: failed-gate-signoff-decisions
version: 1
description: Current exact gate sign-off Decisions with a valid failed Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "gate-signoff"
    && state(decision, "disposition") == "active"
    && exists("failing-reviews-for@1", {subject: decision})
    && none("valid-gate-signoff-replacements-for@1", {decision: decision})
  distinct: true
  order_by: [identity.id, identity.revision]
