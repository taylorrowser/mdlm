kind: selector-definition
id: failed-phase-2-candidates
version: 1
description: Exact group or level candidates with current failed Review or reviewed rejection and no causal successor.
parameters: []
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.kind in ["group-candidate", "level-candidate"]
    && candidate.payload.role == "candidate"
    && candidate.storage.frozen == true
    && (
      exists("failing-reviews-for@1", {subject: candidate})
      || exists("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
    )
    && none("complete-superseding-phase-2-candidates-for@1",
      {candidate: candidate})
  distinct: true
  order_by: [payload.kind, identity.id, identity.revision]
