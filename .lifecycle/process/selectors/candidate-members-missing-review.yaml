kind: selector-definition
id: candidate-members-missing-review
version: 1
description: Review-required candidate members without valid passing Review evidence or with a valid failed Review.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: review-required-members-for@1
    arguments: {candidate: candidate}
  as: member
  where: >-
    none("passing-reviews-for@1", {subject: member})
    || exists("failing-reviews-for@1", {subject: member})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
