kind: selector-definition
id: subject-changed-under
version: 1
description: The supplied exact Change Request when one replacement subject cites it through changed-under.
parameters:
  - {name: subject, kind: revision}
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    selector: change-requests-authoring-subject@1
    arguments: {subject: subject}
  as: candidate
  where: 'candidate == change'
  distinct: true
  order_by: [identity.revision_id]
