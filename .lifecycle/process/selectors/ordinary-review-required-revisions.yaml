kind: selector-definition
id: ordinary-review-required-revisions
version: 1
description: Review-required exact Revisions other than planning DWPs with a fixed product-definition judgment.
parameters: []
result_kind: revision
query:
  from:
    selector: review-required-revisions@1
    arguments: {}
  as: subject
  where: 'none("planning-dwp-matching-subject@1", {subject: subject})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
