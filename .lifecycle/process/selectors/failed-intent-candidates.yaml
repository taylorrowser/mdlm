kind: selector-definition
id: failed-intent-candidates
version: 1
description: Failed, reviewed-rejected, or product-answer-stale Phase 0 intent candidates without a complete causal superseding candidate.
parameters: []
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && candidate.payload.role == "candidate"
    && candidate.storage.frozen == true
    && (
      exists("failing-reviews-for@1", {subject: candidate})
      || exists("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
      || exists("answer-stale-foundation-members-for-candidate@1",
        {candidate: candidate})
    )
    && none("complete-superseding-intent-candidates-for@1", {candidate: candidate})
  distinct: true
  order_by: [identity.id, identity.revision]
