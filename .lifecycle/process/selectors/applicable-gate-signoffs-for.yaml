kind: selector-definition
id: applicable-gate-signoffs-for
version: 1
description: Valid gate-signoff decisions whose required independent review has passed.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: gate-signoff-decisions-for@1
    arguments: {candidate: candidate}
  as: decision
  where: >-
    decision.payload.gate_outcome == "approve"
    && exists("passing-reviews-for@1", {subject: decision})
  distinct: true
  order_by: [identity.revision_id]
