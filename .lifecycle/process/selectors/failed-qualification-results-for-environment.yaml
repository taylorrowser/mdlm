kind: selector-definition
id: failed-qualification-results-for-environment
version: 1
description: Exact failed result from the singular completed qualification RUN for one ENV.
parameters:
  - {name: environment, kind: revision, types: [ENV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: environment, link: assessed-in, emit: source, types: [RES]}
  as: result
  where: >-
    count("qualification-implementations-for-environment@1",
      {environment: environment}) == 1
    && count("completed-runs-for-implementation@1",
      {implementation: one("qualification-implementations-for-environment@1",
        {environment: environment})}) == 1
    && count("failed-qualification-results-for-run-and-environment@1",
      {run: one("completed-runs-for-implementation@1",
        {implementation: one("qualification-implementations-for-environment@1",
          {environment: environment})}), environment: environment}) == 1
    && result == one("failed-qualification-results-for-run-and-environment@1",
      {run: one("completed-runs-for-implementation@1",
        {implementation: one("qualification-implementations-for-environment@1",
          {environment: environment})}), environment: environment})
  distinct: true
  order_by: [identity.revision_id]
