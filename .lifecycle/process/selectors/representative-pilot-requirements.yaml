kind: selector-definition
id: representative-pilot-requirements
version: 1
description: Current STK requirements in Phase 1, one representative SYS in Phase 2, or one CMP in Phase 3 for the distinct observable boundary.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [STK, SYS, CMP]}
  as: requirement
  where: >-
    (phase.id == "phase-1-product-assurance"
      && !every("requirements-requiring-pilot-target@1", {}, representative => representative != requirement))
    || (phase.id == "phase-2-system-definition"
      && !every("phase-2-representative-system-requirements@1", {}, representative => representative != requirement))
    || (phase.id == "phase-3-component-definition"
      && !every("current-decomposition-completions@1", {}, completion =>
        completion.payload.target_child_type != "CMP"
        || requirement != first("completion-outputs-for@1", {completion: completion})))
  distinct: true
  order_by: [identity.revision_id]
