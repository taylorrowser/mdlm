kind: selector-definition
id: suitable-pilot-results-for-requirement
version: 1
description: Exact suitable pilot results reached through the current activity and implementation for one requirement.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP]}
result_kind: revision
query:
  from: {collection: revisions, types: [RES]}
  as: result
  where: >-
    !every("pilot-verification-activities-for-requirement@1", {requirement: requirement}, activity =>
      every("complete-pilot-implementations-for-activity@1", {activity: activity}, implementation =>
        every("exercised-pilot-runs-for-implementation@2", {implementation: implementation}, run =>
          every("pilot-results-completing-run@1", {run: run}, evidence => evidence != result))))
  distinct: true
  order_by: [identity.revision_id]
