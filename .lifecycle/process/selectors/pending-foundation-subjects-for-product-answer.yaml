kind: selector-definition
id: pending-foundation-subjects-for-product-answer
version: 1
description: Current Phase 0 foundation Revisions that still require correction for one applicable reviewed product-answer Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    selector: phase-0-foundation-members@1
    arguments: {}
  as: subject
  where: >-
    !every("applicable-product-answer-decisions-for-foundation-subject@1",
      {subject: subject}, answer => answer != decision)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
