kind: selector-definition
id: phase-2-removed-outputs-for-review
version: 1
description: Exact SYS outputs removed from current scope by one Phase 2 simplification Review.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: removes, emit: target, types: [SYS]}
  as: removed
  where: 'true'
  distinct: true
  order_by: [identity.revision_id]
