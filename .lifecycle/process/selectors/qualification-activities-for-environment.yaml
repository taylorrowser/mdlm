kind: selector-definition
id: qualification-activities-for-environment
version: 1
description: Current valid qualification activities that explicitly qualify one exact ENV.
parameters:
  - {name: environment, kind: revision, types: [ENV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: environment, link: qualifies, emit: source, types: [VER]}
  as: activity
  where: >-
    activity.payload.kind == "qualification"
    && state(activity, "disposition") == "active"
    && state(activity, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: activity})
  distinct: true
  order_by: [identity.revision_id]
