kind: selector-definition
id: candidate-product-answer-review-support
version: 1
description: Structural product-answer authority and correction lineage for answer-incorporating foundation members of one Phase 0 candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, PSP, STK, QST, DEC, REV, BSL]}
  as: support
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && !every("candidate-definition-members@1", {candidate: candidate}, member =>
      !(member.identity.type in ["MAP", "PSP", "STK"])
      || none("incorporated-product-answer-decisions-for-foundation-subject@1",
        {subject: member})
      || (
        support != member
        && every("prior-foundation-revisions-for@1",
          {subject: member}, prior => prior != support)
        && every("incorporated-product-answer-decisions-for-foundation-subject@1",
          {subject: member}, decision =>
            decision != support
            && every("question-targets-for-decision@1", {decision: decision},
              question => question != support)
            && every("structural-passing-product-answer-reviews-for-decision@1",
              {decision: decision}, review =>
                review != support
                && every("structural-review-contexts-cited-by@1",
                  {review: review}, context => context != support)))
      ))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
