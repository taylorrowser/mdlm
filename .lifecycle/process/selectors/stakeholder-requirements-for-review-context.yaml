kind: selector-definition
id: stakeholder-requirements-for-review-context
version: 1
description: Current stakeholder requirement Revisions structurally derived from one product specification without reviewed disposition.
parameters:
  - {name: product_specification, kind: revision, types: [PSP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: product_specification, link: derived-from, emit: source, types: [STK]}
  as: requirement
  where: 'none("newer-revisions-for@1", {subject: requirement})'
  distinct: true
  order_by: [identity.id, identity.revision]
