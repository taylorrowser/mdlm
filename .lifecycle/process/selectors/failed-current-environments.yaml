kind: selector-definition
id: failed-current-environments
version: 1
description: Current exact assurance environment Revisions with a valid failed Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [ENV]}
  as: environment
  where: >-
    state(environment, "disposition") == "active"
    && state(environment, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: environment})
    && exists("failing-reviews-for@1", {subject: environment})
    && count("strategies-for-environment@1", {environment: environment}) == 1
  distinct: true
  order_by: [identity.id, identity.revision]
