kind: selector-definition
id: reviewed-gate-rejections-for-candidate
version: 1
description: Exact valid gate rejections for one candidate whose required independent Review passed.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: gate-signoff-decisions-for@1
    arguments: {candidate: candidate}
  as: rejection
  where: >-
    rejection.payload.gate_outcome == "reject"
    && exists("passing-reviews-for@1", {subject: rejection})
  distinct: true
  order_by: [identity.revision_id]
