kind: selector-definition
id: phase-2-entry-requirement-group-representatives
version: 1
description: One deterministic representative for each coherent accepted Phase 2 requirement group.
parameters: []
result_kind: revision
query:
  from:
    selector: phase-2-entry-requirements@1
    arguments: {}
  as: candidate
  where: >-
    candidate == first("coherent-phase-2-entry-requirements@1", {requirement: candidate})
  distinct: true
  order_by: [identity.revision_id]
