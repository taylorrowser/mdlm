kind: selector-definition
id: strategies-for-decomposition
version: 1
description: Exact verification strategy Revision canonically linked by one DWP.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: plan, link: verified-under, emit: target, types: [VSP]}
  as: strategy
  where: 'true'
  distinct: true
  order_by: [identity.revision_id]
