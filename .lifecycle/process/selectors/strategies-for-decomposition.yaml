kind: selector-definition
id: strategies-for-decomposition
version: 1
description: Exact verification strategy Revision named by one DWP payload.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [VSP]}
  as: strategy
  where: 'strategy.identity.revision_id == plan.payload.verification_strategy_revision'
  distinct: true
  order_by: [identity.revision_id]
