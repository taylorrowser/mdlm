kind: selector-definition
id: current-pilot-targets-for-activity
version: 1
description: Current valid exact repository-backed or inline control artifacts covering one pilot activity's complete requirement set.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {collection: revisions, types: [ART]}
  as: target
  where: >-
    target.payload.kind in ["implementation", "prototype"]
    && ((present(target.payload.public_interface)
        && target.payload.public_interface.working_directory == "fresh-temporary-directory")
      || (present(target.payload.prototype_controls)
        && target.payload.prototype_controls.activity_ref == activity.identity.revision_id))
    && select("requirements-for-pilot-target@1", {target: target})
      == select("requirements-for-pilot-activity@1", {activity: activity})
    && state(target, "disposition") == "active"
    && state(target, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: target})
  distinct: true
  order_by: [identity.id, identity.revision]
