kind: selector-definition
id: composed-groups-containing-member
version: 1
description: Exact group baselines composed by one level candidate and containing the supplied definition member.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: member, kind: revision, types: [SYS, ASP, ICSP, DWP, VSP]}
result_kind: baseline
query:
  from:
    selector: composed-groups-for-level-candidate@1
    arguments: {candidate: candidate}
  as: group
  where: 'exists("baseline-contains-definition@1", {baseline: group, subject: member})'
  distinct: true
  order_by: [identity.revision_id]
