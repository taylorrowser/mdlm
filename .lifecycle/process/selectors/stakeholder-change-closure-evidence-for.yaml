kind: selector-definition
id: stakeholder-change-closure-evidence-for
version: 1
description: Exact fresh requirement, consumer, candidate, and Review evidence required to close one accepted-requirement change.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [BSL, REV]}
  as: evidence
  where: >-
    !every("fresh-shared-system-change-evidence@1", {change: change}, fresh => fresh != evidence)
    || evidence == one("stakeholder-change-candidates-for@1", {change: change})
    || evidence == one("passing-reviews-for@1",
      {subject: one("stakeholder-change-candidates-for@1", {change: change})})
  distinct: true
  order_by: [identity.type, identity.revision_id]
