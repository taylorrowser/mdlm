kind: selector-definition
id: stakeholder-change-closure-evidence-for
version: 1
description: The exact replacement context, STK Review, candidate, and candidate Review required to close one accepted stakeholder change.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [BSL, REV]}
  as: evidence
  where: >-
    evidence == one("change-review-contexts-for@1", {change: change})
    || evidence == one("change-replacement-reviews-for@1", {change: change})
    || evidence == one("stakeholder-change-candidates-for@1", {change: change})
    || evidence == one("stakeholder-change-candidate-reviews-for@1", {change: change})
  distinct: true
  order_by: [identity.type, identity.revision_id]
