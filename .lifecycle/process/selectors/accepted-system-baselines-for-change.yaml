kind: selector-definition
id: accepted-system-baselines-for-change
version: 1
description: Exact accepted system baseline explicitly impacted by a bounded shared-SYS Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: baseline
  where: >-
    baseline.payload.kind == "level-accepted"
    && baseline.payload.role == "accepted"
    && baseline.storage.frozen == true
    && exists("change-impacts-revision@1", {change: change, impacted: baseline})
    && count("accepted-system-candidates-for-change-baseline@1", {accepted: baseline}) == 1
    && every("impacted-requirements-for-change@3", {change: change}, requirement =>
      exists("baseline-contains-definition@1", {baseline: baseline, subject: requirement}))
  distinct: true
  order_by: [identity.revision_id]
