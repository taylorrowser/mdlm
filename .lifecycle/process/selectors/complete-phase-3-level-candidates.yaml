kind: selector-definition
id: complete-phase-3-level-candidates
version: 1
description: Current frozen component-level candidates backed by one exact coherent DWP completion.
parameters: []
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: '"level-candidate"'}
  as: candidate
  where: >-
    exists("phase-3-level-candidate-definition-members@1", {candidate: candidate})
    && every("phase-3-level-candidate-definition-members@1", {candidate: candidate}, member =>
      member.identity.type != "DWP"
      || member.payload.stage != "completion"
      || exists("complete-component-level-candidates-for-completion@1", {completion: member}))
  distinct: true
  order_by: [identity.revision_id]
