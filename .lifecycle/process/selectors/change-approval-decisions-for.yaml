kind: selector-definition
id: change-approval-decisions-for
version: 2
description: Exact reviewed approve Decisions authorizing implementation of one exact reviewed Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    selector: recorded-change-approval-decisions-for@2
    arguments: {change: change}
  as: decision
  where: >-
    decision.payload.change_disposition == "approve"
    && exists("passing-reviews-for@1", {subject: decision})
  distinct: true
  order_by: [identity.revision_id]
