kind: selector-definition
id: change-approval-decisions-for
version: 1
description: Exact reviewed approval Decisions authorizing one exact reviewed Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    selector: recorded-change-approval-decisions-for@1
    arguments: {change: change}
  as: decision
  where: 'exists("passing-reviews-for@1", {subject: decision})'
  distinct: true
  order_by: [identity.revision_id]
