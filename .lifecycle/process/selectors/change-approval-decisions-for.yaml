kind: selector-definition
id: change-approval-decisions-for
version: 1
description: Exact approval Decisions authorizing one exact reviewed Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: 'decision.payload.kind == "change-approval" && state(decision, "validity") == "valid"'
  distinct: true
  order_by: [identity.revision_id]
