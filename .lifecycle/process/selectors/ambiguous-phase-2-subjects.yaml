kind: selector-definition
id: ambiguous-phase-2-subjects
version: 1
description: Exact active Phase 2 architecture, strategy, or plan Revisions participating in an unsupported many-current cardinality.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [ASP, VSP, DWP]}
  as: subject
  where: >-
    state(subject, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: subject})
    && (
      (subject.identity.type == "ASP"
        && exists("decomposition-parents-for-architecture@1",
          {architecture: subject})
        && !every("decomposition-parents-for-architecture@1",
          {architecture: subject}, requirement =>
            count("current-architectures-for-requirement@1",
              {requirement: requirement}) <= 1))
      || (subject.identity.type == "VSP"
        && exists("requirements-governed-by-strategy@1", {strategy: subject})
        && !every("requirements-governed-by-strategy@1", {strategy: subject}, requirement =>
          count("current-strategies-for-decomposition-requirement@1",
            {requirement: requirement}) <= 1))
      || (subject.identity.type == "DWP"
        && subject.payload.stage == "planning"
        && exists("decomposition-parents-for@1", {plan: subject})
        && !every("decomposition-parents-for@1", {plan: subject}, requirement =>
          count("current-decomposition-plans-for-requirement@1",
            {requirement: requirement}) <= 1))
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
