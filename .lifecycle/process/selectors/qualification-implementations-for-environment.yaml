kind: selector-definition
id: qualification-implementations-for-environment
version: 1
description: Qualification implementations that use one exact environment.
parameters:
  - {name: environment, kind: revision, types: [ENV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: environment, link: uses, emit: source, types: [VAI]}
  as: implementation
  where: 'implementation.payload.kind == "qualification"'
  distinct: true
  order_by: [identity.revision_id]
