kind: selector-definition
id: valid-product-simplification-reviews
version: 1
description: Product-simplification Reviews whose canonical blockers are exactly their Phase 0 intent candidate or its members.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && exists("matching-product-simplification-review@1",
      {candidate: candidate, review: review})
    && review.payload.review_kind == "simplification-product-definition"
    && none("invalid-product-simplification-blockers-for-review@1",
      {review: review, candidate: candidate})
    && (
      (review.payload.outcome == "pass"
        && !present(review.payload.simplification)
        && none("product-simplification-blockers-for-review@1",
          {review: review}))
      || (review.payload.outcome == "fail"
        && present(review.payload.simplification)
        && count("product-simplification-blockers-for-review@1",
          {review: review}) == 1
        && every("product-simplification-blockers-for-review@1",
          {review: review}, blocker =>
            blocker.identity.revision_id == review.payload.simplification.target))
    )
  distinct: true
  order_by: [identity.revision_id]
