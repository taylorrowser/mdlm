kind: selector-definition
id: accepted-system-baselines-for-candidate
version: 1
description: Exact frozen system acceptance baselines promoted from one reviewed and approved Phase 2 level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: accepted
  where: >-
    exists("accepted-baseline-promotes-candidate@1",
      {accepted: accepted, candidate: candidate})
    && candidate.payload.kind == "level-candidate"
    && accepted.payload.kind == "level-accepted"
    && accepted.payload.role == "accepted"
    && accepted.storage.frozen == true
    && every("phase-2-level-candidate-definition-members@1",
      {candidate: candidate}, member =>
        exists("baseline-contains-definition@1",
          {baseline: accepted, subject: member}))
    && count("candidate-definition-members@1", {candidate: accepted})
      == count("phase-2-level-candidate-definition-members@1",
        {candidate: candidate})
    && every("level-acceptance-evidence-for-candidate@1",
      {candidate: candidate}, evidence =>
        exists("baseline-contains-evidence@1",
          {baseline: accepted, subject: evidence}))
    && count("baseline-evidence@1", {baseline: accepted})
      == count("level-acceptance-evidence-for-candidate@1",
        {candidate: candidate})
  distinct: true
  order_by: [identity.revision_id]
