kind: selector-definition
id: all-change-impact-links-for
version: 1
description: Every exact Revision named by one Change Request impacts link.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: change, link: impacts, emit: target, types: [STK, SYS, BSL, REV, VER, VAI, RUN, RES, ASP, ICSP, VSP, ENV, ART]}
  as: impacted
  distinct: true
  order_by: [identity.type, identity.revision_id]
