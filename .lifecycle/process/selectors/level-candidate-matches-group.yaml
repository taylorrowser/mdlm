kind: selector-definition
id: level-candidate-matches-group
version: 1
description: The supplied level candidate only when it exactly completes one semantically valid group candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: group, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: complete-level-candidates-for-group@1
    arguments:
      group: group
      completion: 'one("completions-for-group-candidate@1", {group: group})'
  as: level
  where: >-
    count("completions-for-group-candidate@1", {group: group}) == 1
    && level == candidate
  distinct: true
  order_by: [identity.revision_id]
