kind: selector-definition
id: changes-changed-under-subject
version: 1
description: Exact Change Request named by one replacement Revision's changed-under link.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: outgoing-links, of: subject, link: changed-under, emit: target, types: [CHG]}
  as: change
  distinct: true
  order_by: [identity.revision_id]
