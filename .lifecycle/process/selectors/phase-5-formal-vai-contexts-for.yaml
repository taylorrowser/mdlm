kind: selector-definition
id: phase-5-formal-vai-contexts-for
version: 1
description: Frozen source-blind Phase 5 sibling contexts that contain one exact formal VAI and its own immutable direct support.
parameters:
  - {name: subject, kind: revision, types: [VAI]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: subject, emit: entity, types: [BSL]}
  as: context
  where: >-
    subject.payload.kind == "formal"
    && context.payload.kind == "review-context"
    && context.payload.role == "review-context"
    && context.storage.frozen == true
    && state(context, "validity") == "valid"
    && context.provenance.process_ref == process.current_ref
    && context.provenance.scenario == "create-review-context@2"
    && none("newer-revisions-for@1", {subject: context})
    && every("direct-review-support-for@1", {subject: subject}, support =>
      exists("review-context-contains-required-support@1",
        {subject: subject, context: context, required_support: support}))
  distinct: true
  order_by: [identity.revision_id]
