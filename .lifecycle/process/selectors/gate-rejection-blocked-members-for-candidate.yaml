kind: selector-definition
id: gate-rejection-blocked-members-for-candidate
version: 1
description: Direct Phase 0 candidate members implicated by a reviewed rejection of that exact candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity, types: [MAP, PSP, STK]}
  as: member
  where: >-
    exists("reviewed-gate-rejections-for-subject@1", {subject: member})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
