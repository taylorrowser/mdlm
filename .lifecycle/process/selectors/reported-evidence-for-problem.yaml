kind: selector-definition
id: reported-evidence-for-problem
version: 1
description: Exact immutable evidence preserved as the source of one Problem Report.
parameters:
  - {name: problem, kind: revision, types: [PRB]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: problem, link: reports, emit: target, types: [RUN, RES, REV, ART]}
  as: evidence
  distinct: true
  order_by: [identity.type, identity.revision_id]
