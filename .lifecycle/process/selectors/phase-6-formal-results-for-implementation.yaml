kind: selector-definition
id: phase-6-formal-results-for-implementation
version: 1
description: Immutable formal results whose exact RUN, VAI, ENV, ART, and accepted requirement bindings match one formal implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {collection: revisions, types: [RES]}
  as: result
  where: >-
    result.payload.claim.kind == "formal"
    && result.payload.claim.scope == "requirement"
    && result.payload.claim.formal_evidence_eligible == true
    && state(result, "validity") == "valid"
    && result.integrity.scenario_execution_valid == true
    && count("formal-runs-producing-result@1", {result: result}) == 1
    && every("formal-runs-producing-result@1", {result: result}, run =>
      count("verification-implementations-for-run@1", {run: run}) == 1
      && one("verification-implementations-for-run@1", {run: run}) == implementation
      && count("environments-for-run@1", {run: run}) == 1
      && one("environments-for-run@1", {run: run})
        == one("phase-6-qualified-environments-for-formal-implementation@1",
          {implementation: implementation})
      && count("execution-targets-for-run@1", {run: run}) == 1
      && one("execution-targets-for-run@1", {run: run})
        == one("phase-6-controlled-artifacts-for-formal-implementation@1",
          {implementation: implementation}))
    && count("requirements-for-formal-result@1", {result: result}) == 1
    && one("requirements-for-formal-result@1", {result: result})
      == one("phase-6-accepted-requirements-for-formal-implementation@1",
        {implementation: implementation})
    && exists("qualified-environment-match-for-result@1", {
      environment: one("phase-6-qualified-environments-for-formal-implementation@1",
        {implementation: implementation}),
      result: result})
  distinct: true
  order_by: [identity.revision_id]
