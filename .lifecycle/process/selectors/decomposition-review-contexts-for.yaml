kind: selector-definition
id: decomposition-review-contexts-for
version: 1
description: Frozen review-context baselines containing the exact DWP plan and its decomposition definition set.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: plan, emit: entity, types: [BSL]}
  as: context
  where: >-
    context.payload.kind == "review-context"
    && context.storage.frozen == true
  distinct: true
  order_by: [identity.revision_id]
