kind: selector-definition
id: phase-1-requirements-governed-by-strategy
version: 1
description: Current exact Phase 1 stakeholder requirement Revisions governed by one verification strategy Revision.
parameters:
  - {name: strategy, kind: revision, types: [VSP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: strategy, link: governs-revision, emit: target, types: [STK]}
  as: requirement
  where: >-
    state(requirement, "validity") == "valid"
    && !every("current-phase-1-stakeholder-requirements@1", {}, current =>
      current != requirement)
  distinct: true
  order_by: [identity.revision_id]
