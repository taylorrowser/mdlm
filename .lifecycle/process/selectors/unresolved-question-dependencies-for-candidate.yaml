kind: selector-definition
id: unresolved-question-dependencies-for-candidate
version: 1
description: Current referenced Questions that still await an answer or applicable reviewed Decision before candidate correction.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: open-questions@1
    arguments: {}
  as: question
  where: >-
    exists("candidate-members-linking-question@1",
      {candidate: candidate, question: question})
  distinct: true
  order_by: [identity.id, identity.revision]
