kind: selector-definition
id: general-open-questions
version: 1
description: Latest active open QST revisions that do not request exact exploratory prototype evidence.
parameters: []
result_kind: revision
query:
  from:
    selector: open-questions@1
    arguments: {}
  as: question
  where: 'question.payload.resolution_evidence != "prototype"'
  distinct: true
  order_by: [identity.id]
