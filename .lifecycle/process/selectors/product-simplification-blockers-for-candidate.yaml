kind: selector-definition
id: product-simplification-blockers-for-candidate
version: 1
description: Exact MAP, PSP, and STK candidate members blocked by its failed product-simplification Review.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: candidate, emit: entity}
  as: member
  where: >-
    exists("blocking-product-simplification-reviews-for@1",
      {subject: member, candidate: candidate})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
