kind: selector-definition
id: matching-corrected-phase-1-assurance-review
version: 1
description: One exact failed Review of a prior Phase 1 assurance Revision addressed by its replacement.
parameters:
  - {name: subject, kind: revision, types: [VSP, ENV, VER, VAI]}
  - {name: replacement, kind: revision, types: [VSP, ENV, VER, VAI]}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from:
    selector: corrected-phase-1-assurance-reviews-for@1
    arguments: {replacement: replacement}
  as: corrected_review
  where: >-
    corrected_review == review
    && exists("matching-failing-review-for@1", {subject: subject, review: review})
  distinct: true
  order_by: [identity.revision_id]
