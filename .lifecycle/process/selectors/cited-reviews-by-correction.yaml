kind: selector-definition
id: cited-reviews-by-correction
version: 1
description: Every exact Review cited as a causal input by one correction Revision.
parameters:
  - {name: replacement, kind: revision}
result_kind: revision
query:
  from: {relation: outgoing-links, of: replacement, link: corrects-review, emit: target, types: [REV]}
  as: review
  where: 'state(review, "validity") == "valid"'
  distinct: true
  order_by: [identity.revision_id]
