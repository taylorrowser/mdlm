kind: selector-definition
id: phase-3-entry-revisions-for-identity
version: 1
description: Exact accepted Phase 3 entry Revisions for one stable SYS identity.
parameters:
  - {name: stable, kind: stable-datum, types: [SYS]}
result_kind: revision
query:
  from: {relation: revisions, of: stable, emit: entity, types: [SYS]}
  as: requirement
  where: >-
    !every("phase-3-entry-requirements@1", {}, entry => entry != requirement)
  distinct: true
  order_by: [identity.revision]
