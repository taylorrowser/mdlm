kind: selector-definition
id: stakeholder-intent-review-failures
version: 1
description: Current Phase 0 foundation failures requiring an immediate stakeholder-owned intent change.
parameters: []
result_kind: revision
query:
  from:
    selector: failed-phase-0-foundation-revisions@1
    arguments: {}
  as: subject
  where: 'exists("stakeholder-owned-failing-reviews-for@1", {subject: subject})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
