kind: selector-definition
id: complete-environment-assurance-for-strategy
version: 1
description: Current environments for one exact strategy with their qualification activity and implementation pair.
parameters:
  - {name: strategy, kind: revision, types: [VSP]}
result_kind: revision
query:
  from:
    selector: environments-for-strategy@1
    arguments: {strategy: strategy}
  as: environment
  where: >-
    environment.payload.strategy_revision == strategy.identity.revision_id
    && environment.payload.profile_id == strategy.payload.environment_profile.id
    && environment.payload.capabilities == strategy.payload.environment_profile.capabilities
    && count("environments-for-strategy@1", {strategy: strategy}) == 1
    && count("qualification-activities-for-environment@1", {environment: environment}) == 1
    && count("qualification-implementations-for-environment@1", {environment: environment}) == 1
    && every("qualification-implementations-for-environment@1", {environment: environment}, implementation =>
      count("verification-activities-for-implementation@1", {implementation: implementation}) == 1
      && one("verification-activities-for-implementation@1", {implementation: implementation})
        == one("qualification-activities-for-environment@1", {environment: environment}))
  distinct: true
  order_by: [identity.id, identity.revision]
