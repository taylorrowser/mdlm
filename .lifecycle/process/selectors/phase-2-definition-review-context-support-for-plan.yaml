kind: selector-definition
id: phase-2-definition-review-context-support-for-plan
version: 1
description: Every architecture-wide Phase 2 definition member except the representative DWP subject.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: phase-2-definition-members-for-plan@1
    arguments: {plan: plan}
  as: member
  where: member != plan
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
