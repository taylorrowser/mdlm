kind: selector-definition
id: newer-revisions-for
version: 1
description: Exact revisions later than the supplied revision in the same stable lineage.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: revisions, of: {var: subject}, emit: entity}
  as: revision
  where:
    compare:
      left: {path: {var: revision, field: identity.revision}}
      operator: gt
      right: {path: {var: subject, field: identity.revision}}
  distinct: true
  order_by: [identity.revision]
