kind: selector-definition
id: current-strategies-for-phase-2-requirement
version: 1
description: Current valid verification strategies covering one exact Phase 2 requirement Revision.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: governs-revision, emit: source, types: [VSP]}
  as: strategy
  where: >-
    state(strategy, "disposition") == "active"
    && state(strategy, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: strategy})
  distinct: true
  order_by: [identity.id, identity.revision]
