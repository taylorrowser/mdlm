kind: selector-definition
id: formal-activities-for-requirement
version: 1
description: Current exact formal VER Revisions for one exact requirement Revision.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP, DES]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: verifies-revision, emit: source, types: [VER]}
  as: activity
  where: >-
    activity.payload.kind == "formal"
    && activity.payload.claim.scope == "requirement"
    && activity.payload.claim.formal_evidence_eligible == true
    && none("newer-revisions-for@1", {subject: activity})
  distinct: true
  order_by: [identity.revision_id]
