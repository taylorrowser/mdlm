kind: selector-definition
id: execution-targets-for-implementation
version: 1
description: Exact bounded execution target selected by one implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: implementation, link: targets, emit: target, types: [ENV, ART]}
  as: target
  distinct: true
  order_by: [identity.type, identity.revision_id]
