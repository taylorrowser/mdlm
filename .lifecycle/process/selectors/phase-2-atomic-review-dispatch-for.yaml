kind: selector-definition
id: phase-2-atomic-review-dispatch-for
version: 1
description: The selected ordinary Phase 2 Revision, expanded only to current unreviewed sibling SYS outputs of its exact planning DWP.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, DEC, PRB, CHG, PAS]}
  as: review_subject
  where: >-
    review_subject == subject
    || (
      subject.identity.type == "SYS"
      && review_subject.identity.type == "SYS"
      && count("decomposition-plans-for-output@1", {output: subject}) == 1
      && count("decomposition-plans-for-output@1", {output: review_subject}) == 1
      && exists("planning-dwp-matching-subject@1", {
        subject: one("decomposition-plans-for-output@1", {output: subject})
      })
      && none("newer-revisions-for@1", {subject: review_subject})
      && none("passing-reviews-for@1", {subject: review_subject})
      && none("failing-reviews-for@1", {subject: review_subject})
      && !every("phase-2-atomic-review-required-revisions@1", {}, required =>
        required != review_subject)
      && one("decomposition-plans-for-output@1", {output: review_subject})
        == one("decomposition-plans-for-output@1", {output: subject})
    )
  distinct: true
  order_by: [identity.revision_id]
