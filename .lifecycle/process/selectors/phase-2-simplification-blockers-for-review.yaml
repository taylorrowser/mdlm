kind: selector-definition
id: phase-2-simplification-blockers-for-review
version: 1
description: Canonical exact Phase 2 definition targets blocked by one simplification Review.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: blocks, emit: target, types: [SYS, ASP, ICSP, DWP]}
  as: blocker
  where: 'true'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
