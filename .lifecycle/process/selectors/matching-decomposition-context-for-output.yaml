kind: selector-definition
id: matching-decomposition-context-for-output
version: 1
description: The supplied frozen review context when it contains one exact decomposition output.
parameters:
  - {name: output, kind: revision, types: [SYS]}
  - {name: context, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: output, emit: entity, types: [BSL]}
  as: membership
  where: 'membership.identity.revision_id == context.identity.revision_id'
  distinct: true
  order_by: [identity.revision_id]
