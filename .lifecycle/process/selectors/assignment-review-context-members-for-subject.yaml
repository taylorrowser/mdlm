kind: selector-definition
id: assignment-review-context-members-for-subject
version: 1
description: Exact definition members of the frozen Review Context already established for an Assignment subject.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from:
    relation: baseline-members
    of: 'one("assignment-review-contexts-for-subject@1", {subject: subject})'
    emit: entity
  as: member
  where: 'member != subject'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
