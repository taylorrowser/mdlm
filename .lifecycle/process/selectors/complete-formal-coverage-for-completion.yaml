kind: selector-definition
id: complete-formal-coverage-for-completion
version: 1
description: One completion when every exact current requirement in its ancestry has exactly one current passing-reviewed formal VER.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: candidate
  where: >-
    candidate == completion
    && exists("formal-requirements-for-completion@1", {completion: completion})
    && every("formal-requirements-for-completion@1", {completion: completion}, requirement =>
      count("passing-reviewed-formal-activities-for-requirement@1", {requirement: requirement}) == 1)
  distinct: true
  order_by: [identity.revision_id]
