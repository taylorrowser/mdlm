kind: selector-definition
id: consequential-decision-correction-justifications-for
version: 1
description: Exact unchanged subject and evidence justified by one correctable consequential Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [PAS, BSL, ART, STK, RES, REV]}
  as: justification
  where: 'true'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
