kind: selector-definition
id: phase-2-review-flags-subject
version: 1
description: The supplied exact Phase 2 subject when one Review canonically flags collateral correction on it.
parameters:
  - {name: review, kind: revision, types: [REV]}
  - {name: subject, kind: revision, types: [SYS, ASP, ICSP, DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: review, link: flags, emit: target, types: [SYS, ASP, ICSP, DWP]}
  as: target
  where: 'target == subject'
  distinct: true
  order_by: [identity.revision_id]
