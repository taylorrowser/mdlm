kind: selector-definition
id: stakeholder-requirements-for-product-scope
version: 1
description: Exact stakeholder requirement Revisions frozen in one accepted product-scope baseline.
parameters:
  - {name: subject, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: subject, emit: entity, types: [STK]}
  as: requirement
  distinct: true
  order_by: [identity.id, identity.revision]
