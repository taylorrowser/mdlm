kind: selector-definition
id: outdated-shared-system-consumers
version: 2
description: Current consumer DWPs whose exact shared SYS binding is inactive, invalid, or has a later Revision and therefore needs separate coverage reevaluation or blocking.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: consumer
  where: >-
    state(consumer, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: consumer})
    && exists("system-requirements-consumed-by@1", {consumer: consumer})
    && !every("system-requirements-consumed-by@1", {consumer: consumer}, requirement =>
      state(requirement, "disposition") == "active"
      && state(requirement, "validity") == "valid"
      && none("newer-revisions-for@1", {subject: requirement}))
  distinct: true
  order_by: [identity.id, identity.revision]
