kind: selector-definition
id: outdated-shared-system-consumers
version: 2
description: Current consumer DWPs whose exact shared SYS binding has a later Revision and therefore needs separate coverage reevaluation.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: consumer
  where: >-
    state(consumer, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: consumer})
    && count("system-requirements-consumed-by@1", {consumer: consumer}) == 1
    && every("system-requirements-consumed-by@1", {consumer: consumer}, requirement =>
      exists("newer-revisions-for@1", {subject: requirement}))
  distinct: true
  order_by: [identity.id, identity.revision]
