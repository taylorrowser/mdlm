kind: selector-definition
id: execution-targets-for-run
version: 1
description: Exact controlled execution target used by one immutable run.
parameters:
  - {name: run, kind: revision, types: [RUN]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: run, link: targets, emit: target, types: [ENV, ART]}
  as: target
  distinct: true
  order_by: [identity.type, identity.revision_id]
