kind: selector-definition
id: architecture-simplification-reviews-for
version: 1
description: Passing architecture/interface simplification Reviews for one exact DWP plan.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV]}
  as: review
  where: >-
    review.payload.review_kind == "simplification-architecture-interfaces"
    && review.payload.decomposition_plan_revision == plan.identity.revision_id
    && review.payload.outcome == "pass"
    && state(review, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
