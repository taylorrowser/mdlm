kind: selector-definition
id: baseline-members
version: 1
description: Exact definition members stored by one frozen baseline.
parameters:
  - {name: baseline, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: baseline, emit: entity}
  as: member
  distinct: true
  order_by: [identity.revision_id]
