kind: selector-definition
id: baseline-contains-evidence
version: 1
description: Exact evidence in one frozen baseline matching the supplied Revision.
parameters:
  - {name: baseline, kind: baseline, types: [BSL]}
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: baseline-evidence, of: baseline, emit: entity}
  as: evidence
  where: >-
    baseline.storage.frozen == true
    && evidence.identity.revision_id == subject.identity.revision_id
  distinct: true
  order_by: [identity.revision_id]
