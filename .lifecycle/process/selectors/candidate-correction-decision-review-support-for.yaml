kind: selector-definition
id: candidate-correction-decision-review-support-for
version: 1
description: Exact corrected candidate, Decision lineage, causal failed Reviews, definition, and Review evidence needed to judge its current attended correction Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, QST, DEC, PSP, STK, REV, BSL]}
  as: support
  where: >-
    !every("candidate-correction-candidates-for-decision@1",
      {decision: decision}, candidate =>
        candidate != support
        && every("candidate-definition-members@1",
          {candidate: candidate}, member => member != support)
        && every("baseline-evidence@1",
          {baseline: candidate}, evidence => evidence != support)
        && every("cited-failing-reviews-by-correction@1",
          {replacement: candidate}, review => review != support)
        && every("review-correction-history-for@1",
          {subject: decision, view: "lineage"}, prior => prior != support)
        && every("cited-failing-reviews-by-correction@1",
          {replacement: decision}, review => review != support)
        && every("phase-0-candidate-correction-support-for@1",
          {candidate: candidate}, correction => correction != support)
        && every("candidate-question-resolution-support-for@1",
          {candidate: candidate}, disposition => disposition != support))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
