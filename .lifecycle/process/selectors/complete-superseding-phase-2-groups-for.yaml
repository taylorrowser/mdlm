kind: selector-definition
id: complete-superseding-phase-2-groups-for
version: 1
description: Same-lineage group replacements that preserve unaffected exact evidence and substitute only reviewed gate-corrected members.
parameters:
  - {name: group, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: superseding-baselines-for@1
    arguments: {baseline: group}
  as: replacement
  where: >-
    group.payload.kind == "group-candidate"
    && replacement.identity.id == group.identity.id
    && replacement.payload.kind == group.payload.kind
    && replacement.payload.role == group.payload.role
    && (
      replacement.payload.scope == group.payload.scope
      || every("candidate-definition-members@1", {candidate: group}, prior =>
        prior.identity.revision_id != group.payload.scope
        || (exists("reviewed-gate-rejections-for-subject@1", {subject: prior})
          && every("candidate-reviewed-gate-corrections-for-subject@1",
            {candidate: replacement, subject: prior}, correction =>
              replacement.payload.scope == correction.identity.revision_id)))
    )
    && replacement.payload.group == group.payload.group
    && replacement.storage.frozen == true
    && count("candidate-definition-members@1", {candidate: replacement})
      == count("candidate-definition-members@1", {candidate: group})
    && every("candidate-definition-members@1", {candidate: replacement}, member =>
      exists("phase-2-candidate-member-predecessors-for@1",
        {candidate: group, replacement_member: member}))
    && every("candidate-definition-members@1", {candidate: group}, prior =>
      (none("reviewed-gate-rejections-for-subject@1", {subject: prior})
        && exists("baseline-contains-definition@1",
          {baseline: replacement, subject: prior}))
      || (exists("reviewed-gate-rejections-for-subject@1", {subject: prior})
        && count("candidate-reviewed-gate-corrections-for-subject@1",
          {candidate: replacement, subject: prior}) == 1))
    && count("baseline-evidence@1", {baseline: replacement})
      == count("baseline-evidence@1", {baseline: group})
    && every("baseline-evidence@1", {baseline: group}, evidence =>
      exists("baseline-contains-evidence@1",
        {baseline: replacement, subject: evidence}))
    && count("cited-failing-reviews-by-correction@1", {replacement: replacement})
      == count("failing-reviews-for@1", {subject: group})
    && count("cited-gate-rejections-by-correction@1", {replacement: replacement})
      == count("reviewed-gate-rejections-affecting-phase-2-candidate@1",
        {candidate: group})
    && every("reviewed-gate-rejections-affecting-phase-2-candidate@1",
      {candidate: group}, rejection =>
        exists("matching-cited-gate-rejection-by-correction@1",
          {replacement: replacement, rejection: rejection}))
  distinct: true
  order_by: [identity.revision]
