kind: selector-definition
id: phase-2-decomposition-subjects-for
version: 1
description: Exact stakeholder and shared system requirement Revisions decomposed by one Phase 2 DWP.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: plan, link: decomposes, emit: target, types: [STK, SYS]}
  as: subject
  where: 'true'
  distinct: true
  order_by: [identity.type, identity.revision_id]
