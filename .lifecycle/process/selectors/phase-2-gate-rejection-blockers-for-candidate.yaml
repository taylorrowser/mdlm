kind: selector-definition
id: phase-2-gate-rejection-blockers-for-candidate
version: 1
description: Exact candidate or definition members implicated by one reviewed Phase 2 gate rejection.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: rejection, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: rejection, link: blocks, emit: target, types: [SYS, ASP, ICSP, DWP, BSL]}
  as: blocker
  where: >-
    blocker == candidate
    || exists("baseline-contains-definition@1", {baseline: candidate, subject: blocker})
    || (candidate.payload.kind == "level-candidate"
      && exists("matching-phase-2-candidate-definition-member@1",
        {candidate: candidate, member: blocker}))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
