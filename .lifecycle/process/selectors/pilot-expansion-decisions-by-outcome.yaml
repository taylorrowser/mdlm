kind: selector-definition
id: pilot-expansion-decisions-by-outcome
version: 1
description: Applicable reviewed pilot-expansion Decisions with one exact proceed, change, or stop outcome.
parameters:
  - {name: assessment, kind: revision, types: [PAS]}
  - {name: outcome, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from:
    selector: pilot-expansion-decisions-for@1
    arguments: {assessment: assessment}
  as: decision
  where: 'decision.payload.decision == outcome'
  distinct: true
  order_by: [identity.id, identity.revision]
