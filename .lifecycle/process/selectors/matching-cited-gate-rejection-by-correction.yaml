kind: selector-definition
id: matching-cited-gate-rejection-by-correction
version: 1
description: One exact reviewed gate rejection cited by one correction Revision or replacement candidate.
parameters:
  - {name: replacement, kind: revision, types: [MAP, PSP, STK, BSL]}
  - {name: rejection, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    selector: cited-gate-rejections-by-correction@1
    arguments: {replacement: replacement}
  as: cited
  where: 'cited.identity.revision_id == rejection.identity.revision_id'
  distinct: true
  order_by: [identity.revision_id]
