kind: selector-definition
id: matching-complete-pilot-assessment-context
version: 1
description: The supplied context when it is an exact complete current pilot assessment boundary.
parameters:
  - {name: context, kind: revision, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: complete-pilot-assessment-contexts@1
    arguments: {}
  as: complete_context
  where: 'complete_context == context'
  distinct: true
  order_by: [identity.revision_id]
