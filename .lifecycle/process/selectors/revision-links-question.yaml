kind: selector-definition
id: revision-links-question
version: 1
description: Outgoing links from one exact Revision that reference one stable Question identity.
parameters:
  - {name: subject, kind: revision}
  - {name: question, kind: revision, types: [QST]}
result_kind: stable-datum
query:
  from: {relation: outgoing-links, of: subject, emit: target, types: [QST]}
  as: target
  where: 'target.identity.id == question.identity.id'
  distinct: true
  order_by: [identity.id]
