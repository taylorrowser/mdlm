kind: selector-definition
id: system-completion-outputs-for
version: 1
description: Exact SYS outputs canonically accounted for by one SYS-target DWP completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: completion, link: produces, emit: target, types: [SYS]}
  as: output
  where: 'completion.payload.target_child_type == "SYS"'
  distinct: true
  order_by: [identity.revision_id]
