kind: selector-definition
id: foundation-correction-replacements-for-decision
version: 1
description: Exact corrected Phase 0 foundation Revisions justified by one trusted attended correction Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [MAP, PSP, STK]}
  as: replacement
  where: >-
    !every("foundation-correction-decisions-for@1",
      {replacement: replacement}, authority => authority != decision)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
