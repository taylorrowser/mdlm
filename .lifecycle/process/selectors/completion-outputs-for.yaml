kind: selector-definition
id: completion-outputs-for
version: 1
description: Exact SYS outputs canonically accounted for by one DWP completion Revision.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: completion, link: produces, emit: target, types: [SYS]}
  as: output
  distinct: true
  order_by: [identity.revision_id]
