kind: selector-definition
id: applicable-disposition-decisions-for
version: 1
description: Reviewed valid disposition decisions justifying one exact subject revision.
parameters:
  - {name: subject, kind: revision}
  - {name: decision_kind, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {relation: incoming-links, of: {var: subject}, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == decision_kind
    && state(decision, "validity") == "valid"
    && exists("passing-reviews-for@1", {subject: decision})
  distinct: true
  order_by: [identity.revision_id]
