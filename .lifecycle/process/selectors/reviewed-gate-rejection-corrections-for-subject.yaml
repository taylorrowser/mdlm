kind: selector-definition
id: reviewed-gate-rejection-corrections-for-subject
version: 1
description: Same-lineage replacements citing every reviewed gate rejection for one exact subject and carrying fresh passing Review.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from:
    selector: gate-rejection-corrections-for-subject@1
    arguments: {subject: subject}
  as: correction
  where: >-
    exists("passing-reviews-for@1", {subject: correction})
    && none("failing-reviews-for@1", {subject: correction})
  distinct: true
  order_by: [identity.revision_id]
