kind: selector-definition
id: applicable-initial-product-intent-decisions
version: 1
description: Current trusted attended scope Decision with one exact current answered initial product-intent Question and a passing exact Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "scope"
    && decision.provenance.scenario in [
      "resolve-question@2",
      "revise-question-decision-after-review@1"
    ]
    && decision.provenance.process_ref == process.current_ref
    && decision.integrity.scenario_execution_valid == true
    && state(decision, "disposition") == "active"
    && state(decision, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: decision})
    && count("initial-product-intent-sources-for-decision@1", {decision: decision}) == 1
    && count("initial-product-intent-targets-for-decision@1", {decision: decision}) == 1
    && exists("passing-reviews-for@1", {subject: decision})
  distinct: true
  order_by: [identity.revision_id]
