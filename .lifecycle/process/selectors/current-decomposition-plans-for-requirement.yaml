kind: selector-definition
id: current-decomposition-plans-for-requirement
version: 1
description: Current DWP planning Revisions whose exact payload and links bind the package-selected requirement, architecture, interfaces, and strategy.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: decomposes, emit: source, types: [DWP]}
  as: plan
  where: >-
    plan.payload.stage == "planning"
    && state(plan, "disposition") == "active"
    && state(plan, "validity") == "valid"
    && exists("planning-dwp-review-support-is-current@1", {plan: plan})
    && none("newer-planning-revisions-for@1", {plan: plan})
    && count("decomposition-architecture-matches-requirement@1",
      {plan: plan, requirement: requirement}) == 1
    && count("decomposition-strategy-matches-requirement@1",
      {plan: plan, requirement: requirement}) == 1
    && count("architectures-for-decomposition@1", {plan: plan}) == 1
    && one("architectures-for-decomposition@1", {plan: plan}) == one("decomposition-architecture-matches-requirement@1", {plan: plan, requirement: requirement})
    && (exists("interaction-free-architectures-for-requirement@1", {requirement: requirement})
      || exists("current-interfaces-for-architecture@1",
        {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})}))
    && count("interfaces-for-decomposition@1", {plan: plan})
      == count("current-interfaces-for-architecture@1",
        {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})})
    && every("current-interfaces-for-architecture@1",
      {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})}, interface =>
        exists("matching-decomposition-interface@1", {plan: plan, interface: interface}))
  distinct: true
  order_by: [identity.id, identity.revision]
