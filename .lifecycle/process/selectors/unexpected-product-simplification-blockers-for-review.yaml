kind: selector-definition
id: unexpected-product-simplification-blockers-for-review
version: 1
description: Product simplification blockers outside the exact frozen definition set under Review.
parameters:
  - {name: review, kind: revision, types: [REV]}
  - {name: subject_context, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: product-simplification-blockers-for-review@1
    arguments: {review: review}
  as: blocker
  where: 'none("baseline-contains-definition@1", {baseline: subject_context, subject: blocker})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
