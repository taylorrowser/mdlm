kind: selector-definition
id: failed-current-environment-qualifications
version: 1
description: Current exact Phase 1 ENV Revisions whose singular completed qualification RUN produced a valid failure and no pass.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [ENV]}
  as: environment
  where: >-
    state(environment, "disposition") == "active"
    && state(environment, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: environment})
    && count("strategies-for-environment@1", {environment: environment}) == 1
    && exists("complete-environment-assurance-for-environment@1",
      {environment: environment})
    && count("failed-qualification-results-for-environment@1",
      {environment: environment}) == 1
    && none("passing-qualification-results-for@1", {environment: environment})
  distinct: true
  order_by: [identity.id, identity.revision]
