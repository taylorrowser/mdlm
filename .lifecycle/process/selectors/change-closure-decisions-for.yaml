kind: selector-definition
id: change-closure-decisions-for
version: 2
description: Exact closure Decisions citing one approved accepted-STK Change Request and its complete replacement evidence.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.payload.kind == "change-closure"
    && decision.payload.effective_scope == change.identity.revision_id
    && state(decision, "validity") == "valid"
    && exists("passing-reviews-for@1", {subject: change})
  distinct: true
  order_by: [identity.revision_id]
