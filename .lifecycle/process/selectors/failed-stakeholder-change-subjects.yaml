kind: selector-definition
id: failed-stakeholder-change-subjects
version: 2
description: Current non-Decision accepted requirement, consumer, or candidate Revisions requiring one causal same-lineage Change Request Correction.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [CHG, STK, SYS, DWP, BSL]}
  as: subject
  where: >-
    none("newer-revisions-for@1", {subject: subject})
    && exists("failing-reviews-for@1", {subject: subject})
    && exists("changes-controlling-stakeholder-change-subject@2", {subject: subject})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
