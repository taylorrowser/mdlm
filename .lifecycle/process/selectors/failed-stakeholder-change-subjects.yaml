kind: selector-definition
id: failed-stakeholder-change-subjects
version: 1
description: Current non-Decision accepted-STK change Revisions requiring one causal same-lineage Correction.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [CHG, STK, BSL]}
  as: subject
  where: >-
    none("newer-revisions-for@1", {subject: subject})
    && exists("failing-reviews-for@1", {subject: subject})
    && exists("changes-controlling-stakeholder-change-subject@1", {subject: subject})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
