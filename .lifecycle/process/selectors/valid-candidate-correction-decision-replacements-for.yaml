kind: selector-definition
id: valid-candidate-correction-decision-replacements-for
version: 1
description: Current causal same-lineage replacements preserving one failed candidate-correction Decision's exact candidate scope.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    selector: newer-revisions-for@1
    arguments: {subject: decision}
  as: replacement
  where: >-
    replacement.identity.id == decision.identity.id
    && replacement.payload.kind == "scope"
    && replacement.payload.effective_scope == decision.payload.effective_scope
    && (
      replacement.payload.decision != decision.payload.decision
      || replacement.payload.rationale != decision.payload.rationale
      || replacement.payload.alternatives != decision.payload.alternatives
    )
    && replacement.provenance.scenario ==
      "revise-candidate-correction-decision-after-review@1"
    && state(replacement, "disposition") == "active"
    && state(replacement, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: replacement})
    && exists("candidate-correction-candidates-for-decision@1",
      {decision: replacement})
    && every("failing-reviews-for@1", {subject: decision}, failed =>
      !every("cited-failing-reviews-by-correction@1",
        {replacement: replacement}, cited => cited != failed))
    && every("cited-failing-reviews-by-correction@1",
      {replacement: decision}, prior =>
        !every("cited-failing-reviews-by-correction@1",
          {replacement: replacement}, cited => cited != prior))
  distinct: true
  order_by: [identity.revision]
