kind: selector-definition
id: candidate-correction-authorities-requiring-review
version: 1
description: Trusted correction Decisions relied upon by current Phase 0 candidate members that lack an exact passing Review.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && (
      !every("review-required-members-for@1", {candidate: candidate}, member =>
        every("foundation-correction-decisions-for@1",
          {replacement: member}, authority => authority != decision))
      || !every("latest-question-dependencies-for-candidate@1",
        {candidate: candidate}, question =>
          every("question-answer-decisions-for@1",
            {question: question}, answer => answer != decision)
          && every("question-disposition-decisions-for@1",
            {question: question}, disposition => disposition != decision))
    )
    && (
      none("passing-reviews-for@1", {subject: decision})
      || exists("failing-reviews-for@1", {subject: decision})
    )
  distinct: true
  order_by: [identity.id, identity.revision]
