kind: selector-definition
id: unexpected-corrected-qualification-results
version: 1
description: Qualification results cited by a replacement ENV that are not exact failures from its predecessor's singular completed qualification RUN.
parameters:
  - {name: environment, kind: revision, types: [ENV]}
  - {name: replacement, kind: revision, types: [ENV]}
result_kind: revision
query:
  from:
    selector: qualification-results-corrected-by-environment@1
    arguments: {replacement: replacement}
  as: result
  where: >-
    every("failed-qualification-results-for-environment@1",
      {environment: environment}, failed => failed != result)
  distinct: true
  order_by: [identity.revision_id]
