kind: selector-definition
id: formal-result-review-context-members-for
version: 1
description: Exact run, requirement, implementation, activity, environment, and controlled product support for one formal result assessment.
parameters:
  - {name: result, kind: revision, types: [RES]}
result_kind: revision
query:
  from: {collection: revisions, types: [ART, STK, SYS, CMP, DES, ENV, VER, VAI, RUN]}
  as: member
  where: >-
    !every("formal-runs-producing-result@1", {result: result}, run =>
      run != member
      && every("verification-implementations-for-run@1", {run: run}, implementation =>
        implementation != member
        && every("verification-activities-for-implementation@1",
          {implementation: implementation}, activity => activity != member))
      && every("environments-for-run@1", {run: run}, environment => environment != member)
      && every("execution-targets-for-run@1", {run: run}, target => target != member))
    || !every("requirements-for-formal-result@1", {result: result}, requirement => requirement != member)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
