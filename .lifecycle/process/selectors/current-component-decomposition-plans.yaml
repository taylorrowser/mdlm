kind: selector-definition
id: current-component-decomposition-plans
version: 1
description: Current planning DWP Revisions whose declared child type is CMP.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: plan
  where: >-
    plan.payload.stage == "planning"
    && plan.payload.target_child_type == "CMP"
    && state(plan, "disposition") == "active"
    && state(plan, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: plan})
  distinct: true
  order_by: [identity.id, identity.revision]
