kind: selector-definition
id: failed-current-pilot-verification-implementations
version: 1
description: Current exact source-blind pilot implementation Revisions with one or more valid failed Reviews.
parameters: []
result_kind: revision
query:
  from:
    selector: current-pilot-verification-implementations@1
    arguments: {}
  as: implementation
  where: 'exists("failing-reviews-for@1", {subject: implementation})'
  distinct: true
  order_by: [identity.id, identity.revision]
