kind: selector-definition
id: coherent-phase-2-entry-requirements
version: 1
description: Current accepted Phase 2 entry requirements sharing one solution-independent responsibility and trust context.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from:
    selector: phase-2-entry-requirements@1
    arguments: {}
  as: candidate
  where: >-
    candidate.payload.system_context == requirement.payload.system_context
    && count("current-product-specifications-for-requirement@1", {requirement: candidate}) == 1
    && count("current-product-specifications-for-requirement@1", {requirement: requirement}) == 1
    && one("current-product-specifications-for-requirement@1", {requirement: candidate})
      == one("current-product-specifications-for-requirement@1", {requirement: requirement})
  distinct: true
  order_by: [identity.revision_id]
