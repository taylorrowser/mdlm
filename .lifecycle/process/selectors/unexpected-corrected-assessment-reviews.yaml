kind: selector-definition
id: unexpected-corrected-assessment-reviews
version: 1
description: Reviews claimed by a corrected PAS that are not exact failing Reviews of its prior Revision.
parameters:
  - {name: assessment, kind: revision, types: [PAS]}
  - {name: replacement, kind: revision, types: [PAS]}
result_kind: revision
query:
  from:
    selector: corrected-assessment-reviews-for@1
    arguments: {replacement: replacement}
  as: review
  where: 'none("matching-failing-review-for@1", {subject: assessment, review: review})'
  distinct: true
  order_by: [identity.revision_id]
