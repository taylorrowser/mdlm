kind: selector-definition
id: implemented-changes-impacting-revision
version: 2
description: Reviewed approved Change Requests whose exact accepted requirement roots derive the supplied affected Revision and have published a same-lineage replacement.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {collection: revisions, types: [CHG]}
  as: change
  where: >-
    change != subject
    && exists("revised-requirements-for-change@3", {change: change})
    && count("impacted-requirements-for-change@3", {change: change}) == 1
    && (
      (every("impacted-requirements-for-change@3", {change: change}, requirement =>
          requirement.identity.type == "STK")
        && (
          !every("impacted-requirements-for-change@3", {change: change}, requirement =>
            requirement != subject)
          || !every("traceability-affected-change-contexts@1", {change: change}, context =>
            context != subject)
          || !every("traceability-affected-change-evidence@1", {change: change}, evidence =>
            evidence != subject)
        ))
      || (every("impacted-requirements-for-change@3", {change: change}, requirement =>
          requirement.identity.type == "SYS")
        && (
          !every("impacted-requirements-for-change@3", {change: change}, requirement =>
            requirement != subject)
          || !every("accepted-shared-system-consumer-revisions-for-change@1", {change: change}, consumer =>
            consumer != subject)
          || !every("shared-system-change-contexts@1", {change: change}, context =>
            context != subject)
          || !every("shared-system-change-candidates@1", {change: change}, candidate =>
            candidate != subject)
          || !every("shared-system-change-verification-evidence@1", {change: change}, evidence =>
            evidence != subject)
          || !every("shared-system-change-contexts@1", {change: change}, context =>
            every("revisions-tracing-subject@1", {subject: context}, review => review != subject))
          || !every("shared-system-change-candidates@1", {change: change}, candidate =>
            every("revisions-tracing-subject@1", {subject: candidate}, dependent =>
              dependent != subject
              && every("revisions-tracing-subject@1", {subject: dependent}, downstream => downstream != subject)))
          || !every("shared-system-change-verification-evidence@1", {change: change}, evidence =>
            every("revisions-tracing-subject@1", {subject: evidence}, dependent => dependent != subject))
        ))
    )
  distinct: true
  order_by: [identity.revision_id]
