kind: selector-definition
id: phase-2-contexts-for-review
version: 1
description: Exact frozen Review Context cited by one Phase 2 simplification Review.
parameters:
  - {name: review, kind: revision, types: [REV]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: review, link: contextualizes, emit: target, types: [BSL]}
  as: context
  where: 'context.payload.kind == "review-context" && context.storage.frozen == true'
  distinct: true
  order_by: [identity.revision_id]
