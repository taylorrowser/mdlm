kind: selector-definition
id: phase-3-architecture-representative-requirements
version: 1
description: One deterministic accepted SYS representative for the narrow coherent Phase 3 slice.
parameters: []
result_kind: revision
query:
  from:
    selector: phase-3-entry-requirements@1
    arguments: {}
  as: requirement
  where: 'requirement == first("phase-3-entry-requirements@1", {})'
  distinct: true
  order_by: [identity.revision_id]
