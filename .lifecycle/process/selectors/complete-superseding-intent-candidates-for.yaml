kind: selector-definition
id: complete-superseding-intent-candidates-for
version: 1
description: Same-lineage superseding intent candidates containing the reviewed current foundation and preserving rejection evidence when applicable.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: superseding-baselines-for@1
    arguments: {baseline: candidate}
  as: replacement
  where: >-
    replacement.identity.id == candidate.identity.id
    && replacement.payload.scope == candidate.payload.scope
    && replacement.payload.group == candidate.payload.group
    && exists("current-wayfinding-maps@1", {})
    && exists("current-product-specifications@1", {})
    && every("current-product-specifications@1", {}, product_specification =>
      exists("stakeholder-requirements-for@1",
        {product_specification: product_specification}))
    && none("phase-0-foundation-members-missing-review@1", {})
    && every("phase-0-product-simplification-contexts@1", {}, context =>
      every("product-simplification-reviews-for@1",
        {subject_context: context, outcome: "pass"}, review =>
          exists("baseline-contains-evidence@1",
            {baseline: replacement, subject: review})))
    && replacement.payload.kind == "intent-level-candidate"
    && replacement.payload.role == "candidate"
    && every("phase-0-foundation-members@1", {}, member =>
      exists("candidate-members-matching@1",
        {candidate: replacement, required_member: member}))
    && none("non-phase-0-foundation-members-for@1", {candidate: replacement})
    && (
      none("failing-reviews-for@1", {subject: candidate})
      || (
        count("cited-failing-reviews-by-correction@1", {replacement: replacement})
          == count("failing-reviews-for@1", {subject: candidate})
        && every("failing-reviews-for@1", {subject: candidate}, review =>
          exists("matching-cited-failing-review-by-correction@1",
            {replacement: replacement, review: review}))
      )
    )
    && (
      none("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
      || (
        every("baseline-evidence@1", {baseline: candidate}, evidence =>
          exists("baseline-contains-evidence@1",
            {baseline: replacement, subject: evidence}))
        && count("cited-gate-rejections-by-correction@1",
          {replacement: replacement})
          == count("reviewed-gate-rejections-for-candidate@1",
            {candidate: candidate})
        && every("reviewed-gate-rejections-for-candidate@1",
          {candidate: candidate}, rejection =>
            exists("matching-cited-gate-rejection-by-correction@1",
              {replacement: replacement, rejection: rejection}))
      )
    )
  distinct: true
  order_by: [identity.revision]
