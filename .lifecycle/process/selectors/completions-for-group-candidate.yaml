kind: selector-definition
id: completions-for-group-candidate
version: 1
description: Exact DWP completion represented by one semantically complete group candidate.
parameters:
  - {name: group, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: group, emit: entity, types: [DWP]}
  as: completion
  where: >-
    completion.payload.stage == "completion"
    && exists("group-candidate-matches-completion@1",
      {group: group, completion: completion})
  distinct: true
  order_by: [identity.revision_id]
