kind: selector-definition
id: matching-cited-failing-review-by-correction
version: 1
description: The supplied failed Review when one exact replacement cites it as a correction cause.
parameters:
  - {name: replacement, kind: revision}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from:
    selector: cited-failing-reviews-by-correction@1
    arguments: {replacement: replacement}
  as: cited_review
  where: 'cited_review == review'
  distinct: true
  order_by: [identity.revision_id]
