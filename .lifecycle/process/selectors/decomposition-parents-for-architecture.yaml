kind: selector-definition
id: decomposition-parents-for-architecture
version: 1
description: Exact accepted STK or SYS decomposition parents governed by one architecture Revision.
parameters:
  - {name: architecture, kind: revision, types: [ASP]}
result_kind: revision
query:
  from:
    selector: definition-requirements-for-architecture@1
    arguments: {architecture: architecture}
  as: requirement
  where: >-
    (requirement.identity.type == "STK"
      && exists("matching-phase-2-entry-requirement@1", {requirement: requirement}))
    || (requirement.identity.type == "SYS"
      && !every("phase-3-entry-requirements@1", {}, entry => entry != requirement))
    || (requirement.identity.type == "CMP"
      && !every("phase-4-entry-component-requirements@1", {}, entry => entry != requirement))
  distinct: true
  order_by: [identity.revision_id]
