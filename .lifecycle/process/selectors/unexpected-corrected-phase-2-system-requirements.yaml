kind: selector-definition
id: unexpected-corrected-phase-2-system-requirements
version: 1
description: Replacement-plan SYS outputs that do not retain a Stable Datum lineage from the challenged exact output set.
parameters:
  - {name: prior_plan, kind: revision, types: [DWP]}
  - {name: replacement_plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: decomposition-outputs-for@1
    arguments: {plan: replacement_plan}
  as: replacement
  where: 'none("matching-prior-phase-2-system-requirement@1", {prior_plan: prior_plan, replacement: replacement})'
  distinct: true
  order_by: [identity.revision_id]
