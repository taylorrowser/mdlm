kind: selector-definition
id: baselines-containing-with-role
version: 1
description: Frozen baselines of a requested role containing one exact revision.
parameters:
  - {name: subject, kind: revision}
  - {name: role, kind: scalar, scalar_type: string}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: subject, emit: entity, types: [BSL]}
  as: baseline
  where: >-
    baseline.payload.role == role
    && baseline.storage.frozen == true
  distinct: true
  order_by: [identity.revision_id]
