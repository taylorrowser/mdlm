kind: selector-definition
id: current-product-specification-revisions-for-requirement
version: 1
description: Current active exact PSP Revisions reached by one requirement's Stable derived-from link.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from: {collection: revisions, types: [PSP]}
  as: product_specification
  where: >-
    state(product_specification, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: product_specification})
    && !every("current-product-specifications-for-requirement@1",
      {requirement: requirement}, stable_product =>
        stable_product.identity.id != product_specification.identity.id)
  distinct: true
  order_by: [identity.id, identity.revision]
