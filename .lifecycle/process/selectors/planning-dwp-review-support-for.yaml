kind: selector-definition
id: planning-dwp-review-support-for
version: 1
description: Exact allocated ASP, governing ICSP, and applicable latest SYS support for one planning DWP Review.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [ASP, ICSP, SYS]}
  as: support
  where: >-
    (support.identity.type == "ASP"
      && !every("architectures-for-decomposition@1", {plan: plan}, architecture =>
        architecture != support))
    || (support.identity.type == "ICSP"
      && !every("interfaces-for-decomposition@1", {plan: plan}, interface =>
        interface != support))
    || (support.identity.type == "SYS"
      && (
        !every("decomposition-output-revisions-for@1", {plan: plan}, output =>
          output != support)
        || !every("system-requirements-consumed-by@1", {consumer: plan}, requirement =>
          requirement != support)))
  distinct: true
  order_by: [identity.revision_id]
