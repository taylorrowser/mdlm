kind: selector-definition
id: representative-system-requirements-for-level-candidate
version: 1
description: The deterministic first exact SYS member of one complete Phase 2 level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: system-requirements-for-level-candidate@1
    arguments: {candidate: candidate}
  as: requirement
  where: 'requirement == first("system-requirements-for-level-candidate@1", {candidate: candidate})'
  distinct: true
  order_by: [identity.revision_id]
