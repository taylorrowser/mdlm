kind: selector-definition
id: candidate-correction-candidates-for-decision
version: 1
description: Exact Phase 0 candidate justified by one Decision published with its attended correction.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.kind == "intent-level-candidate"
    && candidate.payload.role == "candidate"
    && candidate.identity.revision_id == decision.payload.effective_scope
    && candidate.provenance.scenario == "revise-intent-candidate-after-review@3"
    && decision.provenance.scenario in [
      candidate.provenance.scenario,
      "revise-candidate-correction-decision-after-review@1"
    ]
    && decision.payload.kind == "scope"
  distinct: true
  order_by: [identity.revision_id]
