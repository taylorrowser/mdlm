kind: selector-definition
id: matching-reusable-change-evidence
version: 1
description: The supplied exact evidence when the accepted baseline contains it and the bounded change does not impact it.
parameters:
  - {name: change, kind: revision, types: [CHG]}
  - {name: accepted, kind: baseline, types: [BSL]}
  - {name: evidence, kind: revision}
result_kind: revision
query:
  from: {relation: baseline-evidence, of: accepted, emit: entity}
  as: candidate
  where: >-
    candidate == evidence
    && none("change-impacts-revision@1", {change: change, impacted: candidate})
  distinct: true
  order_by: [identity.revision_id]
