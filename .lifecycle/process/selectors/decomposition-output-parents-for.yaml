kind: selector-definition
id: decomposition-output-parents-for
version: 1
description: Exact STK, SYS, or CMP parent Revisions from which one matching decomposition output is canonically derived.
parameters:
  - {name: output, kind: revision, types: [SYS, CMP, DES]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: output, link: derived-from, emit: target, types: [STK, SYS, CMP]}
  as: parent
  where: >-
    (output.identity.type == "SYS" && parent.identity.type == "STK")
    || (output.identity.type == "CMP" && parent.identity.type == "SYS")
    || (output.identity.type == "DES" && parent.identity.type == "CMP")
  distinct: true
  order_by: [identity.revision_id]
