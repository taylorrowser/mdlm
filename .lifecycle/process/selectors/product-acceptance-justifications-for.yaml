kind: selector-definition
id: product-acceptance-justifications-for
version: 1
description: Exact accepted product scope and evidence directly justified by one product-acceptance Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: decision, link: justifies, emit: target, types: [ART, STK, RES, REV, BSL]}
  as: evidence
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
