kind: selector-definition
id: open-questions
version: 1
description: Latest active QST revisions still awaiting answer, deferral, or cancellation.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: question
  where: >-
    question.payload.state == "open"
    && none("newer-revisions-for@1", {subject: question})
    && state(question, "disposition") == "active"
  distinct: true
  order_by: [identity.id]
