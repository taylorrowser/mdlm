kind: selector-definition
id: open-questions
version: 1
description: Latest active QST revisions still open or awaiting applicable reviewed deferral or cancellation evidence.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: question
  where: >-
    (
      question.payload.state == "open"
      || (
        question.payload.state in ["deferred", "cancelled"]
        && none("applicable-question-dispositions-for@1", {question: question})
      )
      || (
        question.payload.kind == "preferential"
        && question.payload.state == "answered"
        && none("applicable-question-answers-for@1", {question: question})
      )
    )
    && none("newer-revisions-for@1", {subject: question})
    && state(question, "disposition") == "active"
  distinct: true
  order_by: [identity.id]
