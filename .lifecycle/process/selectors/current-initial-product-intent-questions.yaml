kind: selector-definition
id: current-initial-product-intent-questions
version: 1
description: Current active QST lineages that carry the mandatory structural initial product-intent scope.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: question
  where: >-
    question.payload.intent_scope == "product"
    && none("newer-revisions-for@1", {subject: question})
    && state(question, "disposition") == "active"
  distinct: true
  order_by: [identity.id, identity.revision]
