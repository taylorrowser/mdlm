kind: selector-definition
id: legacy-thin-dwp-review-contexts-for
version: 1
description: Authentic thin planning-DWP Review Contexts frozen by exact 0.63.0 or 0.64.0 packages before exact ASP, ICSP, and current SYS support was required.
parameters:
  - {name: subject, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: subject, emit: entity}
  as: context
  where: >-
    subject.payload.stage == "planning"
    && context.identity.type == "BSL"
    && context.payload.kind == "review-context"
    && context.payload.role == "review-context"
    && context.payload.scope == subject.identity.revision_id
    && context.provenance.process_ref in [
      "mdlm-bootstrap@0.63.0#sha256:76edf328dd3aa2ff1a3d536b768d648b1ec328678fa4bce0b6420b47bf0fac7d",
      "mdlm-bootstrap@0.64.0#sha256:e3759f865e15cb62a7014d1cd3c05b25bee3f2858966a1cc7ed59bfda5476c8b"
    ]
    && context.payload.snapshot.process_provenance.process_ref == context.provenance.process_ref
    && every("review-context-members@1", {context: context}, member => member == subject)
    && none("review-context-evidence@1", {context: context})
    && none("composed-baselines-for-review-context@1", {context: context})
  distinct: true
  order_by: [identity.id, identity.revision]
