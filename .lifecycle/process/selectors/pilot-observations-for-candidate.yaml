kind: selector-definition
id: pilot-observations-for-candidate
version: 1
description: Exact durable Phase 0–2 pilot observations justified by one complete level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: candidate, link: justifies, emit: source, types: [DEC]}
  as: observation
  where: >-
    observation.payload.kind == "pilot-observation"
    && observation.payload.effective_scope == "Phase 0–2 pilot evidence boundary"
    && state(observation, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: observation})
    && count("pilot-observation-candidates-for@1", {observation: observation}) == 1
    && none("other-pilot-observation-targets-for@1", {observation: observation})
  distinct: true
  order_by: [identity.revision_id]
