kind: selector-definition
id: accepted-baseline-promotes-candidate
version: 1
description: The supplied exact candidate when one accepted baseline explicitly promotes it.
parameters:
  - {name: accepted, kind: baseline, types: [BSL]}
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: accepted, link: promotes, emit: target, types: [BSL]}
  as: promoted
  where: 'promoted.identity.revision_id == candidate.identity.revision_id'
  distinct: true
  order_by: [identity.revision_id]
