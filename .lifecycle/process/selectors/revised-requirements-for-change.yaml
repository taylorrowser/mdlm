kind: selector-definition
id: revised-requirements-for-change
version: 1
description: Exact replacement requirement Revisions explicitly authored under one approved Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: changed-under, emit: source, types: [SYS]}
  as: requirement
  distinct: true
  order_by: [identity.type, identity.revision_id]
