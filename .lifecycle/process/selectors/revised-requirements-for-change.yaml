kind: selector-definition
id: revised-requirements-for-change
version: 2
description: Exact same-lineage STK replacement Revisions explicitly authored under one approved Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: changed-under, emit: source, types: [STK]}
  as: requirement
  where: 'none("newer-revisions-for@1", {subject: requirement})'
  distinct: true
  order_by: [identity.type, identity.revision_id]
