kind: selector-definition
id: phase-2-system-requirements-for-review
version: 1
description: Exact SYS Revisions frozen in one current Phase 2 simplification Review Context.
parameters:
  - {name: review, kind: revision, types: [REV]}
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [SYS]}
  as: requirement
  where: >-
    count("phase-2-contexts-for-review@1", {review: review}) == 1
    && exists("review-context-contains-member@1",
      {context: one("phase-2-contexts-for-review@1", {review: review}), required_member: requirement})
  distinct: true
  order_by: [identity.revision_id]
