kind: selector-definition
id: applicable-product-answer-decisions-for-foundation-subject
version: 1
description: Exact passing-reviewed product-answer Decisions not yet incorporated by one affected Phase 0 foundation Revision.
parameters:
  - {name: subject, kind: revision, types: [MAP, PSP, STK]}
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    !every("unincorporated-product-questions-for-foundation-subject@1",
      {subject: subject}, question =>
        every("applicable-question-answers-for@1", {question: question},
          answer => answer != decision))
  distinct: true
  order_by: [identity.revision_id]
