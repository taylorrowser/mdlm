kind: selector-definition
id: accepted-stakeholder-requirements-for-change
version: 1
description: Exact impacted STK Revisions that belong to an authorized accepted intent baseline.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from:
    selector: impacted-requirements-for-change@2
    arguments: {change: change}
  as: requirement
  where: 'exists("accepted-intent-candidates-for-requirement@2", {requirement: requirement})'
  distinct: true
  order_by: [identity.id, identity.revision]
