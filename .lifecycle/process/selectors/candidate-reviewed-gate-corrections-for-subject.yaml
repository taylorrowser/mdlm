kind: selector-definition
id: candidate-reviewed-gate-corrections-for-subject
version: 1
description: Reviewed same-lineage gate Corrections for one prior member that are frozen into the supplied replacement candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: subject, kind: revision}
result_kind: revision
query:
  from:
    selector: gate-rejection-corrections-for-subject@1
    arguments: {subject: subject}
  as: correction
  where: >-
    exists("baseline-contains-definition@1", {baseline: candidate, subject: correction})
    && exists("passing-reviews-for@1", {subject: correction})
  distinct: true
  order_by: [identity.revision_id]
