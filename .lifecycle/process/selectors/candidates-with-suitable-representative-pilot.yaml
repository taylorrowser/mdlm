kind: selector-definition
id: candidates-with-suitable-representative-pilot
version: 1
description: Complete Phase 2 level candidates whose deterministic SYS representative has suitable pilot evidence.
parameters: []
result_kind: baseline
query:
  from:
    selector: complete-phase-2-level-candidates@1
    arguments: {}
  as: candidate
  where: >-
    count("representative-system-requirements-for-level-candidate@1", {candidate: candidate}) == 1
    && every("representative-system-requirements-for-level-candidate@1", {candidate: candidate}, requirement =>
      exists("suitable-pilot-results-for-requirement@1", {requirement: requirement}))
  distinct: true
  order_by: [identity.revision_id]
