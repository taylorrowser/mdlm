kind: selector-definition
id: planning-dwp-review-context-matches
version: 1
description: One exact current-support Review Context for the supplied planning DWP.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: context, kind: revision, types: [BSL]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: plan, emit: entity, types: [BSL]}
  as: candidate
  where: >-
    candidate == context
    && candidate.payload.kind == "review-context"
    && candidate.payload.role == "review-context"
    && candidate.payload.scope == plan.identity.revision_id
    && candidate.storage.frozen == true
    && state(candidate, "validity") == "valid"
    && every("planning-dwp-review-support-for@1", {plan: plan}, support =>
      support.integrity.parseable == true
      && support.integrity.schema_valid == true
      && support.integrity.identity_valid == true
      && support.integrity.references_valid == true
      && support.integrity.hash_valid == true
      && none("newer-revisions-for@1", {subject: support}))
    && none("review-context-evidence@1", {context: candidate})
    && none("composed-baselines-for-review-context@1", {context: candidate})
    && exists("review-context-contains-member@1",
      {context: candidate, required_member: plan})
    && every("planning-dwp-review-support-for@1", {plan: plan}, support =>
      exists("review-context-contains-member@1",
        {context: candidate, required_member: support}))
    && every("direct-review-support-for@1", {subject: plan}, support =>
      exists("review-context-contains-member@1",
        {context: candidate, required_member: support}))
    && every("review-context-members@1", {context: candidate}, member =>
      member == plan
      || !every("planning-dwp-review-support-for@1", {plan: plan}, support =>
        support != member)
      || !every("direct-review-support-for@1", {subject: plan}, support =>
        support != member))
  distinct: true
  order_by: [identity.revision_id]
