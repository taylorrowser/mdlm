kind: selector-definition
id: component-pilot-evidence-for-completion
version: 1
description: Exact reusable component pilot chain and independent Reviews for one CMP or compatible DES completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV, ENV, VER, ART, VAI, RUN, RES]}
  as: evidence
  where: >-
    !every("component-pilot-core-evidence-for-completion@1", {completion: completion}, core => core != evidence)
    || !every("component-pilot-reviewed-subjects-for-completion@1", {completion: completion}, subject =>
      every("passing-reviews-for@1", {subject: subject}, review => review != evidence))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
