kind: selector-definition
id: lower-level-strategy-parent-identities
version: 1
description: Stable identities of the exact active lower-level strategy parent set.
parameters: []
result_kind: stable-datum
query:
  from: {collection: stable-data, types: [SYS, CMP]}
  as: stable
  where: >-
    !every("lower-level-strategy-parent-requirements@1", {}, requirement =>
      requirement.identity.id != stable.identity.id)
  distinct: true
  order_by: [identity.id]
