kind: selector-definition
id: draft-outdated-shared-system-consumers
version: 1
description: Current draft consumers whose replacement shared SYS has no approved Change Request cause.
parameters: []
result_kind: revision
query:
  from: {selector: outdated-shared-system-consumers@2, arguments: {}}
  as: consumer
  where: >-
    count("replacement-system-requirements-for-consumer@2", {consumer: consumer}) == 1
    && every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, requirement =>
      none("changes-changed-under-subject@1", {subject: requirement}))
  distinct: true
  order_by: [identity.id, identity.revision]
