kind: selector-definition
id: complete-phase-0-intent-candidates
version: 1
description: Current intent candidates containing every and only current active Phase 0 foundation Revision.
parameters: []
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: '"intent-level-candidate"'}
  as: candidate
  where: >-
    exists("current-wayfinding-maps@1", {})
    && exists("current-product-specifications@1", {})
    && every("current-product-specifications@1", {}, product_specification =>
      exists("stakeholder-requirements-for@1",
        {product_specification: product_specification}))
    && none("phase-0-foundation-members-missing-review@1", {})
    && every("phase-0-product-simplification-contexts@1", {}, context =>
      every("product-simplification-reviews-for@1",
        {subject_context: context, outcome: "pass"}, review =>
          exists("baseline-contains-evidence@1",
            {baseline: candidate, subject: review})))
    && every("phase-0-foundation-members@1", {}, member =>
      exists("candidate-members-matching@1",
        {candidate: candidate, required_member: member}))
    && none("non-phase-0-foundation-members-for@1", {candidate: candidate})
  distinct: true
  order_by: [identity.id, identity.revision]
