kind: selector-definition
id: accepted-system-baselines-for-requirement
version: 1
description: Exact frozen level-accepted baselines containing one exact SYS Revision.
parameters:
  - {name: requirement, kind: revision, types: [SYS]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: baseline
  where: >-
    baseline.payload.kind == "level-accepted"
    && baseline.payload.role == "accepted"
    && baseline.storage.frozen == true
    && exists("baseline-contains-definition@1", {baseline: baseline, subject: requirement})
  distinct: true
  order_by: [identity.revision_id]
