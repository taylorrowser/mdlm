kind: selector-definition
id: unexpected-level-candidate-evidence
version: 1
description: Evidence outside the exact passing simplification Reviews for one level candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: baseline-evidence, of: candidate, emit: entity}
  as: evidence
  where: >-
    count("planning-revisions-for-completion@1", {completion: completion}) == 1
    && none("simplification-evidence-matches-plan@1",
      {plan: one("planning-revisions-for-completion@1", {completion: completion}),
       evidence: evidence})
  distinct: true
  order_by: [identity.revision_id]
