kind: selector-definition
id: pilot-assessment-contexts
version: 1
description: Exact frozen evidence contexts ready for one Phase 0–2 pilot assessment.
parameters: []
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: context
  where: >-
    context.payload.kind == "pilot-assessment-context"
    && context.storage.frozen == true
    && state(context, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
