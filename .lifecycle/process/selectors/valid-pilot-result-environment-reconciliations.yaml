kind: selector-definition
id: valid-pilot-result-environment-reconciliations
version: 1
description: Exact same-lineage ENV replacement and fresh qualification pair causally addressing one pilot implementation's unfavorable results.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
  - {name: environment, kind: revision, types: [ENV]}
  - {name: strategy, kind: revision, types: [VSP]}
  - {name: replacement, kind: revision, types: [ENV]}
  - {name: qualification_activity, kind: revision, types: [VER]}
  - {name: qualification_implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {relation: revisions, of: environment, emit: entity, types: [ENV]}
  as: candidate
  where: >-
    candidate == replacement
    && candidate.identity.id == environment.identity.id
    && candidate.identity.revision > environment.identity.revision
    && candidate.payload.strategy_revision == strategy.identity.revision_id
    && candidate.payload.profile_id == strategy.payload.environment_profile.id
    && candidate.payload.capabilities == strategy.payload.environment_profile.capabilities
    && count("pilot-results-cited-by-correction@1", {replacement: candidate})
      == count("unfavorable-pilot-results-for-implementation@1",
        {implementation: implementation})
    && every("pilot-results-cited-by-correction@1", {replacement: candidate}, result =>
      !every("unfavorable-pilot-results-for-implementation@1",
        {implementation: implementation}, cause => cause != result))
    && qualification_activity.payload.kind == "qualification"
    && qualification_activity.payload.claim.scope == "environment-capability"
    && qualification_implementation.payload.kind == "qualification"
    && qualification_implementation.payload.independence_mode == "environment-capability"
    && one("verification-activities-for-implementation@1",
      {implementation: qualification_implementation}) == qualification_activity
    && one("environments-for-implementation@1",
      {implementation: qualification_implementation}) == candidate
    && one("execution-targets-for-implementation@1",
      {implementation: qualification_implementation}) == candidate
  distinct: true
  order_by: [identity.revision]
