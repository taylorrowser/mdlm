kind: selector-definition
id: source-boundaries-for
version: 1
description: Exact valid source-boundary baselines truthfully published for one supplied QST Revision.
parameters:
  - {name: source, kind: revision, types: [QST]}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: source, emit: entity, types: [BSL]}
  as: boundary
  where: >-
    boundary.payload.kind == "source-boundary"
    && boundary.payload.role == "source-boundary"
    && boundary.payload.scope == source.identity.revision_id
    && boundary.payload.group == "SAME-LINEAGE"
    && boundary.payload.definition_members == [source.identity.revision_id]
    && none("source-boundary-evidence@1", {boundary: boundary})
    && boundary.storage.frozen == true
    && boundary.integrity.scenario_execution_valid == true
    && boundary.provenance.scenario == "freeze-source-boundary@1"
    && state(boundary, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
