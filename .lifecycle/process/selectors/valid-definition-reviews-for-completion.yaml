kind: selector-definition
id: valid-definition-reviews-for-completion
version: 1
description: Current passing coherent-set Reviews whose frozen context contains every exact member of one CMP or DES completion.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: passing-reviews-for@1
    arguments: {subject: completion}
  as: review
  where: >-
    completion.payload.target_child_type in ["CMP", "DES"]
    && every("current-exact-review-contexts-cited-by@1", {review: review, subject: completion}, context =>
      every("definition-members-for-completion@1", {completion: completion}, member =>
        exists("review-context-contains-member@1", {context: context, required_member: member})))
  distinct: true
  order_by: [identity.revision_id]
