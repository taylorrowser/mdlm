kind: selector-definition
id: reviewed-complete-superseding-phase-2-groups-for
version: 1
description: Complete evidence-preserving group replacements whose fresh exact Review passes.
parameters:
  - {name: group, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from:
    selector: complete-superseding-phase-2-groups-for@1
    arguments: {group: group}
  as: replacement
  where: >-
    exists("passing-reviews-for@1", {subject: replacement})
    && none("failing-reviews-for@1", {subject: replacement})
  distinct: true
  order_by: [identity.revision_id]
