kind: selector-definition
id: exhausted-question-decision-review-failures
version: 1
description: Current failed Question Decisions whose two attended causal replacement cycles are exhausted.
parameters: []
result_kind: revision
query:
  from:
    selector: failed-question-decisions@1
    arguments: {}
  as: decision
  where: >-
    count("review-correction-history-for@1",
      {subject: decision, view: "corrections"}) >= 2
  distinct: true
  order_by: [identity.id, identity.revision]
