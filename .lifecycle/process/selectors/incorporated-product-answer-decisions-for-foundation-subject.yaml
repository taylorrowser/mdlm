kind: selector-definition
id: incorporated-product-answer-decisions-for-foundation-subject
version: 1
description: Exact reviewed product-answer Decisions incorporated by one Phase 0 foundation Revision.
parameters:
  - {name: subject, kind: revision, types: [MAP, PSP, STK]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: subject, link: incorporates-answer, emit: target, types: [DEC]}
  as: decision
  distinct: true
  order_by: [identity.revision_id]
