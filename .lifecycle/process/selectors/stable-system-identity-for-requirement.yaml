kind: selector-definition
id: stable-system-identity-for-requirement
version: 1
description: Stable SYS identity corresponding to one exact SYS Revision.
parameters:
  - {name: requirement, kind: revision, types: [SYS]}
result_kind: stable-datum
query:
  from: {collection: stable-data, types: [SYS]}
  as: stable_requirement
  where: 'stable_requirement.identity.id == requirement.identity.id'
  distinct: true
  order_by: [identity.id]
