kind: selector-definition
id: reviewed-gate-rejections-for-subject
version: 1
description: Reviewed exact gate rejections that name one candidate definition Revision as a blocker.
parameters:
  - {name: subject, kind: revision, types: [MAP, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, VER]}
result_kind: revision
query:
  from: {relation: incoming-links, of: subject, link: blocks, emit: source, types: [DEC]}
  as: rejection
  where: >-
    rejection.payload.kind == "gate-signoff"
    && rejection.payload.gate_outcome == "reject"
    && state(rejection, "validity") == "valid"
    && exists("passing-reviews-for@1", {subject: rejection})
    && exists("gate-candidates-for-decision@1", {decision: rejection})
  distinct: true
  order_by: [identity.revision_id]
