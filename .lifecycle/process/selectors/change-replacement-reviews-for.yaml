kind: selector-definition
id: change-replacement-reviews-for
version: 1
description: Fresh passing Reviews of the exact replacement STK for one Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV]}
  as: review
  where: >-
    every("revised-requirements-for-change@2", {change: change}, requirement =>
      exists("matching-passing-review-for@1", {subject: requirement, review: review}))
  distinct: true
  order_by: [identity.revision_id]
