kind: selector-definition
id: accepted-intent-baselines-for-change
version: 1
description: Exact accepted intent or system baseline explicitly impacted by one bounded accepted-requirement Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: baseline
  where: >-
    baseline.payload.role == "accepted"
    && baseline.storage.frozen == true
    && exists("change-impacts-revision@1", {change: change, impacted: baseline})
    && every("impacted-requirements-for-change@3", {change: change}, requirement =>
      exists("baseline-contains-definition@1", {baseline: baseline, subject: requirement})
      && (
        (requirement.identity.type == "STK" && baseline.payload.kind == "intent-approved")
        || (requirement.identity.type == "SYS" && baseline.payload.kind == "level-accepted")
      ))
  distinct: true
  order_by: [identity.revision_id]
