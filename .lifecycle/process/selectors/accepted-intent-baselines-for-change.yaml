kind: selector-definition
id: accepted-intent-baselines-for-change
version: 1
description: Exact accepted intent baseline explicitly impacted by a bounded stakeholder Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: baseline
  where: >-
    baseline.payload.kind == "intent-approved"
    && baseline.payload.role == "accepted"
    && baseline.storage.frozen == true
    && exists("change-impacts-revision@1", {change: change, impacted: baseline})
    && every("accepted-stakeholder-requirements-for-change@1", {change: change}, requirement =>
      exists("baseline-contains-definition@1", {baseline: baseline, subject: requirement}))
  distinct: true
  order_by: [identity.revision_id]
