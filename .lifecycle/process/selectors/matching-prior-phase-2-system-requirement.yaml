kind: selector-definition
id: matching-prior-phase-2-system-requirement
version: 1
description: Prior exact DWP output in the same SYS Stable Datum lineage as one proposed retained replacement output.
parameters:
  - {name: prior_plan, kind: revision, types: [DWP]}
  - {name: replacement, kind: revision, types: [SYS]}
result_kind: revision
query:
  from: {relation: incoming-links, of: prior_plan, link: decomposes, emit: source, types: [SYS]}
  as: prior
  where: 'prior.identity.id == replacement.identity.id'
  distinct: true
  order_by: [identity.revision_id]
