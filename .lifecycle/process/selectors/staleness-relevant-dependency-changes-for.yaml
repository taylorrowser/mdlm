kind: selector-definition
id: staleness-relevant-dependency-changes-for
version: 1
description: Typed structural dependency changes that this package requires users to reassess.
parameters:
  - {name: subject, kind: revision}
result_kind: record
record_schema: dependency-change@1
query:
  from:
    selector: dependency-changes-for@1
    arguments: {subject: 'subject'}
  as: change
  where: >-
    change.kind in
    ["content-change", "outbound-link-change", "stable-link-resolution-change",
    "baseline-membership-change", "baseline-composition-change",
    "evidence-target-change", "review-context-change"]
  distinct: true
  order_by: [kind, path, link_type, stable_target]
