kind: selector-definition
id: pilot-verification-implementations-requiring-run
version: 1
description: Current valid pilot implementations whose execution obligations are evaluated.
parameters: []
result_kind: revision
query:
  from: {selector: verification-implementations-requiring-run@1, arguments: {}}
  as: implementation
  where: 'implementation.payload.kind == "pilot"'
  distinct: true
  order_by: [identity.revision_id]
