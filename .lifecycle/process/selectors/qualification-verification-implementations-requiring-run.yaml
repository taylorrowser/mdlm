kind: selector-definition
id: qualification-verification-implementations-requiring-run
version: 1
description: Current valid qualification implementations whose execution obligations are evaluated.
parameters: []
result_kind: revision
query:
  from: {selector: verification-implementations-requiring-run@1, arguments: {}}
  as: implementation
  where: 'implementation.payload.kind == "qualification"'
  distinct: true
  order_by: [identity.revision_id]
