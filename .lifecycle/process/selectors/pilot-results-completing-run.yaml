kind: selector-definition
id: pilot-results-completing-run
version: 2
description: Valid pilot results from one exact run that establish exercised success and discrimination for verification-design suitability.
parameters:
  - {name: run, kind: revision, types: [RUN]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: run, link: produces, emit: target, types: [RES]}
  as: result
  where: >-
    result.payload.claim.kind == "pilot"
    && result.payload.claim.scope == "verification-design"
    && result.payload.claim.outcome == "suitable"
    && result.payload.claim.formal_evidence_eligible == false
    && result.payload.assessment_state in ["recorded", "accepted"]
    && result.payload.observations.expected_success_observed == true
    && result.payload.observations.expected_discrimination_observed == true
    && result.payload.control_judgments.known_good.observation_ref == "known_good"
    && result.payload.control_judgments.known_good.outcome == "pass"
    && result.payload.control_judgments.known_bad.observation_ref == "known_bad"
    && result.payload.control_judgments.known_bad.outcome == "fail"
    && state(result, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
