kind: selector-definition
id: complete-component-level-candidates-for-completion
version: 1
description: Frozen direct component candidates containing exactly one coherent reviewed definition set.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: '"level-candidate"'}
  as: candidate
  where: >-
    completion.payload.target_child_type == "CMP"
    && candidate.payload.scope == completion.identity.revision_id
    && candidate.payload.group == "DEFAULT"
    && every("component-definition-members-for-completion@1", {completion: completion}, member =>
      exists("baseline-contains-definition@1", {baseline: candidate, subject: member}))
    && every("phase-3-level-candidate-definition-members@1", {candidate: candidate}, member =>
      !every("component-definition-members-for-completion@1", {completion: completion}, required => required != member))
    && exists("valid-component-definition-reviews-for-completion@1", {completion: completion})
    && every("valid-component-definition-reviews-for-completion@1", {completion: completion}, review =>
      exists("baseline-contains-evidence@1", {baseline: candidate, subject: review}))
  distinct: true
  order_by: [identity.revision_id]
