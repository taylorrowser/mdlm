kind: selector-definition
id: pilot-assessments-for-context
version: 1
description: Exact valid pilot assessments measuring one frozen pilot evidence context.
parameters:
  - {name: context, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: context, link: measures, emit: source, types: [PAS]}
  as: assessment
  where: 'state(assessment, "validity") == "valid"'
  distinct: true
  order_by: [identity.id, identity.revision]
