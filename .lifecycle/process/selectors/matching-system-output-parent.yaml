kind: selector-definition
id: matching-system-output-parent
version: 1
description: The supplied exact parent lineage when one SYS output canonically derives from it.
parameters:
  - {name: output, kind: revision, types: [SYS]}
  - {name: parent, kind: revision, types: [STK]}
result_kind: revision
query:
  from:
    selector: system-output-parents-for@1
    arguments: {output: output}
  as: linked
  where: 'linked.identity.id == parent.identity.id'
  distinct: true
  order_by: [identity.revision_id]
