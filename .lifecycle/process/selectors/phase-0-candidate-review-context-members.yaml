kind: selector-definition
id: phase-0-candidate-review-context-members
version: 1
description: Exact MAP, PSP, and STK members that must be visible when independently reviewing one Phase 0 intent candidate.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, PSP, STK]}
  as: member
  where: >-
    exists("intent-candidates-matching-subject@1", {subject: subject})
    && exists("candidate-members-matching@1",
      {candidate: one("intent-candidates-matching-subject@1", {subject: subject}), required_member: member})
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
