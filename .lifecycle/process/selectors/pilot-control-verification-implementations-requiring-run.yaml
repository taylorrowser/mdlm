kind: selector-definition
id: pilot-control-verification-implementations-requiring-run
version: 1
description: Current valid prototype-control pilot implementations whose execution obligations are evaluated.
parameters: []
result_kind: revision
query:
  from: {selector: verification-implementations-requiring-run@1, arguments: {}}
  as: implementation
  where: >-
    implementation.payload.kind == "pilot"
    && present(implementation.payload.prototype_control_bindings)
  distinct: true
  order_by: [identity.revision_id]
