kind: selector-definition
id: lower-level-decomposition-outputs-for
version: 1
description: Typed adapter for exact current CMP or DES outputs of one lower-level decomposition plan.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: plan, link: decomposes, emit: source, types: [CMP, DES]}
  as: output
  where: >-
    output.identity.type == plan.payload.target_child_type
    && none("newer-revisions-for@1", {subject: output})
  distinct: true
  order_by: [identity.revision_id]
