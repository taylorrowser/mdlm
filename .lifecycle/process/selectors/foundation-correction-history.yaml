kind: selector-definition
id: foundation-correction-history
version: 1
description: Exact lineage, Review corrections, or autonomous Review corrections through one Phase 0 foundation Revision.
parameters:
  - {name: subject, kind: revision, types: [MAP, PSP, STK]}
  - {name: view, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {relation: revisions, of: subject, emit: entity}
  as: revision
  where: >-
    revision.identity.revision <= subject.identity.revision
    && (
      view == "lineage"
      || (
        (view == "corrections" || view == "autonomous-corrections")
        && exists("cited-failing-reviews-by-correction@1", {replacement: revision})
        && none("cited-gate-rejections-by-correction@1", {replacement: revision})
        && (view != "autonomous-corrections"
          || none("foundation-correction-decisions-for@1",
            {replacement: revision}))
      )
    )
  distinct: true
  order_by: [identity.revision]
