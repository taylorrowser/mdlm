kind: selector-definition
id: accepted-component-baselines-for-design-candidate
version: 1
description: Exact frozen component acceptance baselines mechanically promoted after one reviewed and approved design candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: accepted
  where: >-
    accepted.payload.kind == "level-accepted"
    && accepted.payload.role == "accepted"
    && accepted.storage.frozen == true
    && exists("accepted-baseline-promotes-phase-3-candidate-for-design@1",
      {accepted: accepted, design_candidate: candidate})
  distinct: true
  order_by: [identity.revision_id]
