kind: selector-definition
id: phase-3-entry-requirements
version: 1
description: Current exact SYS Revisions contained by an accepted Phase 2 system baseline.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [SYS]}
  as: requirement
  where: >-
    state(requirement, "disposition") == "active"
    && state(requirement, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: requirement})
    && exists("accepted-system-baselines-for-requirement@1",
      {requirement: requirement})
  distinct: true
  order_by: [identity.id, identity.revision]
