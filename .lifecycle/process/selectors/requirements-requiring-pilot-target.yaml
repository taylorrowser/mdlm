kind: selector-definition
id: requirements-requiring-pilot-target
version: 1
description: Current exact Phase 1 requirements with at least one current pilot verification activity.
parameters: []
result_kind: revision
query:
  from:
    selector: current-phase-1-stakeholder-requirements@1
    arguments: {}
  as: requirement
  where: 'exists("pilot-verification-activities-for-requirement@1", {requirement: requirement})'
  distinct: true
  order_by: [identity.id, identity.revision]
