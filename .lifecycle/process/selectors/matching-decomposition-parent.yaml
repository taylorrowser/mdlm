kind: selector-definition
id: matching-decomposition-parent
version: 1
description: The supplied exact stakeholder parent Revision when one DWP canonically covers it.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: parent, kind: revision, types: [STK]}
result_kind: revision
query:
  from:
    selector: decomposition-parents-for@1
    arguments: {plan: plan}
  as: linked
  where: 'linked.identity.revision_id == parent.identity.revision_id'
  distinct: true
  order_by: [identity.revision_id]
