kind: selector-definition
id: failed-current-pilot-assessments
version: 1
description: Current valid pilot assessments with an immutable failing Review and no corrected Revision.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [PAS]}
  as: assessment
  where: >-
    state(assessment, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: assessment})
    && exists("failing-reviews-for@1", {subject: assessment})
  distinct: true
  order_by: [identity.id, identity.revision]
