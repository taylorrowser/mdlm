kind: selector-definition
id: matching-review-for-subject
version: 1
description: The supplied Review when it exactly judges the supplied subject Revision.
parameters:
  - {name: subject, kind: revision}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from: {relation: incoming-links, of: subject, link: reviews, emit: source, types: [REV]}
  as: candidate
  where: 'candidate == review'
  distinct: true
  order_by: [identity.revision_id]
