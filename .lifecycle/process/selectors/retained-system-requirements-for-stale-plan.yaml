kind: selector-definition
id: retained-system-requirements-for-stale-plan
version: 1
description: Exact consumed-parent SYS Revisions from one stale plan that remain active, valid, and unsuperseded.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from:
    selector: system-requirements-consumed-by@1
    arguments: {consumer: plan}
  as: requirement
  where: >-
    state(requirement, "disposition") == "active"
    && state(requirement, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: requirement})
  distinct: true
  order_by: [identity.revision_id]
