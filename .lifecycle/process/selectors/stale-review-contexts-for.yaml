kind: selector-definition
id: stale-review-contexts-for
version: 1
description: Review-context baselines containing the subject whose dependency validity is stale.
parameters:
  - {name: subject, kind: revision}
result_kind: baseline
query:
  from: {relation: baseline-memberships, of: {var: subject}, emit: entity, types: [BSL]}
  as: context
  where: >-
    context.payload.kind == "review-context"
    && state(context, "validity") == "stale"
  distinct: true
  order_by: [identity.revision_id]
