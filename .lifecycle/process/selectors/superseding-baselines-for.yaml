kind: selector-definition
id: superseding-baselines-for
version: 1
description: Valid frozen baselines explicitly superseding one exact baseline revision.
parameters:
  - {name: baseline, kind: baseline, types: [BSL]}
result_kind: baseline
query:
  from: {relation: incoming-links, of: baseline, link: supersedes, emit: source, types: [BSL]}
  as: successor
  where: >-
    successor.storage.frozen == true
    && state(successor, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
