kind: selector-definition
id: reviewed-gate-rejections-affecting-phase-2-candidate
version: 1
description: Reviewed gate rejections that implicate one Phase 2 candidate itself or an exact member held directly or through composition.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: rejection
  where: >-
    rejection.payload.kind == "gate-signoff"
    && rejection.payload.gate_outcome == "reject"
    && state(rejection, "validity") == "valid"
    && exists("passing-reviews-for@1", {subject: rejection})
    && exists("gate-candidates-for-decision@1", {decision: rejection})
    && exists("phase-2-gate-rejection-blockers-for-candidate@1",
      {candidate: candidate, rejection: rejection})
  distinct: true
  order_by: [identity.revision_id]
