kind: selector-definition
id: complete-definition-level-candidates-for-completion
version: 1
description: Frozen direct CMP or DES candidates containing exactly one coherent reviewed definition set, complete formal coverage, and applicable pilot evidence.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: '"level-candidate"'}
  as: candidate
  where: >-
    completion.payload.target_child_type in ["CMP", "DES"]
    && candidate.payload.scope == completion.identity.revision_id
    && candidate.payload.group == "DEFAULT"
    && every("definition-candidate-members-for-completion@1", {completion: completion}, member =>
      exists("baseline-contains-definition@1", {baseline: candidate, subject: member}))
    && every("definition-level-candidate-members@1", {candidate: candidate}, member =>
      !every("definition-candidate-members-for-completion@1", {completion: completion}, required => required != member))
    && every("definition-candidate-evidence-for-completion@1", {completion: completion}, evidence =>
      exists("baseline-contains-evidence@1", {baseline: candidate, subject: evidence}))
    && every("candidate-evidence-members@1", {candidate: candidate}, evidence =>
      !every("definition-candidate-evidence-for-completion@1", {completion: completion}, required => required != evidence))
  distinct: true
  order_by: [identity.revision_id]
