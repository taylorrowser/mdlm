kind: selector-definition
id: candidate-baselines
version: 1
description: Current frozen candidate baseline revisions available for review and gate evaluation.
parameters: []
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.role == "candidate"
    && candidate.storage.frozen == true
    && none("superseding-baselines-for@1", {baseline: candidate})
  distinct: true
  order_by: [payload.scope, payload.group, identity.revision_id]
