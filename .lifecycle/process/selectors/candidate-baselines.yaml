kind: selector-definition
id: candidate-baselines
version: 1
description: Current frozen candidate baseline revisions available for review and gate evaluation.
parameters: []
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where:
    all:
      - compare:
          left: {path: {var: candidate, field: payload.role}}
          operator: eq
          right: {literal: candidate}
      - compare:
          left: {path: {var: candidate, field: storage.frozen}}
          operator: eq
          right: {literal: true}
      - none:
          selector: superseding-baselines-for@1
          arguments: {baseline: {var: candidate}}
  distinct: true
  order_by: [payload.scope, payload.group, identity.revision_id]
