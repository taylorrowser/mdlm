kind: selector-definition
id: traceability-affected-change-contexts
version: 1
description: Exact baseline context containing the accepted STK or a promoted-candidate dependent impacted by one bounded Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: context
  where: >-
    context.payload.kind == "review-context"
    && (
      !every("impacted-requirements-for-change@3", {change: change}, requirement =>
        none("baseline-contains-definition@1",
          {baseline: context, subject: requirement}))
      || !every("accepted-intent-candidates-for-change@1", {change: change}, candidate =>
        every("revisions-tracing-subject@1", {subject: candidate}, dependent =>
          none("baseline-contains-definition@1",
            {baseline: context, subject: dependent})))
    )
  distinct: true
  order_by: [identity.revision_id]
