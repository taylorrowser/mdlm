kind: selector-definition
id: complete-level-candidates-for-group
version: 1
description: Frozen level candidates composing one exact group candidate with its shared architecture, interfaces, and strategy.
parameters:
  - {name: group, kind: baseline, types: [BSL]}
  - {name: completion, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: '"level-candidate"'}
  as: candidate
  where: >-
    count("planning-revisions-for-completion@1", {completion: completion}) == 1
    && exists("group-candidate-matches-completion@1",
      {group: group, completion: completion})
    && exists("level-candidate-composes-group@1",
      {candidate: candidate, group: group})
    && count("composed-groups-for-level-candidate@1", {candidate: candidate}) == 1
    && none("unexpected-level-candidate-members@1",
      {candidate: candidate, completion: completion})
    && none("baseline-evidence@1", {baseline: candidate})
    && every("architectures-for-decomposition@1",
      {plan: one("planning-revisions-for-completion@1", {completion: completion})},
      architecture => exists("baseline-contains-definition@1",
        {baseline: candidate, subject: architecture}))
    && every("interfaces-for-decomposition@1",
      {plan: one("planning-revisions-for-completion@1", {completion: completion})},
      interface => exists("baseline-contains-definition@1",
        {baseline: candidate, subject: interface}))
    && every("strategies-for-decomposition@1",
      {plan: one("planning-revisions-for-completion@1", {completion: completion})},
      strategy => exists("baseline-contains-definition@1",
        {baseline: candidate, subject: strategy}))
  distinct: true
  order_by: [identity.revision_id]
