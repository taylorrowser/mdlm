kind: selector-definition
id: requirement-parents-for
version: 1
description: Exact direct requirement parents of one STK, SYS, CMP, or DES Revision.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP, DES]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: requirement, link: derived-from, emit: target, types: [PSP, STK, SYS, CMP]}
  as: parent
  where: 'parent.identity.type in ["STK", "SYS", "CMP"]'
  distinct: true
  order_by: [identity.revision_id]
