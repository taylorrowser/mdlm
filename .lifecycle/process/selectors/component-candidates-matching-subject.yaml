kind: selector-definition
id: component-candidates-matching-subject
version: 1
description: The exact Phase 3 component level candidate when the supplied generic Review subject is that candidate.
parameters:
  - {name: subject, kind: revision}
result_kind: baseline
query:
  from: {collection: baselines, types: [BSL]}
  as: candidate
  where: >-
    candidate.payload.kind == "level-candidate"
    && candidate.identity.revision_id == subject.identity.revision_id
    && exists("phase-3-level-candidate-definition-members@1", {candidate: candidate})
  distinct: true
  order_by: [identity.revision_id]
