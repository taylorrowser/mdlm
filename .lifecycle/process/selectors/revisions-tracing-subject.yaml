kind: selector-definition
id: revisions-tracing-subject
version: 1
description: Exact Revisions with an authored outgoing link to the supplied Revision.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: incoming-links, of: subject, emit: source}
  as: revision
  distinct: true
  order_by: [identity.type, identity.revision_id]
