kind: selector-definition
id: applicable-product-acceptance-decisions-for
version: 1
description: Exact reviewed approving product-acceptance Decisions applicable to one complete product scope.
parameters:
  - {name: subject, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from:
    selector: recorded-product-acceptance-decisions-for@1
    arguments: {subject: subject}
  as: decision
  where: >-
    exists("passing-reviews-for@1", {subject: decision})
    && none("failing-reviews-for@1", {subject: decision})
  distinct: true
  order_by: [identity.revision_id]
