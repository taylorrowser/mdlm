kind: selector-definition
id: applicable-product-answer-decisions-for-map
version: 1
description: Reviewed exact answer Decisions for current Questions indexed by one MAP lineage.
parameters:
  - {name: subject, kind: revision, types: [MAP]}
result_kind: revision
query:
  from: {collection: revisions, types: [DEC]}
  as: decision
  where: >-
    !every("current-questions-indexed-by-map@1", {subject: subject}, question =>
      every("applicable-question-answers-for@1", {question: question},
        answer => answer != decision))
  distinct: true
  order_by: [identity.revision_id]
