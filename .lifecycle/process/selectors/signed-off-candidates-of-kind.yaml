kind: selector-definition
id: signed-off-candidates-of-kind
version: 1
description: Current candidates of the requested kind with applicable reviewed gate sign-off.
parameters:
  - {name: baseline_kind, kind: scalar, scalar_type: string}
result_kind: baseline
query:
  from:
    selector: candidate-baselines-of-kind@1
    arguments: {baseline_kind: baseline_kind}
  as: candidate
  where: 'exists("applicable-gate-signoffs-for@1", {candidate: candidate})'
  distinct: true
  order_by: [payload.scope, payload.group, identity.revision_id]
