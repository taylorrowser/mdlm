kind: selector-definition
id: passing-reviewed-formal-implementations-for-activity
version: 1
description: Current complete formal VAI Revisions for one formal VER with passing independent Review.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from:
    selector: complete-formal-implementations-for-activity@1
    arguments: {activity: activity}
  as: implementation
  where: >-
    exists("passing-reviews-for@1", {subject: implementation})
    && none("failing-reviews-for@1", {subject: implementation})
  distinct: true
  order_by: [identity.revision_id]
