kind: selector-definition
id: component-pilot-reviewed-subjects-for-completion
version: 1
description: Exact pilot VER, environment, and source-blind VAI subjects requiring passing Review for one component pilot.
parameters:
  - {name: completion, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [ENV, VER, VAI]}
  as: subject
  where: >-
    !every("representative-component-pilot-activities-for-completion@1", {completion: completion}, activity =>
      activity != subject
      && every("pilot-environments-for-activity@1", {activity: activity}, environment => environment != subject)
      && every("complete-pilot-implementations-for-activity@1", {activity: activity}, implementation => implementation != subject))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
