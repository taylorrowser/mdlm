kind: selector-definition
id: stakeholder-change-candidate-reviews-for
version: 1
description: Fresh passing Reviews of one exact replacement stakeholder intent candidate.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV]}
  as: review
  where: >-
    every("stakeholder-change-candidates-for@1", {change: change}, candidate =>
      exists("matching-passing-review-for@1", {subject: candidate, review: review}))
  distinct: true
  order_by: [identity.revision_id]
