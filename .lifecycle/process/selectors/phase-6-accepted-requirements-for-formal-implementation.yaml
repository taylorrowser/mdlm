kind: selector-definition
id: phase-6-accepted-requirements-for-formal-implementation
version: 1
description: The one exact accepted requirement Revision bound to one current formal implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from:
    selector: requirements-for-pilot-activity@1
    arguments:
      activity: 'one("verification-activities-for-implementation@1", {implementation: implementation})'
  as: requirement
  where: >-
    count("phase-6-design-candidates-for-formal-implementation@1",
      {implementation: implementation}) == 1
    && !every("phase-6-design-candidates-for-formal-implementation@1",
      {implementation: implementation}, candidate =>
        every("phase-6-accepted-requirements-for-design-candidate@1",
          {candidate: candidate}, accepted => accepted != requirement))
  distinct: true
  order_by: [identity.revision_id]
