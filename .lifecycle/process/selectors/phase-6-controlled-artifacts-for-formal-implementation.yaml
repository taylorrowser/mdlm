kind: selector-definition
id: phase-6-controlled-artifacts-for-formal-implementation
version: 1
description: The one current passing-reviewed implementation ART that realizes the accepted design lineage of one formal implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {collection: revisions, types: [ART]}
  as: artifact
  where: >-
    count("phase-6-design-candidates-for-formal-implementation@1",
      {implementation: implementation}) == 1
    && !every("phase-6-design-candidates-for-formal-implementation@1",
      {implementation: implementation}, candidate =>
        every("passing-reviewed-implementation-artifacts-for-design-candidate@1",
          {candidate: candidate}, exact => exact != artifact))
  distinct: true
  order_by: [identity.revision_id]
