kind: selector-definition
id: architectures-for-decomposition
version: 1
description: Exact architecture Revisions allocated by the supplied DWP.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: plan, link: allocated-to, emit: target, types: [ASP]}
  as: architecture
  distinct: true
  order_by: [identity.revision_id]
