kind: selector-definition
id: non-map-foundation-review-failures-at-stage
version: 1
description: Current PSP and STK foundation failures at one correction-authority stage.
parameters:
  - {name: stage, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {collection: revisions, types: [PSP, STK]}
  as: subject
  where: >-
    !every("foundation-review-failures-at-stage@1", {stage: stage}, failure =>
      failure != subject)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
