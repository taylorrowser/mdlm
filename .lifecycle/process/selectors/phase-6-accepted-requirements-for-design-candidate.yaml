kind: selector-definition
id: phase-6-accepted-requirements-for-design-candidate
version: 1
description: Every exact STK, SYS, CMP, and DES Revision in the accepted ancestry with one current passing-reviewed formal activity.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [STK, SYS, CMP, DES]}
  as: requirement
  where: >-
    count("accepted-design-baselines-for-candidate@1", {candidate: candidate}) == 1
    && !every("formal-activities-for-phase-5-candidate@1", {candidate: candidate}, activity =>
      every("requirements-for-pilot-activity@1", {activity: activity}, exact =>
        exact != requirement))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
