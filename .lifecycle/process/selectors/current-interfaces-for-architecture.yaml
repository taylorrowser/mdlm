kind: selector-definition
id: current-interfaces-for-architecture
version: 1
description: Current valid interface contracts defined for one exact architecture Revision.
parameters:
  - {name: architecture, kind: revision, types: [ASP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: architecture, link: defines-interface-for, emit: source, types: [ICSP]}
  as: interface
  where: >-
    interface.payload.architecture_revision == architecture.identity.revision_id
    && state(interface, "disposition") == "active"
    && state(interface, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: interface})
  distinct: true
  order_by: [identity.id, identity.revision]
