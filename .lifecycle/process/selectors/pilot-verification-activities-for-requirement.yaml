kind: selector-definition
id: pilot-verification-activities-for-requirement
version: 1
description: Current valid pilot activities covering one exact requirement under an applicable exact strategy.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP, DES]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: verifies-revision, emit: source, types: [VER]}
  as: activity
  where: >-
    activity.payload.kind == "pilot"
    && state(activity, "disposition") == "active"
    && state(activity, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: activity})
    && count("strategies-for-verification-activity@1", {activity: activity}) == 1
    && exists("formal-strategies-matching-requirement@1",
      {requirement: requirement,
       strategy: one("strategies-for-verification-activity@1", {activity: activity})})
    && ((requirement.identity.type == "STK"
      && count("pilot-intent-support-for-activity@1", {activity: activity}) == 1
      && one("pilot-intent-support-for-activity@1", {activity: activity}) ==
        one("pilot-intent-support-for-requirement@1", {requirement: requirement}))
    || (requirement.identity.type in ["SYS", "CMP", "DES"]
      && none("pilot-intent-support-for-activity@1", {activity: activity})))
  distinct: true
  order_by: [identity.id, identity.revision]
