kind: selector-definition
id: foundation-correction-decisions-for
version: 1
description: Exact Decisions published as authority evidence for one attended Phase 0 foundation correction.
parameters:
  - {name: replacement, kind: revision, types: [MAP, PSP, STK]}
result_kind: revision
query:
  from: {relation: incoming-links, of: replacement, link: justifies, emit: source, types: [DEC]}
  as: decision
  where: >-
    decision.provenance.scenario == "escalate-foundation-review-correction@3"
    && decision.provenance.scenario == replacement.provenance.scenario
    && decision.payload.kind == "scope"
    && decision.payload.effective_scope == replacement.identity.revision_id
  distinct: true
  order_by: [identity.revision_id]
