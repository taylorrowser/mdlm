kind: selector-definition
id: matching-failing-review-for
version: 1
description: The supplied failing Review when it exactly reviews the supplied subject Revision.
parameters:
  - {name: subject, kind: revision}
  - {name: review, kind: revision, types: [REV]}
result_kind: revision
query:
  from:
    selector: failing-reviews-for@1
    arguments: {subject: subject}
  as: failing_review
  where: 'failing_review == review'
  distinct: true
  order_by: [identity.revision_id]
