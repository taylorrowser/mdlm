kind: selector-definition
id: decomposition-simplification-contexts-for
version: 1
description: The frozen Review Context containing every and only member of the current planning DWP, SYS, ASP, and ICSP set.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: baseline
query:
  from:
    selector: decomposition-review-contexts-for@1
    arguments: {plan: plan}
  as: context
  where: >-
    context.payload.scope == plan.identity.revision_id
    && count("review-context-members@1", {context: context})
      == count("phase-2-definition-members-for-plan@1", {plan: plan})
    && every("phase-2-definition-members-for-plan@1", {plan: plan}, member =>
      exists("review-context-contains-member@1",
        {context: context, required_member: member}))
  distinct: true
  order_by: [identity.revision_id]
