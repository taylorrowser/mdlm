kind: selector-definition
id: structural-initial-product-intent-sources-for-decision
version: 1
description: Exact open product-intent Question structurally resolved by one Decision without Review-derived state.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    relation: revisions
    of: 'one("structural-initial-product-intent-targets-for-decision@1", {decision: decision})'
    emit: entity
    types: [QST]
  as: question
  where: >-
    count("structural-initial-product-intent-targets-for-decision@1",
      {decision: decision}) == 1
    && question.payload.kind == "preferential"
    && question.payload.intent_scope == "product"
    && question.payload.state == "open"
    && question.provenance.scenario == "establish-initial-wayfinding-map@2"
    && question.provenance.process_ref == process.current_ref
    && question.integrity.scenario_execution_valid == true
  distinct: true
  order_by: [identity.revision_id]
