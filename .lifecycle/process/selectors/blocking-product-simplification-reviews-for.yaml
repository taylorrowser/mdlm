kind: selector-definition
id: blocking-product-simplification-reviews-for
version: 1
description: Failed candidate simplification Reviews that name one exact Phase 0 subject as a canonical blocker.
parameters:
  - {name: subject, kind: revision, types: [MAP, PSP, STK, BSL]}
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: subject, link: blocks, emit: source, types: [REV]}
  as: review
  where: >-
    review.payload.review_kind == "simplification-product-definition"
    && review.payload.outcome == "fail"
    && state(review, "validity") == "valid"
    && exists("matching-failing-review-for@1",
      {subject: candidate, review: review})
  distinct: true
  order_by: [identity.revision_id]
