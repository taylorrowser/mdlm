kind: selector-definition
id: blocking-questions-for-decomposition
version: 1
description: Exact open questions whose stored blocks link targets the supplied DWP identity.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: plan, link: blocks, emit: source, types: [QST]}
  as: question
  where: >-
    question.payload.state == "open"
    && none("newer-revisions-for@1", {subject: question})
  distinct: true
  order_by: [identity.id, identity.revision]
