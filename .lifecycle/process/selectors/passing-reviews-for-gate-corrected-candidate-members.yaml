kind: selector-definition
id: passing-reviews-for-gate-corrected-candidate-members
version: 1
description: Passing Reviews for fresh same-lineage corrections of gate-rejected candidate members.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [REV]}
  as: review
  where: >-
    !every("reviewed-gate-rejection-corrections-for-candidate-members@1",
      {candidate: candidate}, member =>
        !exists("matching-passing-review-for@1",
          {subject: member, review: review}))
  distinct: true
  order_by: [identity.revision_id]
