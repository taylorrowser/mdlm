kind: selector-definition
id: phase-2-candidate-member-predecessors-for
version: 1
description: Exact old candidate members preserved unchanged or replaced by a reviewed same-lineage gate Correction.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: replacement_member, kind: revision, types: [SYS, ASP, ICSP, DWP, VSP]}
result_kind: revision
query:
  from:
    selector: candidate-definition-members@1
    arguments: {candidate: candidate}
  as: prior
  where: >-
    (prior == replacement_member
      && none("reviewed-gate-rejections-for-subject@1", {subject: prior}))
    || (prior.identity.id == replacement_member.identity.id
      && exists("matching-reviewed-gate-rejection-correction-for-subject@1",
        {subject: prior, replacement: replacement_member}))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
