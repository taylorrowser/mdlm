kind: selector-definition
id: foundation-review-escalations
version: 1
description: Current Phase 0 foundation failures requiring immediate stakeholder attention because intent is stakeholder-owned or autonomous correction is exhausted.
parameters: []
result_kind: revision
query:
  from:
    selector: failed-phase-0-foundation-revisions@1
    arguments: {}
  as: subject
  where: >-
    exists("stakeholder-owned-failing-reviews-for@1", {subject: subject})
    || count("correction-revisions-through@1", {subject: subject}) >= 2
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
