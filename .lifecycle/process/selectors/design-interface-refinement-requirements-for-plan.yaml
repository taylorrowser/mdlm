kind: selector-definition
id: design-interface-refinement-requirements-for-plan
version: 1
description: Exact DES outputs declaring an externally observable contract change for one design plan.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: incoming-links, of: plan, link: decomposes, emit: source, types: [DES]}
  as: design
  where: >-
    design.payload.interface_effect == "changed"
    && none("newer-revisions-for@1", {subject: design})
  distinct: true
  order_by: [identity.revision_id]
