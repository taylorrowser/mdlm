kind: selector-definition
id: unincorporated-product-questions-for-foundation-subject
version: 1
description: Current answered product Questions whose reviewed exact answer authority is not incorporated by one affected foundation Revision.
parameters:
  - {name: subject, kind: revision, types: [MAP, PSP, STK]}
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: question
  where: >-
    question.payload.intent_scope == "product"
    && question.payload.state == "answered"
    && none("newer-revisions-for@1", {subject: question})
    && !every("blocked-targets-for-question@1", {question: question}, target =>
      target.identity.id != subject.identity.id)
    && exists("applicable-question-answers-for@1", {question: question})
    && !every("applicable-question-answers-for@1", {question: question}, decision =>
      !every("incorporated-product-answer-decisions-for-foundation-subject@1",
        {subject: subject}, incorporated => incorporated != decision))
  distinct: true
  order_by: [identity.revision_id]
