kind: selector-definition
id: question-blocked-targets-for-decision
version: 1
description: Current exact foundation Revisions named by the answered Question governed by one scope Decision.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from: {collection: revisions, types: [PSP, STK]}
  as: target
  where: >-
    count("question-targets-for-decision@1", {decision: decision}) == 1
    && none("newer-revisions-for@1", {subject: target})
    && !every("blocked-targets-for-question@1",
      {question: one("question-targets-for-decision@1", {decision: decision})},
      blocked => blocked.identity.id != target.identity.id)
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
