kind: selector-definition
id: unexpected-pilot-assessment-context-members
version: 1
description: Definition members in a pilot assessment context that are not complete current Phase 2 level candidates.
parameters:
  - {name: context, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: context, emit: entity}
  as: member
  where: >-
    member.identity.type != "BSL"
    || none("matching-complete-phase-2-level-revision@1", {candidate: member})
  distinct: true
  order_by: [identity.revision_id]
