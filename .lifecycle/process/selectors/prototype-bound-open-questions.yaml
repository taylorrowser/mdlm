kind: selector-definition
id: prototype-bound-open-questions
version: 1
description: Latest active open empirical QST revisions that explicitly require exact exploratory prototype evidence.
parameters: []
result_kind: revision
query:
  from:
    selector: open-questions@1
    arguments: {}
  as: question
  where: >-
    question.payload.kind == "empirical"
    && question.payload.resolution_evidence == "prototype"
  distinct: true
  order_by: [identity.id]
