kind: selector-definition
id: gate-rejected-design-requirements
version: 1
description: Current Phase 4 design requirements named by a reviewed gate rejection and lacking correction.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DES]}
  as: design
  where: >-
    state(design, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: design})
    && exists("reviewed-gate-rejections-for-subject@1", {subject: design})
  distinct: true
  order_by: [identity.id, identity.revision]
