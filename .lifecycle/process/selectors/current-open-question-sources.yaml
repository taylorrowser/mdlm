kind: selector-definition
id: current-open-question-sources
version: 1
description: Current active open QST Revisions that require an exact boundary before any same-lineage resolving output.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [QST]}
  as: source
  where: >-
    source.payload.state == "open"
    && none("newer-revisions-for@1", {subject: source})
    && state(source, "disposition") == "active"
  distinct: true
  order_by: [identity.id, identity.revision]
