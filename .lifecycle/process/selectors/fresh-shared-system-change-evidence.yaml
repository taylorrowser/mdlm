kind: selector-definition
id: fresh-shared-system-change-evidence
version: 1
description: Fresh exact Review Context and passing Review evidence for the changed SYS and every serially updated consumer.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {collection: revisions, types: [BSL, REV]}
  as: evidence
  where: >-
    !every("revised-requirements-for-change@3", {change: change}, requirement =>
      evidence != one("valid-review-contexts-for@1", {subject: requirement})
      && evidence != one("passing-reviews-for@1", {subject: requirement}))
    || !every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
      evidence != one("valid-review-contexts-for@1", {subject: consumer})
      && evidence != one("passing-reviews-for@1", {subject: consumer}))
  distinct: true
  order_by: [identity.type, identity.revision_id]
