kind: selector-definition
id: initial-product-intent-sources-for-decision
version: 1
description: Exact package-authored open product-intent Question Revision in the answered target's Stable Datum lineage.
parameters:
  - {name: decision, kind: revision, types: [DEC]}
result_kind: revision
query:
  from:
    relation: revisions
    of: 'one("initial-product-intent-targets-for-decision@1", {decision: decision})'
    emit: entity
    types: [QST]
  as: question
  where: >-
    count("initial-product-intent-targets-for-decision@1", {decision: decision}) == 1
    && question.payload.kind == "preferential"
    && question.payload.intent_scope == "product"
    && question.payload.state == "open"
    && question.provenance.scenario == "establish-initial-wayfinding-map@2"
    && question.provenance.process_ref == process.current_ref
    && question.integrity.scenario_execution_valid == true
    && state(question, "validity") == "valid"
  distinct: true
  order_by: [identity.revision_id]
