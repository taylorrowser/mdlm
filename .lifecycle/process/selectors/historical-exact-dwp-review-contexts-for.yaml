kind: selector-definition
id: historical-exact-dwp-review-contexts-for
version: 1
description: Authentic exact-support planning-DWP Review Contexts frozen by 0.65.0 before the current package was selected.
parameters:
  - { name: subject, kind: revision, types: [DWP] }
result_kind: baseline
query:
  from: { relation: baseline-memberships, of: subject, emit: entity }
  as: context
  where: >-
    subject.payload.stage == "planning"
    && context.identity.type == "BSL"
    && context.payload.kind == "review-context"
    && context.payload.role == "review-context"
    && context.payload.scope == subject.identity.revision_id
    && context.provenance.process_ref == "mdlm-bootstrap@0.65.0#sha256:585b32dad15327e6fc7822cc4ea08c42c14d63301a55b6659b7bfa63297a5c0e"
    && context.payload.snapshot.process_provenance.process_ref == context.provenance.process_ref
    && none("review-context-evidence@1", {context: context})
    && none("composed-baselines-for-review-context@1", {context: context})
    && exists("review-context-contains-member@1",
      {context: context, required_member: subject})
    && every("planning-dwp-review-support-for@1", {plan: subject}, support =>
      exists("review-context-contains-member@1",
        {context: context, required_member: support}))
    && every("review-context-members@1", {context: context}, member =>
      member == subject
      || !every("planning-dwp-review-support-for@1", {plan: subject}, support =>
        support != member))
  distinct: true
  order_by: [identity.id, identity.revision]
