kind: selector-definition
id: completion-interfaces-for-plan
version: 1
description: Exact inherited interface for an unchanged boundary or exact current refined interface for a changed design boundary.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [ICSP]}
  as: interface
  where: >-
    (none("design-interface-refinement-requirements-for-plan@1", {plan: plan})
      && !every("interfaces-for-decomposition@1", {plan: plan},
        inherited => inherited != interface))
    || (exists("design-interface-refinement-requirements-for-plan@1", {plan: plan})
      && !every("current-design-interface-refinements-for-plan@1", {plan: plan},
        refined => refined != interface))
  distinct: true
  order_by: [identity.id, identity.revision]
