kind: selector-definition
id: correctable-definition-completions
version: 1
description: Current CMP or DES completions whose coherent-set Review failed and has no replacement.
parameters: []
result_kind: revision
query:
  from:
    selector: current-decomposition-completions@1
    arguments: {}
  as: completion
  where: >-
    completion.payload.target_child_type in ["CMP", "DES"]
    && exists("failing-reviews-for@1", {subject: completion})
    && none("newer-revisions-for@1", {subject: completion})
  distinct: true
  order_by: [identity.revision_id]
