kind: selector-definition
id: change-evidence-for
version: 1
description: Exact replacement contexts, Reviews, baselines, and verification results authored under one approved Change Request.
parameters:
  - {name: change, kind: revision, types: [CHG]}
result_kind: revision
query:
  from: {relation: incoming-links, of: change, link: changed-under, emit: source, types: [BSL, REV, RES]}
  as: evidence
  distinct: true
  order_by: [identity.type, identity.revision_id]
