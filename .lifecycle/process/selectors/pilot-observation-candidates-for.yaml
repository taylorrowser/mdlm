kind: selector-definition
id: pilot-observation-candidates-for
version: 1
description: The one complete level candidate exactly justified by a durable pilot observation.
parameters:
  - {name: observation, kind: revision, types: [DEC]}
result_kind: baseline
query:
  from: {relation: outgoing-links, of: observation, link: justifies, emit: target, types: [BSL]}
  as: candidate
  where: 'exists("matching-complete-phase-2-level-revision@1", {candidate: candidate})'
  distinct: true
  order_by: [identity.revision_id]
