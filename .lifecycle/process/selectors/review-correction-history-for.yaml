kind: selector-definition
id: review-correction-history-for
version: 1
description: Exact lineage, all evidence-backed corrections, or autonomous evidence-backed corrections through one correctable subject Revision.
parameters:
  - {name: subject, kind: revision}
  - {name: view, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {relation: revisions, of: subject, emit: entity}
  as: revision
  where: >-
    revision.identity.revision <= subject.identity.revision
    && (
      view == "lineage"
      || ((view == "corrections" || view == "autonomous-corrections")
        && (exists("cited-reviews-by-correction@1", {replacement: revision})
          || exists("cited-gate-rejections-by-correction@1",
            {replacement: revision}))
        && (view != "autonomous-corrections"
          || (none("candidate-correction-decisions-for@1", {replacement: revision})
            && none("phase-1-assurance-correction-decisions-for@1",
              {replacement: revision})
            && none("phase-2-correction-decisions-for@1",
              {replacement: revision})
            && none("pilot-assessment-correction-decisions-for@1",
              {replacement: revision}))))
    )
  distinct: true
  order_by: [identity.revision]
