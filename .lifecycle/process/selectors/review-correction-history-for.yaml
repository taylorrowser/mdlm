kind: selector-definition
id: review-correction-history-for
version: 1
description: Exact evidence-backed correction Revisions through one correctable subject Revision.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {relation: revisions, of: subject, emit: entity}
  as: revision
  where: >-
    revision.identity.revision <= subject.identity.revision
    && exists("cited-failing-reviews-by-correction@1", {replacement: revision})
  distinct: true
  order_by: [identity.revision]
