kind: selector-definition
id: review-context-members
version: 1
description: Every exact definition Revision frozen in one Review Context.
parameters:
  - {name: context, kind: revision, types: [BSL]}
result_kind: revision
query:
  from: {relation: baseline-members, of: context, emit: entity}
  as: member
  where: 'true'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
