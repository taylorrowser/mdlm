kind: selector-definition
id: structural-formal-implementations-for-activity
version: 1
description: Exact Scenario-valid current formal VAI Revisions for one formal VER without computed-state or Review dependency.
parameters:
  - {name: activity, kind: revision, types: [VER]}
result_kind: revision
query:
  from: {relation: incoming-links, of: activity, link: realizes, emit: source, types: [VAI]}
  as: implementation
  where: >-
    implementation.payload.kind == "formal"
    && implementation.payload.independence_mode == "source-blind"
    && implementation.integrity.scenario_execution_valid == true
    && none("newer-revisions-for@1", {subject: implementation})
    && count("design-candidates-for-formal-vai@1", {implementation: implementation}) == 1
  distinct: true
  order_by: [identity.id, identity.revision]
