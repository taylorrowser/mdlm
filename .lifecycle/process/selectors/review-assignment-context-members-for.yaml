kind: selector-definition
id: review-assignment-context-members-for
version: 1
description: Exact frozen-context support plus packet-only evidence required to review one substantive Revision.
parameters:
  - {name: subject, kind: revision}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, QST, DEC, ART, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS]}
  as: member
  where: >-
    !every("review-context-members-for@1", {subject: subject}, support =>
      support != member)
    || (exists("intent-candidates-matching-subject@1", {subject: subject})
      && !every("baseline-evidence@1",
        {baseline: one("intent-candidates-matching-subject@1", {subject: subject})}, evidence =>
          evidence != member))
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
