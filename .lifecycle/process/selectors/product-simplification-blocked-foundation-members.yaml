kind: selector-definition
id: product-simplification-blocked-foundation-members
version: 1
description: Current exact Phase 0 foundation Revisions selected for correction by failed simplification evidence.
parameters: []
result_kind: revision
query:
  from:
    selector: phase-0-foundation-members@1
    arguments: {}
  as: subject
  where: 'exists("blocking-product-simplification-reviews-for@1", {subject: subject})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
