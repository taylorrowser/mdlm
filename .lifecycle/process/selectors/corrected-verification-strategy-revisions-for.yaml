kind: selector-definition
id: corrected-verification-strategy-revisions-for
version: 1
description: Valid newer VSP Revisions preserving the exact governed requirement boundary and addressing every and only current failed Review.
parameters:
  - {name: strategy, kind: revision, types: [VSP]}
result_kind: revision
query:
  from: {relation: revisions, of: strategy, emit: entity, types: [VSP]}
  as: replacement
  where: >-
    replacement.identity.revision > strategy.identity.revision
    && state(replacement, "validity") == "valid"
    && every("failing-reviews-for@1", {subject: strategy}, review =>
      exists("matching-corrected-phase-1-assurance-review@1",
        {subject: strategy, replacement: replacement, review: review}))
    && none("unexpected-corrected-phase-1-assurance-reviews@1",
      {subject: strategy, replacement: replacement})
    && count("requirements-governed-by-strategy@1", {strategy: strategy})
      == count("requirements-governed-by-strategy@1", {strategy: replacement})
    && every("requirements-governed-by-strategy@1", {strategy: strategy}, requirement =>
      exists("matching-verification-strategies-for-requirement@1",
        {requirement: requirement, strategy: replacement}))
  distinct: true
  order_by: [identity.revision]
