kind: selector-definition
id: gate-signoff-decisions-for
version: 1
description: Valid gate-signoff decisions linked to one exact frozen candidate, regardless of review completion.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {relation: incoming-links, of: {var: candidate}, link: justifies, emit: source, types: [DEC]}
  as: decision
  where:
    all:
      - compare:
          left: {path: {var: decision, field: payload.kind}}
          operator: eq
          right: {literal: gate-signoff}
      - compare:
          left: {state: {dimension: validity, subject: {var: decision}}}
          operator: eq
          right: {literal: valid}
  distinct: true
  order_by: [identity.revision_id]
