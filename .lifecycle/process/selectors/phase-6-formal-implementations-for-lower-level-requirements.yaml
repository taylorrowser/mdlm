kind: selector-definition
id: phase-6-formal-implementations-for-lower-level-requirements
version: 1
description: Current passing-reviewed formal implementations for the exact direct child requirements of one blocked formal implementation.
parameters:
  - {name: implementation, kind: revision, types: [VAI]}
result_kind: revision
query:
  from: {collection: revisions, types: [VAI]}
  as: child_implementation
  where: >-
    child_implementation.payload.kind == "formal"
    && state(child_implementation, "disposition") == "active"
    && state(child_implementation, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: child_implementation})
    && exists("passing-reviews-for@1", {subject: child_implementation})
    && none("failing-reviews-for@1", {subject: child_implementation})
    && !every("phase-6-accepted-requirements-for-formal-implementation@1",
      {implementation: child_implementation}, child_requirement =>
        every("phase-6-lower-level-requirements-for-formal-implementation@1",
          {implementation: implementation}, required => required != child_requirement))
  distinct: true
  order_by: [identity.revision_id]
