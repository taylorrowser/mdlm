kind: selector-definition
id: open-blocking-questions
version: 1
description: Latest open questions that explicitly block at least one lifecycle concept.
parameters: []
result_kind: revision
query:
  from:
    selector: open-questions@1
    arguments: {}
  as: question
  where: 'exists("blocked-targets-for-question@1", {question: question})'
  distinct: true
  order_by: [identity.id]
