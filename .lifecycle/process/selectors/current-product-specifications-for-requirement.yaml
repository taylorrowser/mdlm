kind: selector-definition
id: current-product-specifications-for-requirement
version: 1
description: Current active product specification Revisions reached by one requirement's Stable derived-from link.
parameters:
  - {name: requirement, kind: revision, types: [MAP, PSP, STK]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: requirement, link: derived-from, emit: target, types: [PSP]}
  as: product_specification
  where: >-
    state(product_specification, "disposition") == "active"
    && none("newer-revisions-for@1", {subject: product_specification})
  distinct: true
  order_by: [identity.id, identity.revision]
