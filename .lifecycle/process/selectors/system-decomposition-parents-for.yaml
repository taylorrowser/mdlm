kind: selector-definition
id: system-decomposition-parents-for
version: 1
description: Exact SYS parents for a CMP-target decomposition, as a typed adapter over the shared parent relation.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: plan, link: decomposes, emit: target, types: [SYS]}
  as: parent
  where: 'plan.payload.target_child_type == "CMP"'
  distinct: true
  order_by: [identity.revision_id]
