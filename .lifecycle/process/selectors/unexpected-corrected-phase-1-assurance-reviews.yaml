kind: selector-definition
id: unexpected-corrected-phase-1-assurance-reviews
version: 1
description: Reviews claimed by a corrected Phase 1 assurance Revision that are not exact failing Reviews of its prior Revision.
parameters:
  - {name: subject, kind: revision, types: [VSP, ENV, VER]}
  - {name: replacement, kind: revision, types: [VSP, ENV, VER]}
result_kind: revision
query:
  from:
    selector: corrected-phase-1-assurance-reviews-for@1
    arguments: {replacement: replacement}
  as: review
  where: 'none("matching-failing-review-for@1", {subject: subject, review: review})'
  distinct: true
  order_by: [identity.revision_id]
