kind: selector-definition
id: component-definition-members-for-candidate
version: 1
description: Typed adapter for exact component definition and verification Revisions held by one Phase 3 candidate.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
result_kind: revision
query:
  from: {collection: revisions, types: [CMP, ASP, ICSP, DWP, VSP, VER]}
  as: member
  where: 'exists("baseline-contains-definition@1", {baseline: candidate, subject: member})'
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
