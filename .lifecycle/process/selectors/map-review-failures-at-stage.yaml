kind: selector-definition
id: map-review-failures-at-stage
version: 1
description: Current MAP failures at one correction-authority stage.
parameters:
  - {name: stage, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {collection: revisions, types: [MAP]}
  as: subject
  where: >-
    !every("foundation-review-failures-at-stage@1", {stage: stage}, failure =>
      failure != subject)
  distinct: true
  order_by: [identity.id, identity.revision]
