kind: selector-definition
id: system-requirements-after-consumer-reevaluation
version: 1
description: Every exact replacement shared SYS plus every unaffected exact shared SYS bound by one consumer.
parameters:
  - {name: consumer, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [SYS]}
  as: requirement
  where: >-
    !every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, replacement =>
      replacement != requirement)
    || (!every("system-requirements-consumed-by@1", {consumer: consumer}, previous =>
        previous != requirement)
      && every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, replacement =>
        replacement.identity.id != requirement.identity.id))
  distinct: true
  order_by: [identity.id, identity.revision]
