kind: selector-definition
id: replacement-strategies-for-stale-plan
version: 1
description: Current exact verification strategy Revisions shared by every stakeholder parent of one stale-support planning DWP.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {collection: revisions, types: [VSP]}
  as: strategy
  where: >-
    state(strategy, "disposition") == "active"
    && state(strategy, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: strategy})
    && every("decomposition-parents-for@1", {plan: plan}, parent =>
      !every("current-strategies-for-decomposition-requirement@1", {requirement: parent}, current =>
        current != strategy))
  distinct: true
  order_by: [identity.revision_id]
