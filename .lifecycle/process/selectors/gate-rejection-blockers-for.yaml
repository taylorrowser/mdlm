kind: selector-definition
id: gate-rejection-blockers-for
version: 1
description: Exact gate rejection blockers classified as permitted candidate scope or unexpected scope.
parameters:
  - {name: candidate, kind: baseline, types: [BSL]}
  - {name: rejection, kind: revision, types: [DEC]}
  - {name: scope, kind: scalar, scalar_type: string}
result_kind: revision
query:
  from: {relation: outgoing-links, of: rejection, link: blocks, emit: target, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, BSL]}
  as: blocker
  where: >-
    (
      scope == "valid"
      && (
        blocker.identity.revision_id == candidate.identity.revision_id
        || (candidate.payload.kind == "intent-level-candidate"
          && exists("baseline-contains-definition@1",
            {baseline: candidate, subject: blocker}))
        || (candidate.payload.kind == "level-candidate"
          && exists("matching-phase-2-candidate-definition-member@1",
            {candidate: candidate, member: blocker}))
      )
    )
    || (
      scope == "unexpected"
      && blocker.identity.revision_id != candidate.identity.revision_id
      && !(candidate.payload.kind == "intent-level-candidate"
        && exists("baseline-contains-definition@1",
          {baseline: candidate, subject: blocker}))
      && !(candidate.payload.kind == "level-candidate"
        && exists("matching-phase-2-candidate-definition-member@1",
          {candidate: candidate, member: blocker}))
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
