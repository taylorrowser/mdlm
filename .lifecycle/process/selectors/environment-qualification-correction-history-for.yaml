kind: selector-definition
id: environment-qualification-correction-history-for
version: 1
description: Autonomous evidence-backed ENV assurance corrections through one exact lineage Revision, whether caused by failed Review or failed qualification.
parameters:
  - {name: subject, kind: revision, types: [ENV]}
result_kind: revision
query:
  from: {relation: revisions, of: subject, emit: entity, types: [ENV]}
  as: revision
  where: >-
    revision.identity.revision <= subject.identity.revision
    && (
      exists("qualification-results-corrected-by-environment@1",
        {replacement: revision})
      || exists("cited-reviews-by-correction@1", {replacement: revision})
    )
    && none("phase-1-assurance-correction-decisions-for@1",
      {replacement: revision})
  distinct: true
  order_by: [identity.revision]
