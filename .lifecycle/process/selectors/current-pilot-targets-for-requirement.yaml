kind: selector-definition
id: current-pilot-targets-for-requirement
version: 1
description: Current valid exact repository-backed or inline control artifacts derived from one requirement Revision.
parameters:
  - {name: requirement, kind: revision, types: [STK, SYS, CMP, DES]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: derived-from, emit: source, types: [ART]}
  as: target
  where: >-
    target.payload.kind in ["implementation", "prototype"]
    && ((present(target.payload.public_interface)
        && target.payload.public_interface.working_directory == "fresh-temporary-directory")
      || (present(target.payload.prototype_controls)
        && count("pilot-verification-activities-for-requirement@1",
          {requirement: requirement}) == 1
        && every("pilot-verification-activities-for-requirement@1",
          {requirement: requirement}, activity =>
            target.payload.prototype_controls.activity_ref
              == activity.identity.revision_id)))
    && state(target, "disposition") == "active"
    && state(target, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: target})
  distinct: true
  order_by: [identity.id, identity.revision]
