kind: selector-definition
id: current-pilot-targets-for-requirement
version: 1
description: Current valid exact controlled artifacts derived from one Phase 1 requirement Revision and declaring both pilot behavior boundaries.
parameters:
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from: {relation: incoming-links, of: requirement, link: derived-from, emit: source, types: [ART]}
  as: target
  where: >-
    target.payload.kind in ["implementation", "prototype"]
    && present(target.payload.public_interface)
    && target.payload.public_interface.working_directory == "fresh-temporary-directory"
    && state(target, "disposition") == "active"
    && state(target, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: target})
  distinct: true
  order_by: [identity.id, identity.revision]
