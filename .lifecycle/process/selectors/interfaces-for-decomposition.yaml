kind: selector-definition
id: interfaces-for-decomposition
version: 1
description: Exact interface Revisions governing the supplied DWP.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
result_kind: revision
query:
  from: {relation: outgoing-links, of: plan, link: governed-by, emit: target, types: [ICSP]}
  as: interface
  distinct: true
  order_by: [identity.revision_id]
