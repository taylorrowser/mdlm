kind: selector-definition
id: decomposition-architecture-matches-requirement
version: 1
description: Current architecture for a requirement only when the DWP payload names its exact Revision.
parameters:
  - {name: plan, kind: revision, types: [DWP]}
  - {name: requirement, kind: revision, types: [STK]}
result_kind: revision
query:
  from:
    selector: current-architectures-for-requirement@1
    arguments: {requirement: requirement}
  as: architecture
  where: 'architecture.identity.revision_id == plan.payload.architecture_context.revision'
  distinct: true
  order_by: [identity.revision_id]
