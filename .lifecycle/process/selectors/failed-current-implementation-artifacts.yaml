kind: selector-definition
id: failed-current-implementation-artifacts
version: 1
description: Current Phase 5 implementation artifacts blocked by an exact failing independent Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [ART]}
  as: implementation
  where: >-
    implementation.payload.kind == "implementation"
    && state(implementation, "disposition") == "active"
    && state(implementation, "validity") == "valid"
    && none("newer-revisions-for@1", {subject: implementation})
    && count("design-candidates-for-implementation-artifact@1",
      {implementation: implementation}) == 1
    && exists("failing-reviews-for@1", {subject: implementation})
  distinct: true
  order_by: [identity.revision_id]
