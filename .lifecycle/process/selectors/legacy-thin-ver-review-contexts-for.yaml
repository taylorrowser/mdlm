kind: selector-definition
id: legacy-thin-ver-review-contexts-for
version: 1
description: Authentic thin VER Review Contexts frozen by the exact 0.60.0, 0.61.0, or 0.62.0 Example Process Package before exact STK and VSP members were required.
parameters:
  - { name: subject, kind: revision, types: [VER] }
result_kind: baseline
query:
  from:
    relation: baseline-memberships
    of: subject
    emit: entity
  as: context
  where: >-
    context.identity.type == "BSL"
    && context.payload.kind == "review-context"
    && context.payload.role == "review-context"
    && context.payload.scope == subject.identity.revision_id
    && context.provenance.process_ref in [
      "mdlm-bootstrap@0.60.0#sha256:f2fbdb67e6915e15293f354c33f22eb732b1da703ad610f4e545990f7b3fa941",
      "mdlm-bootstrap@0.61.0#sha256:fa547ead7a9eb2270b230efb2669996aee87defd9c76634b3017f9e85f5c2746",
      "mdlm-bootstrap@0.62.0#sha256:38b4912e78d4524a5755bd8d5260eba092f4543666315a217bc0782244327ec1"
    ]
    && context.payload.snapshot.process_provenance.process_ref == context.provenance.process_ref
    && every("review-context-members@1", {context: context}, member => member == subject)
    && none("review-context-evidence@1", {context: context})
    && none("composed-baselines-for-review-context@1", {context: context})
  distinct: true
  order_by: [identity.id, identity.revision]
