kind: selector-definition
id: planning-dwp-review-required-revisions
version: 1
description: Review-required exact planning DWP Revisions that need product-definition judgment.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [DWP]}
  as: subject
  where: >-
    !every("review-required-revisions@1", {}, required => required != subject)
    && exists("planning-dwp-matching-subject@1", {subject: subject})
  distinct: true
  order_by: [identity.revision_id]
