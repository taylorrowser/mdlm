kind: selector-definition
id: review-context-subjects
version: 1
description: Review-required Revisions plus planning DWPs that need a frozen preparatory context without a Review.
parameters: []
result_kind: revision
query:
  from: {collection: revisions, types: [MAP, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, BSL, DEC, PRB, CHG, PAS]}
  as: subject
  where: >-
    (phase.id != "phase-2-system-definition"
      || exists("planning-dwp-matching-subject@1", {subject: subject}))
    && ((!every("review-required-revisions@1", {}, required => required != subject)
      && (subject.identity.type != "VAI"
        || subject.payload.kind != "formal"
        || !every("phase-5-formal-vai-review-anchor@1", {}, anchor => anchor != subject)
        || subject.provenance.scenario == "revise-pilot-vai-after-review@3"))
    || (phase.id in ["phase-3-component-definition", "phase-4-design-definition"]
      && subject.identity.type == "DWP"
      && subject.payload.stage == "planning"
      && subject.payload.target_child_type in ["CMP", "DES"]
      && state(subject, "disposition") == "active"
      && state(subject, "validity") == "valid"
      && none("newer-revisions-for@1", {subject: subject}))
    )
  distinct: true
  order_by: [identity.type, identity.id, identity.revision]
