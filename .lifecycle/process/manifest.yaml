    - prompts/resolve-question.md@1
    - prompts/resolve-question-with-prototype.md@1
    - prompts/create-candidate-baseline.md@1
    - prompts/record-gate-signoff.md@1
    - prompts/define-verification-strategy.md@1
    - prompts/realize-verification-environment.md@1
    - prompts/write-verification-activity.md@1
    - prompts/implement-verification-activity.md@1
    - prompts/execute-verification-run.md@1
    - prompts/define-system-architecture.md@1
    - prompts/define-interface-control-specification.md@1
    - prompts/define-decomposition-work-package.md@1
    - prompts/execute-decomposition-work-package.md@1
    - prompts/simplify-requirement-set.md@1
    - prompts/simplify-architecture-and-interfaces.md@1
    - prompts/complete-decomposition-work-package.md@1
    - prompts/report-problem.md@1
    - prompts/analyze-change-impact.md@1
    - prompts/approve-change-request.md@1
    - prompts/revise-requirement-under-change.md@1
    - prompts/close-change-request.md@1
    - prompts/record-pilot-observation.md@1
    - prompts/prepare-pilot-assessment-context.md@1
    - prompts/assess-phase-0-2-pilot.md@1
    - prompts/decide-pilot-expansion.md@1
  skills:
    - skills/lifecycle-data.md@1
    - skills/wayfinding-map.md@1
    - skills/prototyping.md@1
    - skills/product-specification.md@1
    - skills/requirement-writing.md@1
    - skills/traceability.md@1
    - skills/scope-challenge.md@1
    - skills/baseline-model.md@1
    - skills/contextual-artifact-review.md@1
    - skills/clarification-protocol.md@1
    - skills/gate-protocol.md@1
    - skills/verification-strategy-specification.md@1
    - skills/verification-environments.md@1
    - skills/qualification-verification.md@1
    - skills/verification-writing.md@1
    - skills/verification-activity-implementation.md@1
    - skills/verification-independence.md@1
