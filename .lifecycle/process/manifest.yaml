kind: process-package-manifest
id: mdlm-bootstrap
version: 0.44.0
status: experimental
description: >-
  Typed declarative MDLM bootstrap package for validating kernel-owned envelopes,
  template-composed payloads, source-owned links, relational selectors,
  machine-readable policies, computed states, obligations, Scenario routing, and
  narrow Phase 0 intent, Phase 1 qualification/pilot, Phase 2 system
  decomposition, exact problem/change-control, and reviewed pilot-assessment slices.
kernel_contract:
  id: mdlm-kernel-process-interface
  version: 1
  primitive_catalog_ref: primitives/kernel-v1.yaml@1
  envelope_schema_id: https://mdlm.dev/kernel/process-interface/v1/datum-envelope.schema.json
  envelope_schema_copy: meta/datum-envelope.schema.json
  package_may_override: false
artifact_format:
  media_type: text/markdown
  metadata: yaml-frontmatter
  merged_body_field: body
  payload_field: payload
  encoding: utf-8
references:
  process_asset: '<path>@<positive-integer-version>'
  definition: '<stable-definition-id>@<positive-integer-version>'
  datum_stable: '<TYPE>-<Crockford-Base32-ID>'
  datum_revision: '<stable-id>-r<five-digit-revision>'
  obligation_instance: '<obligation>@<version>:<exact-subject>:<process-ref>'
language:
  expressions: mdlm-expression@1
kernel_capabilities:
  exact-baseline@1:
    type: BSL
compatibility:
  minimum_kernel: 0.2.0
  meta_schema_version: 3
  json_schema_draft: '2020-12'
  unknown_definition_fields: reject
  arbitrary_code_execution: forbidden
  template_inheritance: single-parent-additive
catalog:
  templates: [titled-datum, rationale-bearing, requirement]
  types: [MAP, QST, DEC, ART, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS]
  policies: [dependency-reassessment, review-applicability, waiver-applicability, contextual-review-participation, verification-implementation-participation, question-participation, gate-signoff-participation, consequential-decision-participation, phase-progression-participation]
  states: [maturity, disposition, validity, relationship-overlays, decomposition-status, change-status]
