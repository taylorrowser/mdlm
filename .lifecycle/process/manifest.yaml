kind: process-package-manifest
id: mdlm-bootstrap
version: 0.32.0
status: experimental
description: >-
  Typed declarative MDLM bootstrap package for validating kernel-owned envelopes,
  template-composed payloads, source-owned links, relational selectors,
  machine-readable policies, computed states, obligations, Scenario routing, and
  narrow Phase 0 intent, Phase 1 qualification/pilot, Phase 2 system
  decomposition, exact problem/change-control, and reviewed pilot-assessment slices.
kernel_contract:
  id: mdlm-kernel-process-interface
  version: 1
  primitive_catalog_ref: primitives/kernel-v1.yaml@1
  envelope_schema_id: https://mdlm.dev/kernel/process-interface/v1/datum-envelope.schema.json
  envelope_schema_copy: meta/datum-envelope.schema.json
  package_may_override: false
artifact_format:
  media_type: text/markdown
  metadata: yaml-frontmatter
  merged_body_field: body
  payload_field: payload
  encoding: utf-8
references:
  process_asset: '<path>@<positive-integer-version>'
  definition: '<stable-definition-id>@<positive-integer-version>'
  datum_stable: '<TYPE>-<Crockford-Base32-ID>'
  datum_revision: '<stable-id>-r<five-digit-revision>'
  obligation_instance: '<obligation>@<version>:<exact-subject>:<process-ref>'
language:
  expressions: mdlm-expression@1
kernel_capabilities:
  exact-baseline@1:
    type: BSL
compatibility:
  minimum_kernel: 0.2.0
  meta_schema_version: 3
  json_schema_draft: '2020-12'
  unknown_definition_fields: reject
  arbitrary_code_execution: forbidden
  template_inheritance: single-parent-additive
catalog:
  templates: [titled-datum, rationale-bearing, requirement]
  types: [MAP, QST, DEC, ART, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS]
  policies: [dependency-reassessment, review-applicability, waiver-applicability]
  states: [maturity, disposition, validity, relationship-overlays, decomposition-status, change-status]
  selectors:
    - review-required-revisions
    - newer-revisions-for
    - open-questions
    - general-open-questions
    - prototype-bound-open-questions
    - superseding-baselines-for
    - candidate-baselines
    - frozen-baselines
    - valid-review-contexts-for
    - stale-review-contexts-for
    - passing-reviews-for
    - failing-reviews-for
    - stale-reviews-for
    - review-required-members-for
    - candidate-members-missing-review
    - blocked-targets-for-question
    - open-blocking-questions
    - baselines-containing-with-role
    - newer-accepted-revisions-for
    - newer-editable-revisions-for
    - applicable-disposition-decisions-for
    - dependency-changes-for
    - staleness-relevant-dependency-changes-for
    - gate-signoff-decisions-for
    - applicable-gate-signoffs-for
    - candidate-baselines-of-kind
    - signed-off-candidates-of-kind
    - verification-implementations-requiring-run
    - verification-activities-for-implementation
    - environments-for-implementation
    - execution-targets-for-implementation
    - completed-runs-for-implementation
    - passing-qualification-results-for
    - qualification-implementations-for-environment
    - decomposition-plans
    - decomposition-completions-for
    - decomposition-parents-for
    - decomposition-outputs-for
    - unreviewed-decomposition-outputs-for
    - decomposition-review-contexts-for
    - decomposition-simplification-contexts-for
    - matching-decomposition-context-for-output
    - requirement-simplification-reviews-for
    - architecture-simplification-reviews-for
    - blocking-questions-for-decomposition
    - architectures-for-decomposition
    - interfaces-for-decomposition
    - failing-pilot-results
    - problem-reports-for-result
    - open-problem-reports
    - change-requests-for-problem
    - source-problems-for-change
    - reported-evidence-for-problem
    - all-change-requests
    - change-approval-decisions-for
    - impacted-requirements-for-change
    - revised-requirements-for-change
    - change-evidence-for
    - change-closure-decisions-for
    - pilot-assessment-contexts
    - pilot-assessments-for-context
    - all-pilot-assessments
    - pilot-expansion-decisions-for
  obligations:
    - review-context-required
    - passing-review-required
    - open-question-resolution
    - prototype-question-resolution
    - candidate-members-reviewed
    - candidate-gate-signoff
    - verification-run-required
    - decomposition-execution-required
    - decomposition-output-reviews-required
    - decomposition-simplification-required
    - architecture-interface-simplification-required
    - decomposition-completion-required
    - decomposition-parent-coverage-required
    - problem-report-required
    - change-impact-required
    - change-approval-required
    - change-revision-required
    - change-closure-required
    - pilot-assessment-required
    - pilot-expansion-decision-required
  scenarios:
    - chart-wayfinding-map
    - build-exploratory-prototype
    - compile-psp
    - draft-stakeholder-requirements
    - derive-system-requirements
    - create-review-context
    - review-datum-in-context
    - resolve-question
    - resolve-question-with-prototype
    - create-candidate-baseline
    - record-gate-signoff
    - define-verification-strategy
    - realize-verification-environment
    - write-verification-activity
    - implement-verification-activity
    - execute-verification-run
    - define-system-architecture
    - define-interface-control-specification
    - define-decomposition-work-package
    - execute-decomposition-work-package
    - simplify-requirement-set
    - simplify-architecture-and-interfaces
    - complete-decomposition-work-package
    - report-problem
    - analyze-change-impact
    - approve-change-request
    - revise-requirement-under-change
    - close-change-request
    - record-pilot-observation
    - prepare-pilot-assessment-context
    - assess-phase-0-2-pilot
    - decide-pilot-expansion
  phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition, phase-2-pilot-assessment, phase-7-change-control]
  aliases: [question.resolve]
