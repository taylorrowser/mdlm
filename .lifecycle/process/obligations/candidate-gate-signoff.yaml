kind: obligation-definition
id: candidate-gate-signoff
version: 3
description: A current candidate requires exact reviewed gate approval after member Reviews, its package-required candidate judgment, and blocking questions resolve.
phases: [phase-0-wayfinding, phase-2-system-definition, phase-3-component-definition]
for_each: 'select("gate-authorization-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("applicable-gate-signoffs-for@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 400
    when: 'exists("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})'
    reason: The reviewed rejection remains immutable blocking history while exact correction and a superseding candidate return to this same gate.
    blocked_by:
      - obligation: foundation-review-correction-required@5
        subjects: 'select("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate})'
      - obligation: stakeholder-requirement-review-correction-required@1
        subjects: 'select("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate})'
      - obligation: wayfinding-map-review-correction-required@1
        subjects: 'select("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate})'
      - obligation: intent-candidate-review-correction-required@3
        subjects: '[candidate]'
      - obligation: phase-2-candidate-correction-required@1
        subjects: '[candidate]'
  - status: blocked
    priority: 350
    when: >-
      exists("candidate-correction-authorities-requiring-review@1",
        {candidate: candidate})
    reason: A correction Decision relied upon by an exact candidate member awaits a valid passing Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: >-
          select("candidate-correction-authorities-requiring-review@1",
            {candidate: candidate})
  - status: blocked
    priority: 300
    when: >-
      exists("gate-signoff-decisions-for@1", {candidate: candidate})
      && none("applicable-gate-signoffs-for@1", {candidate: candidate})
    reason: A gate sign-off decision awaits review; its individual review obligations must resolve before the gate evidence is applicable.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("gate-signoff-decisions-for@1", {candidate: candidate})'
  - status: blocked
    priority: 200
    when: >-
      exists("candidate-members-missing-review@1", {candidate: candidate})
      || none("passing-reviews-for@1", {subject: candidate})
      || exists("failing-reviews-for@1", {subject: candidate})
      || exists("candidate-correction-authorities-requiring-review@1",
        {candidate: candidate})
      || exists("open-blocking-questions@1", {})
      || (
        candidate.payload.kind == "level-candidate"
        && none("phase-3-level-candidate-definition-members@1", {candidate: candidate})
        && every("candidates-with-suitable-representative-pilot@1", {}, ready =>
          ready != candidate)
      )
      || (
        candidate.payload.kind == "intent-level-candidate"
        && exists("open-phase-0-gate-product-questions@1", {})
      )
    reason: Candidate reviews, member reviews, or blocking questions remain unresolved.
    blocked_by:
      - obligation: candidate-members-reviewed@2
        subjects: '[candidate]'
      - obligation: passing-review-required@2
        subjects: '[candidate]'
      - obligation: open-question-resolution@3
        subjects: 'select("open-blocking-questions@1", {})'
      - obligation: prototype-question-resolution@1
        subjects: 'select("open-blocking-questions@1", {})'
      - obligation: open-question-resolution@3
        subjects: 'select("open-phase-0-gate-product-questions@1", {})'
  - status: ready
    priority: 100
    when: >-
      none("candidate-members-missing-review@1", {candidate: candidate})
      && exists("passing-reviews-for@1", {subject: candidate})
      && none("failing-reviews-for@1", {subject: candidate})
      && none("candidate-correction-authorities-requiring-review@1",
        {candidate: candidate})
      && none("open-blocking-questions@1", {})
      && (
        candidate.payload.kind != "level-candidate"
        || exists("phase-3-level-candidate-definition-members@1", {candidate: candidate})
        || !every("candidates-with-suitable-representative-pilot@1", {}, ready =>
          ready != candidate)
      )
      && (
        candidate.payload.kind != "intent-level-candidate"
        || none("open-phase-0-gate-product-questions@1", {})
      )
    reason: The exact frozen candidate is ready for an explicit gate decision.
default_status: blocked
resolve_with:
  scenario: record-gate-signoff@3
  inputs:
    candidate: candidate
waiver_policy_ref: waiver-applicability@1
