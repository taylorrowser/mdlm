kind: obligation-definition
id: candidate-gate-signoff
version: 2
description: A current candidate requires exact reviewed gate approval after member and candidate reviews pass and blocking questions close.
phases: [phase-0-wayfinding, phase-2-system-definition]
for_each: 'select("candidate-baselines@1", {})'
subject_as: candidate
satisfied_when: 'exists("applicable-gate-signoffs-for@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 300
    when: >-
      exists("gate-signoff-decisions-for@1", {candidate: candidate})
      && none("applicable-gate-signoffs-for@1", {candidate: candidate})
    reason: A gate sign-off decision awaits review; its individual review obligations must resolve before the gate evidence is applicable.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("gate-signoff-decisions-for@1", {candidate: candidate})'
  - status: blocked
    priority: 200
    when: >-
      exists("candidate-members-missing-review@1", {candidate: candidate})
      || none("passing-reviews-for@1", {subject: candidate})
      || exists("open-blocking-questions@1", {})
    reason: Candidate reviews, member reviews, or blocking questions remain unresolved.
    blocked_by:
      - obligation: candidate-members-reviewed@2
        subjects: '[candidate]'
      - obligation: passing-review-required@2
        subjects: '[candidate]'
      - obligation: open-question-resolution@2
        subjects: 'select("open-blocking-questions@1", {})'
      - obligation: prototype-question-resolution@1
        subjects: 'select("open-blocking-questions@1", {})'
  - status: ready
    priority: 100
    when: >-
      none("candidate-members-missing-review@1", {candidate: candidate})
      && exists("passing-reviews-for@1", {subject: candidate})
      && none("open-blocking-questions@1", {})
    reason: The exact frozen candidate is ready for an explicit gate decision.
default_status: blocked
resolve_with:
  scenario: record-gate-signoff@2
  inputs:
    candidate: candidate
waiver_policy_ref: waiver-applicability@1
