kind: obligation-definition
id: system-acceptance-required
version: 1
description: Every exact reviewed and approved Phase 2 level candidate requires one mechanical accepted baseline before progression.
phases: [phase-2-system-definition]
for_each: 'select("complete-phase-2-level-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("accepted-system-baselines-for-candidate@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 200
    when: 'none("applicable-gate-signoffs-for@1", {candidate: candidate})'
    reason: Acceptance waits for the exact candidate, every member, the gate Decision, and its independent Review to pass.
    blocked_by:
      - obligation: candidate-gate-signoff@3
        subjects: '[candidate]'
      - obligation: passing-review-required@2
        subjects: '[candidate]'
  - status: ready
    priority: 100
    when: >-
      exists("passing-reviews-for@1", {subject: candidate})
      && none("candidate-members-missing-review@1", {candidate: candidate})
      && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
    reason: Mechanical publication can now freeze the exact flattened system definition and reviewed gate authority as accepted lifecycle evidence.
default_status: blocked
resolve_with:
  scenario: accept-phase-2-system@1
  inputs:
    candidate: candidate
    definition_members: 'select("phase-2-level-candidate-definition-members@1", {candidate: candidate})'
    evidence: 'select("level-acceptance-evidence-for-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
