kind: obligation-definition
id: decomposition-output-reviews-required
version: 1
description: Every exact SYS output of a DWP plan requires valid passing contextual Review evidence.
phases: [phase-2-system-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: >-
  exists("decomposition-outputs-for@1", {plan: plan})
  && none("unreviewed-decomposition-outputs-for@1", {plan: plan})
status_rules:
  - status: blocked
    priority: 200
    when: 'none("decomposition-outputs-for@1", {plan: plan})'
    reason: Output review waits for exact decomposition outputs.
    blocked_by:
      - obligation: decomposition-execution-required@1
        subjects: '[plan]'
  - status: awaiting-review
    priority: 100
    when: 'exists("unreviewed-decomposition-outputs-for@1", {plan: plan})'
    reason: One or more exact decomposition outputs still require contextual Review.
default_status: blocked
resolve_with:
  scenario: review-datum-in-context@3
  dispatch:
    for_each: 'select("unreviewed-decomposition-outputs-for@1", {plan: plan})'
    as: output
  inputs:
    subject: output
    review_context: 'one("valid-review-contexts-for@1", {subject: output})'
    context_members: 'select("review-context-members-for@1", {subject: output})'
waiver_policy_ref: waiver-applicability@1
