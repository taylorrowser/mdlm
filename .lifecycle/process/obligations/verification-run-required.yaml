kind: obligation-definition
id: verification-run-required
version: 2
description: Every qualification implementation requires a completed exact run, while every pilot implementation requires a completed run with exercised success and discrimination evidence.
phases: [phase-1-product-assurance]
for_each: 'select("verification-implementations-requiring-run@1", {})'
subject_as: implementation
satisfied_when: >-
  (implementation.payload.kind == "qualification"
    && exists("completed-runs-for-implementation@1", {implementation: implementation}))
  || (implementation.payload.kind == "pilot"
    && exists("exercised-pilot-runs-for-implementation@2", {implementation: implementation}))
status_rules:
  - status: blocked
    priority: 400
    when: >-
      implementation.payload.kind == "pilot"
      && none("passing-qualification-results-for@1",
        {environment: one("environments-for-implementation@1", {implementation: implementation})})
    reason: Pilot execution is blocked until an exact passing environment-capability qualification result exists.
    blocked_by:
      - obligation: verification-run-required@2
        subjects: >-
          select("qualification-implementations-for-environment@1",
            {environment: one("environments-for-implementation@1", {implementation: implementation})})
  - status: awaiting-review
    priority: 300
    when: >-
      implementation.payload.kind == "pilot"
      && none("passing-reviews-for@1",
        {subject: one("environments-for-implementation@1", {implementation: implementation})})
    reason: The qualified environment must pass contextual review before pilot use.
    blocked_by:
      - obligation: phase-1-assurance-review-required@1
        subjects: 'select("environments-for-implementation@1", {implementation: implementation})'
  - status: awaiting-review
    priority: 200
    when: >-
      implementation.payload.kind == "pilot"
      && (none("passing-reviews-for@1", {subject: implementation})
      || none("passing-reviews-for@1",
        {subject: one("verification-activities-for-implementation@1", {implementation: implementation})}))
    reason: The source-independent pilot activity and its implementation require independent review before execution.
    blocked_by:
      - obligation: phase-1-assurance-review-required@1
        subjects: '[implementation]'
      - obligation: phase-1-assurance-review-required@1
        subjects: 'select("verification-activities-for-implementation@1", {implementation: implementation})'
  - status: ready
    priority: 100
    when: 'implementation.payload.kind in ["qualification", "pilot"]'
    reason: Exact activity, environment, target, and independence provenance permit a bounded execution; completed inconclusive pilot attempts remain durable evidence but do not prevent a fresh attempt.
default_status: blocked
resolve_with:
  scenario: execute-verification-run@2
  inputs:
    implementation: implementation
    activity: 'one("verification-activities-for-implementation@1", {implementation: implementation})'
    environment: 'one("environments-for-implementation@1", {implementation: implementation})'
    execution_target: 'one("execution-targets-for-implementation@1", {implementation: implementation})'
waiver_policy_ref: waiver-applicability@1
