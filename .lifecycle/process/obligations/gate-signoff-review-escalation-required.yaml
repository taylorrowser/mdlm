kind: obligation-definition
id: gate-signoff-review-escalation-required
version: 1
description: A Phase 0 gate Decision still failing after two attended causal replacements requires explicit exhausted-lineage escalation.
phases: [phase-0-wayfinding]
for_each: 'select("exhausted-gate-signoff-review-failures@1", {})'
subject_as: decision
satisfied_when: 'exists("valid-gate-signoff-replacements-for@1", {decision: decision})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("valid-gate-signoff-replacements-for@1", {decision: decision})'
    reason: The gate Decision correction budget is exhausted; all exact Reviews and findings require renewed stakeholder judgment.
default_status: ready
resolve_with:
  scenario: escalate-gate-signoff-review-correction@1
  inputs:
    decision: decision
    candidate: 'one("gate-candidates-for-decision@1", {decision: decision})'
    prior_failed_reviews: 'select("cited-failing-reviews-by-correction@1", {replacement: decision})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: decision})'
waiver_policy_ref: waiver-applicability@1
