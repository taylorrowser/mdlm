kind: obligation-definition
id: pilot-target-required
version: 1
description: Every current Phase 1 requirement with pilot activity work needs one unambiguous exact runnable target.
phases: [phase-1-product-assurance]
for_each: 'select("requirements-requiring-pilot-target@1", {})'
subject_as: requirement
satisfied_when: 'count("current-pilot-targets-for-requirement@1", {requirement: requirement}) == 1'
status_rules:
  - status: blocked
    priority: 200
    when: 'count("current-pilot-targets-for-requirement@1", {requirement: requirement}) > 1'
    reason: Multiple current exact ART targets are ambiguous and require an explicit disposition before pilot implementation.
  - status: awaiting-review
    priority: 150
    when: >-
      none("current-pilot-targets-for-requirement@1", {requirement: requirement})
      && every("pilot-verification-activities-for-requirement@1",
        {requirement: requirement}, activity =>
          none("passing-reviews-for@1", {subject: activity}))
    reason: Disposable pilot controls wait for independent Review of the exact VER they will exercise.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("pilot-verification-activities-for-requirement@1", {requirement: requirement})'
  - status: ready
    priority: 100
    when: >-
      none("current-pilot-targets-for-requirement@1", {requirement: requirement})
      && every("pilot-verification-activities-for-requirement@1",
        {requirement: requirement}, activity =>
          exists("passing-reviews-for@1", {subject: activity}))
    reason: The reviewed pilot activity needs one disposable good/bad control target.
default_status: blocked
resolve_with:
  scenario: build-pilot-control-prototype@1
  inputs:
    requirement: requirement
    activity: 'one("pilot-verification-activities-for-requirement@1", {requirement: requirement})'
waiver_policy_ref: waiver-applicability@1
