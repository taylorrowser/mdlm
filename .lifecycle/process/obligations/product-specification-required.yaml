kind: obligation-definition
id: product-specification-required
version: 1
description: The current Phase 0 requires one product specification after wayfinding begins.
phases: [phase-0-wayfinding]
for_each: '[phase]'
subject_as: required_phase
satisfied_when: 'exists("current-product-specifications@1", {})'
status_rules:
  - status: blocked
    priority: 200
    when: 'none("current-wayfinding-maps@1", {})'
    reason: Product specification waits for the initial wayfinding frontier.
    blocked_by:
      - obligation: initial-wayfinding-map-required@1
        subjects: '[required_phase]'
  - status: ready
    priority: 100
    when: 'exists("current-wayfinding-maps@1", {})'
    reason: The wayfinding frontier is ready to compile into product intent.
default_status: blocked
resolve_with:
  scenario: compile-psp@2
  inputs: {}
waiver_policy_ref: waiver-applicability@1
