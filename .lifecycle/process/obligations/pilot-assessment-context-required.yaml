kind: obligation-definition
id: pilot-assessment-context-required
version: 1
description: The pilot-assessment Phase requires one exact frozen boundary containing every complete level candidate and durable observation.
phases: [phase-2-pilot-assessment]
for_each: '[phase]'
subject_as: assessment_phase
satisfied_when: 'exists("complete-pilot-assessment-contexts@1", {})'
status_rules:
  - status: blocked
    priority: 200
    when: >-
      none("complete-phase-2-level-candidates@1", {})
      || count("phase-2-entry-requirements@1", {}) != count("complete-phase-2-requirements@1", {})
      || !every("complete-phase-2-level-candidates@1", {}, candidate =>
        count("pilot-observations-for-candidate@1", {candidate: candidate}) == 1)
    reason: The assessment boundary waits for complete Phase 2 scope and one exact observation per complete level candidate.
    blocked_by:
      - obligation: pilot-observation-required@1
        subjects: 'select("complete-phase-2-level-candidates@1", {})'
  - status: ready
    priority: 100
    when: >-
      exists("complete-phase-2-level-candidates@1", {})
      && count("phase-2-entry-requirements@1", {}) == count("complete-phase-2-requirements@1", {})
      && every("complete-phase-2-level-candidates@1", {}, candidate =>
        count("pilot-observations-for-candidate@1", {candidate: candidate}) == 1)
    reason: Exact completed Phase 0–2 candidates and observations are ready to freeze as one assessment boundary.
default_status: blocked
resolve_with:
  scenario: prepare-pilot-assessment-context@1
  inputs:
    candidates: 'select("complete-phase-2-level-candidates@1", {})'
    observations: 'select("complete-pilot-observations@1", {})'
waiver_policy_ref: waiver-applicability@1
