kind: obligation-definition
id: change-proposal-correction
version: 1
description: Correct rejected change request
phases:
- phase-0-tiny-product
for_each: select("current-changes@1", {})
subject_as: subject
satisfied_when: 'none("fail-reviews@1", {subject: subject})'
status_rules:
- status: ready
  priority: 110
  when: 'exists("fail-reviews@1", {subject: subject})'
  reason: Stakeholder rejected change scope
default_status: blocked
resolve_with:
  scenario: amend-change@1
  inputs:
    subject: subject
waiver_policy_ref: waiver-applicability@1
