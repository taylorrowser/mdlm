kind: obligation-definition
id: gate-signoff-review-correction-required
version: 1
description: A current gate sign-off Decision with a failed Review requires a stakeholder-authorized replacement in the same lineage and exact candidate scope.
phases: [phase-0-wayfinding]
for_each: 'select("failed-gate-signoff-decisions@1", {})'
subject_as: decision
satisfied_when: 'exists("valid-gate-signoff-replacements-for@1", {decision: decision})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("valid-gate-signoff-replacements-for@1", {decision: decision})'
    reason: The failed gate Decision Review requires a corrected exact Decision Revision.
default_status: ready
resolve_with:
  scenario: revise-gate-signoff-after-review@1
  inputs:
    decision: decision
    candidate: 'one("gate-candidates-for-decision@1", {decision: decision})'
waiver_policy_ref: waiver-applicability@1
