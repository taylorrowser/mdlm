kind: obligation-definition
id: gate-signoff-review-correction-required
version: 2
description: A current gate sign-off Decision with a failed Review requires a stakeholder-authorized replacement in the same lineage and exact candidate scope.
phases: [phase-0-wayfinding]
for_each: 'select("failed-gate-signoff-decisions@1", {})'
subject_as: decision
satisfied_when: 'exists("valid-gate-signoff-replacements-for@1", {decision: decision})'
status_rules:
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: decision, view: "corrections"}) >= 2
    reason: Two causal gate Decision replacements failed; renewed stakeholder judgment receives the complete exhausted lineage through the same correction interface.
  - status: ready
    priority: 100
    when: 'true'
    reason: The failed gate Decision Review requires renewed exact stakeholder judgment.
default_status: ready
resolve_with:
  scenario: revise-gate-signoff-after-review@2
  inputs:
    decision: decision
    candidate: 'one("gate-candidates-for-decision@1", {decision: decision})'
    lineage: >-
      select("review-correction-history-for@1",
        {subject: decision, view: "lineage"})
    prior_failed_reviews: >-
      select("cited-failing-reviews-by-correction@1", {replacement: decision})
    failed_reviews: 'select("failing-reviews-for@1", {subject: decision})'
waiver_policy_ref: waiver-applicability@1
