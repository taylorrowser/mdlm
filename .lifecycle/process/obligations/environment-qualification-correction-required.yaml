kind: obligation-definition
id: environment-qualification-correction-required
version: 1
description: A current ENV with a failed singular qualification receives causal same-lineage replacement and fresh assurance while its autonomous budget remains, then attended escalation.
phases: [phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("failed-current-environment-qualifications@1", {})'
subject_as: environment
satisfied_when: >-
  exists("corrected-environment-qualification-revisions-for@1",
    {environment: environment})
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: Exact failed qualification evidence requires same-lineage ENV replacement and fresh assurance; the Scenario participation Policy determines autonomous or attended execution.
default_status: ready
resolve_with:
  scenario: revise-environment-after-failed-qualification@1
  inputs:
    environment: environment
    failed_results: >-
      select("failed-qualification-results-for-environment@1",
        {environment: environment})
    strategy: 'one("strategies-for-environment@1", {environment: environment})'
waiver_policy_ref: waiver-applicability@1
