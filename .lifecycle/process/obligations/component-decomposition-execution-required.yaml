kind: obligation-definition
id: component-decomposition-execution-required
version: 1
description: Every current component DWP plan must produce its exact coherent CMP set.
phases: [phase-3-component-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("decomposition-outputs-for@1", {plan: plan})'
status_rules:
  - status: ready
    priority: 100
    when: >-
      exists("valid-review-contexts-for@1", {subject: plan})
      && none("blocking-questions-for-decomposition@1", {plan: plan})
    reason: The exact component decomposition plan is ready to publish its coherent CMP set.
default_status: blocked
resolve_with:
  scenario: execute-component-decomposition-work-package@1
  inputs:
    plan: plan
    parents: 'select("system-decomposition-parents-for@1", {plan: plan})'
    architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
