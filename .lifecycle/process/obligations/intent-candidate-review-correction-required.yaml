kind: obligation-definition
id: intent-candidate-review-correction-required
version: 3
description: A current intent candidate with a failed Review, reviewed gate rejection, or later product-answer foundation change must be rebuilt as a causal superseding exact Revision.
phases: [phase-0-wayfinding]
for_each: 'select("failed-intent-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 350
    when: >-
      exists("unresolved-question-dependencies-for-candidate@1",
        {candidate: candidate})
    reason: Candidate replacement waits for every Question referenced by an exact definition member to receive its applicable authorized disposition.
    blocked_by:
      - obligation: open-question-resolution@3
        subjects: >-
          select("unresolved-question-dependencies-for-candidate@1",
            {candidate: candidate})
  - status: blocked
    priority: 300
    when: >-
      (
        exists("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
        && !every("gate-rejection-blocked-members-for-candidate@1",
          {candidate: candidate}, member =>
            exists("gate-rejection-corrections-for-subject@1", {subject: member}))
      )
      || !every("answer-stale-foundation-members-for-candidate@1",
        {candidate: candidate}, member =>
          exists("newer-revisions-for@1", {subject: member}))
      || (
        exists("product-simplification-reviews-for@1",
          {candidate: candidate, outcome: "fail"})
        && !every("product-simplification-blockers-for-candidate@1",
          {candidate: candidate}, member =>
            exists("newer-revisions-for@1", {subject: member}))
      )
      || exists("phase-0-foundation-members-missing-review@1", {})
    reason: Candidate replacement waits for every exact blocked member correction and fresh passing member Review.
    blocked_by:
      - obligation: foundation-review-correction-required@5
        subjects: 'select("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate})'
      - obligation: foundation-review-correction-required@5
        subjects: 'select("product-simplification-blockers-for-candidate@1", {candidate: candidate})'
      - obligation: foundation-review-correction-required@5
        subjects: >-
          select("answer-stale-foundation-members-for-candidate@1",
            {candidate: candidate})
      - obligation: passing-review-required@2
        subjects: 'select("phase-0-foundation-members-missing-review@1", {})'
  - status: ready
    priority: 250
    when: >-
      !every("product-simplification-reviews-for@1",
        {candidate: candidate, outcome: "fail"}, review =>
          review.payload.simplification.target != candidate.identity.revision_id
          || review.payload.correction_authority == "package-evidence")
    reason: Current blocking simplification evidence requires immediate stakeholder-owned candidate correction without consuming an autonomous cycle.
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: candidate, view: "autonomous-corrections"}) >= 2
    reason: Two autonomous candidate correction cycles failed; the same exact correction interface now requires immediate stakeholder escalation.
  - status: ready
    priority: 100
    when: 'true'
    reason: The candidate is ready for a causal superseding Revision and fresh independent simplification Review.
default_status: blocked
resolve_with:
  scenario: revise-intent-candidate-after-review@3
  inputs:
    candidate: candidate
    definition_members: 'select("phase-0-foundation-members@1", {})'
    member_reviews: 'select("phase-0-foundation-member-reviews@1", {})'
    lineage: >-
      select("review-correction-history-for@1",
        {subject: candidate, view: "lineage"})
    prior_failed_reviews: >-
      select("cited-failing-reviews-by-correction@1", {replacement: candidate})
    failed_reviews: 'select("failing-reviews-for@1", {subject: candidate})'
    gate_rejections: 'select("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})'
    question_dispositions: >-
      select("current-question-dependencies-for-candidate@1",
        {candidate: candidate})
    question_decisions: >-
      select("applicable-question-decisions-for-candidate@1",
        {candidate: candidate})
waiver_policy_ref: waiver-applicability@1
