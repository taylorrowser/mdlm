kind: obligation-definition
id: intent-candidate-review-correction-required
version: 3
description: A current intent candidate with a failed Review or reviewed gate rejection must be rebuilt as a causal superseding exact Revision.
phases: [phase-0-wayfinding]
for_each: 'select("failed-intent-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 300
    when: >-
      exists("failing-reviews-for@1", {subject: candidate})
      && count("review-correction-history-for@1",
        {subject: candidate}) >= 2
    reason: Two autonomous causal candidate replacement cycles failed; attended escalation is required.
    blocked_by:
      - obligation: intent-candidate-review-escalation-required@1
        subjects: '[candidate]'
  - status: blocked
    priority: 200
    when: >-
      exists("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
      && (
        !every("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate}, member =>
          exists("gate-rejection-corrections-for-subject@1", {subject: member}))
        || exists("phase-0-foundation-members-missing-review@1", {})
        || none("phase-0-product-simplification-contexts@1", {})
        || !every("phase-0-product-simplification-contexts@1", {}, context =>
          exists("product-simplification-reviews-for@1",
            {subject_context: context, outcome: "pass"})
          && none("product-simplification-reviews-for@1",
            {subject_context: context, outcome: "fail"}))
      )
    reason: Candidate replacement waits for implicated member correction, fresh passing Reviews, and renewed product-definition simplification.
    blocked_by:
      - obligation: foundation-review-correction-required@5
        subjects: 'select("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate})'
      - obligation: passing-review-required@2
        subjects: 'select("phase-0-foundation-members-missing-review@1", {})'
      - obligation: product-simplification-context-required@1
        subjects: '[phase]'
      - obligation: product-simplification-required@1
        subjects: 'select("phase-0-product-simplification-contexts@1", {})'
  - status: ready
    priority: 100
    when: 'none("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
    reason: The candidate is ready for a corrected superseding Revision.
default_status: blocked
resolve_with:
  scenario: revise-intent-candidate-after-review@3
  inputs:
    candidate: candidate
    definition_members: 'select("phase-0-foundation-members@1", {})'
    prior_failed_reviews: 'select("cited-failing-reviews-by-correction@1", {replacement: candidate})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: candidate})'
    gate_rejections: 'select("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
