kind: obligation-definition
id: intent-candidate-review-correction-required
version: 1
description: A current intent candidate with a failed Review must be rebuilt as a superseding exact Revision.
phases: [phase-0-wayfinding]
for_each: 'select("failed-intent-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
    reason: The failed candidate Review requires a corrected superseding candidate Revision.
default_status: ready
resolve_with:
  scenario: revise-intent-candidate-after-review@1
  inputs:
    candidate: candidate
    definition_members: 'select("phase-0-foundation-members@1", {})'
waiver_policy_ref: waiver-applicability@1
