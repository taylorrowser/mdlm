kind: obligation-definition
id: qualification-verification-run-required
version: 1
description: Qualification implementations require one completed exact environment-capability run.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
for_each: 'select("qualification-verification-implementations-requiring-run@1", {})'
subject_as: implementation
satisfied_when: 'exists("completed-runs-for-implementation@1", {implementation: implementation})'
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: The exact qualification activity, environment, and implementation permit one bounded environment-capability execution.
default_status: blocked
resolve_with:
  scenario: execute-qualification-verification-run@1
  inputs:
    implementation: implementation
    activity: 'one("verification-activities-for-implementation@1", {implementation: implementation})'
    environment: 'one("environments-for-required-run@1", {implementation: implementation})'
    execution_target: 'one("execution-targets-for-required-run@1", {implementation: implementation})'
waiver_policy_ref: waiver-applicability@1
