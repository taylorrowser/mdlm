kind: obligation-definition
id: change-revision-required
version: 2
description: Every approved accepted-STK Change Request requires one exact same-lineage replacement first in original-V order; other dispositions close without replacement.
phases: [phase-7-change-control]
for_each: 'select("all-change-requests@1", {})'
subject_as: change
satisfied_when: >-
  exists("revised-requirements-for-change@2", {change: change})
  || exists("terminal-change-disposition-decisions-for@1", {change: change})
status_rules:
  - status: blocked
    priority: 200
    when: >-
      none("change-approval-decisions-for@2", {change: change})
      && none("terminal-change-disposition-decisions-for@1", {change: change})
    reason: Exact reviewed attended disposition is required before accepted intent can change.
    blocked_by:
      - obligation: change-approval-required@2
        subjects: '[change]'
  - status: ready
    priority: 100
    when: 'exists("change-approval-decisions-for@2", {change: change})'
    reason: Replace the exact accepted STK in the same lineage before fresh context, Review, and candidate evidence.
default_status: blocked
resolve_with:
  scenario: revise-requirement-under-change@2
  inputs:
    change: change
    requirement: 'one("impacted-requirements-for-change@2", {change: change})'
    approval: 'one("change-approval-decisions-for@2", {change: change})'
waiver_policy_ref: waiver-applicability@1
