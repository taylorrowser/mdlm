kind: obligation-definition
id: change-revision-required
version: 1
description: Every approved Change Request requires its affected requirement to be revised first in original-V order.
phases: [phase-7-change-control]
for_each: 'select("all-change-requests@1", {})'
subject_as: change
satisfied_when: 'exists("revised-requirements-for-change@1", {change: change})'
status_rules:
  - status: blocked
    priority: 200
    when: 'none("change-approval-decisions-for@1", {change: change})'
    reason: Exact approval is required before affected lifecycle data may be revised.
    blocked_by:
      - obligation: change-approval-required@1
        subjects: '[change]'
  - status: ready
    priority: 100
    when: 'exists("change-approval-decisions-for@1", {change: change})'
    reason: Revise the affected requirement before replacement context, Review, baseline, and verification evidence.
default_status: blocked
resolve_with:
  scenario: revise-requirement-under-change@1
  inputs:
    change: change
    requirement: 'one("impacted-requirements-for-change@1", {change: change})'
    approval: 'one("change-approval-decisions-for@1", {change: change})'
waiver_policy_ref: waiver-applicability@1
