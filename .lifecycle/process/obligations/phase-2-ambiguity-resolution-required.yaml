kind: obligation-definition
id: phase-2-ambiguity-resolution-required
version: 1
description: Unsupported multiple-current Phase 2 architecture, strategy, or plan choices require exact attended cancellation evidence and independent Review instead of arbitrary selection.
phases: [phase-2-system-definition]
for_each: 'select("ambiguous-phase-2-subjects@1", {})'
subject_as: subject
satisfied_when: >-
  exists("phase-2-ambiguity-decisions-for@1",
    {subject: subject, view: "applicable"})
status_rules:
  - status: blocked
    priority: 200
    when: >-
      exists("phase-2-ambiguity-decisions-for@1",
        {subject: subject, view: "recorded"})
      && none("phase-2-ambiguity-decisions-for@1",
        {subject: subject, view: "applicable"})
    reason: The exact ambiguity cancellation Decision requires fresh independent Review before it changes current selection.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("phase-2-ambiguity-decisions-for@1", {subject: subject, view: "recorded"})'
  - status: ready
    priority: 100
    when: 'true'
    reason: The narrow profile refuses arbitrary cardinality selection; a stakeholder must explicitly cancel this exact competing Revision.
default_status: ready
resolve_with:
  scenario: resolve-phase-2-ambiguity@1
  inputs:
    subject: subject
waiver_policy_ref: waiver-applicability@1
