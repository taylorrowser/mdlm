kind: obligation-definition
id: stakeholder-requirements-required
version: 1
description: Every current Phase 0 product specification requires a smallest sufficient stakeholder requirement set.
phases: [phase-0-wayfinding]
for_each: 'select("current-product-specifications@1", {})'
subject_as: product_specification
satisfied_when: 'exists("stakeholder-requirements-for@1", {product_specification: product_specification})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("stakeholder-requirements-for@1", {product_specification: product_specification})'
    reason: The exact product specification is ready to derive stakeholder-visible commitments.
default_status: ready
resolve_with:
  scenario: draft-stakeholder-requirements@2
  inputs:
    product_specification: product_specification
waiver_policy_ref: waiver-applicability@1
