kind: obligation-definition
id: stakeholder-requirements-required
version: 1
description: Every independently reviewed current Phase 0 product specification requires a smallest sufficient stakeholder requirement set.
phases: [phase-0-wayfinding]
for_each: 'select("current-product-specifications@1", {})'
subject_as: product_specification
satisfied_when: >-
  exists("passing-reviews-for@1", {subject: product_specification})
  && exists("stakeholder-requirements-for@1", {product_specification: product_specification})
status_rules:
  - status: blocked
    priority: 200
    when: 'none("passing-reviews-for@1", {subject: product_specification})'
    reason: Stakeholder requirement derivation waits for a passing independent Review of the exact current product specification so unresolved ambiguity and disproportionate scope do not fan out.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[product_specification]'
  - status: ready
    priority: 100
    when: >-
      exists("passing-reviews-for@1", {subject: product_specification})
      && none("stakeholder-requirements-for@1", {product_specification: product_specification})
    reason: The reviewed exact product specification is ready to derive stakeholder-visible commitments.
default_status: blocked
resolve_with:
  scenario: draft-stakeholder-requirements@2
  inputs:
    product_specification: product_specification
waiver_policy_ref: waiver-applicability@1
