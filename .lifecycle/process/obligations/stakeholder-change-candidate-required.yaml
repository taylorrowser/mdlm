kind: obligation-definition
id: stakeholder-change-candidate-required
version: 1
description: Every approved accepted-requirement replacement requires one fresh selective candidate, including every shared-SYS consumer when applicable.
phases: [phase-7-change-control]
for_each: 'select("all-change-requests@1", {})'
subject_as: change
satisfied_when: >-
  exists("stakeholder-change-candidates-for@1", {change: change})
  || exists("terminal-change-disposition-decisions-for@1", {change: change})
status_rules:
  - status: blocked
    priority: 300
    when: 'none("change-approval-decisions-for@2", {change: change})'
    reason: Exact reviewed approval is required before candidate replacement.
    blocked_by:
      - obligation: change-approval-required@2
        subjects: '[change]'
  - status: blocked
    priority: 200
    when: >-
      count("revised-requirements-for-change@3", {change: change}) != 1
      || !every("revised-requirements-for-change@3", {change: change}, requirement =>
        exists("valid-review-contexts-for@1", {subject: requirement})
        && exists("passing-reviews-for@1", {subject: requirement}))
      || count("updated-shared-system-consumers-for-change@1", {change: change})
        != count("shared-system-consumers-for-change@1", {change: change})
      || !every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
        exists("valid-review-contexts-for@1", {subject: consumer})
        && exists("passing-reviews-for@1", {subject: consumer}))
    reason: The replacement and every affected shared-SYS consumer need separate fresh Review evidence.
    blocked_by:
      - obligation: change-revision-required@2
        subjects: '[change]'
      - obligation: shared-system-consumer-reevaluation-required@1
        subjects: 'select("outdated-shared-system-consumers@2", {})'
  - status: ready
    priority: 100
    when: >-
      exists("change-approval-decisions-for@2", {change: change})
      && every("revised-requirements-for-change@3", {change: change}, requirement =>
        exists("passing-reviews-for@1", {subject: requirement}))
      && count("updated-shared-system-consumers-for-change@1", {change: change})
        == count("shared-system-consumers-for-change@1", {change: change})
      && every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
        exists("passing-reviews-for@1", {subject: consumer}))
    reason: Assemble one exact candidate from fresh changed evidence and every unaffected reusable item.
default_status: blocked
resolve_with:
  scenario: create-stakeholder-change-candidate@1
  inputs:
    change: change
    accepted: 'one("accepted-intent-baselines-for-change@1", {change: change})'
    replacement: 'one("revised-requirements-for-change@3", {change: change})'
    updated_consumers: 'select("updated-shared-system-consumers-for-change@1", {change: change})'
    fresh_evidence: 'select("fresh-shared-system-change-evidence@1", {change: change})'
    reusable_definitions: >-
      select("reusable-change-definitions-for@1",
        {change: change, accepted: one("accepted-intent-baselines-for-change@1", {change: change})})
    reusable_evidence: >-
      select("reusable-change-evidence-for@1",
        {change: change, accepted: one("accepted-intent-baselines-for-change@1", {change: change})})
waiver_policy_ref: waiver-applicability@1
