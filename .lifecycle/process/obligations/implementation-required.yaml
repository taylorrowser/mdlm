kind: obligation-definition
id: implementation-required
version: 1
description: implementation required
phases:
- phase-0-tiny-product
for_each: select("current-requirements@1", {})
subject_as: subject
satisfied_when: 'exists("implementations-for@1", {requirements: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("pass-reviews@1", {subject: subject}) && none("fail-reviews@1", {subject: subject}) && none("prior-implementations-for@1",
    {requirements: subject})'
  reason: implementation required
default_status: blocked
resolve_with:
  scenario: implement-product@1
  inputs:
    requirements: subject
waiver_policy_ref: waiver-applicability@1
