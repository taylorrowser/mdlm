kind: obligation-definition
id: component-decomposition-completion-required
version: 1
description: Every component planning DWP with a coherent CMP set requires one same-lineage completion Revision.
phases: [phase-3-component-definition]
for_each: 'select("current-component-decomposition-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("component-completions-for-plan@1", {plan: plan})'
status_rules:
  - status: ready
    priority: 100
    when: >-
      exists("component-outputs-for-plan@1", {plan: plan})
      && none("blocking-questions-for-decomposition@1", {plan: plan})
    reason: The exact component outputs are ready to freeze in the same DWP lineage completion.
default_status: blocked
resolve_with:
  scenario: complete-component-decomposition-work-package@1
  inputs:
    plan: plan
    parents: 'select("component-parents-for-plan@1", {plan: plan})'
    outputs: 'select("component-outputs-for-plan@1", {plan: plan})'
    architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
    verification_strategy: 'one("strategies-for-decomposition@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
