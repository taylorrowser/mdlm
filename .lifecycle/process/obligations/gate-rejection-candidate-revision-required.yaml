kind: obligation-definition
id: gate-rejection-candidate-revision-required
version: 1
description: A reviewed candidate-level rejection requires a same-lineage superseding candidate preserving its exact members and evidence.
phases: [phase-2-system-definition]
for_each: 'select("candidate-baselines@1", {})'
subject_as: candidate
satisfied_when: >-
  candidate.payload.kind == "intent-level-candidate"
  || none("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
  || exists("complete-exact-gate-rejection-replacements-for@1", {candidate: candidate})
status_rules:
  - status: ready
    priority: 100
    when: >-
      exists("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})
      && none("complete-exact-gate-rejection-replacements-for@1", {candidate: candidate})
    reason: Candidate-level gate findings require a superseding exact candidate before fresh Review and return to the same gate.
default_status: blocked
resolve_with:
  scenario: replace-rejected-candidate@1
  inputs:
    candidate: candidate
    rejections: 'select("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
