kind: obligation-definition
id: intent-approval-required
version: 1
description: Every exact reviewed approving Phase 0 gate Decision requires one accepted baseline preserving its candidate and authorization evidence.
phases: [phase-0-wayfinding]
for_each: 'select("signed-off-candidates-of-kind@1", {baseline_kind: "intent-level-candidate"})'
subject_as: candidate
satisfied_when: 'exists("phase-0-intent-approvals-for@1", {candidate: candidate})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("phase-0-intent-approvals-for@1", {candidate: candidate})'
    reason: Reviewed approving gate evidence is ready to freeze the exact accepted intent without another stakeholder decision.
default_status: ready
resolve_with:
  scenario: accept-phase-0-intent@1
  inputs:
    candidate: candidate
    definition_members: >-
      select("candidate-definition-members@1", {candidate: candidate})
    candidate_reviews: >-
      select("product-simplification-reviews-for@1",
        {candidate: candidate, outcome: "pass"})
    gate_signoff: 'one("applicable-gate-signoffs-for@1", {candidate: candidate})'
    signoff_reviews: >-
      select("passing-reviews-for@1", {subject:
        one("applicable-gate-signoffs-for@1", {candidate: candidate})})
waiver_policy_ref: waiver-applicability@1
