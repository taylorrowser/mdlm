kind: obligation-definition
id: interface-control-specification-required
version: 1
description: Every current Phase 2 architecture requires at least one exact normative interface contract.
phases: [phase-2-system-definition]
for_each: 'select("current-phase-2-architectures@1", {})'
subject_as: architecture
satisfied_when: 'count("current-interfaces-for-architecture@1", {architecture: architecture}) == 1'
status_rules:
  - status: blocked
    priority: 200
    when: 'count("current-interfaces-for-architecture@1", {architecture: architecture}) > 1'
    reason: Multiple current interface Revisions are ambiguous and require explicit correction before decomposition can continue.
  - status: ready
    priority: 100
    when: 'count("current-interfaces-for-architecture@1", {architecture: architecture}) == 0'
    reason: The exact architecture is ready for its bounded public interface contract.
default_status: blocked
resolve_with:
  scenario: define-interface-control-specification@2
  inputs:
    architecture: architecture
waiver_policy_ref: waiver-applicability@1
