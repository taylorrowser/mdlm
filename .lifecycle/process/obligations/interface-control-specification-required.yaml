kind: obligation-definition
id: interface-control-specification-required
version: 1
description: Every current Phase 2 architecture requires one or more exact normative interface contracts.
phases: [phase-2-system-definition]
for_each: 'select("current-phase-2-architectures@1", {})'
subject_as: architecture
satisfied_when: 'exists("current-interfaces-for-architecture@1", {architecture: architecture})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("current-interfaces-for-architecture@1", {architecture: architecture})'
    reason: The exact architecture is ready for its bounded public interface contract.
default_status: blocked
resolve_with:
  scenario: define-interface-control-specification@2
  inputs:
    architecture: architecture
waiver_policy_ref: waiver-applicability@1
