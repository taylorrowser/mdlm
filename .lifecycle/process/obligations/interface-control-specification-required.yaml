kind: obligation-definition
id: interface-control-specification-required
version: 1
description: A current Phase 2 architecture with independently controlled boundaries requires an exact normative interface contract covering those boundaries; an architecture without such a boundary requires none.
phases: [phase-2-system-definition]
for_each: 'select("current-phase-2-architectures@1", {})'
subject_as: architecture
satisfied_when: >-
  (architecture.payload.controlled_boundaries == []
    && none("current-interfaces-for-architecture@1", {architecture: architecture}))
  || (architecture.payload.controlled_boundaries != []
    && exists("current-interfaces-for-architecture@1", {architecture: architecture}))
status_rules:
  - status: ready
    priority: 100
    when: >-
      architecture.payload.controlled_boundaries != []
      && none("current-interfaces-for-architecture@1", {architecture: architecture})
    reason: The exact architecture is ready for one contract covering every independently controlled boundary.
default_status: blocked
resolve_with:
  scenario: define-interface-control-specification@2
  inputs:
    architecture: architecture
waiver_policy_ref: waiver-applicability@1
