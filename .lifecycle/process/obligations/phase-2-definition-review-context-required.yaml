kind: obligation-definition
id: phase-2-definition-review-context-required
version: 1
description: Every complete reviewed architecture-wide Phase 2 definition set requires one exact frozen simplification context.
phases: [phase-2-system-definition]
for_each: 'select("architecture-definition-set-representative-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("decomposition-simplification-contexts-for@1", {plan: plan})'
status_rules:
  - status: blocked
    priority: 200
    when: >-
      none("decomposition-outputs-for@1", {plan: plan})
      || exists("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})
    reason: The complete architecture-wide definition set and its ordinary member Reviews must exist first.
    blocked_by:
      - obligation: decomposition-execution-required@1
        subjects: '[plan]'
      - obligation: passing-review-required@2
        subjects: 'select("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})'
  - status: ready
    priority: 100
    when: >-
      exists("decomposition-outputs-for@1", {plan: plan})
      && none("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})
    reason: Materialize the every-and-only architecture-wide simplification context.
default_status: blocked
resolve_with:
  scenario: create-phase-2-definition-review-context@1
  inputs:
    plan: plan
    definition_members: 'select("phase-2-definition-review-context-support-for-plan@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
