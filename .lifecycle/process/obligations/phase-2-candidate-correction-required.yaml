kind: obligation-definition
id: phase-2-candidate-correction-required
version: 1
description: A failed or reviewed-rejected level candidate receives one exact evidence-preserving superseding candidate and fresh Review.
phases: [phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
for_each: 'select("failed-phase-2-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("complete-superseding-phase-2-candidates-for@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 300
    when: >-
      exists("gate-rejected-requirement-members-for-candidate@1", {candidate: candidate})
      && none("reviewed-gate-rejection-corrections-for-candidate-members@1",
        {candidate: candidate})
    reason: Gate-rejected requirement members need same-lineage passing-reviewed corrections before candidate replacement.
    blocked_by:
      - obligation: gate-rejected-design-requirement-correction-required@1
        subjects: 'select("gate-rejected-requirement-members-for-candidate@1", {candidate: candidate})'
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: candidate, view: "autonomous-corrections"}) >= 2
    reason: Two autonomous candidate Correction cycles failed; immediate attended escalation now uses the same exact replacement interface.
  - status: ready
    priority: 100
    when: 'true'
    reason: Preserve unaffected exact candidate membership and evidence while replacing or removing only gate-rejected members and recording every correction cause.
default_status: ready
resolve_with:
  scenario: revise-phase-2-candidate-after-review@2
  inputs:
    candidate: candidate
    definition_members: 'select("candidate-definition-members@1", {candidate: candidate})'
    evidence: 'select("baseline-evidence@1", {baseline: candidate})'
    rejected_members: 'select("gate-rejection-blocked-members-for-candidate@1", {candidate: candidate})'
    corrected_members: 'select("reviewed-gate-rejection-corrections-for-candidate-members@1", {candidate: candidate})'
    corrected_member_reviews: 'select("passing-reviews-for-gate-corrected-candidate-members@1", {candidate: candidate})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: candidate})'
    gate_rejections: 'select("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
