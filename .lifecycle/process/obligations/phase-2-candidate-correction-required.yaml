kind: obligation-definition
id: phase-2-candidate-correction-required
version: 1
description: A failed or reviewed-rejected Phase 2 candidate receives one exact evidence-preserving superseding candidate and fresh Review.
phases: [phase-2-system-definition]
for_each: 'select("failed-phase-2-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("complete-superseding-phase-2-candidates-for@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 300
    when: >-
      exists("unresolved-phase-2-candidate-gate-members@1", {candidate: candidate})
      || exists("unresolved-phase-2-candidate-groups@1", {candidate: candidate})
    reason: Implicated exact members require local Correction and fresh Review, and affected composed groups require reviewed evidence-preserving replacement before this candidate can be rebuilt.
    blocked_by:
      - obligation: phase-2-review-correction-required@1
        subjects: 'select("unresolved-phase-2-candidate-gate-members@1", {candidate: candidate})'
      - obligation: phase-2-candidate-correction-required@1
        subjects: 'select("unresolved-phase-2-candidate-groups@1", {candidate: candidate})'
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: candidate, view: "autonomous-corrections"}) >= 2
    reason: Two autonomous candidate Correction cycles failed; immediate attended escalation now uses the same exact replacement interface.
  - status: ready
    priority: 100
    when: 'true'
    reason: Preserve the exact candidate membership, evidence, and composition while recording its process-significant predecessor and every correction cause.
default_status: ready
resolve_with:
  scenario: revise-phase-2-candidate-after-review@1
  inputs:
    candidate: candidate
    definition_members: 'select("phase-2-replacement-definition-members-for-candidate@1", {candidate: candidate})'
    evidence: 'select("baseline-evidence@1", {baseline: candidate})'
    composed_groups: 'select("phase-2-replacement-composed-groups-for-candidate@1", {candidate: candidate})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: candidate})'
    gate_rejections: 'select("reviewed-gate-rejections-affecting-phase-2-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
