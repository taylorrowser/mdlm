kind: obligation-definition
id: pilot-verification-implementation-required
version: 1
description: Every current pilot activity requires one separately authorized source-independent implementation bound to its exact qualified environment and controlled target.
phases: [phase-1-product-assurance]
for_each: 'select("current-pilot-verification-activities@1", {})'
subject_as: activity
satisfied_when: 'exists("complete-pilot-implementations-for-activity@1", {activity: activity})'
status_rules:
  - status: awaiting-review
    priority: 500
    when: 'none("passing-reviews-for@1", {subject: activity})'
    reason: Independent implementation waits for contextual Review of the exact pilot activity design.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[activity]'
  - status: blocked
    priority: 400
    when: 'count("pilot-environments-for-activity@1", {activity: activity}) != 1'
    reason: Pilot implementation waits for one unambiguous environment realization from the activity's exact strategy.
    blocked_by:
      - obligation: environment-assurance-required@2
        subjects: 'select("strategies-for-verification-activity@1", {activity: activity})'
  - status: awaiting-review
    priority: 300
    when: >-
      count("pilot-environments-for-activity@1", {activity: activity}) == 1
      && none("eligible-pilot-environments-for-activity@1", {activity: activity})
    reason: Pilot implementation waits for passing qualification evidence and independent Review of its exact environment.
    blocked_by:
      - obligation: verification-run-required@1
        subjects: >-
          select("qualification-implementations-for-environment@1",
            {environment: one("pilot-environments-for-activity@1", {activity: activity})})
      - obligation: passing-review-required@2
        subjects: 'select("pilot-environments-for-activity@1", {activity: activity})'
  - status: blocked
    priority: 200
    when: 'count("eligible-pilot-targets-for-activity@1", {activity: activity}) != 1'
    reason: Pilot implementation waits for one unambiguous current exact ART derived from the activity's requirement Revision.
    blocked_by:
      - obligation: pilot-target-required@1
        subjects: 'select("requirements-for-pilot-activity@1", {activity: activity})'
  - status: ready
    priority: 100
    when: >-
      count("eligible-pilot-environments-for-activity@1", {activity: activity}) == 1
      && count("eligible-pilot-targets-for-activity@1", {activity: activity}) == 1
    reason: The exact pilot activity, qualified reviewed environment, and controlled target are ready for separately authorized source-independent implementation.
default_status: blocked
resolve_with:
  scenario: implement-verification-activity@1
  inputs:
    activity: activity
    environment: 'one("eligible-pilot-environments-for-activity@1", {activity: activity})'
    execution_target: 'one("eligible-pilot-targets-for-activity@1", {activity: activity})'
waiver_policy_ref: waiver-applicability@1
