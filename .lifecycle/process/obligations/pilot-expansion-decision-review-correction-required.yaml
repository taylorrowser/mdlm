kind: obligation-definition
id: pilot-expansion-decision-review-correction-required
version: 1
description: A failed pilot-expansion Decision Review requires renewed exact stakeholder judgment before any result applies.
phases: [phase-2-pilot-assessment]
for_each: 'select("all-pilot-assessments@1", {})'
subject_as: assessment
satisfied_when: >-
  none("recorded-pilot-expansion-decisions-for@1", {assessment: assessment})
  || every("recorded-pilot-expansion-decisions-for@1", {assessment: assessment}, decision =>
    none("failing-reviews-for@1", {subject: decision}))
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: The exact failed Expansion Decision findings require renewed stakeholder judgment.
default_status: ready
resolve_with:
  scenario: revise-pilot-expansion-decision-after-review@1
  inputs:
    decision: 'one("recorded-pilot-expansion-decisions-for@1", {assessment: assessment})'
    assessment: assessment
    assessment_review: 'one("passing-reviews-for@1", {subject: assessment})'
    failed_reviews: >-
      select("failing-reviews-for@1",
        {subject: one("recorded-pilot-expansion-decisions-for@1",
          {assessment: assessment})})
waiver_policy_ref: waiver-applicability@1
