kind: obligation-definition
id: system-architecture-required
version: 1
description: Each coherent accepted Phase 2 requirement group requires the smallest justified architecture partition.
phases: [phase-2-system-definition]
for_each: 'select("phase-2-entry-requirement-group-representatives@1", {})'
subject_as: requirement
satisfied_when: >-
  every("coherent-phase-2-entry-requirements@1", {requirement: requirement}, member =>
    count("current-architectures-for-requirement@1", {requirement: member}) == 1)
status_rules:
  - status: blocked
    priority: 250
    when: >-
      !every("coherent-phase-2-entry-requirements@1", {requirement: requirement}, member =>
        count("current-architectures-for-requirement@1", {requirement: member}) <= 1)
    reason: Multiple current architecture Revisions govern one group member and require explicit correction before decomposition can continue.
  - status: blocked
    priority: 200
    when: >-
      !every("coherent-phase-2-entry-requirements@1", {requirement: requirement}, member =>
        count("current-architectures-for-requirement@1", {requirement: member}) == 0)
    reason: A partial architecture partition cannot be extended piecemeal; replace it as one exact coherent partition.
  - status: ready
    priority: 100
    when: >-
      every("coherent-phase-2-entry-requirements@1", {requirement: requirement}, member =>
        count("current-architectures-for-requirement@1", {requirement: member}) == 0)
    reason: The complete coherent requirement group is ready for its smallest justified shared architecture context after ephemeral topology preflight.
default_status: blocked
resolve_with:
  scenario: define-system-architecture@3
  inputs:
    requirements: 'select("coherent-phase-2-entry-requirements@1", {requirement: requirement})'
waiver_policy_ref: waiver-applicability@1
