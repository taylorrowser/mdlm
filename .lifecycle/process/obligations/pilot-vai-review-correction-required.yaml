kind: obligation-definition
id: pilot-vai-review-correction-required
version: 3
description: A current source-blind pilot or formal VAI with failed Review evidence receives one exact same-lineage correction without replay.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition, phase-5-implementation]
for_each: 'select("failed-current-pilot-verification-implementations@1", {})'
subject_as: implementation
satisfied_when: 'exists("corrected-pilot-verification-implementation-revisions-for@1", {implementation: implementation})'
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: Every exact failed Review and finding for this source-blind pilot procedure requires one causal correction; participation remains autonomous for two cycles before attended escalation.
default_status: ready
resolve_with:
  scenario: revise-pilot-vai-after-review@3
  inputs:
    implementation: implementation
    failed_reviews: 'select("failing-reviews-for@1", {subject: implementation})'
    activity: 'one("verification-activities-for-implementation@1", {implementation: implementation})'
    environment: 'one("environments-for-implementation@1", {implementation: implementation})'
    execution_target: 'one("execution-targets-for-implementation@1", {implementation: implementation})'
    requirement: >-
      one("requirements-for-pilot-activity@1",
        {activity: one("verification-activities-for-implementation@1",
          {implementation: implementation})})
    strategy: >-
      one("strategies-for-verification-activity@1",
        {activity: one("verification-activities-for-implementation@1",
          {implementation: implementation})})
waiver_policy_ref: waiver-applicability@1
