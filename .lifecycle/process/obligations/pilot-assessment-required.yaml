kind: obligation-definition
id: pilot-assessment-required
version: 1
description: Every exact frozen Phase 0–2 evidence context requires one durable measurement assessment.
phases: [phase-2-pilot-assessment]
for_each: 'select("pilot-assessment-contexts@1", {})'
subject_as: context
satisfied_when: 'exists("pilot-assessments-for-context@1", {context: context})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("pilot-assessments-for-context@1", {context: context})'
    reason: Exact frozen pilot evidence is ready for measurement and an expansion recommendation.
default_status: blocked
resolve_with:
  scenario: assess-phase-0-2-pilot@1
  inputs:
    context: context
waiver_policy_ref: waiver-applicability@1
