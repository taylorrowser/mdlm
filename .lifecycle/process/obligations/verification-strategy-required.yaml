kind: obligation-definition
id: verification-strategy-required
version: 1
description: The current Phase 1 requires applicable verification strategy coverage for every exact entry commitment.
phases: [phase-1-product-assurance]
for_each: '[phase]'
subject_as: required_phase
satisfied_when: >-
  exists("current-phase-1-stakeholder-requirements@1", {})
  && every("current-phase-1-stakeholder-requirements@1", {}, requirement =>
    exists("verification-strategies-for-requirement@1", {requirement: requirement}))
status_rules:
  - status: blocked
    priority: 200
    when: 'none("current-phase-1-stakeholder-requirements@1", {})'
    reason: Verification strategy definition waits for exact stakeholder commitments from Phase 0.
  - status: ready
    priority: 100
    when: >-
      exists("current-phase-1-stakeholder-requirements@1", {})
      && !every("current-phase-1-stakeholder-requirements@1", {}, requirement =>
        exists("verification-strategies-for-requirement@1", {requirement: requirement}))
    reason: Current Phase 1 entry commitments need applicable verification strategy coverage.
default_status: blocked
resolve_with:
  scenario: define-verification-strategy@1
  inputs:
    requirements: 'select("current-phase-1-stakeholder-requirements@1", {})'
waiver_policy_ref: waiver-applicability@1
