kind: obligation-definition
id: product-simplification-required
version: 1
description: Every current exact Phase 0 product-definition context requires a passing adversarial simplification Review before candidate assembly.
phases: [phase-0-wayfinding]
for_each: 'select("phase-0-product-simplification-contexts@1", {})'
subject_as: subject_context
satisfied_when: >-
  exists("product-simplification-reviews-for@1",
    {subject_context: subject_context, outcome: "pass"})
  && none("product-simplification-reviews-for@1",
    {subject_context: subject_context, outcome: "fail"})
status_rules:
  - status: failed
    priority: 200
    when: 'exists("product-simplification-reviews-for@1", {subject_context: subject_context, outcome: "fail"})'
    reason: Blocking simplification findings require exact subject correction; completion of the Review ceremony is not success.
    blocked_by:
      - obligation: foundation-review-correction-required@5
        subjects: 'select("failed-phase-0-foundation-revisions@1", {})'
  - status: awaiting-review
    priority: 100
    when: 'none("product-simplification-reviews-for@1", {subject_context: subject_context, outcome: "pass"})'
    reason: The exact frozen product-definition set is ready for independent adversarial simplification.
default_status: blocked
resolve_with:
  scenario: simplify-product-definition@1
  inputs:
    subject_context: subject_context
waiver_policy_ref: waiver-applicability@1
