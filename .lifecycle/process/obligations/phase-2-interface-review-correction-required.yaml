kind: obligation-definition
id: phase-2-interface-review-correction-required
version: 1
description: Every current failed or collateral-flagged Phase 2 interface receives one exact causal same-lineage Correction, then fresh Review.
phases: [phase-2-system-definition]
for_each: 'select("phase-2-correctable-interfaces@1", {})'
subject_as: subject
satisfied_when: 'exists("newer-revisions-for@1", {subject: subject})'
status_rules:
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1", {subject: subject, view: "autonomous-corrections"}) >= 2
      || !every("phase-2-correction-reviews-for-subject@1", {subject: subject, view: "authority"}, review =>
        review.payload.outcome != "fail" || review.payload.correction_authority == "package-evidence")
    reason: The autonomous correction budget is exhausted or exact judgment changes stakeholder-owned scope; immediate attended escalation is required.
  - status: ready
    priority: 100
    when: 'true'
    reason: The exact subject and all current primary or collateral Review causes are ready for one local same-lineage Correction.
default_status: ready
resolve_with:
  scenario: revise-phase-2-interface-after-review@1
  inputs:
    subject: subject
    reviews: 'select("phase-2-correction-reviews-for-subject@1", {subject: subject, view: "local"})'
    interface_subjects: 'select("phase-2-interface-subjects-for@1", {interface: subject})'
waiver_policy_ref: waiver-applicability@1
