kind: obligation-definition
id: environment-assurance-required
version: 2
description: Every applicable exact active-phase strategy requires one realized environment and its qualification activity and implementation.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
for_each: 'select("current-active-phase-verification-strategies@1", {})'
subject_as: strategy
satisfied_when: 'exists("complete-environment-assurance-for-strategy@1", {strategy: strategy})'
status_rules:
  - status: awaiting-review
    priority: 300
    when: 'none("passing-reviews-for@1", {subject: strategy})'
    reason: Environment realization waits for a passing independent Review of the exact strategy Revision so failed planning does not fan out.
    blocked_by:
      - obligation: phase-1-assurance-review-required@1
        subjects: '[strategy]'
  - status: blocked
    priority: 200
    when: >-
      exists("environments-for-strategy@1", {strategy: strategy})
      && none("complete-environment-assurance-for-strategy@1", {strategy: strategy})
    reason: Existing environment evidence does not form one unambiguous ENV, qualification VER, and qualification VAI transaction.
  - status: ready
    priority: 100
    when: 'none("environments-for-strategy@1", {strategy: strategy})'
    reason: The applicable exact strategy profile is ready for environment realization and qualification definition.
default_status: blocked
resolve_with:
  scenario: realize-verification-environment@1
  inputs:
    strategy: strategy
waiver_policy_ref: waiver-applicability@1
