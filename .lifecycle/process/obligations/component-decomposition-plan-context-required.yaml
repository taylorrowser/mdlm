kind: obligation-definition
id: component-decomposition-plan-context-required
version: 1
description: Every component planning DWP requires one exact frozen context before same-lineage completion work begins.
phases: [phase-3-component-definition]
for_each: 'select("current-component-decomposition-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("valid-review-contexts-for@1", {subject: plan})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("valid-review-contexts-for@1", {subject: plan})'
    reason: Freeze the exact planning DWP and its current support before publishing its same-lineage completion Revision.
default_status: blocked
resolve_with:
  scenario: create-review-context@2
  inputs:
    subject: plan
    context_members: 'select("review-context-members-for@1", {subject: plan})'
waiver_policy_ref: waiver-applicability@1
