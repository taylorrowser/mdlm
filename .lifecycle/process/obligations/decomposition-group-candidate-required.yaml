kind: obligation-definition
id: decomposition-group-candidate-required
version: 1
description: Every exact reviewed DWP completion requires one frozen group candidate containing its complete reviewed definition and simplification evidence.
phases: [phase-2-system-definition]
for_each: 'select("current-decomposition-completions@1", {})'
subject_as: completion
satisfied_when: 'exists("complete-group-candidates-for-completion@1", {completion: completion})'
status_rules:
  - status: blocked
    priority: 300
    when: >-
      count("planning-revisions-for-completion@1", {completion: completion}) != 1
      || none("decomposition-outputs-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      || count("architectures-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) != 1
      || none("interfaces-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      || count("strategies-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) != 1
      || none("requirement-simplification-reviews-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      || none("architecture-simplification-reviews-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
    reason: Group candidate creation requires one complete exact DWP provenance and evidence chain.
  - status: blocked
    priority: 200
    when: >-
      none("passing-reviews-for@1", {subject: completion})
      || exists("failing-reviews-for@1", {subject: completion})
    reason: Group candidate creation waits for the exact DWP completion Revision to pass contextual Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[completion]'
  - status: ready
    priority: 100
    when: >-
      exists("passing-reviews-for@1", {subject: completion})
      && none("failing-reviews-for@1", {subject: completion})
      && count("planning-revisions-for-completion@1", {completion: completion}) == 1
      && exists("decomposition-outputs-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      && count("architectures-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) == 1
      && exists("interfaces-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      && count("strategies-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) == 1
      && exists("requirement-simplification-reviews-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      && exists("architecture-simplification-reviews-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
    reason: The exact reviewed decomposition definition is ready to freeze as its group candidate.
default_status: blocked
resolve_with:
  scenario: create-decomposition-group-candidate@1
  inputs:
    completion: completion
waiver_policy_ref: waiver-applicability@1
