kind: obligation-definition
id: source-boundary-required
version: 1
description: Every current open QST must freeze its exact editable source Revision before a same-lineage resolving Revision can publish.
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("current-open-question-sources@1", {})'
subject_as: source
satisfied_when: 'exists("source-boundaries-for@1", {source: source})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("source-boundaries-for@1", {source: source})'
    reason: The exact editable QST Revision can be atomically frozen through its package-authored source-boundary Scenario.
default_status: ready
resolve_with:
  scenario: freeze-source-boundary@1
  inputs:
    source: source
waiver_policy_ref: waiver-applicability@1
