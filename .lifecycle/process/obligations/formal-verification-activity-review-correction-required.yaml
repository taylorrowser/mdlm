kind: obligation-definition
id: formal-verification-activity-review-correction-required
version: 1
description: A current source-blind formal VER with failed Review evidence receives one causal same-lineage correction before fresh Review.
phases: [phase-3-component-definition, phase-4-design-definition]
for_each: 'select("failed-current-formal-verification-activities@1", {})'
subject_as: activity
satisfied_when: 'exists("corrected-formal-verification-activity-revisions-for@1", {activity: activity})'
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: Exact failed formal verification findings require one same-lineage correction before fresh independent Review.
default_status: ready
resolve_with:
  scenario: revise-formal-verification-activity-after-review@1
  inputs:
    activity: activity
    failed_reviews: 'select("failing-reviews-for@1", {subject: activity})'
    requirements: 'select("requirements-for-pilot-activity@1", {activity: activity})'
    strategy: 'one("strategies-for-verification-activity@1", {activity: activity})'
waiver_policy_ref: waiver-applicability@1
