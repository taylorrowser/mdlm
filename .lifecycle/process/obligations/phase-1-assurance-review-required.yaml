kind: obligation-definition
id: phase-1-assurance-review-required
version: 1
description: Each active Phase 1 or representative Phase 2 assurance Revision needs one atomic evidence-bearing Review Context and independent Review.
phases: [phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("phase-1-assurance-review-required-revisions@1", {})'
subject_as: subject
satisfied_when: >-
  exists("passing-reviews-for@1", {subject: subject})
  && none("failing-reviews-for@1", {subject: subject})
status_rules:
  - status: failed
    priority: 300
    when: 'exists("failing-reviews-for@1", {subject: subject})'
    reason: The current exact assurance Revision has a failed Review.
  - status: blocked
    priority: 200
    when: >-
      subject.identity.type == "ENV"
      && (none("complete-environment-assurance-for-environment@1", {environment: subject})
        || none("complete-environment-qualification-for-environment@1", {environment: subject}))
    reason: An ENV Review waits for exact realization and qualification evidence.
    blocked_by:
      - obligation: verification-run-required@2
        subjects: 'select("qualification-implementations-for-environment@1", {environment: subject})'
  - status: awaiting-review
    priority: 100
    when: 'true'
    reason: The exact assurance Revision and required evidence can be reviewed atomically.
default_status: awaiting-review
resolve_with:
  scenario: review-phase-1-assurance@1
  inputs:
    subject: subject
    review_context_members: 'select("review-context-members-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
