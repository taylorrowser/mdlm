kind: obligation-definition
id: wayfinding-map-review-correction-required
version: 1
description: A current wayfinding MAP blocked by Review receives a same-lineage replacement that indexes every current open Phase 0 product Question.
phases: [phase-0-wayfinding]
for_each: 'select("map-review-failures-at-stage@1", {stage: "autonomous"})'
subject_as: subject
satisfied_when: 'exists("newer-revisions-for@1", {subject: subject})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("newer-revisions-for@1", {subject: subject})'
    reason: The exact blocking evidence requires a corrected MAP that restores current product-Question indexing.
default_status: ready
resolve_with:
  scenario: revise-wayfinding-map-after-review@1
  inputs:
    subject: subject
    prior_failed_reviews: 'select("cited-failing-reviews-by-correction@1", {replacement: subject})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: subject})'
    simplification_reviews: >-
      select("product-simplification-reviews-blocking-subject@1",
        {subject: subject})
    gate_rejections: 'select("reviewed-gate-rejections-for-subject@1", {subject: subject})'
    open_product_questions: 'select("open-phase-0-gate-product-questions@1", {})'
    indexed_product_questions: >-
      select("current-questions-indexed-by-map@1", {subject: subject})
    product_answer_decisions: >-
      select("applicable-product-answer-decisions-for-foundation-subject@1",
        {subject: subject})
waiver_policy_ref: waiver-applicability@1
