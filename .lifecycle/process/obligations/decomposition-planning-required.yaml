kind: obligation-definition
id: decomposition-planning-required
version: 2
description: Each selected STK or SYS slice requires one bounded DWP after its architecture, interface, and verification strategy are available.
phases: [phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
for_each: 'select("decomposition-representative-requirements@1", {})'
subject_as: requirement
satisfied_when: 'count("current-decomposition-plans-for-requirement@1", {requirement: requirement}) >= 1'
status_rules:
  - status: ready
    priority: 100
    when: >-
      count("current-architectures-for-requirement@1", {requirement: requirement}) == 1
      && (exists("interaction-free-architectures-for-requirement@1", {requirement: requirement})
        || exists("current-interfaces-for-architecture@1",
          {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})}))
      && count("current-strategies-for-decomposition-requirement@1", {requirement: requirement}) == 1
    reason: Exact accepted parents, architecture, interface set, and verification strategy are ready for one bounded DWP plan.
default_status: blocked
resolve_with:
  scenario: define-decomposition-work-package@4
  inputs:
    parents: 'select("decomposition-parents-for-architecture@1", {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})})'
    architecture: 'one("current-architectures-for-requirement@1", {requirement: requirement})'
    interfaces: 'select("current-interfaces-for-architecture@1", {architecture: one("current-architectures-for-requirement@1", {requirement: requirement})})'
    verification_strategy: 'one("current-strategies-for-decomposition-requirement@1", {requirement: requirement})'
waiver_policy_ref: waiver-applicability@1
