kind: obligation-definition
id: system-pilot-verification-activity-required
version: 1
description: Every representative SYS with one applicable strategy requires one source-independent pilot verification activity.
phases: [phase-2-system-definition]
for_each: 'select("phase-2-representative-system-requirements@1", {})'
subject_as: requirement
satisfied_when: 'exists("pilot-verification-activities-for-requirement@1", {requirement: requirement})'
status_rules:
  - status: awaiting-review
    priority: 300
    when: >-
      count("verification-strategies-for-requirement@1", {requirement: requirement}) == 1
      && none("passing-reviews-for@1",
        {subject: one("verification-strategies-for-requirement@1", {requirement: requirement})})
    reason: Pilot activity authoring waits for passing Review of the exact system strategy.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("verification-strategies-for-requirement@1", {requirement: requirement})'
  - status: blocked
    priority: 200
    when: 'count("verification-strategies-for-requirement@1", {requirement: requirement}) != 1'
    reason: Pilot activity authoring waits for one exact strategy covering the representative SYS Revision.
    blocked_by:
      - obligation: system-verification-strategy-required@1
        subjects: '[requirement]'
  - status: ready
    priority: 100
    when: >-
      count("verification-strategies-for-requirement@1", {requirement: requirement}) == 1
      && exists("passing-reviews-for@1",
        {subject: one("verification-strategies-for-requirement@1", {requirement: requirement})})
    reason: The representative SYS and reviewed strategy are ready for source-independent pilot activity authoring.
default_status: blocked
resolve_with:
  scenario: write-system-verification-activity@1
  inputs:
    requirement: requirement
    strategy: 'one("verification-strategies-for-requirement@1", {requirement: requirement})'
waiver_policy_ref: waiver-applicability@1
