kind: obligation-definition
id: component-architecture-required
version: 1
description: The exact accepted SYS slice requires one minimal current component architecture.
phases: [phase-3-component-definition]
for_each: 'select("phase-3-architecture-representative-requirements@1", {})'
subject_as: requirement
satisfied_when: >-
  every("phase-3-entry-requirements@1", {}, member =>
    count("current-component-architectures-for-requirement@1", {requirement: member}) == 1)
status_rules:
  - status: ready
    priority: 100
    when: >-
      every("phase-3-entry-requirements@1", {}, member =>
        count("current-component-architectures-for-requirement@1", {requirement: member}) == 0)
    reason: The exact accepted SYS slice is ready for one minimal component architecture.
default_status: blocked
resolve_with:
  scenario: define-component-architecture@1
  inputs:
    requirements: 'select("phase-3-entry-requirements@1", {})'
waiver_policy_ref: waiver-applicability@1
