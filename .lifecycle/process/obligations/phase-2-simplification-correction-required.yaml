kind: obligation-definition
id: phase-2-simplification-correction-required
version: 1
description: One uncorrected subject-scoped simplification failure derives one same-lineage SYS correction carrying all of that Review's findings.
phases: [phase-2-system-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: >-
  none("failed-phase-2-simplification-reviews-by-scope@1",
    {plan: plan, correction_set: "subject"})
status_rules:
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: one("phase-2-primary-system-simplification-blocker@1",
          {review: one("failed-phase-2-simplification-reviews-by-scope@1",
            {plan: plan, correction_set: "subject"})}),
         view: "autonomous-corrections"}) >= 2
    reason: Two autonomous simplification Correction cycles failed; immediate attended escalation now uses the same exact interface.
  - status: ready
    priority: 100
    when: >-
      exists("failed-phase-2-simplification-reviews-by-scope@1",
        {plan: plan, correction_set: "subject"})
    reason: Every blocking Finding for one exact SYS subject travels in one serial Correction.
default_status: ready
resolve_with:
  scenario: revise-phase-2-subject-after-simplification@1
  inputs:
    subject: >-
      one("phase-2-primary-system-simplification-blocker@1",
        {review: one("failed-phase-2-simplification-reviews-by-scope@1",
          {plan: plan, correction_set: "subject"})})
    failed_review: >-
      one("failed-phase-2-simplification-reviews-by-scope@1",
        {plan: plan, correction_set: "subject"})
    plan: plan
    parents: 'select("stakeholder-decomposition-parents-for@1", {plan: plan})'
    architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
