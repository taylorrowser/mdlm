kind: obligation-definition
id: system-level-candidate-required
version: 2
description: Every current reviewed DWP completion requires one exact system-level candidate containing its definition and simplification evidence.
phases: [phase-2-system-definition]
for_each: 'select("current-decomposition-completions@1", {})'
subject_as: completion
satisfied_when: 'exists("complete-level-candidates-for-completion@1", {completion: completion})'
status_rules:
  - status: blocked
    priority: 250
    when: >-
      count("planning-revisions-for-completion@1", {completion: completion}) != 1
      || none("decomposition-outputs-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      || count("architectures-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) != 1
      || count("strategies-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) != 1
      || count("system-strategies-for-completion@1", {completion: completion}) != 1
      || none("architecture-simplification-reviews-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
    reason: Level candidate creation requires one complete exact DWP definition, its system-level strategy, and simplification-evidence chain.
  - status: awaiting-review
    priority: 200
    when: >-
      none("passing-reviews-for@1", {subject: completion})
      || exists("failing-reviews-for@1", {subject: completion})
    reason: Level candidate creation waits for the current DWP completion to pass independent Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[completion]'
  - status: ready
    priority: 100
    when: >-
      exists("passing-reviews-for@1", {subject: completion})
      && none("failing-reviews-for@1", {subject: completion})
      && count("planning-revisions-for-completion@1", {completion: completion}) == 1
      && exists("decomposition-outputs-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
      && count("architectures-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) == 1
      && count("strategies-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})}) == 1
      && count("system-strategies-for-completion@1", {completion: completion}) == 1
      && exists("architecture-simplification-reviews-for@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
    reason: The exact reviewed DWP completion is ready to freeze directly as its system-level candidate.
default_status: blocked
resolve_with:
  scenario: create-system-level-candidate@2
  inputs:
    completion: completion
    architecture: 'one("architectures-for-decomposition@1", {plan: one("planning-revisions-for-completion@1", {completion: completion})})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: one("planning-revisions-for-completion@1", {completion: completion})})'
    verification_strategy: 'one("system-strategies-for-completion@1", {completion: completion})'
waiver_policy_ref: waiver-applicability@1
