kind: obligation-definition
id: change-impact-required
version: 1
description: Every exact open Problem Report requires one bounded traceability-based Change Request.
phases: [phase-7-change-control]
for_each: 'select("open-problem-reports@1", {})'
subject_as: problem
satisfied_when: 'exists("change-requests-for-problem@1", {problem: problem})'
status_rules:
  - status: ready
    priority: 100
    when: 'state(problem, "validity") == "valid"'
    reason: Exact source evidence is available for impact analysis.
default_status: blocked
resolve_with:
  scenario: analyze-change-impact@1
  inputs:
    problem: problem
waiver_policy_ref: waiver-applicability@1
