kind: obligation-definition
id: foundation-review-correction-required
version: 2
description: A current Phase 0 foundation Revision with failed Reviews must receive one same-lineage replacement citing every exact failure.
phases: [phase-0-wayfinding]
for_each: 'select("failed-phase-0-foundation-revisions@1", {})'
subject_as: subject
satisfied_when: 'exists("newer-revisions-for@1", {subject: subject})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("newer-revisions-for@1", {subject: subject})'
    reason: The exact failed Review requires a corrected replacement Revision.
default_status: ready
resolve_with:
  scenario: revise-foundation-after-review@2
  inputs:
    subject: subject
    failed_reviews: 'select("failing-reviews-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
