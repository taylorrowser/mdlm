kind: obligation-definition
id: decomposition-execution-required
version: 1
description: Every reviewed DWP plan must produce at least one exact system requirement unless blocked by an exact open question.
phases: [phase-2-system-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("decomposition-outputs-for@1", {plan: plan})'
status_rules:
  - status: blocked
    priority: 300
    when: 'exists("blocking-questions-for-decomposition@1", {plan: plan})'
    reason: An exact open question blocks decomposition execution.
    blocked_by:
      - obligation: open-question-resolution@3
        subjects: 'select("blocking-questions-for-decomposition@1", {plan: plan})'
      - obligation: prototype-question-resolution@1
        subjects: 'select("blocking-questions-for-decomposition@1", {plan: plan})'
  - status: blocked
    priority: 200
    when: >-
      none("passing-reviews-for@1", {subject: plan})
      || exists("failing-reviews-for@1", {subject: plan})
      || every("architectures-for-decomposition@1", {plan: plan},
        architecture => none("passing-reviews-for@1", {subject: architecture}))
      || every("interfaces-for-decomposition@1", {plan: plan},
        interface => none("passing-reviews-for@1", {subject: interface}))
      || every("strategies-for-decomposition@1", {plan: plan},
        strategy => none("passing-reviews-for@1", {subject: strategy}))
      || every("architectures-for-decomposition@1", {plan: plan},
        architecture => exists("failing-reviews-for@1", {subject: architecture}))
      || every("interfaces-for-decomposition@1", {plan: plan},
        interface => exists("failing-reviews-for@1", {subject: interface}))
      || every("strategies-for-decomposition@1", {plan: plan},
        strategy => exists("failing-reviews-for@1", {subject: strategy}))
    reason: The exact DWP plan, architecture, interfaces, and strategy must pass contextual Review before execution.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[plan]'
      - obligation: passing-review-required@2
        subjects: 'select("architectures-for-decomposition@1", {plan: plan})'
      - obligation: passing-review-required@2
        subjects: 'select("interfaces-for-decomposition@1", {plan: plan})'
      - obligation: passing-review-required@2
        subjects: 'select("strategies-for-decomposition@1", {plan: plan})'
  - status: ready
    priority: 100
    when: >-
      exists("passing-reviews-for@1", {subject: plan})
      && none("failing-reviews-for@1", {subject: plan})
      && every("architectures-for-decomposition@1", {plan: plan},
        architecture => exists("passing-reviews-for@1", {subject: architecture}))
      && every("interfaces-for-decomposition@1", {plan: plan},
        interface => exists("passing-reviews-for@1", {subject: interface}))
      && every("strategies-for-decomposition@1", {plan: plan},
        strategy => exists("passing-reviews-for@1", {subject: strategy}))
      && every("architectures-for-decomposition@1", {plan: plan},
        architecture => none("failing-reviews-for@1", {subject: architecture}))
      && every("interfaces-for-decomposition@1", {plan: plan},
        interface => none("failing-reviews-for@1", {subject: interface}))
      && every("strategies-for-decomposition@1", {plan: plan},
        strategy => none("failing-reviews-for@1", {subject: strategy}))
      && none("blocking-questions-for-decomposition@1", {plan: plan})
    reason: The bounded reviewed decomposition plan is ready to execute.
default_status: blocked
resolve_with:
  scenario: execute-decomposition-work-package@2
  inputs:
    plan: plan
    parents: 'select("decomposition-parents-for@1", {plan: plan})'
    architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
