kind: obligation-definition
id: decomposition-parent-coverage-required
version: 1
description: Every DWP completion Revision must account for every parent slice through exact children, termination, or waiver.
phases: [phase-2-system-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: >-
  exists("decomposition-completions-for@1", {plan: plan})
  && every("decomposition-completions-for@1", {plan: plan},
    completion => completion.payload.parent_coverage_status in ["complete", "waived"])
status_rules:
  - status: blocked
    priority: 200
    when: 'none("decomposition-completions-for@1", {plan: plan})'
    reason: Parent coverage is recorded by the exact DWP completion Revision.
    blocked_by:
      - obligation: decomposition-completion-required@2
        subjects: '[plan]'
  - status: ready
    priority: 100
    when: >-
      exists("decomposition-completions-for@1", {plan: plan})
      && none("blocking-questions-for-decomposition@1", {plan: plan})
    reason: Coverage gaps require another exact completion Revision or an explicit disposition.
default_status: blocked
resolve_with:
  scenario: complete-decomposition-work-package@3
  inputs:
    plan: plan
    parents: 'select("decomposition-parents-for@1", {plan: plan})'
    outputs: 'select("decomposition-outputs-for@1", {plan: plan})'
    architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
    verification_strategy: 'one("strategies-for-decomposition@1", {plan: plan})'
    simplification_reviews: 'select("phase-2-simplification-reviews-for-plan@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
