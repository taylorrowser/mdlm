kind: obligation-definition
id: approved-change-revision
version: 1
description: approved change revision
phases:
- phase-0-tiny-product
for_each: select("current-changes@1", {})
subject_as: subject
satisfied_when: 'none("pass-reviews@1", {subject: subject}) || exists("sets-for-change@1", {change: subject})'
status_rules:
- status: ready
  priority: 110
  when: 'exists("pass-reviews@1", {subject: subject}) && none("fail-reviews@1", {subject: subject})'
  reason: approved change revision
default_status: blocked
resolve_with:
  scenario: revise-requirements@1
  inputs:
    change: subject
    subject: one("current-requirements@1", {})
waiver_policy_ref: waiver-applicability@1
