kind: obligation-definition
id: shared-system-change-closure-required
version: 1
description: An approved shared-SYS change closes only after both consumers and the selective system candidate have fresh exact Review evidence.
phases: [phase-7-change-control]
for_each: 'select("shared-system-change-requests@1", {})'
subject_as: change
satisfied_when: >-
  exists("change-closure-decisions-for@2", {change: change})
  || exists("terminal-change-disposition-decisions-for@1", {change: change})
status_rules:
  - status: blocked
    priority: 300
    when: >-
      none("change-approval-decisions-for@2", {change: change})
      && none("terminal-change-disposition-decisions-for@1", {change: change})
    reason: The exact attended disposition and its independent Review have not yet applied.
    blocked_by:
      - obligation: change-approval-required@2
        subjects: '[change]'
  - status: blocked
    priority: 200
    when: >-
      count("shared-system-change-candidates-for@1", {change: change}) != 1
      || !every("shared-system-change-candidates-for@1", {change: change}, candidate =>
        exists("passing-reviews-for@1", {subject: candidate}))
    reason: Exact shared-SYS replacement, both consumer coverage Reviews, selective candidate, and candidate Review remain required.
    blocked_by:
      - obligation: shared-system-change-candidate-required@1
        subjects: '[change]'
      - obligation: passing-review-required@2
        subjects: 'select("shared-system-change-candidates-for@1", {change: change})'
  - status: ready
    priority: 100
    when: >-
      exists("change-approval-decisions-for@2", {change: change})
      && count("shared-system-change-candidates-for@1", {change: change}) == 1
      && every("shared-system-change-candidates-for@1", {change: change}, candidate =>
        exists("passing-reviews-for@1", {subject: candidate}))
    reason: Every exact changed consumer and candidate judgment is fresh; close without rewriting accepted history.
default_status: blocked
resolve_with:
  scenario: close-change-request@4
  inputs:
    change: change
    problem: 'one("source-problems-for-change@1", {change: change})'
    approval: 'one("change-approval-decisions-for@2", {change: change})'
    source_evidence: 'select("reported-evidence-for-problem@1", {problem: one("source-problems-for-change@1", {change: change})})'
    revised_requirements: 'select("revised-requirements-for-change@3", {change: change})'
    closure_evidence: 'select("shared-system-change-closure-evidence-for@1", {change: change})'
waiver_policy_ref: waiver-applicability@1
