kind: obligation-definition
id: planning-dwp-product-definition-review-required
version: 1
description: Every review-required planning DWP needs a current valid product-definition Review in a valid frozen context.
phases: [phase-2-system-definition, phase-2-pilot-assessment, phase-3-component-definition, phase-4-design-definition, phase-5-implementation, phase-6-verification, phase-7-change-control]
for_each: 'select("planning-dwp-review-required-revisions@1", {})'
subject_as: subject
satisfied_when: >-
  exists("passing-reviews-for@1", {subject: subject})
  && none("failing-reviews-for@1", {subject: subject})
status_rules:
  - status: failed
    priority: 400
    when: 'exists("failing-reviews-for@1", {subject: subject})'
    reason: A current valid product-definition Review failed; revise the planning DWP or resolve its findings.
  - status: stale
    priority: 350
    when: >-
      phase.id == "phase-2-system-definition"
      && exists("stale-reviews-for@1", {subject: subject})
    reason: Prior Phase 2 Review evidence exists but its subject or atomic context changed.
    blocked_by:
      - obligation: phase-2-atomic-review-required@1
        subjects: '[subject]'
  - status: stale
    priority: 300
    when: >-
      phase.id != "phase-2-system-definition"
      && exists("stale-reviews-for@1", {subject: subject})
    reason: Prior product-definition Review evidence exists but its subject or context changed.
    blocked_by:
      - obligation: review-context-required@2
        subjects: '[subject]'
  - status: blocked
    priority: 250
    when: >-
      phase.id == "phase-2-system-definition"
      && none("valid-review-contexts-for@1", {subject: subject})
    reason: Phase 2 product-definition Review waits for one atomic exact context-and-Review transaction.
    blocked_by:
      - obligation: phase-2-atomic-review-required@1
        subjects: '[subject]'
  - status: blocked
    priority: 200
    when: >-
      phase.id != "phase-2-system-definition"
      && none("valid-review-contexts-for@1", {subject: subject})
    reason: Product-definition Review cannot begin until an exact valid review context is frozen.
    blocked_by:
      - obligation: review-context-required@2
        subjects: '[subject]'
  - status: awaiting-review
    priority: 100
    when: 'exists("valid-review-contexts-for@1", {subject: subject})'
    reason: Exact context exists and an independent product-definition Review is required.
default_status: blocked
resolve_with:
  scenario: review-planning-dwp-product-definition@1
  inputs:
    subject: subject
    review_context: 'one("valid-review-contexts-for@1", {subject: subject})'
    context_members: 'select("review-assignment-context-members-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
