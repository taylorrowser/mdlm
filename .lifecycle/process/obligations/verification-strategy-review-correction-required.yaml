kind: obligation-definition
id: verification-strategy-review-correction-required
version: 2
description: A current Phase 1 verification strategy with a failed Review receives causal same-lineage correction while its autonomous budget remains, then attended escalation.
phases: [phase-1-product-assurance]
for_each: 'select("failed-current-verification-strategies@1", {})'
subject_as: strategy
satisfied_when: 'exists("corrected-verification-strategy-revisions-for@1", {strategy: strategy})'
status_rules:
  - status: ready
    priority: 300
    when: >-
      !every("failing-reviews-for@1", {subject: strategy}, review =>
        review.payload.correction_authority != "stakeholder")
    reason: Current strategy findings require immediate stakeholder-owned correction without consuming autonomous correction budget.
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: strategy, view: "autonomous-corrections"}) >= 2
    reason: Both autonomous strategy replacement-and-Review cycles failed; the same exact correction interface now requires stakeholder attention.
  - status: ready
    priority: 100
    when: 'true'
    reason: Exact failed strategy Review findings require a corrected same-lineage strategy Revision.
default_status: ready
resolve_with:
  scenario: revise-verification-strategy-after-review@2
  inputs:
    strategy: strategy
    failed_reviews: 'select("failing-reviews-for@1", {subject: strategy})'
    requirements: 'select("requirements-governed-by-strategy@1", {strategy: strategy})'
waiver_policy_ref: waiver-applicability@1
