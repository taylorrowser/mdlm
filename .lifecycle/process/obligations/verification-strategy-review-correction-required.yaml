kind: obligation-definition
id: verification-strategy-review-correction-required
version: 2
description: A current assurance verification strategy with a failed Review receives causal same-lineage correction while its autonomous budget remains, then attended escalation.
phases: [phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("failed-current-verification-strategies@1", {})'
subject_as: strategy
satisfied_when: 'exists("corrected-verification-strategy-revisions-for@1", {strategy: strategy})'
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: Exact failed strategy Review findings require correction; the Scenario participation Policy determines autonomous or attended execution.
default_status: ready
resolve_with:
  scenario: revise-verification-strategy-after-review@2
  inputs:
    strategy: strategy
    failed_reviews: 'select("failing-reviews-for@1", {subject: strategy})'
    requirements: 'select("requirements-governed-by-strategy@1", {strategy: strategy})'
waiver_policy_ref: waiver-applicability@1
