kind: obligation-definition
id: product-simplification-context-required
version: 1
description: The complete individually reviewed Phase 0 foundation requires one exact frozen definition-set context before candidate assembly.
phases: [phase-0-wayfinding]
for_each: '[phase]'
subject_as: required_phase
satisfied_when: 'exists("phase-0-product-simplification-contexts@1", {})'
status_rules:
  - status: blocked
    priority: 200
    when: >-
      none("current-wayfinding-maps@1", {})
      || none("current-product-specifications@1", {})
      || exists("phase-0-foundation-members-missing-review@1", {})
    reason: Product simplification waits until the exact MAP, PSP, and STK set has individual passing Reviews.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("phase-0-foundation-members-missing-review@1", {})'
  - status: ready
    priority: 100
    when: >-
      exists("current-wayfinding-maps@1", {})
      && exists("current-product-specifications@1", {})
      && none("phase-0-foundation-members-missing-review@1", {})
    reason: The earliest complete reviewed product-purpose, stakeholder-intent, and scope set is ready to freeze for simplification.
default_status: blocked
resolve_with:
  scenario: prepare-product-simplification-context@1
  inputs:
    definition_members: 'select("phase-0-foundation-members@1", {})'
waiver_policy_ref: waiver-applicability@1
