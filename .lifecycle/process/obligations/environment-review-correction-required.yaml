kind: obligation-definition
id: environment-review-correction-required
version: 1
description: A current Phase 1 environment with a failed Review must be corrected with a fresh exact qualification chain.
phases: [phase-1-product-assurance]
for_each: 'select("failed-current-environments@1", {})'
subject_as: environment
satisfied_when: 'exists("corrected-environment-revisions-for@1", {environment: environment})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("corrected-environment-revisions-for@1", {environment: environment})'
    reason: Exact failed environment Review findings require a corrected same-lineage ENV and fresh qualification chain.
default_status: ready
resolve_with:
  scenario: revise-environment-assurance-after-review@1
  inputs:
    environment: environment
    failed_reviews: 'select("failing-reviews-for@1", {subject: environment})'
    strategy: 'one("strategies-for-environment@1", {environment: environment})'
waiver_policy_ref: waiver-applicability@1
