kind: obligation-definition
id: environment-review-correction-required
version: 2
description: A current Phase 1 environment with a failed Review receives causal same-lineage correction and a fresh qualification chain while its autonomous budget remains, then attended escalation.
phases: [phase-1-product-assurance]
for_each: 'select("failed-current-environments@1", {})'
subject_as: environment
satisfied_when: 'exists("corrected-environment-revisions-for@1", {environment: environment})'
status_rules:
  - status: ready
    priority: 300
    when: >-
      !every("failing-reviews-for@1", {subject: environment}, review =>
        review.payload.correction_authority != "stakeholder")
    reason: Current environment findings require immediate stakeholder-owned correction without consuming autonomous correction budget.
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: environment, view: "autonomous-corrections"}) >= 2
    reason: Both autonomous environment replacement-and-Review cycles failed; the same exact correction interface now requires stakeholder attention.
  - status: ready
    priority: 100
    when: 'true'
    reason: Exact failed environment Review findings require a corrected same-lineage ENV and fresh qualification chain.
default_status: ready
resolve_with:
  scenario: revise-environment-assurance-after-review@2
  inputs:
    environment: environment
    failed_reviews: 'select("failing-reviews-for@1", {subject: environment})'
    strategy: 'one("strategies-for-environment@1", {environment: environment})'
waiver_policy_ref: waiver-applicability@1
