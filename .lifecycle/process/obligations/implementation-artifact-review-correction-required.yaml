kind: obligation-definition
id: implementation-artifact-review-correction-required
version: 1
description: A current implementation artifact with a failing Review receives one exact same-lineage correction and fresh Review.
phases: [phase-5-implementation]
for_each: 'select("failed-current-implementation-artifacts@1", {})'
subject_as: implementation
satisfied_when: 'exists("newer-revisions-for@1", {subject: implementation})'
status_rules:
  - status: ready
    priority: 300
    when: 'true'
    reason: Correct the exact failed implementation artifact without replaying unrelated Phase 5 work.
default_status: ready
resolve_with:
  scenario: revise-implementation-artifact-after-review@1
  inputs:
    implementation: implementation
    failed_reviews: 'select("failing-reviews-for@1", {subject: implementation})'
    candidate: 'one("design-candidates-for-implementation-artifact@1", {implementation: implementation})'
    design_requirements: 'select("design-requirements-for-phase-5-candidate@1", {candidate: one("design-candidates-for-implementation-artifact@1", {implementation: implementation})})'
waiver_policy_ref: waiver-applicability@1
