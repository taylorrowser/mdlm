kind: obligation-definition
id: implementation-review-required
version: 1
description: implementation review required
phases:
- phase-0-tiny-product
for_each: select("current-implementations@1", {})
subject_as: subject
satisfied_when: 'exists("reviews-for@1", {subject: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("passing-results@1", {implementation: subject})'
  reason: implementation review required
default_status: blocked
resolve_with:
  scenario: review-implementation@1
  inputs:
    subject: subject
    requirements: 'one("requirements-for@1", {implementation: subject})'
    result: 'one("passing-results@1", {implementation: subject})'
waiver_policy_ref: waiver-applicability@1
