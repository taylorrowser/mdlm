kind: obligation-definition
id: pilot-verification-activity-review-correction-required
version: 2
description: A current assurance pilot verification activity with a failed Review receives causal same-lineage correction while its autonomous budget remains, then attended escalation.
phases: [phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("failed-current-pilot-verification-activities@1", {})'
subject_as: activity
satisfied_when: 'exists("corrected-pilot-verification-activity-revisions-for@1", {activity: activity})'
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: Exact failed pilot activity Review findings require correction; the Scenario participation Policy determines autonomous or attended execution.
default_status: ready
resolve_with:
  scenario: revise-pilot-verification-activity-after-review@3
  inputs:
    activity: activity
    failed_reviews: 'select("failing-reviews-for@1", {subject: activity})'
    requirement: 'one("requirements-for-pilot-activity@1", {activity: activity})'
    strategy: 'one("strategies-for-verification-activity@1", {activity: activity})'
    intent_support: 'one("pilot-intent-support-for-activity@1", {activity: activity})'
waiver_policy_ref: waiver-applicability@1
