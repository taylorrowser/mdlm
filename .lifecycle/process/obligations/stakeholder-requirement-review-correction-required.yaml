kind: obligation-definition
id: stakeholder-requirement-review-correction-required
version: 1
description: A current STK blocked by Review receives a same-lineage replacement that preserves its exact product-specification parent and correction evidence.
phases: [phase-0-wayfinding]
for_each: 'select("stakeholder-requirement-review-failures-at-stage@1", {stage: "autonomous"})'
subject_as: subject
satisfied_when: 'exists("newer-revisions-for@1", {subject: subject})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("newer-revisions-for@1", {subject: subject})'
    reason: The exact blocking evidence requires a corrected STK with its product-specification parent preserved.
default_status: ready
resolve_with:
  scenario: revise-stakeholder-requirement-after-review@1
  inputs:
    subject: subject
    prior_failed_reviews: 'select("cited-failing-reviews-by-correction@1", {replacement: subject})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: subject})'
    simplification_reviews: >-
      select("product-simplification-reviews-blocking-subject@1",
        {subject: subject})
    gate_rejections: 'select("reviewed-gate-rejections-for-subject@1", {subject: subject})'
    product_questions: >-
      select("unincorporated-product-questions-for-foundation-subject@1",
        {subject: subject})
    product_answer_decisions: >-
      select("applicable-product-answer-decisions-for-foundation-subject@1",
        {subject: subject})
    product_specification: >-
      one("current-product-specification-revisions-for-requirement@1",
        {requirement: subject})
waiver_policy_ref: waiver-applicability@1
