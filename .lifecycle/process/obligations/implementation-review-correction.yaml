kind: obligation-definition
id: implementation-review-correction
version: 1
description: implementation review correction
phases:
- phase-0-tiny-product
for_each: select("current-implementations@1", {})
subject_as: subject
satisfied_when: 'none("fail-reviews@1", {subject: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("fail-reviews@1", {subject: subject})'
  reason: implementation review correction
default_status: blocked
resolve_with:
  scenario: correct-implementation-after-review@1
  inputs:
    subject: subject
    requirements: 'one("requirements-for@1", {implementation: subject})'
    failure: 'one("fail-reviews@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
