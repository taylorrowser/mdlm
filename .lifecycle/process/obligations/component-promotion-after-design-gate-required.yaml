kind: obligation-definition
id: component-promotion-after-design-gate-required
version: 1
description: Every reviewed and approved design candidate requires one exact mechanical component acceptance baseline.
phases: [phase-4-design-definition]
for_each: 'select("complete-phase-4-level-candidates@1", {})'
subject_as: candidate
satisfied_when: 'exists("accepted-component-baselines-for-design-candidate@1", {candidate: candidate})'
status_rules:
  - status: blocked
    priority: 200
    when: >-
      none("applicable-gate-signoffs-for@1", {candidate: candidate})
      || count("phase-3-candidates-for-design-candidate@1", {design_candidate: candidate}) != 1
    reason: Mechanical promotion waits for one exact component predecessor and reviewed Phase 4 gate authority.
    blocked_by:
      - obligation: candidate-gate-signoff@3
        subjects: '[candidate]'
  - status: ready
    priority: 100
    when: >-
      exists("applicable-gate-signoffs-for@1", {candidate: candidate})
      && count("phase-3-candidates-for-design-candidate@1", {design_candidate: candidate}) == 1
    reason: The exact predecessor and Phase 4 authority evidence are ready for mechanical component acceptance.
default_status: blocked
resolve_with:
  scenario: promote-component-after-design-gate@1
  inputs:
    design_candidate: candidate
    component_candidate: 'one("phase-3-candidates-for-design-candidate@1", {design_candidate: candidate})'
    component_members: 'select("component-definition-members-for-candidate@1", {candidate: one("phase-3-candidates-for-design-candidate@1", {design_candidate: candidate})})'
    design_authority_evidence: 'select("level-acceptance-evidence-for-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
