kind: obligation-definition
id: lower-level-decomposition-execution-required
version: 1
description: Every current CMP- or DES-target DWP plan must produce its exact coherent requirement set.
phases: [phase-3-component-definition, phase-4-design-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("decomposition-outputs-for@1", {plan: plan})'
status_rules:
  - status: ready
    priority: 100
    when: >-
      plan.payload.target_child_type in ["CMP", "DES"]
      && exists("valid-review-contexts-for@1", {subject: plan})
      && none("blocking-questions-for-decomposition@1", {plan: plan})
    reason: The exact reviewed lower-level plan is ready to publish its coherent requirement set.
default_status: blocked
resolve_with:
  scenario: execute-lower-level-decomposition-work-package@1
  inputs:
    plan: plan
    parents: 'select("lower-level-decomposition-parents-for@1", {plan: plan})'
    architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
