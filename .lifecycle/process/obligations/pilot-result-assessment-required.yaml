kind: obligation-definition
id: pilot-result-assessment-required
version: 1
description: Each immutable suitable pilot result that declares independent assessment requires one atomic contextual Review instead of another execution.
phases: [phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("verification-implementations-requiring-run@1", {})'
subject_as: implementation
satisfied_when: >-
  none("pilot-results-awaiting-assessment-for-implementation@1",
    {implementation: implementation})
status_rules:
  - status: failed
    priority: 200
    when: >-
      exists("pilot-results-awaiting-assessment-for-implementation@1",
        {implementation: implementation})
      && every("pilot-results-awaiting-assessment-for-implementation@1",
        {implementation: implementation}, result =>
          exists("failing-reviews-for@1", {subject: result}))
    reason: The immutable witnessed pilot result failed independent assessment and cannot be replayed.
  - status: awaiting-review
    priority: 100
    when: >-
      exists("pilot-results-awaiting-assessment-for-implementation@1",
        {implementation: implementation})
    reason: The immutable pilot result requires its declared independent assessment.
default_status: blocked
resolve_with:
  scenario: review-phase-1-assurance@1
  inputs:
    subject: >-
      one("pilot-results-awaiting-assessment-for-implementation@1",
        {implementation: implementation})
    review_context_members: >-
      select("review-context-members-for@1", {subject:
        one("pilot-results-awaiting-assessment-for-implementation@1",
          {implementation: implementation})})
waiver_policy_ref: waiver-applicability@1
