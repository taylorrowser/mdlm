kind: obligation-definition
id: intent-candidate-review-escalation-required
version: 1
description: A Phase 0 candidate still failing after two autonomous causal replacements requires attended stakeholder correction.
phases: [phase-0-wayfinding]
for_each: 'select("exhausted-intent-candidate-review-failures@1", {})'
subject_as: candidate
satisfied_when: 'exists("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
status_rules:
  - status: ready
    priority: 100
    when: 'none("complete-superseding-intent-candidates-for@1", {candidate: candidate})'
    reason: The candidate Review-correction budget is exhausted; exact immutable Reviews and findings require stakeholder attention.
default_status: ready
resolve_with:
  scenario: escalate-intent-candidate-review-correction@1
  inputs:
    candidate: candidate
    definition_members: 'select("phase-0-foundation-members@1", {})'
    prior_failed_reviews: 'select("cited-failing-reviews-by-correction@1", {replacement: candidate})'
    failed_reviews: 'select("failing-reviews-for@1", {subject: candidate})'
    gate_rejections: 'select("reviewed-gate-rejections-for-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
