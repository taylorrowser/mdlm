kind: obligation-definition
id: phase-2-definition-consistency-correction-required
version: 1
description: One declared consistency-set simplification failure derives one atomic replacement of its exact current Phase 2 definition set.
phases: [phase-2-system-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: >-
  none("failed-phase-2-simplification-reviews-by-scope@1",
    {plan: plan, correction_set: "definition-consistency"})
status_rules:
  - status: ready
    priority: 200
    when: >-
      count("review-correction-history-for@1",
        {subject: plan, view: "autonomous-corrections"}) >= 2
    reason: Two autonomous consistency-set Correction cycles failed; immediate attended escalation now uses the same exact interface.
  - status: ready
    priority: 100
    when: >-
      exists("failed-phase-2-simplification-reviews-by-scope@1",
        {plan: plan, correction_set: "definition-consistency"})
    reason: The exact architecture, interfaces, planning DWP, and still-applicable SYS outputs must change atomically.
default_status: ready
resolve_with:
  scenario: revise-phase-2-definition-set-after-simplification@1
  inputs:
    failed_review: >-
      one("failed-phase-2-simplification-reviews-by-scope@1",
        {plan: plan, correction_set: "definition-consistency"})
    prior_architecture: 'one("architectures-for-decomposition@1", {plan: plan})'
    prior_interfaces: 'select("interfaces-for-decomposition@1", {plan: plan})'
    prior_plan: plan
    prior_requirements: >-
      select("phase-2-system-requirements-for-review@1",
        {review: one("failed-phase-2-simplification-reviews-by-scope@1",
          {plan: plan, correction_set: "definition-consistency"}), plan: plan})
    parents: 'select("decomposition-parents-for@1", {plan: plan})'
    verification_strategy: 'one("strategies-for-decomposition@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
