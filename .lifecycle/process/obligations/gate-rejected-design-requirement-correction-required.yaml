kind: obligation-definition
id: gate-rejected-design-requirement-correction-required
version: 1
description: Every current gate-rejected design requirement receives one exact causal same-lineage correction before candidate replacement.
phases: [phase-4-design-definition]
for_each: 'select("gate-rejected-design-requirements@1", {})'
subject_as: design
satisfied_when: 'exists("newer-revisions-for@1", {subject: design})'
status_rules:
  - status: ready
    priority: 300
    when: 'true'
    reason: The reviewed gate rejection and exact decomposition context are ready for one same-lineage DES correction.
default_status: ready
resolve_with:
  scenario: revise-gate-rejected-design-requirement@1
  inputs:
    design: design
    gate_rejections: 'select("reviewed-gate-rejections-for-subject@1", {subject: design})'
    parents: 'select("component-decomposition-parents-for-design@1", {design: design})'
    plan: 'one("decomposition-plans-for-output@1", {output: design})'
    architecture: >-
      one("architectures-for-decomposition@1",
        {plan: one("decomposition-plans-for-output@1", {output: design})})
    interfaces: >-
      select("interfaces-for-decomposition@1",
        {plan: one("decomposition-plans-for-output@1", {output: design})})
waiver_policy_ref: waiver-applicability@1
