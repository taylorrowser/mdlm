kind: obligation-definition
id: stakeholder-rejection-correction
version: 1
description: Correct an implementation rejected by its stakeholder
phases:
- phase-0-tiny-product
for_each: select("current-implementations@1", {})
subject_as: subject
satisfied_when: 'none("rejections-for@1", {implementation: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("rejections-for@1", {implementation: subject})'
  reason: stakeholder rejected the implementation
default_status: blocked
resolve_with:
  scenario: correct-product@2
  inputs:
    subject: subject
    requirements: 'one("requirements-for@1", {implementation: subject})'
    failure: 'one("rejections-for@1", {implementation: subject})'
waiver_policy_ref: waiver-applicability@1
