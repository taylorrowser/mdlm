kind: obligation-definition
id: architecture-interface-simplification-required
version: 1
description: Every complete architecture-wide Phase 2 definition set requires one passing semantic simplification Review.
phases: [phase-2-system-definition]
for_each: 'select("architecture-definition-set-representative-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("architecture-simplification-reviews-for@1", {plan: plan})'
status_rules:
  - status: failed
    priority: 300
    when: >-
      exists("failed-phase-2-simplification-reviews-by-scope@1",
        {plan: plan, correction_set: "subject"})
      || exists("failed-phase-2-simplification-reviews-by-scope@1",
        {plan: plan, correction_set: "definition-consistency"})
    reason: Exact blocking findings require bounded same-lineage correction of each retained definition subject.
    blocked_by:
      - obligation: phase-2-simplification-correction-required@1
        subjects: '[plan]'
      - obligation: phase-2-review-correction-required@1
        subjects: 'select("phase-2-correctable-subjects@1", {})'
      - obligation: phase-2-interface-review-correction-required@1
        subjects: 'select("phase-2-correctable-interfaces@1", {})'
      - obligation: phase-2-decomposition-review-correction-required@1
        subjects: 'select("phase-2-correctable-decompositions@1", {})'
      - obligation: phase-2-system-review-correction-required@1
        subjects: 'select("phase-2-correctable-system-requirements@1", {})'
  - status: blocked
    priority: 200
    when: >-
      none("decomposition-outputs-for@1", {plan: plan})
      || none("decomposition-simplification-contexts-for@1", {plan: plan})
      || exists("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})
    reason: Simplification waits for exact outputs, their complete Review Context, and acceptable Reviews of every exact member.
    blocked_by:
      - obligation: decomposition-execution-required@1
        subjects: '[plan]'
      - obligation: phase-2-definition-review-context-required@1
        subjects: '[plan]'
      - obligation: review-context-required@2
        subjects: 'select("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})'
      - obligation: passing-review-required@2
        subjects: 'select("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})'
  - status: awaiting-review
    priority: 100
    when: >-
      exists("decomposition-simplification-contexts-for@1", {plan: plan})
      && none("unreviewed-phase-2-definition-members-for-plan@1", {plan: plan})
    reason: The earliest exact definition set is ready for independent architecture and interface simplification.
default_status: blocked
resolve_with:
  scenario: simplify-architecture-and-interfaces@2
  inputs:
    plan: plan
    subject_context: 'one("decomposition-simplification-contexts-for@1", {plan: plan})'
    definition_members: 'select("phase-2-definition-members-for-plan@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
