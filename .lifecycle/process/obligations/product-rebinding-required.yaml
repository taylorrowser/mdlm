kind: obligation-definition
id: product-rebinding-required
version: 1
description: Reuse the same product lineage after requirement correction
phases:
- phase-0-tiny-product
for_each: select("current-requirements@1", {})
subject_as: subject
satisfied_when: 'none("prior-implementations-for@1", {requirements: subject}) || exists("implementations-for@1",
  {requirements: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("pass-reviews@1", {subject: subject}) && none("fail-reviews@1", {subject: subject}) && exists("prior-implementations-for@1",
    {requirements: subject})'
  reason: implementation required
default_status: blocked
resolve_with:
  scenario: rebind-product@1
  inputs:
    requirements: subject
    prior: 'one("prior-implementations-for@1", {requirements: subject})'
waiver_policy_ref: waiver-applicability@1
