kind: obligation-definition
id: foundation-review-escalation-required
version: 1
description: A Phase 0 foundation failure requires attended correction when stakeholder-owned intent is implicated or two autonomous replacement cycles have failed.
phases: [phase-0-wayfinding]
for_each: 'select("foundation-review-escalations@1", {})'
subject_as: subject
satisfied_when: 'exists("newer-revisions-for@1", {subject: subject})'
status_rules:
  - status: ready
    priority: 200
    when: 'exists("stakeholder-owned-failing-reviews-for@1", {subject: subject})'
    reason: Stakeholder attention is required immediately because correction would change stakeholder-owned intent; autonomous correction budget is not consumed.
  - status: ready
    priority: 100
    when: 'count("correction-revisions-through@1", {subject: subject}) >= 2'
    reason: Stakeholder attention is required because both autonomous replacement-and-Review cycles failed and the correction lineage is exhausted.
default_status: ready
resolve_with:
  scenario: escalate-foundation-review-correction@1
  inputs:
    subject: subject
    lineage: 'select("revision-lineage-through@1", {subject: subject})'
    failed_reviews: 'select("failed-reviews-in-lineage-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
