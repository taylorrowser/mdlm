kind: obligation-definition
id: pilot-verification-activity-required
version: 2
description: Every current Phase 1 verification strategy requires one source-independent pilot activity covering its governed requirement set.
phases: [phase-1-product-assurance]
for_each: 'select("current-phase-1-verification-strategies@1", {})'
subject_as: strategy
satisfied_when: 'exists("pilot-verification-activities-for-strategy@1", {strategy: strategy})'
status_rules:
  - status: awaiting-review
    priority: 300
    when: 'none("passing-reviews-for@1", {subject: strategy})'
    reason: Pilot activity authoring waits for a passing independent Review of its exact strategy Revision so failed planning does not fan out.
    blocked_by:
      - obligation: phase-1-assurance-review-required@1
        subjects: '[strategy]'
  - status: ready
    priority: 100
    when: 'exists("passing-reviews-for@1", {subject: strategy})'
    reason: The reviewed exact strategy and its complete governed requirement set are ready for one source-independent pilot activity.
default_status: blocked
resolve_with:
  scenario: write-verification-activity@2
  inputs:
    requirements: 'select("phase-1-requirements-governed-by-strategy@1", {strategy: strategy})'
    strategy: strategy
    intent_support: 'one("pilot-intent-support-for-strategy@1", {strategy: strategy})'
waiver_policy_ref: waiver-applicability@1
