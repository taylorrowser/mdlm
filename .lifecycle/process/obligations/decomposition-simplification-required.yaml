kind: obligation-definition
id: decomposition-simplification-required
version: 1
description: Every executed DWP requires one passing dedicated requirement-set simplification Review.
phases: [phase-2-system-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: 'exists("requirement-simplification-reviews-for@1", {plan: plan})'
status_rules:
  - status: blocked
    priority: 200
    when: >-
      none("decomposition-outputs-for@1", {plan: plan})
      || none("decomposition-simplification-contexts-for@1", {plan: plan})
    reason: Simplification waits for exact outputs and one frozen definition-set context.
    blocked_by:
      - obligation: decomposition-execution-required@1
        subjects: '[plan]'
      - obligation: review-context-required@2
        subjects: '[plan]'
  - status: awaiting-review
    priority: 100
    when: >-
      exists("decomposition-outputs-for@1", {plan: plan})
      && exists("decomposition-simplification-contexts-for@1", {plan: plan})
    reason: The frozen requirement set is ready for an adversarial simplification Review.
default_status: blocked
resolve_with:
  scenario: simplify-requirement-set@2
  inputs:
    plan: plan
    subject_context: 'one("decomposition-simplification-contexts-for@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
