kind: obligation-definition
id: change-closure-required
version: 1
description: Every approved Change Request closes only after exact replacement lifecycle and verification evidence exists.
phases: [phase-7-change-control]
for_each: 'select("all-change-requests@1", {})'
subject_as: change
satisfied_when: 'exists("change-closure-decisions-for@1", {change: change})'
status_rules:
  - status: blocked
    priority: 300
    when: 'none("change-approval-decisions-for@1", {change: change})'
    reason: Exact approval is required before closure.
    blocked_by:
      - obligation: change-approval-required@1
        subjects: '[change]'
  - status: blocked
    priority: 200
    when: >-
      none("revised-requirements-for-change@1", {change: change})
      || none("change-evidence-for@1", {change: change})
    reason: Exact revised requirements and replacement context, Review, baseline, and verification evidence are required.
    blocked_by:
      - obligation: change-revision-required@1
        subjects: '[change]'
  - status: ready
    priority: 100
    when: >-
      exists("change-approval-decisions-for@1", {change: change})
      && exists("revised-requirements-for-change@1", {change: change})
      && exists("change-evidence-for@1", {change: change})
    reason: The exact approved change and replacement evidence can now be closed without rewriting history.
default_status: blocked
resolve_with:
  scenario: close-change-request@1
  inputs:
    change: change
    problem: 'one("source-problems-for-change@1", {change: change})'
    approval: 'one("change-approval-decisions-for@1", {change: change})'
    source_evidence: 'select("reported-evidence-for-problem@1", {problem: one("source-problems-for-change@1", {change: change})})'
    revised_requirements: 'select("revised-requirements-for-change@1", {change: change})'
    closure_evidence: 'select("change-evidence-for@1", {change: change})'
waiver_policy_ref: waiver-applicability@1
