kind: obligation-definition
id: foundation-correction-decision-review-correction-required
version: 1
description: A failed Review of trusted Phase 0 foundation correction authority requires a same-lineage stakeholder correction.
phases: [phase-0-wayfinding]
for_each: 'select("failed-foundation-correction-decisions@1", {})'
subject_as: decision
satisfied_when: >-
  exists("valid-foundation-correction-decision-replacements-for@1",
    {decision: decision})
status_rules:
  - status: ready
    priority: 100
    when: 'true'
    reason: The failed correction authority and its exact corrected subject are ready for renewed stakeholder judgment.
default_status: ready
resolve_with:
  scenario: revise-foundation-correction-decision-after-review@1
  inputs:
    decision: decision
    corrected_subject: >-
      one("foundation-correction-replacements-for-decision@1",
        {decision: decision})
    lineage: >-
      select("review-correction-history-for@1",
        {subject: decision, view: "lineage"})
    prior_failed_reviews: >-
      select("cited-failing-reviews-by-correction@1", {replacement: decision})
    failed_reviews: 'select("failing-reviews-for@1", {subject: decision})'
waiver_policy_ref: waiver-applicability@1
