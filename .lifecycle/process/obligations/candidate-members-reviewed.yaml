kind: obligation-definition
id: candidate-members-reviewed
version: 2
description: Every review-required exact definition member of a current candidate must have a valid passing review.
phases: [phase-0-wayfinding, phase-2-system-definition]
for_each: 'select("candidate-baselines@1", {})'
subject_as: candidate
satisfied_when: >-
  every("review-required-members-for@1", {candidate: candidate},
    member => exists("passing-reviews-for@1", {subject: member}))
status_rules:
  - status: blocked
    priority: 100
    when: 'exists("candidate-members-missing-review@1", {candidate: candidate})'
    reason: One or more exact candidate members still lack valid passing review evidence.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("candidate-members-missing-review@1", {candidate: candidate})'
default_status: blocked
resolve_with:
  scenario: review-datum-in-context@2
  dispatch:
    for_each: 'select("candidate-members-missing-review@1", {candidate: candidate})'
    as: member
  inputs:
    subject: member
    review_context: 'one("valid-review-contexts-for@1", {subject: member})'
waiver_policy_ref: waiver-applicability@1
