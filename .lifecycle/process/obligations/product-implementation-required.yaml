kind: obligation-definition
id: product-implementation-required
version: 1
description: Every admitted design candidate requires one exact controlled implementation artifact with a passing independent traceability Review.
phases: [phase-5-implementation]
for_each: 'select("phase-5-entry-design-candidates@1", {})'
subject_as: candidate
satisfied_when: >-
  exists("passing-reviewed-implementation-artifacts-for-design-candidate@1",
    {candidate: candidate})
status_rules:
  - status: awaiting-review
    priority: 200
    when: 'exists("implementation-artifacts-for-design-candidate@1", {candidate: candidate})'
    reason: The exact implementation artifact awaits independent traceability and changed-path Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("implementation-artifacts-for-design-candidate@1", {candidate: candidate})'
  - status: ready
    priority: 100
    when: 'none("implementation-artifacts-for-design-candidate@1", {candidate: candidate})'
    reason: The exact design candidate is ready for one controlled implementation artifact.
default_status: blocked
resolve_with:
  scenario: implement-design-set@1
  inputs:
    candidate: candidate
    design_requirements: 'select("design-requirements-for-phase-5-candidate@1", {candidate: candidate})'
waiver_policy_ref: waiver-applicability@1
