kind: obligation-definition
id: component-interface-required
version: 1
description: A component architecture with a controlled boundary requires one exact ICSP.
phases: [phase-3-component-definition]
for_each: 'select("current-component-architectures-for-requirement@1", {requirement: first("phase-3-entry-requirements@1", {})})'
subject_as: architecture
satisfied_when: >-
  (architecture.payload.controlled_boundaries == []
    && none("current-component-interfaces-for-architecture@1", {architecture: architecture}))
  || (architecture.payload.controlled_boundaries != []
    && exists("current-component-interfaces-for-architecture@1", {architecture: architecture}))
status_rules:
  - status: ready
    priority: 100
    when: >-
      architecture.payload.controlled_boundaries != []
      && none("current-component-interfaces-for-architecture@1", {architecture: architecture})
    reason: The exact component architecture is ready for one controlled-boundary contract.
default_status: blocked
resolve_with:
  scenario: define-interface-control-specification@2
  inputs:
    architecture: architecture
waiver_policy_ref: waiver-applicability@1
