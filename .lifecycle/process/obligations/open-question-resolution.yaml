kind: obligation-definition
id: open-question-resolution
version: 3
description: Every latest general question needs an answer, or exact reviewed DEC evidence when explicitly deferred or cancelled.
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("general-open-questions@1", {})'
subject_as: question
satisfied_when: >-
  (question.payload.kind == "empirical" && question.payload.state == "answered")
  || exists("applicable-question-answers-for@1", {question: question})
  || exists("applicable-question-dispositions-for@1", {question: question})
status_rules:
  - status: blocked
    priority: 600
    when: >-
      question.payload.state == "open"
      && none("source-boundaries-for@1", {source: question})
    reason: The exact editable source QST Revision must be frozen through the package-authored source-boundary Scenario before a satisfying Revision can be published.
    blocked_by:
      - obligation: source-boundary-required@1
        subjects: '[question]'
  - status: blocked
    priority: 500
    when: >-
      question.payload.kind == "preferential"
      && question.payload.state == "answered"
      && exists("question-answer-decisions-for@1", {question: question})
      && none("applicable-question-answers-for@1", {question: question})
    reason: The exact preferential scope Decision awaits its policy-required passing Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("question-answer-decisions-for@1", {question: question})'
  - status: blocked
    priority: 450
    when: >-
      question.payload.kind == "preferential"
      && question.payload.state == "answered"
      && none("question-answer-decisions-for@1", {question: question})
    reason: An answered preferential question is not applicable without an exact valid scoped Decision.
  - status: blocked
    priority: 400
    when: >-
      question.payload.state in ["deferred", "cancelled"]
      && exists("question-disposition-decisions-for@1", {question: question})
      && none("applicable-question-dispositions-for@1", {question: question})
    reason: The exact deferral or cancellation Decision awaits its policy-required passing Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("question-disposition-decisions-for@1", {question: question})'
  - status: blocked
    priority: 350
    when: >-
      question.payload.state in ["deferred", "cancelled"]
      && none("question-disposition-decisions-for@1", {question: question})
    reason: Deferred or cancelled question state is not applicable without an exact valid scoped Decision.
  - status: ready
    priority: 300
    when: >-
      question.payload.state == "open"
      && question.payload.resolution_disposition in ["defer", "cancel"]
    reason: The explicit disposition is technically ready, but requires stakeholder authority and exact reviewed DEC evidence.
  - status: ready
    priority: 200
    when: >-
      question.payload.state == "open"
      && question.payload.kind == "preferential"
    reason: The question is technically ready, but its participation Policy requires explicit stakeholder authority.
  - status: ready
    priority: 100
    when: >-
      question.payload.state == "open"
      && question.payload.kind == "empirical"
      && question.payload.evidence_available == true
    reason: The exact question declares that sufficient empirical evidence is available for autonomous resolution.
  - status: ready
    priority: 50
    when: >-
      question.payload.state == "open"
      && question.payload.kind == "empirical"
    reason: The evidence provider must supply exact empirical work now or return the question for explicit deferral, cancellation, or unsupported disposition.
default_status: blocked
resolve_with:
  scenario: resolve-question@2
  inputs:
    question: question
waiver_policy_ref: waiver-applicability@1
