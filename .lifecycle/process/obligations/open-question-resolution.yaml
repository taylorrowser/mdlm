kind: obligation-definition
id: open-question-resolution
version: 2
description: Every latest open question not explicitly bound to prototype evidence must be answered, explicitly deferred, or cancelled through an exact decision.
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("general-open-questions@1", {})'
subject_as: question
satisfied_when: 'question.payload.state in ["answered", "deferred", "cancelled"]'
status_rules:
  - status: blocked
    priority: 200
    when: 'question.payload.kind == "preferential"'
    reason: An explicit stakeholder answer is required; the process may not fabricate it.
  - status: ready
    priority: 100
    when: 'question.payload.kind == "empirical"'
    reason: The empirical question can be resolved when sufficient evidence is available.
default_status: blocked
resolve_with:
  scenario: resolve-question@1
  inputs:
    question: question
waiver_policy_ref: waiver-applicability@1
