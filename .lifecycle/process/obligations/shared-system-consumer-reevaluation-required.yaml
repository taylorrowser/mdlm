kind: obligation-definition
id: shared-system-consumer-reevaluation-required
version: 1
description: Every exact decomposition consumer of a replaced shared SYS requires its own serial same-lineage coverage reevaluation.
phases: [phase-2-system-definition, phase-7-change-control]
for_each: 'select("outdated-shared-system-consumers@2", {})'
subject_as: consumer
satisfied_when: 'exists("newer-revisions-for@1", {subject: consumer})'
status_rules:
  - status: blocked
    priority: 650
    when: >-
      !every("system-requirements-consumed-by@1", {consumer: consumer}, requirement =>
        (state(requirement, "disposition") == "active"
          && state(requirement, "validity") == "valid"
          && none("newer-revisions-for@1", {subject: requirement}))
        || !every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, replacement =>
          replacement.identity.id != requirement.identity.id))
    reason: At least one consumed-parent SYS lineage lacks an active valid latest replacement, so exact consumer support cannot yet be corrected.
  - status: ready
    priority: 200
    when: >-
      exists("replacement-system-requirements-for-consumer@2", {consumer: consumer})
      && every("system-requirements-consumed-by@1", {consumer: consumer}, requirement =>
        (state(requirement, "disposition") == "active"
          && state(requirement, "validity") == "valid"
          && none("newer-revisions-for@1", {subject: requirement}))
        || !every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, replacement =>
          replacement.identity.id != requirement.identity.id))
    reason: Rebind every exact current replacement for this one consumer; the public operator seam serializes consumers and ordinary Review obligations collect fresh evidence.
default_status: blocked
resolve_with:
  scenario: reevaluate-shared-system-consumer@1
  inputs:
    consumer: consumer
    replacement_requirements: 'select("system-requirements-after-consumer-reevaluation@1", {consumer: consumer})'
    parents: 'select("stakeholder-decomposition-parents-for@1", {plan: consumer})'
    architecture: 'one("architectures-for-decomposition@1", {plan: consumer})'
    interfaces: 'select("interfaces-for-decomposition@1", {plan: consumer})'
    verification_strategy: 'one("strategies-for-decomposition@1", {plan: consumer})'
    planning_source: 'first("planning-revisions-for-completion@1", {completion: consumer})'
    outputs: 'select("system-completion-outputs-for@1", {completion: consumer})'
    simplification_reviews: 'select("completion-simplification-evidence-for@1", {completion: consumer})'
    review_causes: 'select("review-causes-for-consumer-replacements@1", {consumer: consumer})'
    change_causes: 'select("change-causes-for-consumer-replacements@1", {consumer: consumer})'
waiver_policy_ref: waiver-applicability@1
