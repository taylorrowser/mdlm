kind: obligation-definition
id: shared-system-consumer-reevaluation-required
version: 1
description: Every exact decomposition consumer of a replaced shared SYS requires its own serial same-lineage coverage reevaluation and fresh Review.
phases: [phase-7-change-control]
for_each: 'select("changed-outdated-shared-system-consumers@1", {})'
subject_as: consumer
satisfied_when: 'exists("newer-revisions-for@1", {subject: consumer})'
status_rules:
  - status: blocked
    priority: 200
    when: >-
      count("replacement-system-requirements-for-consumer@2", {consumer: consumer}) != 1
      || !every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, requirement =>
        exists("valid-review-contexts-for@1", {subject: requirement})
        && exists("passing-reviews-for@1", {subject: requirement})
        && every("updated-shared-system-consumers-for-change@1",
          {change: one("changes-changed-under-subject@1", {subject: requirement})}, updated =>
            exists("valid-review-contexts-for@1", {subject: updated})
            && exists("passing-reviews-for@1", {subject: updated})))
    reason: The shared SYS replacement and every earlier serial consumer update require fresh Review evidence before the next coverage account.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("replacement-system-requirements-for-consumer@2", {consumer: consumer})'
  - status: ready
    priority: 100
    when: >-
      count("replacement-system-requirements-for-consumer@2", {consumer: consumer}) == 1
      && every("replacement-system-requirements-for-consumer@2", {consumer: consumer}, requirement =>
        exists("valid-review-contexts-for@1", {subject: requirement})
        && exists("passing-reviews-for@1", {subject: requirement})
        && every("updated-shared-system-consumers-for-change@1",
          {change: one("changes-changed-under-subject@1", {subject: requirement})}, updated =>
            exists("valid-review-contexts-for@1", {subject: updated})
            && exists("passing-reviews-for@1", {subject: updated})))
    reason: Rebind this one exact consumer after every earlier serial update has fresh Review evidence.
default_status: blocked
resolve_with:
  scenario: reevaluate-shared-system-consumer@1
  inputs:
    consumer: consumer
    replacement_requirement: 'one("replacement-system-requirements-for-consumer@2", {consumer: consumer})'
    change: 'one("changes-changed-under-subject@1", {subject: one("replacement-system-requirements-for-consumer@2", {consumer: consumer})})'
waiver_policy_ref: waiver-applicability@1
