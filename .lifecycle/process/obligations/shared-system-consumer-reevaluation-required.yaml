kind: obligation-definition
id: shared-system-consumer-reevaluation-required
version: 1
description: Every exact decomposition consumer of a replaced shared SYS requires its own serial same-lineage coverage reevaluation.
phases: [phase-2-system-definition, phase-7-change-control]
for_each: 'select("outdated-shared-system-consumers@2", {})'
subject_as: consumer
satisfied_when: 'exists("newer-revisions-for@1", {subject: consumer})'
status_rules:
  - status: ready
    priority: 100
    when: 'count("replacement-system-requirements-for-consumer@2", {consumer: consumer}) == 1'
    reason: Rebind this one exact consumer; the public operator seam serializes consumers and ordinary Review obligations collect fresh evidence.
default_status: blocked
resolve_with:
  scenario: reevaluate-shared-system-consumer@1
  inputs:
    consumer: consumer
    replacement_requirement: 'one("replacement-system-requirements-for-consumer@2", {consumer: consumer})'
waiver_policy_ref: waiver-applicability@1
