kind: obligation-definition
id: design-interface-refinement-required
version: 1
description: A DES set that changes an externally observable contract requires one same-lineage ICSP refinement; a compatible boundary reuses its exact current ICSP.
phases: [phase-4-design-definition]
for_each: 'select("decomposition-plans@1", {})'
subject_as: plan
satisfied_when: >-
  none("design-interface-refinement-requirements-for-plan@1", {plan: plan})
  || exists("current-design-interface-refinements-for-plan@1", {plan: plan})
status_rules:
  - status: ready
    priority: 100
    when: >-
      plan.payload.target_child_type == "DES"
      && exists("design-interface-refinement-requirements-for-plan@1", {plan: plan})
      && count("interfaces-for-decomposition@1", {plan: plan}) == 1
    reason: The exact changed DES boundary is ready for one same-lineage interface refinement.
default_status: blocked
resolve_with:
  scenario: refine-design-interface@1
  inputs:
    interface: 'one("interfaces-for-decomposition@1", {plan: plan})'
    existing_subjects: 'select("interface-subjects-for@1", {interface: one("interfaces-for-decomposition@1", {plan: plan})})'
    plan: plan
    changed_designs: 'select("design-interface-refinement-requirements-for-plan@1", {plan: plan})'
waiver_policy_ref: waiver-applicability@1
