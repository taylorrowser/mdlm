kind: obligation-definition
id: change-scope-amendment
version: 1
description: Obtain approval for discovered work outside current scope
phases:
- phase-0-tiny-product
for_each: select("current-requirements@1", {})
subject_as: subject
satisfied_when: 'none("fail-reviews@1", {subject: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("fail-reviews@1", {subject: subject}) && !every("fail-reviews@1",
    {subject: subject}, failed => failed.payload.scope_amendment_required == false)
    && every("change-for-set@1", {requirements: subject}, change => none("newer-revisions@1",
    {subject: change}))'
  reason: Required correction extends beyond approved change scope
default_status: blocked
resolve_with:
  scenario: amend-change@1
  inputs:
    subject: 'one("change-for-set@1", {requirements: subject})'
waiver_policy_ref: waiver-applicability@1
