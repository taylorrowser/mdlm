kind: obligation-definition
id: representative-level-pilot-target-required
version: 1
description: Every current pilot activity needs one exact disposable control target covering its complete requirement set.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
for_each: 'select("current-pilot-verification-activities@1", {})'
subject_as: activity
satisfied_when: 'count("current-pilot-targets-for-activity@1", {activity: activity}) == 1'
status_rules:
  - status: blocked
    priority: 300
    when: 'count("current-pilot-targets-for-activity@1", {activity: activity}) > 1'
    reason: Multiple current control targets are ambiguous.
  - status: awaiting-review
    priority: 250
    when: >-
      phase.id in ["phase-1-product-assurance", "phase-2-system-definition"]
      && none("passing-reviews-for@1", {subject: activity})
    reason: Disposable pilot controls wait for Review of the exact activity.
    blocked_by:
      - obligation: phase-1-assurance-review-required@1
        subjects: '[activity]'
  - status: awaiting-review
    priority: 200
    when: >-
      phase.id in ["phase-3-component-definition", "phase-4-design-definition"]
      && none("passing-reviews-for@1", {subject: activity})
    reason: Disposable pilot controls wait for Review of the exact activity.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[activity]'
  - status: ready
    priority: 100
    when: >-
      none("current-pilot-targets-for-activity@1", {activity: activity})
      && exists("passing-reviews-for@1", {subject: activity})
    reason: The reviewed representative activity is ready for one disposable good/bad control target.
default_status: blocked
resolve_with:
  scenario: build-representative-level-pilot-control-prototype@1
  inputs:
    requirements: 'select("requirements-for-pilot-activity@1", {activity: activity})'
    activity: activity
waiver_policy_ref: waiver-applicability@1
