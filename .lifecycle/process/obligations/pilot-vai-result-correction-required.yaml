kind: obligation-definition
id: pilot-vai-result-correction-required
version: 1
description: Accepted inconclusive pilot evidence requires one causal same-lineage VAI correction before fresh Review and execution.
phases: [phase-1-product-assurance, phase-2-system-definition]
for_each: 'select("verification-implementations-requiring-run@1", {})'
subject_as: implementation
satisfied_when: >-
  none("unfavorable-pilot-results-for-implementation@1",
    {implementation: implementation})
  || exists("pilot-result-corrections-for-implementation@1",
    {implementation: implementation})
status_rules:
  - status: ready
    priority: 100
    when: >-
      implementation.payload.kind == "pilot"
      && exists("unfavorable-pilot-results-for-implementation@1",
        {implementation: implementation})
      && none("unsuitable-pilot-results-for-implementation@1",
        {implementation: implementation})
    reason: Preserve the accepted RUN and RES, then correct the exact VAI and only the bound ENV or ART proven causal by that evidence.
default_status: blocked
resolve_with:
  scenario: revise-pilot-vai-after-result@1
  inputs:
    implementation: implementation
    failed_results: >-
      select("unfavorable-pilot-results-for-implementation@1",
        {implementation: implementation})
    activity: 'one("verification-activities-for-implementation@1", {implementation: implementation})'
    environment: 'one("environments-for-implementation@1", {implementation: implementation})'
    execution_target: 'one("pilot-art-targets-for-implementation@1", {implementation: implementation})'
    requirements: >-
      select("requirements-for-pilot-activity@1",
        {activity: one("verification-activities-for-implementation@1",
          {implementation: implementation})})
    strategy: >-
      one("strategies-for-verification-activity@1",
        {activity: one("verification-activities-for-implementation@1",
          {implementation: implementation})})
waiver_policy_ref: waiver-applicability@1
