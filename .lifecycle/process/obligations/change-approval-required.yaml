kind: obligation-definition
id: change-approval-required
version: 1
description: Every exact Change Request requires contextual Review and an exact approval Decision.
phases: [phase-7-change-control]
for_each: 'select("all-change-requests@1", {})'
subject_as: change
satisfied_when: 'exists("change-approval-decisions-for@1", {change: change})'
status_rules:
  - status: awaiting-review
    priority: 200
    when: 'none("passing-reviews-for@1", {subject: change})'
    reason: Impact analysis must pass contextual Review before approval.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[change]'
  - status: ready
    priority: 100
    when: 'exists("passing-reviews-for@1", {subject: change})'
    reason: The reviewed exact impact analysis can now receive an approval Decision.
default_status: blocked
resolve_with:
  scenario: approve-change-request@1
  inputs:
    change: change
waiver_policy_ref: waiver-applicability@1
