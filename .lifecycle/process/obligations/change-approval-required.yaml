kind: obligation-definition
id: change-approval-required
version: 2
description: Every exact reviewed Change Request receives one attended disposition whose exact Decision Review must pass before it applies.
phases: [phase-7-change-control]
for_each: 'select("all-change-requests@1", {})'
subject_as: change
satisfied_when: >-
  exists("change-approval-decisions-for@2", {change: change})
  || exists("terminal-change-disposition-decisions-for@1", {change: change})
status_rules:
  - status: blocked
    priority: 300
    when: >-
      exists("recorded-change-approval-decisions-for@2", {change: change})
      && none("change-approval-decisions-for@2", {change: change})
      && none("terminal-change-disposition-decisions-for@1", {change: change})
    reason: The exact attended Change Request disposition awaits its required passing Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("recorded-change-approval-decisions-for@2", {change: change})'
  - status: awaiting-review
    priority: 200
    when: 'none("passing-reviews-for@1", {subject: change})'
    reason: Exact traceability-based impact must pass contextual Review before attended disposition.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[change]'
  - status: ready
    priority: 100
    when: 'exists("passing-reviews-for@1", {subject: change})'
    reason: The exact reviewed impact can now receive one attended approve, reject, defer, or cancel Decision.
default_status: blocked
resolve_with:
  scenario: approve-change-request@3
  inputs:
    change: change
waiver_policy_ref: waiver-applicability@1
