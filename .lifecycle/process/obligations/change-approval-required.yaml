kind: obligation-definition
id: change-approval-required
version: 1
description: change approval required
phases:
- phase-0-tiny-product
for_each: select("current-changes@1", {})
subject_as: subject
satisfied_when: 'exists("reviews-for@1", {subject: subject})'
status_rules:
- status: ready
  priority: 110
  when: 'none("reviews-for@1", {subject: subject})'
  reason: change approval required
default_status: blocked
resolve_with:
  scenario: approve-change@1
  inputs:
    subject: subject
waiver_policy_ref: waiver-applicability@1
