kind: obligation-definition
id: passing-review-required
version: 2
description: Every review-required exact revision needs a current valid passing REV in a valid frozen context.
phases: [phase-2-system-definition, phase-2-pilot-assessment, phase-3-component-definition, phase-4-design-definition, phase-5-implementation, phase-6-verification, phase-7-change-control]
for_each: 'select("review-required-revisions@1", {})'
subject_as: subject
satisfied_when: >-
  exists("passing-reviews-for@1", {subject: subject})
  && none("failing-reviews-for@1", {subject: subject})
status_rules:
  - status: failed
    priority: 400
    when: 'exists("failing-reviews-for@1", {subject: subject})'
    reason: A current valid review failed; revise the subject or resolve its findings.
  - status: stale
    priority: 300
    when: 'exists("stale-reviews-for@1", {subject: subject})'
    reason: Prior review evidence exists but its subject or context changed.
    blocked_by:
      - obligation: review-context-required@2
        subjects: '[subject]'
  - status: blocked
    priority: 200
    when: 'none("valid-review-contexts-for@1", {subject: subject})'
    reason: Review cannot begin until an exact valid review context is frozen.
    blocked_by:
      - obligation: review-context-required@2
        subjects: '[subject]'
  - status: awaiting-review
    priority: 100
    when: 'exists("valid-review-contexts-for@1", {subject: subject})'
    reason: Exact context exists and an independent review is required.
default_status: blocked
resolve_with:
  scenario: review-datum-in-context@3
  inputs:
    subject: subject
    review_context: 'one("valid-review-contexts-for@1", {subject: subject})'
    context_members: 'select("review-assignment-context-members-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
