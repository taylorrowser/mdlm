kind: obligation-definition
id: component-decomposition-planning-required
version: 1
description: The exact accepted SYS slice requires one bounded component decomposition plan.
phases: [phase-3-component-definition]
for_each: 'select("phase-3-architecture-representative-requirements@1", {})'
subject_as: requirement
satisfied_when: 'exists("current-component-decomposition-plans@1", {})'
status_rules:
  - status: ready
    priority: 100
    when: >-
      count("current-component-architectures-for-requirement@1", {requirement: requirement}) == 1
      && count("current-component-strategies-for-requirement@1", {requirement: requirement}) == 1
      && exists("current-component-interfaces-for-architecture@1",
        {architecture: one("current-component-architectures-for-requirement@1", {requirement: requirement})})
    reason: Exact SYS parents, component architecture, interface, and strategy are ready for one DWP plan.
default_status: blocked
resolve_with:
  scenario: define-component-decomposition-work-package@1
  inputs:
    parents: 'select("phase-3-entry-requirements@1", {})'
    architecture: 'one("current-component-architectures-for-requirement@1", {requirement: requirement})'
    interfaces: 'select("current-component-interfaces-for-architecture@1", {architecture: one("current-component-architectures-for-requirement@1", {requirement: requirement})})'
    verification_strategy: 'one("current-component-strategies-for-requirement@1", {requirement: requirement})'
waiver_policy_ref: waiver-applicability@1
