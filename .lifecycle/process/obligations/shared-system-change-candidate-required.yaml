kind: obligation-definition
id: shared-system-change-candidate-required
version: 1
description: Every approved shared-SYS replacement requires both serial consumer updates, fresh Reviews, and one selective system candidate.
phases: [phase-7-change-control]
for_each: 'select("shared-system-change-requests@1", {})'
subject_as: change
satisfied_when: >-
  exists("shared-system-change-candidates-for@1", {change: change})
  || exists("terminal-change-disposition-decisions-for@1", {change: change})
status_rules:
  - status: blocked
    priority: 300
    when: 'none("change-approval-decisions-for@2", {change: change})'
    reason: Exact reviewed attended approval is required before accepted shared-system replacement.
    blocked_by:
      - obligation: change-approval-required@2
        subjects: '[change]'
  - status: blocked
    priority: 200
    when: >-
      count("revised-requirements-for-change@3", {change: change}) != 1
      || !every("revised-requirements-for-change@3", {change: change}, requirement =>
        exists("valid-review-contexts-for@1", {subject: requirement})
        && exists("passing-reviews-for@1", {subject: requirement}))
      || count("updated-shared-system-consumers-for-change@1", {change: change})
        != count("shared-system-consumers-for-change@1", {change: change})
      || !every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
        exists("valid-review-contexts-for@1", {subject: consumer})
        && exists("passing-reviews-for@1", {subject: consumer}))
    reason: The shared SYS and every exact consumer need separate same-lineage replacement coverage and fresh Review evidence.
    blocked_by:
      - obligation: change-revision-required@2
        subjects: '[change]'
      - obligation: shared-system-consumer-reevaluation-required@1
        subjects: 'select("changed-outdated-shared-system-consumers@1", {})'
  - status: ready
    priority: 100
    when: >-
      exists("change-approval-decisions-for@2", {change: change})
      && every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
        exists("passing-reviews-for@1", {subject: consumer}))
    reason: Assemble one exact selective system candidate with fresh changed evidence and byte-reused unaffected evidence.
default_status: blocked
resolve_with:
  scenario: create-shared-system-change-candidate@1
  inputs:
    change: change
    accepted: 'one("accepted-system-baselines-for-change@1", {change: change})'
    replacement: 'one("revised-system-requirements-for-change@1", {change: change})'
    updated_consumers: 'select("updated-shared-system-consumers-for-change@1", {change: change})'
    fresh_evidence: 'select("fresh-shared-system-change-evidence@1", {change: change})'
    reusable_definitions: >-
      select("reusable-system-change-definitions-for@1",
        {change: change, accepted: one("accepted-system-baselines-for-change@1", {change: change})})
    reusable_evidence: >-
      select("reusable-system-change-evidence-for@1",
        {change: change, accepted: one("accepted-system-baselines-for-change@1", {change: change})})
waiver_policy_ref: waiver-applicability@1
