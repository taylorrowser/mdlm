kind: obligation-definition
id: pilot-expansion-decision-required
version: 1
description: Every exact pilot assessment requires independent Review before an exact proceed, change, or stop Decision.
phases: [phase-2-pilot-assessment]
for_each: 'select("all-pilot-assessments@1", {})'
subject_as: assessment
satisfied_when: 'exists("pilot-expansion-decisions-for@1", {assessment: assessment})'
status_rules:
  - status: blocked
    priority: 300
    when: >-
      exists("recorded-pilot-expansion-decisions-for@1", {assessment: assessment})
      && none("pilot-expansion-decisions-for@1", {assessment: assessment})
    reason: The exact expansion Decision awaits its policy-required passing Review.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: 'select("recorded-pilot-expansion-decisions-for@1", {assessment: assessment})'
  - status: failed
    priority: 250
    when: 'exists("failing-reviews-for@1", {subject: assessment})'
    reason: The current pilot assessment failed independent Review and requires an exact corrected Revision.
    blocked_by:
      - obligation: pilot-assessment-review-correction-required@1
        subjects: '[assessment]'
  - status: awaiting-review
    priority: 200
    when: 'none("passing-reviews-for@1", {subject: assessment})'
    reason: Pilot measurements must pass independent contextual Review before the expansion Decision.
    blocked_by:
      - obligation: passing-review-required@2
        subjects: '[assessment]'
  - status: ready
    priority: 100
    when: >-
      exists("passing-reviews-for@1", {subject: assessment})
      && none("failing-reviews-for@1", {subject: assessment})
    reason: Reviewed pilot measurements support an exact proceed, change, or stop Decision.
default_status: blocked
resolve_with:
  scenario: decide-pilot-expansion@2
  inputs:
    assessment: assessment
    assessment_review: 'one("passing-reviews-for@1", {subject: assessment})'
waiver_policy_ref: waiver-applicability@1
