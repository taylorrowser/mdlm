kind: obligation-definition
id: acceptance-required
version: 1
description: acceptance required
phases:
- phase-0-tiny-product
for_each: select("current-implementations@1", {})
subject_as: subject
satisfied_when: 'exists("acceptances-for@1", {implementation: subject})'
status_rules:
- status: ready
  priority: 100
  when: 'exists("pass-reviews@1", {subject: subject}) && none("fail-reviews@1", {subject:
    subject}) && exists("passing-results@1", {implementation: subject})'
  reason: acceptance required
default_status: blocked
resolve_with:
  scenario: accept-product@1
  inputs:
    implementation: subject
    requirements: 'one("requirements-for@1", {implementation: subject})'
    result: 'one("passing-results@1", {implementation: subject})'
waiver_policy_ref: waiver-applicability@1
