kind: obligation-definition
id: review-context-required
version: 2
description: Every review-required Revision and each Phase 3 planning DWP must appear in an exact valid frozen Review Context before judgment or same-lineage completion.
phases: [phase-2-system-definition, phase-2-pilot-assessment, phase-3-component-definition, phase-7-change-control]
for_each: 'select("review-context-subjects@1", {})'
subject_as: subject
satisfied_when: 'exists("valid-review-contexts-for@1", {subject: subject})'
status_rules:
  - status: blocked
    priority: 350
    when: >-
      phase.id == "phase-0-wayfinding"
      && subject.identity.type == "STK"
      && !every("current-product-specifications@1", {}, product_specification =>
        every("stakeholder-requirements-for-review-context@1",
          {product_specification: product_specification}, requirement =>
            requirement != subject)
        || exists("passing-reviews-for@1", {subject: product_specification}))
    reason: Stakeholder-requirement Review context waits for a passing independent Review of every exact current PSP parent.
  - status: blocked
    priority: 300
    when: >-
      phase.id in ["phase-1-product-assurance", "phase-2-system-definition"]
      && subject.identity.type == "ENV"
      && (none("complete-environment-assurance-for-environment@1", {environment: subject})
      || none("complete-environment-qualification-for-environment@1", {environment: subject}))
    reason: Environment Review context waits for one exact profile realization and its passing qualification VER, VAI, RUN, and RES evidence.
    blocked_by:
      - obligation: verification-run-required@2
        subjects: 'select("qualification-implementations-for-environment@1", {environment: subject})'
  - status: stale
    priority: 200
    when: 'exists("stale-review-contexts-for@1", {subject: subject})'
    reason: Prior context exists but a declared dependency changed.
  - status: ready
    priority: 100
    when: 'none("valid-review-contexts-for@1", {subject: subject})'
    reason: A deterministic exact review context can be created now.
default_status: ready
resolve_with:
  scenario: create-review-context@2
  inputs:
    subject: subject
    context_members: 'select("review-context-members-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
