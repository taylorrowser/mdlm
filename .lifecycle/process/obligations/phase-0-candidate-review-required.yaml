kind: obligation-definition
id: phase-0-candidate-review-required
version: 1
description: Each active Phase 0 intent candidate needs one atomic Review Context and passing independent Review.
phases: [phase-0-wayfinding]
for_each: 'select("phase-0-candidate-review-required-revisions@1", {})'
subject_as: subject
satisfied_when: >-
  exists("passing-reviews-for@1", {subject: subject})
  && none("failing-reviews-for@1", {subject: subject})
status_rules:
  - status: failed
    priority: 200
    when: 'exists("failing-reviews-for@1", {subject: subject})'
    reason: The current exact intent candidate has a failed Review.
  - status: awaiting-review
    priority: 100
    when: 'true'
    reason: The exact intent candidate and its required support can be reviewed atomically.
default_status: awaiting-review
resolve_with:
  scenario: review-phase-0-candidate@1
  inputs:
    subject: subject
    review_context_members: 'select("review-context-members-for@1", {subject: subject})'
waiver_policy_ref: waiver-applicability@1
