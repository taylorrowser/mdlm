kind: obligation-definition
id: phase-2-atomic-review-required
version: 1
description: Each ordinary active Phase 2 Revision needs one atomic Review Context and independent Review.
phases: [phase-2-system-definition]
for_each: 'select("phase-2-atomic-review-required-revisions@1", {})'
subject_as: subject
satisfied_when: >-
  exists("passing-reviews-for@1", {subject: subject})
  && none("failing-reviews-for@1", {subject: subject})
status_rules:
  - status: failed
    priority: 300
    when: 'exists("failing-reviews-for@1", {subject: subject})'
    reason: The current exact Phase 2 Revision has a failed Review.
  - status: awaiting-review
    priority: 100
    when: 'true'
    reason: The exact Phase 2 Revision and its deterministic context can be reviewed atomically.
default_status: awaiting-review
resolve_with:
  scenario: review-phase-2-datum@1
  dispatch:
    for_each: 'select("phase-2-atomic-review-dispatch-for@1", {subject: subject})'
    as: review_subject
  inputs:
    subject: review_subject
    review_context_members: 'select("review-context-members-for@1", {subject: review_subject})'
waiver_policy_ref: waiver-applicability@1
