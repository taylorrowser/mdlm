kind: phase-definition
id: phase-6-verification
version: 1
order: 6
name: Formal verification and product acceptance
purpose: Execute exact reviewed formal verification implementations bottom-up against one controlled implementation, assess judgment-dependent results, and obtain reviewed stakeholder product acceptance.
coverage: bootstrap-subset
omitted_capabilities:
  - downstream change implementation after a formal product failure
entry: >-
  process.integrity.package_valid == true
  && exists("accepted-design-baselines@1", {})
attention_checkpoints: []
routing:
  eligible_when: dispatchable
  status_order: [ready, awaiting-review, failed, stale, blocked]
  tie_breakers: [subject, obligation]
outputs: [RUN, RES, REV, BSL, DEC, PRB]
progression: null
gate:
  required: false
  candidate_selector: 'select("accepted-design-baselines@1", {})'
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: 'false'
