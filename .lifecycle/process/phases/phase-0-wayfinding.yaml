kind: phase-definition
id: phase-0-wayfinding
version: 3
order: 0
name: Wayfinding bootstrap
purpose: Establish reviewed, scope-challenged product intent and stakeholder commitments for explicit user approval.
coverage: bootstrap-subset
omitted_capabilities:
  - VSP and environment profiles
  - dedicated simplification REV over the complete candidate
entry: 'process.integrity.package_valid == true'
attention_checkpoints:
  - id: phase-0-gate
    readiness: >-
      exists("candidate-baselines-of-kind@1", {baseline_kind: "intent-level-candidate"})
      && every("candidate-baselines-of-kind@1",
        {baseline_kind: "intent-level-candidate"}, candidate =>
          none("candidate-members-missing-review@1", {candidate: candidate})
          && exists("passing-reviews-for@1", {subject: candidate})
          && none("failing-reviews-for@1", {subject: candidate}))
      && none("open-blocking-questions@1", {})
scenarios:
  - chart-wayfinding-map@1
  - establish-initial-wayfinding-map@1
  - build-exploratory-prototype@1
  - compile-psp@2
  - draft-stakeholder-requirements@2
  - create-review-context@1
  - review-datum-in-context@2
  - resolve-question@2
  - resolve-question-with-prototype@2
  - create-phase-0-intent-candidate@1
  - record-gate-signoff@3
  - record-consequential-decision@1
  - revise-foundation-after-review@4
  - escalate-foundation-review-correction@1
  - revise-intent-candidate-after-review@2
  - revise-gate-signoff-after-review@1
obligations:
  - initial-wayfinding-map-required@1
  - product-specification-required@1
  - stakeholder-requirements-required@1
  - intent-candidate-required@2
  - foundation-review-correction-required@4
  - foundation-review-escalation-required@1
  - intent-candidate-review-correction-required@2
  - gate-signoff-review-correction-required@1
  - review-context-required@2
  - passing-review-required@2
  - open-question-resolution@2
  - prototype-question-resolution@1
  - candidate-members-reviewed@2
  - candidate-gate-signoff@3
outputs: [MAP, QST, DEC, ART, PSP, STK, REV, BSL]
progression:
  next_phase: phase-1-product-assurance
  readiness: >-
    exists("candidate-baselines-of-kind@1", {baseline_kind: "intent-level-candidate"})
    && every("candidate-baselines-of-kind@1",
      {baseline_kind: "intent-level-candidate"}, candidate =>
        none("candidate-members-missing-review@1", {candidate: candidate})
        && exists("passing-reviews-for@1", {subject: candidate})
        && none("failing-reviews-for@1", {subject: candidate}))
    && none("open-blocking-questions@1", {})
  authorization:
    condition: >-
      exists("candidate-baselines-of-kind@1", {baseline_kind: "intent-level-candidate"})
      && every("candidate-baselines-of-kind@1",
        {baseline_kind: "intent-level-candidate"}, candidate =>
          exists("applicable-gate-signoffs-for@1", {candidate: candidate}))
    policy_ref: phase-progression-participation@1
    arguments: {phase: phase}
    scenario: record-gate-signoff@3
    subjects: >-
      select("candidate-baselines-of-kind@1", {baseline_kind: "intent-level-candidate"})
    evidence_selector: applicable-gate-signoffs-for@1
gate:
  required: true
  candidate_selector: >-
    select("candidate-baselines-of-kind@1",
      {baseline_kind: "intent-level-candidate"})
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: >-
    none("candidate-members-missing-review@1", {candidate: candidate})
    && exists("passing-reviews-for@1", {subject: candidate})
    && none("failing-reviews-for@1", {subject: candidate})
    && none("open-blocking-questions@1", {})
    && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
