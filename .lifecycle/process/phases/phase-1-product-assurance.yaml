kind: phase-definition
id: phase-1-product-assurance
version: 9
order: 1
name: Product assurance qualification and pilot
purpose: Qualify one declared environment and demonstrate that a source-independent pilot design distinguishes supported from intentionally unsupported behavior.
coverage: bootstrap-subset
omitted_capabilities:
  - complete Phase 1 candidate composition and gate
  - dedicated product simplification review
  - downstream STK acceptance
entry: 'process.integrity.package_valid == true'
routing:
  eligible_when: dispatchable
  status_order: [ready, awaiting-review, failed, stale, blocked]
  tie_breakers: [subject, obligation]
outputs: [VSP, ENV, VER, VAI, RUN, RES, REV, BSL, QST, DEC, ART]
progression:
  next_phase: phase-2-system-definition
  readiness: >-
    exists("current-pilot-verification-activities@1", {})
    && every("current-pilot-verification-activities@1", {}, activity =>
      exists("complete-pilot-implementations-for-activity@1", {activity: activity})
      && every("complete-pilot-implementations-for-activity@1", {activity: activity},
        implementation => exists("exercised-pilot-runs-for-implementation@2",
          {implementation: implementation})))
  authorization:
    condition: >-
      exists("current-pilot-verification-activities@1", {})
      && every("current-pilot-verification-activities@1", {}, activity =>
        exists("complete-pilot-implementations-for-activity@1", {activity: activity})
        && every("complete-pilot-implementations-for-activity@1", {activity: activity},
        implementation => exists("exercised-pilot-runs-for-implementation@2",
            {implementation: implementation})))
    policy_ref: phase-progression-participation@1
    arguments: {phase: phase}
    scenario: execute-verification-run@2
    subjects: 'select("current-pilot-verification-activities@1", {})'
    evidence_selector: complete-pilot-implementations-for-activity@1
gate:
  required: false
  candidate_selector: 'select("candidate-baselines-of-kind@1", {baseline_kind: "group-candidate"})'
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: 'false'
