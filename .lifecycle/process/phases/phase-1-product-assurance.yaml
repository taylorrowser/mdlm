kind: phase-definition
id: phase-1-product-assurance
version: 5
order: 1
name: Product assurance qualification and pilot
purpose: Qualify one declared environment and demonstrate that a source-independent pilot design distinguishes supported from intentionally unsupported behavior.
coverage: bootstrap-subset
omitted_capabilities:
  - complete Phase 1 candidate composition and gate
  - dedicated product simplification review
  - downstream STK acceptance
entry: 'process.integrity.package_valid == true'
scenarios:
  - define-verification-strategy@1
  - realize-verification-environment@1
  - write-verification-activity@1
  - register-pilot-target@1
  - implement-verification-activity@1
  - execute-verification-run@1
  - revise-verification-strategy-after-review@2
  - revise-environment-assurance-after-review@2
  - revise-pilot-verification-activity-after-review@2
  - revise-pilot-vai-after-review@1
  - prepare-pilot-assessment-context@1
  - create-review-context@2
  - review-datum-in-context@3
  - resolve-question@2
  - resolve-question-with-prototype@2
  - record-consequential-decision@1
obligations:
  - verification-strategy-required@1
  - environment-assurance-required@2
  - pilot-verification-activity-required@2
  - pilot-target-required@1
  - pilot-verification-implementation-required@1
  - review-context-required@2
  - passing-review-required@2
  - open-question-resolution@3
  - prototype-question-resolution@1
  - verification-run-required@1
  - verification-strategy-review-correction-required@2
  - environment-review-correction-required@2
  - pilot-verification-activity-review-correction-required@2
  - pilot-vai-review-correction-required@1
outputs: [VSP, ENV, VER, VAI, RUN, RES, REV, BSL, QST, DEC, ART]
progression:
  next_phase: phase-2-system-definition
  readiness: >-
    exists("current-pilot-verification-activities@1", {})
    && every("current-pilot-verification-activities@1", {}, activity =>
      exists("complete-pilot-implementations-for-activity@1", {activity: activity})
      && every("complete-pilot-implementations-for-activity@1", {activity: activity},
        implementation => exists("completed-runs-for-implementation@1",
          {implementation: implementation})))
  authorization:
    condition: >-
      exists("current-pilot-verification-activities@1", {})
      && every("current-pilot-verification-activities@1", {}, activity =>
        exists("complete-pilot-implementations-for-activity@1", {activity: activity})
        && every("complete-pilot-implementations-for-activity@1", {activity: activity},
          implementation => exists("completed-runs-for-implementation@1",
            {implementation: implementation})))
    policy_ref: phase-progression-participation@1
    arguments: {phase: phase}
    scenario: execute-verification-run@1
    subjects: 'select("current-pilot-verification-activities@1", {})'
    evidence_selector: complete-pilot-implementations-for-activity@1
gate:
  required: false
  candidate_selector: 'select("candidate-baselines-of-kind@1", {baseline_kind: "group-candidate"})'
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: 'false'
