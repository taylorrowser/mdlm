kind: phase-definition
id: phase-4-design-definition
version: 1
order: 4
name: Design definition
purpose: Derive and coherently review one exact CMP-to-DES slice, complete formal design coverage, approve one direct candidate, and mechanically accept its component predecessor.
coverage: bootstrap-subset
omitted_capabilities:
  - product implementation
  - formal verification implementation and execution
entry: >-
  process.integrity.package_valid == true
  && exists("complete-phase-3-level-candidates@1", {})
  && every("complete-phase-3-level-candidates@1", {}, candidate =>
    exists("applicable-gate-signoffs-for@1", {candidate: candidate}))
attention_checkpoints:
  - id: phase-4-design-gate
    readiness: >-
      exists("complete-phase-4-level-candidates@1", {})
      && every("complete-phase-4-level-candidates@1", {}, candidate =>
        exists("passing-reviews-for@1", {subject: candidate})
        && none("failing-reviews-for@1", {subject: candidate}))
routing:
  eligible_when: dispatchable
  status_order: [ready, awaiting-review, failed, stale, blocked]
  tie_breakers: [subject, obligation]
outputs: [DES, ICSP, DWP, VSP, VER, REV, BSL, QST, DEC]
progression: null
gate:
  required: true
  candidate_selector: 'select("complete-phase-4-level-candidates@1", {})'
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: >-
    exists("passing-reviews-for@1", {subject: candidate})
    && none("failing-reviews-for@1", {subject: candidate})
    && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
    && exists("accepted-component-baselines-for-design-candidate@1",
      {candidate: candidate})
