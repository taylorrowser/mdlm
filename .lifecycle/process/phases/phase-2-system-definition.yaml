kind: phase-definition
id: phase-2-system-definition
version: 6
order: 2
name: System definition tracer
purpose: Plan, review, execute, simplify, and complete one bounded decomposition into an exact reviewed SYS candidate with architecture and interface context.
coverage: bootstrap-subset
omitted_capabilities:
  - formal SYS verification execution
  - downstream promotion of STK candidates
  - multiple architecture groups and cross-group reconciliation
entry: >-
  process.integrity.package_valid == true
  && exists("signed-off-candidates-of-kind@1",
    {baseline_kind: "intent-level-candidate"})
attention_checkpoints:
  - id: phase-2-system-gate
    readiness: >-
      exists("phase-2-entry-requirements@1", {})
      && every("phase-2-entry-requirements@1", {}, requirement =>
        exists("matching-complete-phase-2-requirement@1", {requirement: requirement}))
      && exists("complete-phase-2-level-candidates@1", {})
      && every("complete-phase-2-level-candidates@1", {}, candidate =>
          none("candidate-members-missing-review@1", {candidate: candidate})
          && exists("passing-reviews-for@1", {subject: candidate})
          && none("failing-reviews-for@1", {subject: candidate}))
      && none("open-blocking-questions@1", {})
scenarios:
  - define-system-architecture@2
  - define-interface-control-specification@2
  - define-decomposition-work-package@2
  - execute-decomposition-work-package@2
  - create-review-context@1
  - review-datum-in-context@2
  - simplify-requirement-set@2
  - simplify-architecture-and-interfaces@2
  - revise-phase-2-subject-after-simplification@1
  - revise-phase-2-definition-set-after-simplification@1
  - complete-decomposition-work-package@2
  - resolve-question@2
  - resolve-question-with-prototype@2
  - create-candidate-baseline@1
  - create-decomposition-group-candidate@1
  - create-system-level-candidate@1
  - record-gate-signoff@3
  - record-consequential-decision@1
obligations:
  - review-context-required@2
  - passing-review-required@2
  - open-question-resolution@3
  - prototype-question-resolution@1
  - system-architecture-required@1
  - interface-control-specification-required@1
  - decomposition-planning-required@1
  - decomposition-execution-required@1
  - decomposition-output-reviews-required@1
  - decomposition-simplification-required@1
  - architecture-interface-simplification-required@1
  - phase-2-simplification-correction-required@1
  - phase-2-definition-consistency-correction-required@1
  - decomposition-completion-required@1
  - decomposition-parent-coverage-required@1
  - decomposition-group-candidate-required@1
  - system-level-candidate-required@1
  - candidate-members-reviewed@2
  - candidate-gate-signoff@3
outputs: [SYS, ASP, ICSP, DWP, REV, BSL, QST, DEC, ART]
progression:
  next_phase: phase-2-pilot-assessment
  readiness: >-
    exists("phase-2-entry-requirements@1", {})
    && every("phase-2-entry-requirements@1", {}, requirement =>
      exists("matching-complete-phase-2-requirement@1", {requirement: requirement}))
    && exists("complete-phase-2-level-candidates@1", {})
    && every("complete-phase-2-level-candidates@1", {}, candidate =>
        none("candidate-members-missing-review@1", {candidate: candidate})
        && exists("passing-reviews-for@1", {subject: candidate})
        && none("failing-reviews-for@1", {subject: candidate}))
    && none("open-blocking-questions@1", {})
  authorization:
    condition: >-
      exists("phase-2-entry-requirements@1", {})
      && every("phase-2-entry-requirements@1", {}, requirement =>
        exists("matching-complete-phase-2-requirement@1", {requirement: requirement}))
      && exists("complete-phase-2-level-candidates@1", {})
      && every("complete-phase-2-level-candidates@1", {}, candidate =>
          exists("applicable-gate-signoffs-for@1", {candidate: candidate}))
    policy_ref: phase-progression-participation@1
    arguments: {phase: phase}
    scenario: record-gate-signoff@3
    subjects: >-
      select("complete-phase-2-level-candidates@1", {})
    evidence_selector: applicable-gate-signoffs-for@1
gate:
  required: true
  candidate_selector: 'select("complete-phase-2-level-candidates@1", {})'
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: >-
    none("candidate-members-missing-review@1", {candidate: candidate})
    && exists("passing-reviews-for@1", {subject: candidate})
    && none("open-blocking-questions@1", {})
    && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
