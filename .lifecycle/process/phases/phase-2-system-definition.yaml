kind: phase-definition
id: phase-2-system-definition
version: 2
order: 2
name: System definition bootstrap
purpose: Test traceable derivation, contextual review, and candidate baselining for solution-independent SYS requirements.
coverage: bootstrap-subset
omitted_capabilities:
  - Phase 1 product assurance
  - DWP planning and completion
  - system VSP and verification pilot
  - ASP and ICSP definition
  - dedicated requirement and architecture simplification reviews
  - downstream promotion of STK candidates
entry: >-
  process.integrity.package_valid == true
  && exists("signed-off-candidates-of-kind@1",
    {baseline_kind: "intent-level-candidate"})
scenarios:
  - derive-system-requirements@1
  - create-review-context@1
  - review-datum-in-context@1
  - resolve-question@1
  - create-candidate-baseline@1
  - record-gate-signoff@1
obligations:
  - review-context-required@2
  - passing-review-required@2
  - open-question-resolution@2
  - candidate-members-reviewed@2
  - candidate-gate-signoff@2
outputs: [SYS, REV, BSL, QST, DEC]
gate:
  required: true
  candidate_selector: >-
    select("candidate-baselines-of-kind@1",
      {baseline_kind: "level-candidate"})
  candidate_as: candidate
  completion: >-
    none("candidate-members-missing-review@1", {candidate: candidate})
    && exists("passing-reviews-for@1", {subject: candidate})
    && none("open-blocking-questions@1", {})
    && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
