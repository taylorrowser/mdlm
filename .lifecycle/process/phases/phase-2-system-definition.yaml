kind: phase-definition
id: phase-2-system-definition
version: 10
order: 2
name: System definition tracer
purpose: Preflight coherent topology, then plan, review, execute, and semantically simplify proportional many-to-many decomposition into exact reviewed SYS candidates.
coverage: bootstrap-subset
omitted_capabilities:
  - formal SYS verification execution
  - downstream promotion of STK candidates
  - cross-group reconciliation beyond exact parent traceability
entry: >-
  process.integrity.package_valid == true
  && exists("signed-off-candidates-of-kind@1",
    {baseline_kind: "intent-level-candidate"})
attention_checkpoints:
  - id: phase-2-system-gate
    readiness: >-
      exists("phase-2-entry-requirements@1", {})
      && every("phase-2-entry-requirements@1", {}, requirement =>
        exists("matching-complete-phase-2-requirement@1", {requirement: requirement}))
      && exists("complete-phase-2-level-candidates@1", {})
      && every("complete-phase-2-level-candidates@1", {}, candidate =>
          none("candidate-members-missing-review@1", {candidate: candidate})
          && exists("passing-reviews-for@1", {subject: candidate})
          && none("failing-reviews-for@1", {subject: candidate})
          && !every("candidates-with-suitable-representative-pilot@1", {}, ready =>
            ready != candidate))
      && none("open-blocking-questions@1", {})
routing:
  eligible_when: dispatchable
  status_order: [ready, awaiting-review, failed, stale, blocked]
  tie_breakers: [subject, obligation]
outputs: [SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, QST, DEC, ART]
progression:
  next_phase: phase-2-pilot-assessment
  readiness: >-
    exists("phase-2-entry-requirements@1", {})
    && every("phase-2-entry-requirements@1", {}, requirement =>
      exists("matching-complete-phase-2-requirement@1", {requirement: requirement}))
    && exists("complete-phase-2-level-candidates@1", {})
    && every("complete-phase-2-level-candidates@1", {}, candidate =>
        none("candidate-members-missing-review@1", {candidate: candidate})
        && exists("passing-reviews-for@1", {subject: candidate})
        && none("failing-reviews-for@1", {subject: candidate})
        && !every("candidates-with-suitable-representative-pilot@1", {}, ready =>
          ready != candidate)
        && exists("accepted-system-baselines-for-candidate@1",
          {candidate: candidate}))
    && none("open-blocking-questions@1", {})
  authorization:
    condition: >-
      exists("phase-2-entry-requirements@1", {})
      && every("phase-2-entry-requirements@1", {}, requirement =>
        exists("matching-complete-phase-2-requirement@1", {requirement: requirement}))
      && exists("complete-phase-2-level-candidates@1", {})
      && every("complete-phase-2-level-candidates@1", {}, candidate =>
          exists("applicable-gate-signoffs-for@1", {candidate: candidate}))
    policy_ref: phase-progression-participation@1
    arguments: {phase: phase}
    scenario: record-gate-signoff@3
    subjects: >-
      select("complete-phase-2-level-candidates@1", {})
    evidence_selector: applicable-gate-signoffs-for@1
gate:
  required: true
  candidate_selector: 'select("complete-phase-2-level-candidates@1", {})'
  candidate_as: candidate
  obligation: candidate-gate-signoff@3
  completion: >-
    none("candidate-members-missing-review@1", {candidate: candidate})
    && exists("passing-reviews-for@1", {subject: candidate})
    && !every("candidates-with-suitable-representative-pilot@1", {}, ready =>
      ready != candidate)
    && none("open-blocking-questions@1", {})
    && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
