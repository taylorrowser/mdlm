kind: type-template-definition
id: requirement
version: 2
description: Singular rationale-backed requirement with explicit verification intent and shared correction and change causality.
extends: rationale-bearing@1
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [statement, verification_intent]
  properties:
    statement: {type: string, minLength: 1}
    verification_intent: {type: string, minLength: 1}
outgoing_links:
  - id: corrects-review
    description: Exact failed Reviews whose blocking findings this replacement requirement Revision addresses.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by
  - id: corrects-gate-rejection
    description: Exact reviewed gate rejection Decisions addressed by this replacement requirement Revision.
    targets:
      - {kind: datum, types: [DEC], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-gate-rejection
  - id: changed-under
    description: Exact approved Change Request authorizing this replacement requirement Revision.
    targets:
      - {kind: datum, types: [CHG], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: changed-requirement
