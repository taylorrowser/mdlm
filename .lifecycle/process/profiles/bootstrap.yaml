kind: implementation-profile-definition
id: bootstrap
version: 51
status: experimental
description: Fresh bootstrap profile through bottom-up formal verification and reviewed final product acceptance.
enabled:
  types: [MAP, QST, DEC, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS]
  phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition, phase-5-implementation, phase-6-verification]
  obligation_statuses: [ready, blocked, awaiting-review, stale, failed]
disabled_capabilities: []
terminal_outcomes:
  profile_boundary:
    condition: >-
      (
        phase.id == "phase-1-product-assurance"
        && (
          !every("current-phase-1-stakeholder-requirements@1", {}, requirement =>
            count("verification-strategies-for-requirement@1",
              {requirement: requirement}) <= 1)
          || !every("current-phase-1-verification-strategies@1", {}, strategy =>
            count("environments-for-strategy@1", {strategy: strategy}) <= 1)
          || !every("current-pilot-verification-activities@1", {}, activity =>
            count("current-pilot-targets-for-activity@1",
              {activity: activity}) <= 1)
        )
      )
      || (
        phase.id == "phase-2-pilot-assessment"
        && exists("all-pilot-assessments@1", {})
        && every("all-pilot-assessments@1", {}, assessment =>
          count("pilot-expansion-decisions-for@1", {assessment: assessment}) == 1
          && every("pilot-expansion-decisions-for@1", {assessment: assessment}, decision =>
            decision.payload.decision == "proceed"))
      )
      || (
        phase.id == "phase-7-change-control"
        && exists("all-pilot-assessments@1", {})
        && every("all-pilot-assessments@1", {}, assessment =>
          count("pilot-expansion-decisions-for@1", {assessment: assessment}) == 1
          && every("pilot-expansion-decisions-for@1", {assessment: assessment}, decision =>
            decision.payload.decision == "change"))
      )
      || (
        phase.id == "phase-6-verification"
        && exists("problem-reportable-results@1", {})
        && every("problem-reportable-results@1", {}, result =>
          count("problem-reports-for-result@1", {result: result}) == 1)
      )
    explanation: The selected profile stops at an explicit retained breadth, change-control boundary, or exact Phase 6 Problem Report; the passing full-V route continues through final acceptance.
  lifecycle_complete:
    condition: >-
      (phase.id == "phase-2-pilot-assessment"
        && exists("all-pilot-assessments@1", {})
        && every("all-pilot-assessments@1", {}, assessment =>
          count("pilot-expansion-decisions-for@1", {assessment: assessment}) == 1
          && every("pilot-expansion-decisions-for@1", {assessment: assessment}, decision =>
            decision.payload.decision == "stop")))
      || (phase.id == "phase-6-verification"
        && exists("phase-6-product-scope-baselines@1", {})
        && every("phase-6-product-scope-baselines@1", {}, subject =>
          count("applicable-product-acceptance-decisions-for@1", {subject: subject}) == 1))
    explanation: The lifecycle completes after an explicit early stop or after one independently reviewed attended product-acceptance Decision covers the exact complete Phase 6 evidence set.
success_criteria:
  - every definition conforms to its versioned meta-schema
  - the kernel envelope cannot be weakened by templates or types
  - all template, policy, selector, state, scenario, phase, prompt, skill, and rubric references resolve exactly
  - template flattening is deterministic and rejects widening or inheritance cycles
  - selector, policy, state, and obligation dependency graphs are acyclic
  - no process-specific computed fact is required by a rule
  - every unsatisfied obligation has a type-correct enabled resolver
  - every non-Resolver Scenario declares explicit initiation and publishes one validated atomic output batch
  - every type named by an authority-evidence contract publishes only through validated Scenario execution
  - every current open QST receives one package-authored exact source boundary before a same-lineage Resolver output, while prototype-bound empirical QST routes to exact bounded ART, DEC, and satisfying QST evidence and generic empirical questions retain their non-prototype resolver
  - one small MAP-to-reviewed-intent slice reaches an exact reviewed Gate Sign-off through generic surfaces
  - every replacement or newly published QST declares the exact stable Lifecycle Data that it continues to block
  - the initial product-intent Question is frozen and resolved through immediate attended stakeholder authority before autonomous PSP compilation receives its exact passing-reviewed scope Decision
  - the complete required Phase 0 foundation emerges from package Obligations, including exact correction and re-Review after failure
  - the exact intent candidate is the earliest complete evidence-bearing product set and receives independent product-simplification judgment before downstream verification or decomposition
  - lifecycle information is allocated once at its authoritative level without upward or downward restatement
  - coherent STK responsibility and trust contexts share the smallest justified ASP and many-to-many DWP while materially distinct contexts remain separate
  - every definition author runs bounded ephemeral rubric preflight without publishing or disclosing it to independent Review
  - every primary blocking Review Finding names an exact criterion, concrete evidence, and material consequence
  - current Review Context membership is derived exactly from package selectors and kernel-finalized without agent context choice
  - every ordinary Phase 2 independent Review atomically publishes its exact kernel-finalized Review Context and REV while routes that consume a context before other work retain explicit materialization
  - blocking simplification findings derive exact causal member or candidate correction, fresh independent Review, bounded autonomous retries, and attended escalation through one correction interface
  - a reviewed gate rejection derives exact implicated-member or candidate correction, fresh Reviews, a superseding candidate with unaffected evidence preserved, and re-entry to the same gate without implying terminal disposition
  - reviewed approving gate evidence mechanically publishes one exact accepted-intent baseline before declarative entry to Phase 1 without redundant authority
  - failed Reviews of current VSP, ENV, pilot VER, and source-blind pilot VAI Revisions derive exact same-lineage correction with every applicable Review and Finding, fresh context and Review, two autonomous cycles before attended escalation, and a fresh exact qualification chain for corrected ENV assurance
  - corrected pilot VAI procedures preserve the exact pilot claim class, requirement, strategy, declared cases, and behavior scope while binding either the reviewed VER/ENV/ART Revisions or one exact same-lineage reconciliation from the same atomic transaction; an ENV reconciliation requires a fresh qualification chain, and every correction requires bounded checkout, environment-check, and product-case deadlines, forced termination and reaping, partial raw observation, guaranteed cleanup, continue-through-all-cases aggregation, fresh Review, and fresh run evidence
  - accepted inconclusive or unsuitable pilot results preserve their exact RUN and RES, block unchanged VAI execution, and derive one bounded same-lineage VAI correction with optional exact ENV or ART reconciliation before fresh Review and execution
  - every current pilot activity discovers one exact ART target covering its complete governed requirement set, either a disposable inline good/bad control pair bound to its reviewed VER or an immutable bounded repository registration with deterministic exact-byte command observations
  - one qualified ENV and source-independent pilot distinguish supported from intentionally unsupported behavior without formal evidence
  - accepted exact intent derives ASP, ICSP, and one unambiguous DWP planning Obligation before reviewed-plan execution
  - one planning DWP receives independent product-definition Review with every and only exact allocated ASP, governing ICSP, and consumed current SYS parent support before deriving coverage, output-review, simplification, completion, question, and blocker Obligations; outputs produced by that plan receive their own exact Reviews and do not invalidate the unchanged planning Review; superseded exact support removes the old DWP from Review dispatch, requires one explicit same-lineage replacement against current definition support, and gives active valid consumed-parent SYS rebinding priority over that correction
  - the earliest exact planning-DWP, SYS, ASP, and ICSP set receives independent simplification before completion; blocking findings derive serial subject Correction or one atomic exact consistency-set Correction with causal links, fresh Reviews, bounded autonomous retries, attended escalation, and observed scope reduction
  - failed or collateral-flagged Reviews of every current Phase 2 SYS, ASP, ICSP, and planning/completion DWP derive one subject-bounded same-lineage Correction with complete exact causes, two autonomous cycles, attended escalation, and fresh Review
  - ambiguous current single-valued architecture, strategy, or DWP cardinality derives exact attended cancellation and independent Review rather than arbitrary selection or a Process Dead End
  - DWP completion binds every exact parent, output, architecture, interface, and simplification Review through canonical source-owned links; incomplete accounts cannot publish
  - exact reviewed completion evidence derives one reviewed SYS level candidate containing its complete definition and simplification evidence without an intermediate singleton group candidate
  - a failed or reviewed-rejected level candidate preserves every exact unaffected member and evidence item while naming its predecessor through supersedes and returning to fresh Review and the same gate
  - reviewed approving Phase 2 gate evidence mechanically publishes one exact flattened level-accepted baseline before progression, without redundant stakeholder authority
  - exact reviewed level-gate authorization controls progression into pilot assessment
  - every complete Phase 2 level candidate derives one exact durable observation before the package freezes their complete evidence boundary
  - a failed PAS Review derives same-lineage correction over the unchanged context, fresh independent Review, two autonomous cycles, and attended escalation
  - only a current passing PAS exposes the final nondelegable stakeholder Authority Requirement for exact proceed, change, or stop publication
  - each Expansion Decision preserves exact PAS and Review evidence, requires independent Review, and receives same-lineage attended Correction after failure
  - reviewed proceed reaches the omitted Phase 3–6 Profile Boundary, reviewed change enters the declared change-control route, and reviewed stop declares Lifecycle Complete
  - exact accepted-baseline membership, not Review alone, protects STK and shared SYS through bounded impact, reviewed attended approve/reject/defer/cancel disposition, same-lineage changed-under replacement, selective candidate/evidence reuse, and exact closure; two exact shared-SYS consumers rebind serially with separate fresh coverage while draft replacement remains ordinary
  - one exact pilot evidence context records reviewed burden, reuse, queue, ceremony, discrimination, and scope measurements before an exact proceed, change, or stop Decision
  - one exact reviewed and gate-approved design candidate independently dispatches product implementation and source-blind formal-VAI work without either waiting for the other
  - one controlled implementation ART names an immutable Git commit, a parameterized or zero-argument runnable public interface with exact success and rejection observations, every exact candidate DES Revision, and a bounded traversal-free DES-to-path mapping whose completeness is independently reviewed
  - a failed formal VER Review derives one exact same-lineage correction before its requirement can contribute to direct definition-candidate coverage
  - every exact current formal VER in the design candidate receives one separately authorized source-blind formal VAI and its own independent Review while the complete compatible sibling set shares one immutable VAI-only Review Context that contains no product evidence
  - complete passing implementation ART and formal-VAI Review coverage mechanically accepts the exact DES candidate without a second authority gate before Phase 6
  - every accepted formal verification implementation executes once per exact attempt against its reviewed activity, qualified environment, controlled implementation ART, and accepted requirement Revision, bottom-up from DES through CMP and SYS to STK
  - aborted, infrastructure-error, and inconclusive formal attempts preserve immutable RUN and RES evidence, establish no product conclusion or PRB, and leave a fresh non-replay execution transaction dispatchable
  - deterministic passing formal evidence applies without Review, judgment-required evidence applies only after independent Review, and completed formal failure blocks ancestors while routing one ordinary PRB
  - one independently reviewed attended product-acceptance Decision over every and only exact current formal result, required assessment, stakeholder claim, and controlled ART returns Lifecycle Complete without a duplicate accepted baseline or summary datum
