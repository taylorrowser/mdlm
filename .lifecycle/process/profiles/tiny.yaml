kind: implementation-profile-definition
id: tiny
version: 2
description: One-batch normal-link requirements and fully attributed Python product lifecycle.
status: experimental
enabled:
  types:
  - REQ
  - RQS
  - IMP
  - SCP
  - RES
  - REV
  - ACC
  phases:
  - phase-0-tiny-product
  obligation_statuses:
  - ready
  - blocked
  - awaiting-review
  - stale
  - failed
disabled_capabilities:
- architecture and interface definition
- environment qualification
- custom verification image builds
- long-running services or products requiring a TTY
terminal_outcomes:
  lifecycle_complete:
    condition: 'exists("current-requirements@1", {}) && every("current-requirements@1", {}, req => exists("implementations-for@1",
      {requirements: req}) && every("implementations-for@1", {requirements: req}, imp => exists("acceptances-for@2",
      {implementation: imp}) && exists("passing-results@1", {implementation: imp}) && exists("pass-reviews@1", {subject:
      imp}) && none("fail-reviews@1", {subject: imp}))) && every("current-requirements@1", {}, req => exists("pass-reviews@1",
      {subject: req}) && none("fail-reviews@1", {subject: req}))'
    explanation: Every current requirement set has a passing independently reviewed implementation explicitly accepted
      by the stakeholder.
success_criteria:
- A correct product is accepted after current exact verification and independent content Review.
- Wrong expectations and wrong code receive reviewed corrective revisions preserving failed evidence.
