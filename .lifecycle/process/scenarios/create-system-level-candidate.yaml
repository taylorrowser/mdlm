kind: scenario-definition
id: create-system-level-candidate
version: 2
description: Freeze one reviewed DWP completion and its exact system definition and evidence as a level candidate.
phases: [phase-2-system-definition]
inputs:
  - name: completion
    types: [DWP]
    cardinality: one
    identity: revision
  - name: architecture
    types: [ASP]
    cardinality: one
    identity: revision
  - name: interfaces
    types: [ICSP]
    cardinality: zero-or-more
    identity: revision
  - name: verification_strategy
    types: [VSP]
    cardinality: one
    identity: revision
outputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    required_links: []
prompt_ref: prompts/create-system-level-candidate.md@2
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && candidate.payload.kind == "level-candidate"
  && candidate.payload.role == "candidate"
  && candidate.storage.frozen == true
  && exists("level-candidate-matches-completion@1",
    {candidate: candidate, completion: completion})
resolves: [system-level-candidate-required]
prohibited_inputs: [unreviewed completion, extra definition membership, extra evidence, mutable latest aliases]
batching: single
