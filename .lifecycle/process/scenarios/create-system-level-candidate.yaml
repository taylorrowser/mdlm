kind: scenario-definition
id: create-system-level-candidate
version: 1
description: Compose one reviewed group candidate with its exact shared architecture, interfaces, and verification strategy as a system-level candidate.
phases: [phase-2-system-definition]
inputs:
  - name: group
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      group.payload.kind == "group-candidate"
      && group.storage.frozen == true
      && exists("passing-reviews-for@1", {subject: group})
      && group.payload.scope == completion.identity.revision_id
  - {name: completion, types: [DWP], cardinality: one, identity: revision}
  - name: architecture
    types: [ASP]
    cardinality: one
    identity: revision
    conditions: >-
      architecture == one("architectures-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
  - name: interfaces
    types: [ICSP]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("matching-decomposition-interface@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion}),
         interface: interfaces})
  - name: verification_strategy
    types: [VSP]
    cardinality: one
    identity: revision
    conditions: >-
      verification_strategy == one("strategies-for-decomposition@1",
        {plan: one("planning-revisions-for-completion@1", {completion: completion})})
outputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    required_links:
      - {link: composes, target: {input: group}}
prompt_ref: prompts/create-system-level-candidate.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && candidate.payload.kind == "level-candidate"
  && candidate.payload.role == "candidate"
  && candidate.storage.frozen == true
  && exists("baseline-contains-definition@1",
    {baseline: candidate, subject: architecture})
  && every("interfaces-for-decomposition@1",
    {plan: one("planning-revisions-for-completion@1", {completion: completion})},
    interface => exists("baseline-contains-definition@1",
      {baseline: candidate, subject: interface}))
  && exists("baseline-contains-definition@1",
    {baseline: candidate, subject: verification_strategy})
  && count("composed-groups-for-level-candidate@1", {candidate: candidate}) == 1
  && none("unexpected-level-candidate-members@1",
    {candidate: candidate, completion: completion})
  && none("baseline-evidence@1", {baseline: candidate})
resolves: [system-level-candidate-required]
prohibited_inputs: [unreviewed group candidate, extra definition membership, mutable latest aliases]
batching: single
