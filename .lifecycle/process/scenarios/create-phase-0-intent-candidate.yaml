kind: scenario-definition
id: create-phase-0-intent-candidate
version: 1
description: Freeze the complete exact reviewed Phase 0 foundation as one intent-level candidate.
phases: [phase-0-wayfinding]
inputs:
  - name: definition_members
    types: [MAP, PSP, STK]
    cardinality: one-or-more
    identity: revision
  - name: member_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
  - name: stable_link_targets
    types: [QST]
    cardinality: zero-or-more
    identity: revision
outputs:
  - {name: candidate, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/create-phase-0-intent-candidate.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && candidate.payload.kind == "intent-level-candidate"
  && candidate.payload.role == "candidate"
  && every("phase-0-foundation-members@1", {}, member =>
    exists("candidate-members-matching@1",
      {candidate: candidate, required_member: member}))
  && none("non-phase-0-foundation-members-for@1", {candidate: candidate})
  && member_reviews == select("phase-0-foundation-member-reviews@1", {})
  && select("baseline-evidence@1", {baseline: candidate}) == member_reviews
  && candidate.storage.frozen == true
resolves: [intent-candidate-required]
prohibited_inputs: [mutable latest aliases, unreviewed definition revisions, omitted or unrelated member Review evidence, raw evidence as definition membership]
batching: single
