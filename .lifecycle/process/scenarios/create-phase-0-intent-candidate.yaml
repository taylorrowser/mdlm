kind: scenario-definition
id: create-phase-0-intent-candidate
version: 2
description: Freeze the complete exact reviewed Phase 0 foundation as one intent-level candidate.
phases: [phase-0-wayfinding]
inputs:
  - name: definition_members
    types: [MAP, PSP, STK]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("passing-reviews-for@1", {subject: definition_members})
      && none("failing-reviews-for@1", {subject: definition_members})
  - name: simplification_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: 'simplification_reviews.payload.review_kind == "simplification-product-definition" && simplification_reviews.payload.outcome == "pass"'
outputs:
  - {name: candidate, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/create-phase-0-intent-candidate.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && candidate.payload.kind == "intent-level-candidate"
  && candidate.payload.role == "candidate"
  && exists("complete-phase-0-intent-candidates@1", {})
  && candidate.storage.frozen == true
resolves: [intent-candidate-required]
prohibited_inputs: [mutable latest aliases, unreviewed definition revisions, raw evidence as definition membership]
batching: single
