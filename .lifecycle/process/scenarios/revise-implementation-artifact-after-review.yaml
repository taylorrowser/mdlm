kind: scenario-definition
id: revise-implementation-artifact-after-review
version: 1
description: Correct one failed implementation artifact in the same lineage while preserving its exact candidate and DES scope.
phases: [phase-5-implementation]
inputs:
  - {name: implementation, types: [ART], cardinality: one, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
  - {name: candidate, types: [BSL], cardinality: one, identity: revision}
  - {name: design_requirements, types: [DES], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [ART]
    cardinality: one
    identity_from: {input: implementation}
    required_payload: {kind: implementation}
    required_links:
      - {link: corrects-review, target: {input: failed_reviews}}
      - {link: realizes-candidate, target: {input: candidate}}
      - {link: implements, target: {input: design_requirements}}
prompt_ref: prompts/revise-implementation-artifact-after-review.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == implementation.identity.id
  && replacement.identity.type == implementation.identity.type
  && replacement.payload.kind == "implementation"
  && present(replacement.payload.repository_ref)
  && present(replacement.payload.public_interface)
  && present(replacement.payload.design_path_mapping)
  && candidate == one("design-candidates-for-implementation-artifact@1",
    {implementation: implementation})
  && design_requirements == select("design-requirements-for-phase-5-candidate@1",
    {candidate: candidate})
resolves: [implementation-artifact-review-correction-required]
prohibited_inputs: [mutation of failed ART history, mutation of failed Review history, unrelated candidate, unrelated DES, mutable repository aliases, uncommitted product bytes]
batching: single
