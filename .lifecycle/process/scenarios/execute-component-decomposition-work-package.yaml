kind: scenario-definition
id: execute-component-decomposition-work-package
version: 1
description: Produce one minimal coherent CMP set within one exact component decomposition plan.
phases: [phase-3-component-definition]
inputs:
  - {name: plan, types: [DWP], cardinality: one, identity: revision}
  - {name: parents, types: [SYS], cardinality: one-or-more, identity: revision}
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: interfaces, types: [ICSP], cardinality: zero-or-more, identity: revision}
outputs:
  - name: requirements
    types: [CMP]
    cardinality: one-or-more
    required_links:
      - {link: derived-from, target: {input: parents}, distribution: cover}
      - {link: decomposes, target: {input: plan}, distribution: each-output}
      - {link: allocated-to, target: {input: architecture}, distribution: each-output}
      - {link: governed-by, target: {input: interfaces}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/execute-component-decomposition-work-package.md@1
review_policy_ref: review-applicability@1
completion: 'execution.integrity.contract_valid == true'
resolves: [component-decomposition-execution-required]
prohibited_inputs: [product source code, design requirements, mutable latest aliases]
batching: coherent-batch
