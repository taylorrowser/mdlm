kind: scenario-definition
id: correct-product
version: 2
description: Correct a failed verification or stakeholder rejection
phases:
- phase-0-tiny-product
inputs:
- name: failure
  types:
  - RES
  - ACC
  cardinality: one
  identity: revision
- name: subject
  types:
  - IMP
  cardinality: one
  identity: revision
- name: requirements
  types:
  - RQS
  cardinality: one
  identity: revision
outputs:
- name: implementation
  types:
  - IMP
  cardinality: one
  required_links:
  - link: implements
    target:
      input: requirements
  - link: corrects
    target:
      input: failure
  required_payload:
    publication: recorded
  identity_from:
    input: subject
- name: source_scopes
  types:
  - SCP
  cardinality: zero-or-more
  required_links: []
  required_payload:
    publication: recorded
prompt_ref: prompts/correct-product.md@5
review_policy_ref: review-applicability@1
completion: 'execution.integrity.contract_valid == true && (!every("results-for@1", {implementation: subject}, item => item.identity.revision_id != failure.identity.revision_id || item.payload.correction_target != "implementation") || !every("rejections-for@1", {implementation: subject}, item => item.identity.revision_id != failure.identity.revision_id))
  && !every("correction-subjects-for@2", {failure: failure}, corrected => corrected.identity.revision_id != subject.identity.revision_id)'
resolves:
- product-correction
- stakeholder-rejection-correction
prohibited_inputs: []
batching: single
