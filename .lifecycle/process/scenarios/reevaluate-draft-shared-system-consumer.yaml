kind: scenario-definition
id: reevaluate-draft-shared-system-consumer
version: 1
description: Rebind one draft decomposition consumer to a replacement unaccepted shared SYS Revision without Change Request ceremony.
phases: [phase-2-system-definition]
inputs:
  - {name: consumer, types: [DWP], cardinality: one, identity: revision}
  - {name: replacement_requirement, types: [SYS], cardinality: one, identity: revision}
outputs:
  - name: replacement_consumer
    types: [DWP]
    cardinality: one
    required_links:
      - {link: decomposes, target: {input: replacement_requirement}}
prompt_ref: prompts/reevaluate-draft-shared-system-consumer.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement_consumer.identity.id == consumer.identity.id
  && replacement_consumer.payload.stage == consumer.payload.stage
  && replacement_consumer.payload.parent_coverage_status == "complete"
  && count("system-requirements-consumed-by@1", {consumer: replacement_consumer}) == 1
  && one("system-requirements-consumed-by@1", {consumer: replacement_consumer}) == replacement_requirement
  && none("changes-changed-under-subject@1", {subject: replacement_requirement})
  && none("changes-changed-under-subject@1", {subject: replacement_consumer})
resolves: [draft-shared-system-consumer-reevaluation-required]
prohibited_inputs: [Change Request ceremony, copied requirement lineages, unrelated consumers, incomplete coverage, mutable latest aliases, parallel consumer publication]
batching: single
