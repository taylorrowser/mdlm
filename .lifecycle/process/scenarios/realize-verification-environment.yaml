kind: scenario-definition
id: realize-verification-environment
version: 1
description: Realize one exact strategy profile and author the minimal qualification activity and implementation.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: strategy, types: [VSP], cardinality: one, identity: revision}
outputs:
  - name: environment
    types: [ENV]
    cardinality: one
    required_links:
      - {link: realizes, target: {input: strategy}}
  - name: qualification_activity
    types: [VER]
    cardinality: one
    required_links:
      - {link: governed-by, target: {input: strategy}}
      - {link: qualifies, target: {output: environment}}
  - name: qualification_implementation
    types: [VAI]
    cardinality: one
    required_links:
      - {link: realizes, target: {output: qualification_activity}}
      - {link: uses, target: {output: environment}}
      - {link: targets, target: {output: environment}}
prompt_ref: prompts/realize-verification-environment.md@2
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && environment.payload.strategy_revision == strategy.identity.revision_id
  && environment.payload.profile_id == strategy.payload.environment_profile.id
  && environment.payload.capabilities == strategy.payload.environment_profile.capabilities
  && qualification_activity.payload.kind == "qualification"
  && qualification_activity.payload.claim.scope == "environment-capability"
  && qualification_implementation.payload.kind == "qualification"
  && qualification_implementation.payload.independence_mode == "environment-capability"
  && present(qualification_implementation.payload.execution_procedure)
  && present(qualification_implementation.payload.execution_procedure.content)
  && !present(qualification_implementation.payload.prototype_control_bindings)
resolves: [environment-assurance-required]
prohibited_inputs: [undeclared environment capability, product requirement acceptance claim, mutable environment reference]
batching: single
