kind: scenario-definition
id: resolve-phase-2-ambiguity
version: 1
description: Record attended exact cancellation of one competing Phase 2 Revision so package selectors never choose arbitrarily.
phases: [phase-2-system-definition]
inputs:
  - {name: subject, types: [ASP, VSP, DWP], cardinality: one, identity: revision}
outputs:
  - name: decision
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: subject}}
prompt_ref: prompts/resolve-phase-2-ambiguity.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: consequential-decision-participation@1
  arguments: {subject: subject}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && decision.payload.kind == "cancellation"
  && decision.payload.effective_scope == subject.identity.revision_id
resolves: [phase-2-ambiguity-resolution-required]
prohibited_inputs: [arbitrary latest selection, implied cancellation, mutable latest aliases]
batching: single
