kind: scenario-definition
id: implement-verification-activity
version: 1
description: Implement one reviewed pilot activity against a qualified environment and bounded exact target without product-source access.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition]
inputs:
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
    conditions: >-
      activity.payload.kind == "pilot"
      && exists("passing-reviews-for@1", {subject: activity})
  - name: environment
    types: [ENV]
    cardinality: one
    identity: revision
    conditions: >-
      exists("passing-qualification-results-for@1", {environment: environment})
      && exists("passing-reviews-for@1", {subject: environment})
  - name: execution_target
    types: [ART]
    cardinality: one
    identity: revision
outputs:
  - name: implementation
    types: [VAI]
    cardinality: one
    required_links:
      - {link: realizes, target: {input: activity}}
      - {link: uses, target: {input: environment}}
      - {link: targets, target: {input: execution_target}}
  - name: authorization
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {output: implementation}}
prompt_ref: prompts/implement-verification-activity.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: verification-implementation-participation@1
  arguments:
    activity: activity
    environment: environment
    execution_target: execution_target
authority_evidence: {output: authorization, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && implementation.payload.kind == "pilot"
  && implementation.payload.independence_mode == "source-blind"
  && implementation.payload.target_behavior.supported == execution_target.payload.supported_behavior
  && implementation.payload.target_behavior.intentionally_unsupported == execution_target.payload.unsupported_behavior
  && (!present(execution_target.payload.prototype_controls)
    || (implementation.payload.prototype_control_bindings.activity_ref
      == execution_target.payload.prototype_controls.activity_ref
    && implementation.payload.prototype_control_bindings.known_good.argv
      == execution_target.payload.prototype_controls.known_good.argv
    && implementation.payload.prototype_control_bindings.known_good.expected_verification_outcome == "pass"
    && implementation.payload.prototype_control_bindings.known_bad.argv
      == execution_target.payload.prototype_controls.known_bad.argv
    && implementation.payload.prototype_control_bindings.known_bad.expected_verification_outcome == "fail"))
  && authorization.payload.kind == "decision"
  && authorization.payload.effective_scope == implementation.identity.revision_id
resolves: [pilot-verification-implementation-required]
prohibited_inputs: [product source code, product unit tests, private implementation details, uncontrolled implementation shortcuts]
batching: single
