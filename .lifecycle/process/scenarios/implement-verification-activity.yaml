kind: scenario-definition
id: implement-verification-activity
version: 1
description: Implement one reviewed pilot or formal activity against a qualified environment without product-source access.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition, phase-5-implementation]
inputs:
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
    conditions: >-
      activity.payload.kind in ["pilot", "formal"]
      && exists("passing-reviews-for@1", {subject: activity})
  - name: environment
    types: [ENV]
    cardinality: one
    identity: revision
    conditions: >-
      exists("passing-qualification-results-for@1", {environment: environment})
      && exists("passing-reviews-for@1", {subject: environment})
  - name: execution_target
    types: [ENV, ART]
    cardinality: one
    identity: revision
    conditions: >-
      (activity.payload.kind == "pilot" && execution_target.identity.type == "ART")
      || (activity.payload.kind == "formal"
        && execution_target == environment)
outputs:
  - name: implementation
    types: [VAI]
    cardinality: one
    required_links:
      - {link: realizes, target: {input: activity}}
      - {link: uses, target: {input: environment}}
      - {link: targets, target: {input: execution_target}}
  - name: authorization
    types: [DEC]
    cardinality: one
    required_payload:
      kind: decision
      effective_scope: $proposal.implementation.revision_id
    required_links:
      - {link: justifies, target: {output: implementation}}
prompt_ref: prompts/implement-verification-activity.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: verification-implementation-participation@1
  arguments:
    activity: activity
    environment: environment
authority_evidence: {output: authorization, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && implementation.payload.kind == activity.payload.kind
  && implementation.payload.independence_mode == "source-blind"
  && ((activity.payload.kind == "formal"
      && execution_target == environment
      && implementation.payload.authoring_input_refs
        == [activity.identity.revision_id, environment.identity.revision_id]
      && count("execution-targets-for-implementation@1", {implementation: implementation}) == 1
      && one("execution-targets-for-implementation@1", {implementation: implementation}) == environment
      && none("pilot-art-targets-for-implementation@1", {implementation: implementation}))
    || (activity.payload.kind == "pilot"
      && execution_target.identity.type == "ART"
      && count("pilot-art-targets-for-implementation@1", {implementation: implementation}) == 1
      && every("pilot-art-targets-for-implementation@1", {implementation: implementation}, target =>
        target == execution_target
        && implementation.payload.target_behavior.supported == target.payload.supported_behavior
        && implementation.payload.target_behavior.intentionally_unsupported == target.payload.unsupported_behavior
        && (!present(target.payload.prototype_controls)
          || (implementation.payload.activity_bindings == ["known_good", "known_bad"]
          && implementation.payload.prototype_control_bindings.activity_ref
            == target.payload.prototype_controls.activity_ref
          && implementation.payload.prototype_control_bindings.known_good.argv
            == target.payload.prototype_controls.known_good.argv
          && implementation.payload.prototype_control_bindings.known_good.expected_verification_outcome == "pass"
          && implementation.payload.prototype_control_bindings.known_bad.argv
            == target.payload.prototype_controls.known_bad.argv
          && implementation.payload.prototype_control_bindings.known_bad.expected_verification_outcome == "fail")))))
  && authorization.payload.kind == "decision"
  && authorization.payload.effective_scope == implementation.identity.revision_id
resolves: [pilot-verification-implementation-required, formal-verification-implementation-required]
prohibited_inputs: [product source code, product unit tests, private implementation details, uncontrolled implementation shortcuts, mutable aliases, prototype implementation bytes, product implementation ART during formal work]
batching: single
