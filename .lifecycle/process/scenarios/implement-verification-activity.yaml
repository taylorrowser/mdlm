kind: scenario-definition
id: implement-verification-activity
version: 1
description: Implement one reviewed pilot activity against a qualified environment and bounded exact target without product-source access.
phases: [phase-1-product-assurance]
inputs:
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
    conditions: 'activity.payload.kind == "pilot"'
  - name: environment
    types: [ENV]
    cardinality: one
    identity: revision
    conditions: >-
      exists("passing-qualification-results-for@1", {environment: environment})
      && exists("passing-reviews-for@1", {subject: environment})
  - name: execution_target
    types: [ART]
    cardinality: one
    identity: revision
outputs:
  - name: implementation
    types: [VAI]
    cardinality: one
    required_links:
      - {link: realizes, target: {input: activity}}
      - {link: uses, target: {input: environment}}
      - {link: targets, target: {input: execution_target}}
prompt_ref: prompts/implement-verification-activity.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && implementation.payload.kind == "pilot"
  && implementation.payload.independence_mode == "source-blind"
initiation: explicit
resolves: []
prohibited_inputs: [product source code, product unit tests, private implementation details, uncontrolled implementation shortcuts]
batching: single
