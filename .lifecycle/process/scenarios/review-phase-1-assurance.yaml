kind: scenario-definition
id: review-phase-1-assurance
version: 1
description: Independently judge one exact active-phase assurance Revision and publish its evidence-bearing Review Context with the REV.
kernel_materialization:
  kind: exact-baseline@1
  output: review_context
  subject_input: subject
  support_input: review_context_members
  payload_fields: {title: title, kind: kind, role: role, scope: scope, group: group, members: definition_members, evidence: evidence}
  title_prefix: 'Review context for '
  baseline_kind: review-context
  baseline_role: review-context
  baseline_group: DEFAULT
  evidence_subject_types: [ENV]
  evidence_types: [RES, RUN, VAI, VER]
phases: [phase-1-product-assurance, phase-2-system-definition]
inputs:
  - {name: subject, types: [VSP, ENV, VER, VAI, RES], cardinality: one, identity: revision}
  - {name: review_context_members, types: [MAP, QST, DEC, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS], cardinality: zero-or-more, identity: revision}
outputs:
  - {name: review_context, handle: context, types: [BSL], cardinality: one, required_links: []}
  - name: review
    handle: review
    types: [REV]
    cardinality: one
    required_payload: {review_kind: phase-1-assurance}
    required_links:
      - {link: reviews, target: {input: subject}}
      - {link: contextualizes, target: {output: review_context}}
prompt_ref: prompts/review-phase-1-assurance.md@1
skills:
  - reference: skills/contextual-artifact-review.md@2
    summary: Judge one exact assurance Revision against its declared requirement, environment, implementation, and RUN or RES evidence.
input_summaries:
  subject: The exact VSP, ENV, VER, VAI, or assessment-required pilot RES Revision under judgment.
  review_context_members: Exact requirements and the declared ENV, VER, VAI, RUN, or RES evidence required for this subject.
review_contract:
  required_evidence: [review_context_members]
  allowed_findings: [traceability, observability, consistency, evidence, independence]
  summary_rule: State whether the assurance claim is traceable, reproducible, independent where required, and supported by exact execution evidence.
  correction_authorities: [stakeholder, package-evidence]
review_policy_ref: review-applicability@1
review_policy_arguments: {subject: subject}
participation:
  policy_ref: atomic-review-participation@1
  arguments: {subject: subject}
authority_evidence: {output: review, type: REV}
standing_delegation: {selector_ref: applicable-authority-delegations-for@1, target_input: subject, authority: stakeholder, delegate: independent-reviewer}
completion_summary: Publish exactly one evidence-bearing Review Context and its exact REV in one transaction.
completion: >-
  execution.integrity.contract_valid == true
  && review_context.payload.kind == "review-context"
  && review_context.payload.scope == subject.identity.revision_id
  && review_context.storage.frozen == true
  && exists("valid-review-contexts-for@1", {subject: subject})
  && review.payload.review_kind == "phase-1-assurance"
  && review.payload.outcome in ["pass", "fail", "cancelled"]
resolves: [phase-1-assurance-review-required, pilot-result-assessment-required]
prohibited_inputs: [product source code, product unit tests, mutable latest aliases]
batching: single
