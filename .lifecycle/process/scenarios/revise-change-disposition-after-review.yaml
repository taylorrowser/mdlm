kind: scenario-definition
id: revise-change-disposition-after-review
version: 1
description: Record renewed attended judgment as a same-lineage replacement for one failed exact Change Request disposition or correction-authority Decision.
phases: [phase-7-change-control]
inputs:
  - {name: decision, types: [DEC], cardinality: one, identity: revision}
  - {name: change, types: [CHG], cardinality: one, identity: revision}
  - {name: target, types: [CHG, STK, BSL], cardinality: one, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: target}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-change-disposition-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: consequential-decision-participation@1
  arguments: {subject: change}
authority_evidence: {output: replacement, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == decision.identity.id
  && replacement.payload.kind == decision.payload.kind
  && replacement.payload.effective_scope == decision.payload.effective_scope
  && (
    (replacement.payload.kind == "change-approval"
      && replacement.payload.change_disposition in ["approve", "reject", "defer", "cancel"]
      && replacement.payload.effective_scope == change.identity.revision_id
      && target == change
      && !every("recorded-change-approval-decisions-for@2", {change: change}, disposition =>
        disposition != replacement))
    || (replacement.payload.kind == "scope"
      && target != change
      && replacement.provenance.scenario == "revise-change-disposition-after-review@1")
  )
resolves: [change-disposition-review-correction-required]
prohibited_inputs: [suppression of failed Reviews, implicit disposition, mutation of immutable history, mutable latest aliases]
batching: single
