kind: scenario-definition
id: correct-requirements-after-review
version: 1
description: Correct requirements after content Review
phases:
- phase-0-tiny-product
inputs:
- name: subject
  types:
  - RQS
  cardinality: one
  identity: revision
- name: failure
  types:
  - REV
  cardinality: one
  identity: revision
outputs:
- name: requirements
  types:
  - REQ
  cardinality: one-or-more
  required_links: []
  required_payload:
    publication: recorded
- name: requirement_set
  types:
  - RQS
  cardinality: one
  required_links:
  - link: corrects
    target:
      input: failure
  required_payload:
    publication: recorded
  identity_from:
    input: subject
prompt_ref: prompts/correct-requirements-after-review.md@3
review_policy_ref: review-applicability@1
completion: 'execution.integrity.contract_valid == true && (true) && exists("fail-reviews@1", {subject: subject})
  && every("fail-reviews@1", {subject: subject}, failed => failed.identity.revision_id == failure.identity.revision_id)'
resolves:
- requirements-review-correction
prohibited_inputs: []
batching: single
