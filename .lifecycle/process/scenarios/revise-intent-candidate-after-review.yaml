kind: scenario-definition
id: revise-intent-candidate-after-review
version: 3
description: Rebuild one failed or reviewed-rejected Phase 0 intent candidate from exact reviewed members while preserving immutable evidence.
phases: [phase-0-wayfinding]
inputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    identity: revision
  - name: definition_members
    types: [MAP, PSP, STK]
    cardinality: one-or-more
    identity: revision
  - name: prior_failed_reviews
    types: [REV]
    cardinality: zero-or-more
    identity: revision
  - name: failed_reviews
    types: [REV]
    cardinality: zero-or-more
    identity: revision
  - name: gate_rejections
    types: [DEC]
    cardinality: zero-or-more
    identity: revision
outputs:
  - name: replacement
    types: [BSL]
    cardinality: one
    required_links:
      - {link: supersedes, target: {input: candidate}}
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
      - {link: corrects-gate-rejection, target: {input: gate_rejections}}
prompt_ref: prompts/revise-intent-candidate-after-review.md@3
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && exists("complete-superseding-intent-candidates-for@1",
    {candidate: candidate})
resolves: [intent-candidate-review-correction-required]
prohibited_inputs: [mutation of the prior candidate, unreviewed definition Revisions, omission of unaffected evidence, inferred terminal disposition]
batching: single
