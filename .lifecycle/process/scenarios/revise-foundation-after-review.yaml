kind: scenario-definition
id: revise-foundation-after-review
version: 3
description: Replace one exact failed Phase 0 foundation Revision while autonomous correction budget remains, citing every current failed Review and preserving immutable history.
phases: [phase-0-wayfinding]
inputs:
  - name: subject
    types: [MAP, PSP, STK]
    cardinality: one
    identity: revision
    conditions: >-
      exists("failing-reviews-for@1", {subject: subject})
      && none("stakeholder-owned-failing-reviews-for@1", {subject: subject})
      && count("correction-revisions-through@1", {subject: subject}) < 2
      && none("newer-revisions-for@1", {subject: subject})
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: 'exists("matching-failing-review-for@1", {subject: subject, review: failed_reviews})'
outputs:
  - name: replacement
    types: [MAP, PSP, STK]
    cardinality: one
    required_links:
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-foundation-after-review.md@3
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && replacement.identity.type == subject.identity.type
resolves: [foundation-review-correction-required]
prohibited_inputs: [mutation of the failed Revision, deletion of failed Review history, unrelated scope expansion]
batching: single
