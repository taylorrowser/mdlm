kind: scenario-definition
id: revise-foundation-after-review
version: 5
description: Replace one exact Phase 0 foundation Revision while autonomous correction budget remains, citing every current Review or gate-rejection cause and preserving immutable history.
phases: [phase-0-wayfinding]
inputs:
  - name: subject
    types: [MAP, PSP, STK]
    cardinality: one
    identity: revision
  - name: prior_failed_reviews
    types: [REV]
    cardinality: zero-or-more
    identity: revision
  - name: failed_reviews
    types: [REV]
    cardinality: zero-or-more
    identity: revision
  - name: simplification_reviews
    types: [REV]
    cardinality: zero-or-more
    identity: revision
  - name: gate_rejections
    types: [DEC]
    cardinality: zero-or-more
    identity: revision
  - name: product_intent_authority
    types: [DEC]
    cardinality: zero-or-more
    identity: revision
outputs:
  - name: replacement
    types: [MAP, PSP, STK]
    cardinality: one
    required_links:
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
      - {link: corrects-review, target: {input: simplification_reviews}}
      - {link: corrects-gate-rejection, target: {input: gate_rejections}}
prompt_ref: prompts/revise-foundation-after-review.md@5
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && replacement.identity.type == subject.identity.type
  && (subject.identity.type != "PSP"
    || every("product-intent-authorities-for-foundation-subject@1",
      {subject: subject}, authority =>
        !every("product-intent-authorities-for-foundation-subject@1",
          {subject: replacement}, replacement_authority =>
            replacement_authority != authority)))
resolves: [foundation-review-correction-required]
prohibited_inputs: [mutation of the failed Revision, deletion of failed Review history, unrelated scope expansion]
batching: single
