kind: scenario-definition
id: revise-environment-assurance-after-review
version: 2
description: Correct one failed assurance environment through bounded autonomous cycles or attended escalation and author a fresh exact qualification activity and implementation atomically.
phases: [phase-1-product-assurance, phase-2-system-definition]
inputs:
  - name: environment
    types: [ENV]
    cardinality: one
    identity: revision
    conditions: >-
      exists("failing-reviews-for@1", {subject: environment})
      && none("newer-revisions-for@1", {subject: environment})
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("matching-failing-review-for@1",
        {subject: environment, review: failed_reviews})
  - name: strategy
    types: [VSP]
    cardinality: one
    identity: revision
    conditions: >-
      count("strategies-for-environment@1", {environment: environment}) == 1
      && strategy == one("strategies-for-environment@1",
        {environment: environment})
outputs:
  - name: replacement
    types: [ENV]
    cardinality: one
    identity_from: {input: environment}
    required_links:
      - {link: realizes, target: {input: strategy}}
      - {link: corrects-review, target: {input: failed_reviews}}
  - name: qualification_activity
    types: [VER]
    cardinality: one
    required_links:
      - {link: governed-by, target: {input: strategy}}
      - {link: qualifies, target: {output: replacement}}
  - name: qualification_implementation
    types: [VAI]
    cardinality: one
    required_links:
      - {link: realizes, target: {output: qualification_activity}}
      - {link: uses, target: {output: replacement}}
      - {link: targets, target: {output: replacement}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-environment-assurance-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-1-assurance-correction-participation@1
  arguments: {subject: environment}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == environment.identity.id
  && replacement.identity.type == environment.identity.type
  && replacement.payload.strategy_revision == strategy.identity.revision_id
  && replacement.payload.profile_id == strategy.payload.environment_profile.id
  && replacement.payload.capabilities == strategy.payload.environment_profile.capabilities
  && qualification_activity.payload.kind == "qualification"
  && qualification_activity.payload.claim.scope == "environment-capability"
  && qualification_implementation.payload.kind == "qualification"
  && qualification_implementation.payload.independence_mode == "environment-capability"
  && exists("corrected-environment-revisions-for@1", {environment: environment})
  && (
    (policy("phase-1-assurance-correction-participation@1",
      {subject: environment}).authority_mode == "autonomous"
      && none("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}))
    || (policy("phase-1-assurance-correction-participation@1",
      {subject: environment}).authority_mode == "attended"
      && count("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}) == 1)
  )
resolves: [environment-review-correction-required]
prohibited_inputs: [mutation of failed environment or Review history, borrowed qualification evidence, undeclared environment capability, product requirement acceptance claim]
batching: single
