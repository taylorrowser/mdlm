kind: scenario-definition
id: revise-stakeholder-change-after-review
version: 2
description: Correct one exact non-Decision accepted requirement, consumer, or candidate subject through one same-lineage interface while preserving its bounded Change Request.
phases: [phase-7-change-control]
inputs:
  - {name: subject, types: [CHG, STK, SYS, DWP, BSL], cardinality: one, identity: revision}
  - {name: change, types: [CHG], cardinality: one, identity: revision}
  - {name: reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [CHG, STK, SYS, DWP, BSL]
    cardinality: one
    identity_from: {input: subject}
    required_links:
      - {link: corrects-review, target: {input: reviews}}
  - name: authority
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-stakeholder-change-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: stakeholder-change-correction-participation@2
  arguments: {subject: subject}
authority_evidence: {output: authority, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && replacement.identity.type == subject.identity.type
  && (
    (replacement.identity.type == "CHG"
      && exists("valid-stakeholder-change-impact@2", {change: replacement}))
    || (replacement.identity.type in ["STK", "SYS"]
      && !every("revised-requirements-for-change@3", {change: change}, requirement =>
        requirement != replacement))
    || (replacement.identity.type == "DWP"
      && !every("updated-shared-system-consumers-for-change@1", {change: change}, consumer =>
        consumer != replacement))
    || (replacement.identity.type == "BSL"
      && !every("stakeholder-change-candidates-for@1", {change: change}, candidate =>
        candidate != replacement))
  )
  && (
    (policy("stakeholder-change-correction-participation@2",
      {subject: subject}).authority_mode == "autonomous"
      && none("stakeholder-change-correction-decisions-for@1",
        {replacement: replacement}))
    || (policy("stakeholder-change-correction-participation@2",
      {subject: subject}).authority_mode == "attended"
      && count("stakeholder-change-correction-decisions-for@1",
        {replacement: replacement}) == 1)
  )
resolves: [stakeholder-change-review-correction-required]
prohibited_inputs: [mutation of failed evidence, unrelated change subjects, accepted-history rewriting, mutable latest aliases]
batching: single
