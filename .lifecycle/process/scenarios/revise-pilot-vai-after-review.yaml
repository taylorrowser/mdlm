kind: scenario-definition
id: revise-pilot-vai-after-review
version: 3
description: Correct one failed source-blind pilot or formal VAI procedure while preserving immutable Review history and exact bound inputs.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition, phase-5-implementation]
inputs:
  - name: implementation
    types: [VAI]
    cardinality: one
    identity: revision
    conditions: >-
      implementation.payload.kind in ["pilot", "formal"]
      && implementation.payload.independence_mode == "source-blind"
      && exists("failing-reviews-for@1", {subject: implementation})
      && none("newer-revisions-for@1", {subject: implementation})
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("matching-failing-review-for@1",
        {subject: implementation, review: failed_reviews})
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
    conditions: >-
      activity == one("verification-activities-for-implementation@1",
        {implementation: implementation})
  - name: environment
    types: [ENV]
    cardinality: one
    identity: revision
    conditions: >-
      environment == one("environments-for-implementation@1",
        {implementation: implementation})
  - name: execution_target
    types: [ENV, ART]
    cardinality: one
    identity: revision
    conditions: >-
      ((implementation.payload.kind == "pilot"
        && execution_target.identity.type == "ART"
        && execution_target == one("eligible-pilot-targets-for-activity@1",
          {activity: activity}))
      || (implementation.payload.kind == "formal"
        && execution_target == environment))
      && execution_target == one("execution-targets-for-implementation@1",
        {implementation: implementation})
  - name: requirement
    types: [STK, SYS, CMP, DES]
    cardinality: one
    identity: revision
    conditions: >-
      count("requirements-for-pilot-activity@1", {activity: activity}) == 1
      && requirement == one("requirements-for-pilot-activity@1",
        {activity: activity})
  - name: strategy
    types: [VSP]
    cardinality: one
    identity: revision
    conditions: >-
      count("strategies-for-verification-activity@1", {activity: activity}) == 1
      && strategy == one("strategies-for-verification-activity@1",
        {activity: activity})
outputs:
  - name: replacement
    types: [VAI]
    cardinality: one
    identity_from: {input: implementation}
    required_links:
      - {link: realizes, target: {input: activity}}
      - {link: uses, target: {input: environment}}
      - {link: targets, target: {input: execution_target}}
      - {link: corrects-review, target: {input: failed_reviews}}
  - name: authorization
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-pilot-vai-after-review.md@3
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-1-assurance-correction-participation@1
  arguments: {subject: implementation}
authority_evidence: {output: authorization, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == implementation.identity.id
  && replacement.identity.type == implementation.identity.type
  && one("verification-activities-for-implementation@1",
    {implementation: replacement}) == activity
  && one("environments-for-implementation@1", {implementation: replacement})
    == environment
  && one("execution-targets-for-implementation@1", {implementation: replacement})
    == execution_target
  && (implementation.payload.kind != "formal"
    || (execution_target == environment
      && replacement.payload.authoring_input_refs
        == [activity.identity.revision_id, environment.identity.revision_id]
      && count("execution-targets-for-implementation@1", {implementation: replacement}) == 1
      && one("execution-targets-for-implementation@1", {implementation: replacement}) == environment
      && none("pilot-art-targets-for-implementation@1", {implementation: replacement})))
  && exists("corrected-pilot-verification-implementation-revisions-for@1",
    {implementation: implementation})
  && authorization.payload.effective_scope == replacement.identity.revision_id
  && (
    (policy("phase-1-assurance-correction-participation@1",
      {subject: implementation}).authority_mode == "autonomous"
      && authorization.payload.kind == "decision")
    || (policy("phase-1-assurance-correction-participation@1",
      {subject: implementation}).authority_mode == "attended"
      && authorization.payload.kind == "scope")
  )
resolves: [pilot-vai-review-correction-required]
prohibited_inputs: [mutation of failed VAI history, mutation of supplied VER history, mutation of prior RUN or RES evidence, mutation of failed Review history, mutation of supplied ENV history, mutation of supplied ART history, changed pilot claim class, VER requirement change, VER strategy change, ART behavior-scope change, ENV capability change outside the exact VSP profile, unrelated VER, unrelated ENV, unrelated ART, borrowed qualification evidence, product source, product unit tests, private implementation details, mutable aliases, prototype implementation bytes, product implementation ART during formal work]
batching: single
