kind: scenario-definition
id: build-exploratory-prototype
version: 1
description: Build an exact exploratory prototype for one empirical question and record its bounded finding.
phases: [phase-0-wayfinding]
inputs:
  - name: question
    types: [QST]
    cardinality: one
    identity: revision
    conditions: 'question.payload.kind == "empirical"'
outputs:
  - name: prototype
    types: [ART]
    cardinality: one
    required_links:
      - {link: derived-from, target: {input: question}}
  - name: finding
    types: [DEC]
    cardinality: one
    required_links:
      - {link: resolves, target: {input: question}}
prompt_ref: prompts/build-exploratory-prototype.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && prototype.payload.kind == "prototype"
resolves: []
prohibited_inputs: [product source as unrecorded evidence, unsupported empirical conclusions]
batching: single
