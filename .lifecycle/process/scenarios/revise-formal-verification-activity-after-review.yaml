kind: scenario-definition
id: revise-formal-verification-activity-after-review
version: 1
description: Correct one failed source-blind formal VER while preserving its exact requirement, strategy, and failed judgment.
phases: [phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: activity, types: [VER], cardinality: one, identity: revision}
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: 'exists("matching-failing-review-for@1", {subject: activity, review: failed_reviews})'
  - {name: requirements, types: [STK, SYS, CMP, DES], cardinality: one-or-more, identity: revision}
  - {name: strategy, types: [VSP], cardinality: one, identity: revision}
outputs:
  - name: replacement
    types: [VER]
    cardinality: one
    identity_from: {input: activity}
    required_links:
      - {link: verifies, target: {input: requirements}}
      - {link: verifies-revision, target: {input: requirements}}
      - {link: governed-by, target: {input: strategy}}
      - {link: corrects-review, target: {input: failed_reviews}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-formal-verification-activity-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-1-assurance-correction-participation@1
  arguments: {subject: activity}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == activity.identity.id
  && replacement.payload.kind == "formal"
  && replacement.payload.claim == activity.payload.claim
  && exists("corrected-formal-verification-activity-revisions-for@1",
    {activity: activity})
  && (
    (policy("phase-1-assurance-correction-participation@1",
      {subject: activity}).authority_mode == "autonomous"
      && none("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}))
    || (policy("phase-1-assurance-correction-participation@1",
      {subject: activity}).authority_mode == "attended"
      && count("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}) == 1)
  )
resolves: [formal-verification-activity-review-correction-required]
prohibited_inputs: [mutation of failed activity or Review history, changed requirement set or strategy boundary, product source, product unit tests, private implementation details]
batching: single
