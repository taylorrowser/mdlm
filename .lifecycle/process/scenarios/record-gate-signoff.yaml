kind: scenario-definition
id: record-gate-signoff
version: 3
description: Record explicit user approval or rejection against one exact frozen candidate baseline.
phases: [phase-0-wayfinding, phase-2-system-definition]
inputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      candidate.payload.role == "candidate"
      && candidate.storage.frozen == true
outputs:
  - name: decision
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: candidate}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/record-gate-signoff.md@3
review_policy_ref: review-applicability@1
participation:
  policy_ref: gate-signoff-participation@1
  arguments:
    candidate: candidate
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && decision.payload.kind == "gate-signoff"
  && decision.payload.effective_scope == candidate.identity.revision_id
  && (
    (
      decision.payload.gate_outcome == "approve"
      && none("gate-rejection-blockers-for@1",
        {candidate: candidate, rejection: decision, scope: "valid"})
    )
    || (
      decision.payload.gate_outcome == "reject"
      && exists("gate-rejection-blockers-for@1",
        {candidate: candidate, rejection: decision, scope: "valid"})
      && none("gate-rejection-blockers-for@1",
        {candidate: candidate, rejection: decision, scope: "unexpected"})
      && every(decision.payload.gate_rejection.findings, finding =>
        exists("gate-rejection-blockers-matching-target@1",
          {rejection: decision, target: finding.target}))
      && every("gate-rejection-blockers-for@1",
        {candidate: candidate, rejection: decision, scope: "valid"}, blocker =>
          !every(decision.payload.gate_rejection.findings, finding =>
            finding.target != blocker.identity.revision_id))
    )
  )
resolves: [candidate-gate-signoff]
prohibited_inputs: [unfrozen candidate, mutable latest aliases, implied approval, inferred stop, inferred deferral, inferred cancellation]
batching: single
