kind: scenario-definition
id: record-gate-signoff
version: 1
description: Record explicit user approval or rejection against one exact frozen candidate baseline.
phases: [phase-0-wayfinding, phase-2-system-definition]
inputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    identity: revision
    conditions:
      all:
        - compare:
            left: {path: {var: candidate, field: payload.role}}
            operator: eq
            right: {literal: candidate}
        - compare:
            left: {path: {var: candidate, field: storage.frozen}}
            operator: eq
            right: {literal: true}
outputs:
  - name: decision
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: candidate}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/record-gate-signoff.md@1
review_policy_ref: review-applicability@1
completion:
  all:
    - compare:
        left: {path: {var: execution, field: integrity.contract_valid}}
        operator: eq
        right: {literal: true}
    - compare:
        left: {path: {var: decision, field: payload.kind}}
        operator: eq
        right: {literal: gate-signoff}
resolves: [candidate-gate-signoff]
prohibited_inputs: [unfrozen candidate, mutable latest aliases, implied approval]
batching: single
