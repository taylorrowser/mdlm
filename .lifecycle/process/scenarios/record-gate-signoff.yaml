kind: scenario-definition
id: record-gate-signoff
version: 1
description: Record explicit user approval or rejection against one exact frozen candidate baseline.
phases: [phase-0-wayfinding, phase-2-system-definition]
inputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      candidate.payload.role == "candidate"
      && candidate.storage.frozen == true
outputs:
  - name: decision
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: candidate}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/record-gate-signoff.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && decision.payload.kind == "gate-signoff"
resolves: [candidate-gate-signoff]
prohibited_inputs: [unfrozen candidate, mutable latest aliases, implied approval]
batching: single
