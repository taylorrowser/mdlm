kind: scenario-definition
id: complete-decomposition-work-package
version: 3
description: Record the next exact completion Revision for a covered decomposition plan.
phases: [phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: plan, types: [DWP], cardinality: one, identity: revision}
  - {name: parents, types: [STK, SYS, CMP], cardinality: one-or-more, identity: revision}
  - {name: outputs, types: [SYS, CMP, DES], cardinality: one-or-more, identity: revision}
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: interfaces, types: [ICSP], cardinality: zero-or-more, identity: revision}
  - {name: verification_strategy, types: [VSP], cardinality: one, identity: revision}
  - {name: simplification_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
outputs:
  - name: completion
    types: [DWP]
    cardinality: one
    identity_from: {input: plan}
    required_payload: {stage: completion}
    required_links:
      - {link: derived-from, target: {input: plan}}
      - {link: decomposes, target: {input: parents}}
      - {link: produces, target: {input: outputs}}
      - {link: allocated-to, target: {input: architecture}}
      - {link: governed-by, target: {input: interfaces}}
      - {link: verified-under, target: {input: verification_strategy}}
      - {link: justifies, target: {input: simplification_reviews}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/complete-decomposition-work-package.md@2
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && completion.identity.id == plan.identity.id
  && completion.payload.stage == "completion"
  && completion.payload.target_child_type == plan.payload.target_child_type
  && (completion.payload.target_child_type != "SYS"
    || (completion.payload.parent_coverage_status == "complete"
      && completion.payload.output_reviews_complete == true))
  && count("decomposition-parents-for@1", {plan: completion})
    == count("decomposition-parents-for@1", {plan: plan})
  && every("decomposition-parents-for@1", {plan: plan}, parent =>
    exists("matching-decomposition-parent@1", {plan: completion, parent: parent})
    && exists("completion-outputs-covering-parent@1",
      {completion: completion, parent: parent}))
  && count("completion-outputs-for@1", {completion: completion})
    == count("decomposition-outputs-for@1", {plan: plan})
  && every("completion-outputs-for@1", {completion: completion}, output =>
    exists("matching-decomposition-output@1", {plan: plan, output: output})
    && every("decomposition-output-parents-for@1", {output: output}, parent =>
      exists("matching-decomposition-parent@1", {plan: plan, parent: parent})))
  && (completion.payload.target_child_type != "SYS"
    || every("completion-simplification-evidence-for@1", {completion: completion}, review =>
      exists("simplification-evidence-matches-plan@1",
        {plan: plan, evidence: review})))
  && count("architectures-for-decomposition@1", {plan: completion}) == 1
  && one("architectures-for-decomposition@1", {plan: completion}) == one("architectures-for-decomposition@1", {plan: plan})
  && count("strategies-for-decomposition@1", {plan: completion}) == 1
  && one("strategies-for-decomposition@1", {plan: completion}) == verification_strategy
  && verification_strategy == one("strategies-for-decomposition@1", {plan: plan})
  && count("interfaces-for-decomposition@1", {plan: completion})
    == count("completion-interfaces-for-plan@1", {plan: plan})
  && every("completion-interfaces-for-plan@1", {plan: plan},
    interface => !every("interfaces-for-decomposition@1", {plan: completion},
      candidate => candidate != interface))
resolves: [decomposition-completion-required, decomposition-parent-coverage-required]
prohibited_inputs: [unreviewed outputs, unresolved blocking questions, incomplete simplification evidence, mutable latest aliases]
batching: single
