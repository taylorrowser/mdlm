kind: scenario-definition
id: report-problem
version: 1
description: Preserve one exact completed formal failure or unsuitable pilot result in a bounded Problem Report.
phases: [phase-6-verification, phase-7-change-control]
inputs:
  - {name: result, types: [RES], cardinality: one, identity: revision}
outputs:
  - name: problem
    types: [PRB]
    cardinality: one
    required_links:
      - {link: reports, target: {input: result}}
prompt_ref: prompts/report-problem.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && (
    (result.payload.claim.kind == "pilot"
      && result.payload.claim.outcome == "unsuitable")
    || (result.payload.claim.kind == "formal"
      && result.payload.claim.outcome == "fail"
      && (result.payload.assessment_state != "assessment-required"
        || exists("passing-reviews-for@1", {subject: result}))
      && exists("completed-formal-runs-producing-result@1", {result: result}))
  )
  && problem.payload.disposition == "open"
resolves: [problem-report-required]
prohibited_inputs: [mutable latest aliases, product source code not present in exact evidence, inconclusive or infrastructure evidence represented as a product defect]
batching: single
