kind: scenario-definition
id: write-verification-activity
version: 2
description: Write one source-independent pilot activity with explicit success and discrimination behavior for an exact strategy and its governed requirements.
phases: [phase-1-product-assurance]
inputs:
  - {name: requirements, types: [STK], cardinality: one-or-more, identity: revision}
  - {name: strategy, types: [VSP], cardinality: one, identity: revision}
  - {name: intent_support, types: [PSP], cardinality: one, identity: revision}
outputs:
  - name: activity
    types: [VER]
    cardinality: one
    required_links:
      - {link: verifies, target: {input: requirements}}
      - {link: verifies-revision, target: {input: requirements}}
      - {link: governed-by, target: {input: strategy}}
      - {link: derived-from, target: {input: intent_support}}
prompt_ref: prompts/write-verification-activity.md@2
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && activity.payload.kind == "pilot"
  && activity.payload.claim.scope == "verification-design"
  && activity.payload.claim.formal_evidence_eligible == false
  && requirements == select("phase-1-requirements-governed-by-strategy@1",
    {strategy: strategy})
  && intent_support == one("pilot-intent-support-for-strategy@1",
    {strategy: strategy})
resolves: [pilot-verification-activity-required]
prohibited_inputs: [product source code, product unit tests, private implementation details, unstated product behavior, formal acceptance conclusion]
batching: coherent-batch
