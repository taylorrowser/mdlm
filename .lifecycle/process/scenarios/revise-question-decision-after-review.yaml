kind: scenario-definition
id: revise-question-decision-after-review
version: 1
description: Replace one failed preferential-answer, deferral, or cancellation Decision under renewed exact stakeholder authority.
phases: [phase-0-wayfinding]
inputs:
  - {name: decision, types: [DEC], cardinality: one, identity: revision}
  - {name: question, types: [QST], cardinality: one, identity: revision}
  - {name: lineage, types: [DEC], cardinality: one-or-more, identity: revision}
  - {name: prior_failed_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DEC]
    cardinality: one
    required_links:
      - {link: resolves, target: {input: question}}
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-question-decision-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: consequential-decision-participation@1
  arguments: {subject: question}
authority_evidence: {output: replacement, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == decision.identity.id
  && replacement.payload.kind == decision.payload.kind
  && replacement.payload.effective_scope == question.identity.revision_id
  && replacement.payload.kind in ["scope", "deferral", "cancellation"]
  && (
    question.payload.intent_scope != "product"
    || replacement.payload.decision == question.payload.attended_answer
    || present(replacement.payload.attended_answer_change)
  )
  && exists("valid-question-decision-replacements-for@1", {decision: decision})
resolves: [question-decision-review-correction-required]
prohibited_inputs: [changed Question scope, invented stakeholder preference, suppression of failed Reviews, mutation of immutable history]
batching: single
