kind: scenario-definition
id: resolve-question-with-prototype
version: 2
description: Resolve one prototype-bound empirical question with an exact ART, bounded DEC finding, and satisfying QST Revision.
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition]
inputs:
  - name: question
    types: [QST]
    cardinality: one
    identity: revision
    conditions: >-
      question.payload.kind == "empirical"
      && question.payload.state == "open"
      && question.payload.resolution_evidence == "prototype"
      && question.storage.frozen == true
  - name: blocked_targets
    types: [PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, QST, DEC]
    cardinality: zero-or-more
    identity: stable
outputs:
  - name: prototype
    types: [ART]
    cardinality: one
    required_links:
      - {link: derived-from, target: {input: question}}
  - name: finding
    types: [DEC]
    cardinality: one
    required_links:
      - {link: resolves, target: {input: question}}
      - {link: justifies, target: {output: prototype}}
  - name: updated_question
    types: [QST]
    cardinality: one
    identity_from: {input: question}
    required_links:
      - {link: blocks, target: {input: blocked_targets}}
prompt_ref: prompts/resolve-question-with-prototype.md@2
review_policy_ref: review-applicability@1
participation:
  policy_ref: question-participation@1
  arguments:
    question: question
    selected_phase: phase
authority_evidence: {output: finding, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && prototype.payload.kind == "prototype"
  && prototype.payload.repository_ref == question.payload.prototype_evidence.repository_ref
  && prototype.payload.supported_behavior == question.payload.prototype_evidence.supported_behavior
  && prototype.payload.unsupported_behavior == question.payload.prototype_evidence.unsupported_behavior
  && finding.payload.kind == "decision"
  && (finding.payload.decision == question.payload.prototype_evidence.finding_if_supported
  || finding.payload.decision == question.payload.prototype_evidence.finding_if_not_supported)
  && finding.payload.effective_scope == question.payload.prototype_evidence.repository_ref
  && updated_question.identity.id == question.identity.id
  && updated_question.payload.kind == "empirical"
  && updated_question.payload.question == question.payload.question
  && updated_question.payload.state == "answered"
  && updated_question.payload.resolution_evidence == "prototype"
  && updated_question.payload.prototype_evidence == question.payload.prototype_evidence
resolves: [prototype-question-resolution]
prohibited_inputs:
  - unstated prototype observation
  - conclusion outside the two declared bounded findings
  - mutable repository reference
  - prototype finding represented as RUN or RES evidence
batching: single
