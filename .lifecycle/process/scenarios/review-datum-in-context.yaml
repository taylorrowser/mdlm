kind: scenario-definition
id: review-datum-in-context
version: 2
description: Independently review one exact substantive revision in one exact frozen baseline context.
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition, phase-2-pilot-assessment, phase-7-change-control]
inputs:
  - {name: subject, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, DEC, PRB, CHG, PAS], cardinality: one, identity: revision}
  - {name: review_context, types: [BSL], cardinality: one, identity: revision}
  - {name: context_members, types: [MAP, PSP, STK], cardinality: zero-or-more, identity: revision}
outputs:
  - name: review
    types: [REV]
    cardinality: one
    required_links:
      - {link: reviews, target: {input: subject}}
      - {link: contextualizes, target: {input: review_context}}
prompt_ref: prompts/review-datum-in-context.md@2
review_policy_ref: review-applicability@1
participation:
  policy_ref: contextual-review-participation@1
  arguments:
    subject: subject
    review_context: review_context
authority_evidence: {output: review, type: REV}
standing_delegation:
  selector_ref: applicable-authority-delegations-for@1
  target_input: subject
  authority: stakeholder
  delegate: independent-reviewer
completion: >-
  execution.integrity.contract_valid == true
  && review_context.payload.kind == "review-context"
  && review_context.storage.frozen == true
  && review.payload.outcome in ["pass", "fail", "cancelled"]
  && (
    (exists("intent-candidates-matching-subject@1", {subject: subject})
      && exists("valid-product-simplification-reviews@1", {review: review}))
    || (none("intent-candidates-matching-subject@1", {subject: subject})
      && review.payload.review_kind != "simplification-product-definition")
  )
resolves: [passing-review-required, candidate-members-reviewed]
prohibited_inputs: [unfrozen context, mutable latest aliases, prior review outcome as authority]
batching: coherent-batch
