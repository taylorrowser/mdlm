kind: scenario-definition
id: execute-lower-level-decomposition-work-package
version: 1
description: Produce one minimal coherent CMP or DES set within one exact reviewed lower-level decomposition plan.
phases: [phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: plan, types: [DWP], cardinality: one, identity: revision}
  - {name: parents, types: [SYS, CMP], cardinality: one-or-more, identity: revision}
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: interfaces, types: [ICSP], cardinality: zero-or-more, identity: revision}
outputs:
  - name: component_requirements
    types: [CMP]
    cardinality: zero-or-more
    required_links:
      - {link: derived-from, target: {input: parents}, distribution: cover}
      - {link: decomposes, target: {input: plan}, distribution: each-output}
      - {link: allocated-to, target: {input: architecture}, distribution: each-output}
      - {link: governed-by, target: {input: interfaces}}
  - name: design_requirements
    types: [DES]
    cardinality: zero-or-more
    required_links:
      - {link: derived-from, target: {input: parents}, distribution: cover}
      - {link: decomposes, target: {input: plan}, distribution: each-output}
      - {link: allocated-to, target: {input: architecture}, distribution: each-output}
      - {link: governed-by, target: {input: interfaces}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/execute-lower-level-decomposition-work-package.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && exists("decomposition-outputs-for@1", {plan: plan})
  && every("decomposition-outputs-for@1", {plan: plan}, output =>
    output.identity.type == plan.payload.target_child_type)
resolves: [lower-level-decomposition-execution-required]
prohibited_inputs: [product source code, verification implementation, mutable latest aliases]
batching: coherent-batch
