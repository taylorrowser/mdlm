kind: scenario-definition
id: review-implementation
version: 1
description: Review implementation and execution evidence
phases:
- phase-0-tiny-product
inputs:
- name: subject
  types:
  - IMP
  cardinality: one
  identity: revision
- name: result
  types:
  - RES
  cardinality: one
  identity: revision
- name: requirements
  types:
  - RQS
  cardinality: one
  identity: revision
outputs:
- name: review
  types:
  - REV
  cardinality: one
  required_links:
  - link: reviews
    target:
      input: subject
  - link: uses-evidence
    target:
      input: result
  required_payload:
    publication: recorded
prompt_ref: prompts/review-implementation.md@3
review_policy_ref: review-applicability@1
completion: 'execution.integrity.contract_valid == true && (exists("passing-results@1", {implementation: subject})
  && every("passing-results@1", {implementation: subject}, passed => passed.identity.revision_id == result.identity.revision_id))
  && exists("requirements-for@1", {implementation: subject}) && every("requirements-for@1", {implementation: subject},
  req => req.identity.revision_id == requirements.identity.revision_id)'
resolves:
- implementation-review-required
prohibited_inputs: []
batching: single
participation:
  policy_ref: independent-review@1
  arguments:
    subject: subject
authority_evidence:
  output: review
  type: REV
