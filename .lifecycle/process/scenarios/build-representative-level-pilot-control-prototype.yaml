kind: scenario-definition
id: build-representative-level-pilot-control-prototype
version: 1
description: Create one disposable inline good/bad control pair for a reviewed representative STK, SYS, or CMP pilot activity.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: requirement, types: [STK, SYS, CMP, DES], cardinality: one, identity: revision}
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
    conditions: >-
      activity.payload.kind == "pilot"
      && exists("passing-reviews-for@1", {subject: activity})
      && one("requirements-for-pilot-activity@1", {activity: activity}) == requirement
outputs:
  - name: target
    types: [ART]
    cardinality: one
    required_links:
      - {link: derived-from, target: {input: requirement}}
prompt_ref: prompts/build-representative-level-pilot-control-prototype.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && target.payload.kind == "prototype"
  && target.payload.prototype_controls.activity_ref == activity.identity.revision_id
  && target.payload.prototype_controls.known_good.expected_verification_outcome == "pass"
  && target.payload.prototype_controls.known_bad.expected_verification_outcome == "fail"
  && target.payload.supported_behavior == [activity.payload.expected_success_activity]
  && target.payload.unsupported_behavior == [activity.payload.expected_discrimination_activity]
resolves: [representative-level-pilot-target-required]
prohibited_inputs: [product source code, product unit tests, product implementation, mutable repository reference, more than one injected fault]
batching: single
