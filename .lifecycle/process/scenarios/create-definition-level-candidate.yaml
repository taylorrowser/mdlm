kind: scenario-definition
id: create-definition-level-candidate
version: 1
description: Freeze one reviewed lower-level completion, its exact definition set, complete formal VER coverage, and applicable pilot evidence as a direct candidate.
phases: [phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: completion, types: [DWP], cardinality: one, identity: revision}
  - {name: definition_members, types: [CMP, DES, ASP, ICSP, DWP, VSP, VER], cardinality: one-or-more, identity: revision}
  - {name: evidence, types: [REV, ENV, ART, VAI, RUN, RES], cardinality: one-or-more, identity: revision}
outputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    required_links: []
prompt_ref: prompts/create-definition-level-candidate.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && candidate.payload.kind == "level-candidate"
  && candidate.payload.role == "candidate"
  && candidate.payload.scope == completion.identity.revision_id
  && candidate.storage.frozen == true
  && exists("complete-definition-level-candidates-for-completion@1",
    {completion: completion})
resolves: [definition-level-candidate-required]
prohibited_inputs: [unreviewed definition set, incomplete formal coverage, duplicate pilot evidence, mutable latest aliases]
batching: single
