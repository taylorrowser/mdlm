kind: scenario-definition
id: escalate-question-decision-review-correction
version: 1
description: Replace one exhausted failed Question Decision after explicitly presenting its complete correction history.
phases: [phase-0-wayfinding]
inputs:
  - {name: decision, types: [DEC], cardinality: one, identity: revision}
  - {name: question, types: [QST], cardinality: one, identity: revision}
  - {name: prior_failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DEC]
    cardinality: one
    required_links:
      - {link: resolves, target: {input: question}}
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/escalate-question-decision-review-correction.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: consequential-decision-participation@1
  arguments: {subject: question}
authority_evidence: {output: replacement, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == decision.identity.id
  && replacement.payload.kind == decision.payload.kind
  && replacement.payload.effective_scope == question.identity.revision_id
  && replacement.payload.kind in ["scope", "deferral", "cancellation"]
resolves: [question-decision-review-escalation-required]
prohibited_inputs: [changed Question scope, invented stakeholder preference, suppression of exhausted Review history, mutation of immutable history]
batching: single
