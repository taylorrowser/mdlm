kind: scenario-definition
id: revise-phase-2-subject-after-simplification
version: 1
description: Correct one exact SYS subject and all of its current blocking simplification findings without widening scope.
phases: [phase-2-system-definition]
inputs:
  - {name: subject, types: [SYS], cardinality: one, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
  - {name: plan, types: [DWP], cardinality: one, identity: revision}
  - {name: parents, types: [STK], cardinality: one-or-more, identity: revision}
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: interfaces, types: [ICSP], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [SYS]
    cardinality: one
    required_links:
      - {link: corrects-review, target: {input: failed_reviews}}
      - {link: derived-from, target: {input: parents}}
      - {link: decomposes, target: {input: plan}}
      - {link: allocated-to, target: {input: architecture}}
      - {link: governed-by, target: {input: interfaces}}
prompt_ref: prompts/revise-phase-2-subject-after-simplification.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && replacement.identity.type == subject.identity.type
  && replacement.payload.architecture_allocation.architecture_revision == architecture.identity.revision_id
resolves: [phase-2-simplification-correction-required]
prohibited_inputs: [unrelated subjects, scope expansion, mutation or deletion of failed evidence, mutable latest aliases]
batching: single
