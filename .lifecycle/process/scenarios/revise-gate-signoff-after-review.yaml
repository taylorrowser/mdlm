kind: scenario-definition
id: revise-gate-signoff-after-review
version: 2
description: Replace one failed gate sign-off Decision under fresh stakeholder authority without changing its exact candidate scope.
phases: [phase-0-wayfinding, phase-2-system-definition, phase-3-component-definition, phase-4-design-definition]
inputs:
  - {name: decision, types: [DEC], cardinality: one, identity: revision}
  - {name: candidate, types: [BSL], cardinality: one, identity: revision}
  - {name: candidate_review, types: [REV], cardinality: one, identity: revision}
  - {name: lineage, types: [DEC], cardinality: one-or-more, identity: revision}
  - {name: prior_failed_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DEC]
    cardinality: one
    identity_from: {input: decision}
    required_links:
      - {link: justifies, target: {input: candidate}}
      - {link: relies-on-review, target: {input: candidate_review}}
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-gate-signoff-after-review.md@2
review_policy_ref: review-applicability@1
participation:
  policy_ref: gate-signoff-participation@1
  arguments:
    candidate: candidate
authority_evidence: {output: replacement, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == decision.identity.id
  && replacement.payload.kind == "gate-signoff"
  && replacement.payload.effective_scope == candidate.identity.revision_id
  && replacement.payload.gate_outcome in ["approve", "reject"]
  && exists("valid-gate-signoff-replacements-for@1", {decision: decision})
resolves: [gate-signoff-review-correction-required]
prohibited_inputs: [changed candidate scope, implied approval, mutation of failed Decision or Review history]
batching: single
