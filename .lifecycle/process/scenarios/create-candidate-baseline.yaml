kind: scenario-definition
id: create-candidate-baseline
version: 1
description: Freeze exact reviewed definition revisions as a candidate baseline for one role and scope.
phases: [phase-0-wayfinding, phase-2-system-definition]
inputs:
  - name: definition_members
    types: [PSP, STK, SYS]
    cardinality: one-or-more
    identity: revision
    conditions:
      exists:
        selector: passing-reviews-for@1
        arguments: {subject: {var: definition_members}}
outputs:
  - {name: candidate, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/create-candidate-baseline.md@1
review_policy_ref: review-applicability@1
completion:
  all:
    - compare:
        left: {path: {var: execution, field: integrity.contract_valid}}
        operator: eq
        right: {literal: true}
    - compare:
        left: {path: {var: candidate, field: payload.role}}
        operator: eq
        right: {literal: candidate}
    - compare:
        left: {path: {var: candidate, field: storage.frozen}}
        operator: eq
        right: {literal: true}
resolves: []
prohibited_inputs: [mutable latest aliases, unreviewed definition revisions, raw evidence as definition membership]
batching: single
