kind: scenario-definition
id: revise-requirement-under-change
version: 3
description: Replace one exact accepted STK or shared SYS in its Stable Datum lineage under the approved bounded Change Request.
phases: [phase-7-change-control]
inputs:
  - {name: change, types: [CHG], cardinality: one, identity: revision}
  - {name: requirement, types: [STK, SYS], cardinality: one, identity: revision}
  - {name: approval, types: [DEC], cardinality: one, identity: revision}
outputs:
  - name: revised_requirement
    types: [STK, SYS]
    cardinality: one
    identity_from: {input: requirement}
    required_links:
      - {link: changed-under, target: {input: change}}
prompt_ref: prompts/revise-requirement-under-change.md@3
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && revised_requirement.identity.id == requirement.identity.id
  && revised_requirement.identity.type == requirement.identity.type
  && !every("impacted-requirements-for-change@3", {change: change}, impacted => impacted != requirement)
  && exists("valid-stakeholder-change-impact@2", {change: change})
  && approval.payload.kind == "change-approval"
  && approval.payload.change_disposition == "approve"
resolves: [change-revision-required]
prohibited_inputs: [unapproved changes, unrelated requirements, mutable latest aliases]
batching: single
