kind: scenario-definition
id: simplify-architecture-and-interfaces
version: 2
description: Adversarially challenge architecture elements, interactions, boundaries, and interface obligations in one frozen decomposition context.
phases: [phase-2-system-definition]
inputs:
  - name: plan
    types: [DWP]
    cardinality: one
    identity: revision
  - name: subject_context
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      subject_context.payload.kind == "review-context"
      && subject_context.storage.frozen == true
  - {name: definition_members, types: [SYS, ASP, ICSP, DWP], cardinality: one-or-more, identity: revision}
outputs:
  - name: review
    types: [REV]
    cardinality: one
    required_links:
      - {link: reviews, target: {input: subject_context}}
      - {link: contextualizes, target: {input: subject_context}}
    permitted_links:
      - {link: blocks, target: {input: definition_members}}
prompt_ref: prompts/simplify-architecture-and-interfaces.md@2
review_policy_ref: review-applicability@1
participation:
  policy_ref: contextual-review-participation@1
  arguments:
    subject: plan
    review_context: subject_context
authority_evidence: {output: review, type: REV}
standing_delegation:
  selector_ref: applicable-authority-delegations-for@1
  target_input: plan
  authority: stakeholder
  delegate: independent-reviewer
completion: >-
  execution.integrity.contract_valid == true
  && review.payload.review_kind == "simplification-architecture-interfaces"
  && exists("valid-phase-2-simplification-review@1", {review: review, plan: plan})
resolves: [architecture-interface-simplification-required]
prohibited_inputs: [implementation convenience as necessity, mutable latest aliases, prior review outcome as authority]
batching: coherent-batch
