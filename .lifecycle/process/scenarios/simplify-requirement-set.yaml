kind: scenario-definition
id: simplify-requirement-set
version: 2
description: Adversarially challenge the necessity, coverage, duplication, and provenance of one frozen decomposition context.
phases: [phase-2-system-definition]
inputs:
  - name: plan
    types: [DWP]
    cardinality: one
    identity: revision
  - name: subject_context
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      subject_context.payload.kind == "review-context"
      && subject_context.storage.frozen == true
  - {name: definition_members, types: [SYS, ASP, ICSP, DWP], cardinality: one-or-more, identity: revision}
outputs:
  - name: review
    types: [REV]
    cardinality: one
    required_links:
      - {link: reviews, target: {input: subject_context}}
      - {link: contextualizes, target: {input: subject_context}}
prompt_ref: prompts/simplify-requirement-set.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: contextual-review-participation@1
  arguments:
    subject: plan
    review_context: subject_context
authority_evidence: {output: review, type: REV}
standing_delegation:
  selector_ref: applicable-authority-delegations-for@1
  target_input: plan
  authority: stakeholder
  delegate: independent-reviewer
completion: >-
  execution.integrity.contract_valid == true
  && review.payload.review_kind == "simplification-requirements"
  && review.payload.decomposition_plan_revision == plan.identity.revision_id
  && review.payload.outcome in ["pass", "fail", "cancelled"]
  && (
    (review.payload.outcome in ["pass", "cancelled"]
      && none("phase-2-simplification-blockers-for-review@1", {review: review})
      && none("phase-2-removed-outputs-for-review@1", {review: review}))
    || (review.payload.outcome == "fail"
      && every("phase-2-removed-outputs-for-review@1", {review: review}, removed =>
        exists("matching-decomposition-output@1", {plan: plan, output: removed})
        && exists("phase-2-review-blocks-definition-member@1",
          {review: review, member: removed}))
      && ((present(review.payload.definition_simplification.scope_reduction)
          && exists("phase-2-removed-outputs-for-review@1", {review: review}))
        || (!present(review.payload.definition_simplification.scope_reduction)
          && none("phase-2-removed-outputs-for-review@1", {review: review})))
      && (
        (review.payload.definition_simplification.correction_set == "subject"
          && count("phase-2-simplification-blockers-for-review@1", {review: review}) == 1
          && count("phase-2-primary-system-simplification-blocker@1", {review: review}) == 1
          && exists("matching-decomposition-output@1", {plan: plan,
            output: one("phase-2-primary-system-simplification-blocker@1", {review: review})}))
        || (review.payload.definition_simplification.correction_set == "definition-consistency"
          && exists("phase-2-primary-definition-simplification-blocker@1", {review: review})
          && count("phase-2-simplification-blockers-for-review@1", {review: review})
            == count("phase-2-definition-members-for-plan@1", {plan: plan})
          && every("phase-2-definition-members-for-plan@1", {plan: plan}, member =>
            exists("phase-2-review-blocks-definition-member@1",
              {review: review, member: member})))
      ))
  )
resolves: [decomposition-simplification-required]
prohibited_inputs: [scope expansion without accepted provenance, mutable latest aliases, prior review outcome as authority]
batching: coherent-batch
