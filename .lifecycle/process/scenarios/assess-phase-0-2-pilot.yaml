kind: scenario-definition
id: assess-phase-0-2-pilot
version: 1
description: Measure one exact frozen pilot context and record a proceed, change, or stop recommendation.
phases: [phase-2-pilot-assessment]
inputs:
  - name: context
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: 'context.payload.kind == "pilot-assessment-context" && context.storage.frozen == true'
outputs:
  - name: assessment
    types: [PAS]
    cardinality: one
    required_links:
      - {link: measures, target: {input: context}}
prompt_ref: prompts/assess-phase-0-2-pilot.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && assessment.payload.pilot_scope == "phase-0-through-2"
  && assessment.payload.measurements.evidence_reuse.explanations_correct == true
  && assessment.payload.measurements.loose_ends.useful == true
  && assessment.payload.measurements.verification_discrimination.discriminates == true
resolves: [pilot-assessment-required]
prohibited_inputs: [mutable latest aliases, generated indexes or reports as lifecycle truth, estimates without exact evidence context, formal promotion evidence]
batching: single
