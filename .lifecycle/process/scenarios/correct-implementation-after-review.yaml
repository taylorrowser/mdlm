kind: scenario-definition
id: correct-implementation-after-review
version: 1
description: Correct implementation after content Review
phases:
- phase-0-tiny-product
inputs:
- name: subject
  types:
  - IMP
  cardinality: one
  identity: revision
- name: requirements
  types:
  - REQ
  cardinality: one
  identity: revision
- name: failure
  types:
  - REV
  cardinality: one
  identity: revision
outputs:
- name: implementation
  types:
  - IMP
  cardinality: one
  required_links:
  - link: implements
    target:
      input: requirements
  - link: corrects
    target:
      input: failure
  required_payload:
    publication: recorded
  identity_from:
    input: subject
prompt_ref: prompts/correct-implementation-after-review.md@1
review_policy_ref: review-applicability@1
completion: 'execution.integrity.contract_valid == true && (true) && exists("fail-reviews@1", {subject: subject})
  && every("fail-reviews@1", {subject: subject}, failed => failed.identity.revision_id == failure.identity.revision_id)'
resolves:
- implementation-review-correction
prohibited_inputs: []
batching: single
