kind: scenario-definition
id: create-review-context
version: 2
description: Deterministically freeze one primary subject with the exact parent, sibling, decision, and candidate context needed for review.
kernel_materialization:
  kind: exact-baseline@1
  output: context
  subject_input: subject
  support_input: context_members
  payload_fields:
    title: title
    kind: kind
    role: role
    scope: scope
    group: group
    members: definition_members
    evidence: evidence
  title_prefix: 'Review context for '
  baseline_kind: review-context
  baseline_role: review-context
  baseline_group: DEFAULT
  evidence_subject_types: [ENV]
  evidence_types: [RES, RUN, VAI, VER]
phases: [phase-2-system-definition, phase-2-pilot-assessment, phase-3-component-definition, phase-4-design-definition, phase-5-implementation, phase-6-verification, phase-7-change-control]
inputs:
  - {name: subject, types: [MAP, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, BSL, DEC, PRB, CHG, PAS], cardinality: one, identity: revision}
  - {name: context_members, types: [MAP, QST, DEC, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS], cardinality: zero-or-more, identity: revision}
outputs:
  - {name: context, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/create-review-context.md@2
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && context.payload.kind == "review-context"
  && context.payload.scope == subject.identity.revision_id
  && context_members == select("review-context-members-for@1", {subject: subject})
  && every("review-context-members-for@1", {subject: subject}, member =>
    exists("review-context-contains-required-support@1",
      {subject: subject, context: context, required_support: member}))
  && context.storage.frozen == true
  && exists("valid-review-contexts-for@1", {subject: subject})
resolves: [review-context-required]
prohibited_inputs: [mutable latest aliases, generated indexes as lifecycle truth]
batching: either
