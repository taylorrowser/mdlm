kind: scenario-definition
id: create-review-context
version: 1
description: Deterministically freeze one primary subject with the exact parent, sibling, decision, and candidate context needed for review.
phases: [phase-0-wayfinding, phase-2-system-definition]
inputs:
  - {name: subject, types: [MAP, PSP, STK, SYS, BSL, DEC], cardinality: one, identity: revision}
outputs:
  - {name: context, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/create-review-context.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && context.payload.kind == "review-context"
  && context.storage.frozen == true
resolves: [review-context-required]
prohibited_inputs: [mutable latest aliases, generated indexes as lifecycle truth]
batching: either
