kind: scenario-definition
id: revise-phase-2-definition-set-after-simplification
version: 1
description: Atomically replace one exact Phase 2 definition consistency set while omitting only SYS outputs explicitly removed by its failed Review.
phases: [phase-2-system-definition]
inputs:
  - {name: failed_review, types: [REV], cardinality: one, identity: revision}
  - {name: prior_architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: prior_interfaces, types: [ICSP], cardinality: one-or-more, identity: revision}
  - {name: prior_plan, types: [DWP], cardinality: one, identity: revision}
  - {name: prior_requirements, types: [SYS], cardinality: one-or-more, identity: revision}
  - {name: parents, types: [STK], cardinality: one-or-more, identity: revision}
  - {name: verification_strategy, types: [VSP], cardinality: one, identity: revision}
outputs:
  - name: architecture
    types: [ASP]
    cardinality: one
    required_links:
      - {link: corrects-review, target: {input: failed_review}}
      - {link: governs, target: {input: parents}}
      - {link: governs, target: {output: plan}}
  - name: interfaces
    types: [ICSP]
    cardinality: one-or-more
    required_links:
      - {link: corrects-review, target: {input: failed_review}}
      - {link: defines-interface-for, target: {output: architecture}}
  - name: plan
    types: [DWP]
    cardinality: one
    required_links:
      - {link: corrects-review, target: {input: failed_review}}
      - {link: decomposes, target: {input: parents}}
      - {link: allocated-to, target: {output: architecture}}
      - {link: governed-by, target: {output: interfaces}}
      - {link: verified-under, target: {input: verification_strategy}}
  - name: requirements
    types: [SYS]
    cardinality: one-or-more
    required_links:
      - {link: corrects-review, target: {input: failed_review}}
      - {link: derived-from, target: {input: parents}}
      - {link: decomposes, target: {output: plan}}
      - {link: allocated-to, target: {output: architecture}}
      - {link: governed-by, target: {output: interfaces}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: plan}}
prompt_ref: prompts/revise-phase-2-definition-set-after-simplification.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-2-correction-participation@1
  arguments: {subject: prior_plan}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && architecture.identity.id == prior_architecture.identity.id
  && plan.identity.id == prior_plan.identity.id
  && plan.payload.stage == "planning"
  && count("architectures-for-decomposition@1", {plan: plan}) == 1
  && one("architectures-for-decomposition@1", {plan: plan}) == architecture
  && count("strategies-for-decomposition@1", {plan: plan}) == 1
  && one("strategies-for-decomposition@1", {plan: plan}) == verification_strategy
  && count("interfaces-for-decomposition@1", {plan: plan}) == count("interfaces-for-decomposition@1", {plan: prior_plan})
  && every("interfaces-for-decomposition@1", {plan: prior_plan}, prior_interface =>
    count("newer-revisions-for@1", {subject: prior_interface}) == 1
    && exists("matching-decomposition-interface@1", {plan: plan,
      interface: one("newer-revisions-for@1", {subject: prior_interface})}))
  && every("interfaces-for-decomposition@1", {plan: plan}, interface =>
    interface.payload.architecture_revision == architecture.identity.revision_id)
  && every("phase-2-system-requirements-for-review@1", {review: failed_review, plan: prior_plan}, prior =>
    (exists("phase-2-review-removes-output@1", {review: failed_review, output: prior})
      && none("newer-revisions-for@1", {subject: prior}))
    || (none("phase-2-review-removes-output@1", {review: failed_review, output: prior})
      && count("newer-revisions-for@1", {subject: prior}) == 1
      && exists("matching-decomposition-output@1", {plan: plan,
        output: one("newer-revisions-for@1", {subject: prior})})))
  && every("decomposition-outputs-for@1", {plan: plan}, requirement =>
    exists("matching-reviewed-phase-2-system-requirement@1",
      {review: failed_review, plan: prior_plan, replacement: requirement})
    && requirement.payload.architecture_allocation.architecture_revision == architecture.identity.revision_id)
  && (
    (policy("phase-2-correction-participation@1",
      {subject: prior_plan}).authority_mode == "autonomous"
      && none("phase-2-correction-decisions-for@1",
        {replacement: plan}))
    || (policy("phase-2-correction-participation@1",
      {subject: prior_plan}).authority_mode == "attended"
      && count("phase-2-correction-decisions-for@1",
        {replacement: plan}) == 1)
  )
resolves: [phase-2-definition-consistency-correction-required]
prohibited_inputs: [scope expansion, unrelated definition subjects, mutation or deletion of failed evidence, downstream candidates, mutable latest aliases]
batching: coherent-batch
