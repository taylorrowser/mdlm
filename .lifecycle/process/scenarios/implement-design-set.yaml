kind: scenario-definition
id: implement-design-set
version: 1
description: Publish one controlled exact-commit implementation artifact covering one reviewed and approved design candidate.
phases: [phase-5-implementation]
inputs:
  - {name: candidate, types: [BSL], cardinality: one, identity: revision}
  - {name: design_requirements, types: [DES], cardinality: one-or-more, identity: revision}
outputs:
  - name: implementation
    types: [ART]
    cardinality: one
    required_payload: {kind: implementation}
    required_links:
      - {link: realizes-candidate, target: {input: candidate}}
      - {link: implements, target: {input: design_requirements}}
prompt_ref: prompts/implement-design-set.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && candidate == one("phase-5-entry-design-candidates@1", {})
  && design_requirements == select("design-requirements-for-phase-5-candidate@1", {candidate: candidate})
  && implementation.payload.kind == "implementation"
  && present(implementation.payload.repository_ref)
  && present(implementation.payload.public_interface)
  && present(implementation.payload.design_path_mapping)
  && exists("implementation-artifacts-for-design-candidate@1", {candidate: candidate})
resolves: [product-implementation-required]
prohibited_inputs: [mutable repository aliases, uncommitted product bytes, private implementation details outside the product repository]
batching: single
