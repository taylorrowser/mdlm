kind: scenario-definition
id: revise-verification-strategy-after-review
version: 2
description: Correct one failed Phase 1 verification strategy through bounded autonomous cycles and the same exact attended escalation interface.
phases: [phase-1-product-assurance]
inputs:
  - name: strategy
    types: [VSP]
    cardinality: one
    identity: revision
    conditions: >-
      exists("failing-reviews-for@1", {subject: strategy})
      && none("newer-revisions-for@1", {subject: strategy})
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("matching-failing-review-for@1",
        {subject: strategy, review: failed_reviews})
  - name: requirements
    types: [STK]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("matching-verification-strategies-for-requirement@1",
        {requirement: requirements, strategy: strategy})
outputs:
  - name: replacement
    types: [VSP]
    cardinality: one
    identity_from: {input: strategy}
    required_links:
      - {link: governs, target: {input: requirements}}
      - {link: governs-revision, target: {input: requirements}}
      - {link: corrects-review, target: {input: failed_reviews}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-verification-strategy-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-1-assurance-correction-participation@1
  arguments: {subject: strategy}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == strategy.identity.id
  && replacement.identity.type == strategy.identity.type
  && exists("corrected-verification-strategy-revisions-for@1", {strategy: strategy})
  && (
    (policy("phase-1-assurance-correction-participation@1",
      {subject: strategy}).authority_mode == "autonomous"
      && none("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}))
    || (policy("phase-1-assurance-correction-participation@1",
      {subject: strategy}).authority_mode == "attended"
      && count("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}) == 1)
  )
resolves: [verification-strategy-review-correction-required]
prohibited_inputs: [mutation of failed strategy or Review history, unrelated scope expansion, product source, product unit tests]
batching: single
