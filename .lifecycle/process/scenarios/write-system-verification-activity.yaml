kind: scenario-definition
id: write-system-verification-activity
version: 1
description: Write one source-independent pilot activity for the exact representative SYS and strategy.
phases: [phase-2-system-definition]
inputs:
  - {name: requirement, types: [SYS], cardinality: one, identity: revision}
  - {name: strategy, types: [VSP], cardinality: one, identity: revision}
outputs:
  - name: activity
    types: [VER]
    cardinality: one
    required_links:
      - {link: verifies, target: {input: requirement}}
      - {link: verifies-revision, target: {input: requirement}}
      - {link: governed-by, target: {input: strategy}}
prompt_ref: prompts/write-system-verification-activity.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && activity.payload.kind == "pilot"
  && activity.payload.claim.scope == "verification-design"
  && activity.payload.claim.formal_evidence_eligible == false
  && exists("matching-verification-strategies-for-requirement@1",
    {requirement: requirement, strategy: strategy})
resolves: [system-pilot-verification-activity-required]
prohibited_inputs: [product source code, product unit tests, private implementation details, unstated product behavior, formal acceptance conclusion]
batching: single
