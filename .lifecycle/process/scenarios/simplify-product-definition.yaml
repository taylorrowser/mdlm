kind: scenario-definition
id: simplify-product-definition
version: 1
description: Independently challenge one exact Phase 0 product-definition set for unnecessary purpose, stakeholder intent, or scope before fan-out.
phases: [phase-0-wayfinding]
inputs:
  - name: subject_context
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      subject_context.payload.kind == "review-context"
      && subject_context.payload.scope == "phase-0-wayfinding@4"
      && subject_context.storage.frozen == true
outputs:
  - name: review
    types: [REV]
    cardinality: one
    required_links:
      - {link: reviews, target: {input: subject_context}}
      - {link: contextualizes, target: {input: subject_context}}
prompt_ref: prompts/simplify-product-definition.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: contextual-review-participation@1
  arguments:
    subject: subject_context
    review_context: subject_context
authority_evidence: {output: review, type: REV}
completion: >-
  execution.integrity.contract_valid == true
  && review.payload.review_kind == "simplification-product-definition"
  && (
    (review.payload.outcome == "pass"
      && none("product-simplification-blockers-for-review@1", {review: review}))
    || (review.payload.outcome == "fail"
      && exists("product-simplification-blockers-for-review@1", {review: review})
      && none("unexpected-product-simplification-blockers-for-review@1",
        {review: review, subject_context: subject_context}))
  )
resolves: [product-simplification-required]
prohibited_inputs: [scope expansion without exact stakeholder authority, downstream verification or decomposition data, prior Review outcome as authority]
batching: single
