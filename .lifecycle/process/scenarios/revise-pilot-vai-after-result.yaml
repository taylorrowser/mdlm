kind: scenario-definition
id: revise-pilot-vai-after-result
version: 1
description: Correct one pilot procedure after accepted unfavorable execution evidence, optionally reconciling only its exact bound ENV or ART.
phases: [phase-1-product-assurance, phase-2-system-definition]
inputs:
  - {name: implementation, types: [VAI], cardinality: one, identity: revision}
  - {name: failed_results, types: [RES], cardinality: one-or-more, identity: revision}
  - {name: activity, types: [VER], cardinality: one, identity: revision}
  - {name: environment, types: [ENV], cardinality: one, identity: revision}
  - {name: execution_target, types: [ART], cardinality: one, identity: revision}
  - {name: requirement, types: [STK, SYS], cardinality: one, identity: revision}
  - {name: strategy, types: [VSP], cardinality: one, identity: revision}
outputs:
  - name: replacement_environment
    types: [ENV]
    cardinality: zero-or-one
    required_links:
      - {link: realizes, target: {input: strategy}}
      - {link: corrects-pilot-result, target: {input: failed_results}}
  - name: qualification_activity
    types: [VER]
    cardinality: zero-or-one
    required_links:
      - {link: governed-by, target: {input: strategy}}
      - {link: qualifies, target: {output: replacement_environment}}
  - name: qualification_implementation
    types: [VAI]
    cardinality: zero-or-one
    required_links: []
  - name: replacement_target
    types: [ART]
    cardinality: zero-or-one
    required_links:
      - {link: derived-from, target: {input: requirement}}
      - {link: corrects-pilot-result, target: {input: failed_results}}
  - name: replacement
    types: [VAI]
    cardinality: one
    required_links:
      - {link: realizes, target: {input: activity}}
      - {link: corrects-pilot-result, target: {input: failed_results}}
  - name: authorization
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-pilot-vai-after-result.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-1-assurance-correction-participation@1
  arguments: {subject: implementation}
authority_evidence: {output: authorization, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == implementation.identity.id
  && replacement.identity.type == implementation.identity.type
  && exists("pilot-result-corrections-for-implementation@1",
    {implementation: implementation})
  && ((replacement_environment == null
      && qualification_activity == null
      && qualification_implementation == null
      && one("environments-for-implementation@1", {implementation: replacement})
        == environment)
    || (replacement_environment != null
      && one("environments-for-implementation@1", {implementation: replacement})
        == replacement_environment
      && qualification_activity != null
      && qualification_implementation != null
      && exists("valid-pilot-result-environment-reconciliations@1", {
        implementation: implementation,
        environment: environment,
        strategy: strategy,
        replacement: replacement_environment,
        qualification_activity: qualification_activity,
        qualification_implementation: qualification_implementation})))
  && ((replacement_target == null
      && one("execution-targets-for-implementation@1", {implementation: replacement})
        == execution_target)
    || (replacement_target != null
      && one("execution-targets-for-implementation@1", {implementation: replacement})
        == replacement_target
      && exists("valid-pilot-result-target-reconciliations@1", {
        implementation: implementation,
        target: execution_target,
        requirement: requirement,
        replacement: replacement_target})))
  && authorization.payload.effective_scope == replacement.identity.revision_id
resolves: [pilot-vai-result-correction-required]
prohibited_inputs: [mutation or replay of accepted RUN or RES, execution of the unchanged VAI, unrelated ENV or ART, changed VER or pilot claim class, changed ART behavior scope, product source, product unit tests, private implementation details]
batching: single
