kind: scenario-definition
id: implement-product
version: 1
description: Implement the tiny product
phases:
- phase-0-tiny-product
inputs:
- name: requirements
  types:
  - RQS
  cardinality: one
  identity: revision
  conditions: 'exists("pass-reviews@1", {subject: requirements}) && none("fail-reviews@1", {subject: requirements})'
outputs:
- name: implementation
  types:
  - IMP
  cardinality: one
  required_links:
  - link: implements
    target:
      input: requirements
  required_payload:
    publication: recorded
- name: source_scopes
  types:
  - SCP
  cardinality: zero-or-more
  required_links: []
  required_payload:
    publication: recorded
prompt_ref: prompts/implement-product.md@6
review_policy_ref: review-applicability@1
completion: 'execution.integrity.contract_valid == true && (true) && count("implementations-for@1", {requirements:
  requirements}) == 1'
resolves:
- implementation-required
prohibited_inputs: []
batching: single
