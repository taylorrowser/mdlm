kind: scenario-definition
id: prepare-product-simplification-context
version: 1
description: Freeze the earliest complete reviewed Phase 0 product-purpose, stakeholder-intent, and scope set for independent simplification.
phases: [phase-0-wayfinding]
inputs:
  - name: definition_members
    types: [MAP, PSP, STK]
    cardinality: one-or-more
    identity: revision
    conditions: >-
      exists("passing-reviews-for@1", {subject: definition_members})
      && none("failing-reviews-for@1", {subject: definition_members})
outputs:
  - {name: context, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/prepare-product-simplification-context.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && context.payload.kind == "review-context"
  && context.payload.role == "review-context"
  && context.payload.scope == "phase-0-wayfinding@4"
  && context.storage.frozen == true
  && exists("phase-0-product-simplification-contexts@1", {})
resolves: [product-simplification-context-required]
prohibited_inputs: [unreviewed foundation Revisions, downstream verification or decomposition data, mutable latest aliases]
batching: single
