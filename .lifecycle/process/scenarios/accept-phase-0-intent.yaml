kind: scenario-definition
id: accept-phase-0-intent
version: 1
description: Freeze the exact approved Phase 0 candidate as accepted intent using its already reviewed gate authorization.
phases: [phase-0-wayfinding]
inputs:
  - name: candidate
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      candidate.payload.kind == "intent-level-candidate"
      && candidate.payload.role == "candidate"
      && exists("applicable-gate-signoffs-for@1", {candidate: candidate})
  - {name: definition_members, types: [MAP, PSP, STK], cardinality: one-or-more, identity: revision}
  - {name: candidate_reviews, types: [REV], cardinality: one-or-more, identity: revision}
  - {name: gate_signoff, types: [DEC], cardinality: one, identity: revision}
  - {name: signoff_reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: accepted_intent
    types: [BSL]
    cardinality: one
    required_links:
      - {link: promotes, target: {input: candidate}}
prompt_ref: prompts/accept-phase-0-intent.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && accepted_intent.payload.kind == "intent-approved"
  && accepted_intent.payload.role == "accepted"
  && accepted_intent.payload.scope == candidate.payload.scope
  && accepted_intent.payload.group == candidate.payload.group
  && accepted_intent.storage.frozen == true
  && exists("phase-0-intent-approvals-for@1", {candidate: candidate})
resolves: [intent-approval-required]
prohibited_inputs: [unreviewed candidate, unreviewed gate Decision, changed candidate membership, redundant stakeholder authorization]
batching: single
