kind: scenario-definition
id: revise-phase-2-interface-after-review
version: 1
description: Correct one exact Phase 2 interface with every current primary and collateral Review cause.
phases: [phase-2-system-definition]
inputs:
  - {name: subject, types: [ICSP], cardinality: one, identity: revision}
  - {name: reviews, types: [REV], cardinality: one-or-more, identity: revision}
  - {name: interface_subjects, types: [ASP, SYS, DWP], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [ICSP]
    cardinality: one
    identity_from: {input: subject}
    required_links:
      - {link: corrects-review, target: {input: reviews}}
      - {link: defines-interface-for, target: {input: interface_subjects}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-phase-2-interface-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-2-correction-participation@1
  arguments: {subject: subject}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && replacement.identity.type == subject.identity.type
  && ((policy("phase-2-correction-participation@1", {subject: subject}).authority_mode == "autonomous"
      && none("phase-2-correction-decisions-for@1", {replacement: replacement}))
    || (policy("phase-2-correction-participation@1", {subject: subject}).authority_mode == "attended"
      && count("phase-2-correction-decisions-for@1", {replacement: replacement}) == 1
      && every("phase-2-correction-decisions-for@1", {replacement: replacement}, authority =>
        authority.payload.kind == "scope"
        && authority.payload.effective_scope == replacement.identity.revision_id
        && state(authority, "disposition") == "active"
        && state(authority, "validity") == "valid")))
resolves: [phase-2-interface-review-correction-required]
prohibited_inputs: [mutation of failed evidence, unrelated subjects, scope expansion, mutable latest aliases]
batching: single
