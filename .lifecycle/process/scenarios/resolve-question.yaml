kind: scenario-definition
id: resolve-question
version: 2
description: Answer, defer, or cancel one exact dispatchable open question; Resolver authorization owns open-state eligibility.
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition]
inputs:
  - name: question
    types: [QST]
    cardinality: one
    identity: revision
  - name: blocked_targets
    types: [PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, QST, DEC]
    cardinality: zero-or-more
    identity: stable
outputs:
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: resolves, target: {output: updated_question}}
  - name: updated_question
    types: [QST]
    cardinality: one
    identity_from: {input: question}
    required_links:
      - {link: blocks, target: {input: blocked_targets}}
prompt_ref: prompts/resolve-question.md@2
review_policy_ref: review-applicability@1
participation:
  policy_ref: question-participation@1
  arguments:
    question: question
    selected_phase: phase
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && updated_question.identity.id == question.identity.id
  && updated_question.payload.kind == question.payload.kind
  && updated_question.payload.intent_scope == question.payload.intent_scope
  && updated_question.payload.question == question.payload.question
  && updated_question.payload.state in ["answered", "deferred", "cancelled"]
  && (
    question.payload.intent_scope != "product"
    || question.payload.kind != "preferential"
    || (
      updated_question.payload.state == "answered"
      && present(updated_question.payload.attended_answer)
      && present(decision)
      && decision.payload.decision == updated_question.payload.attended_answer
      && !present(decision.payload.attended_answer_change)
    )
  )
  && (
    question.payload.kind != "empirical"
    || (
      (
        !present(question.payload.resolution_disposition)
        || question.payload.resolution_disposition == "answer"
      )
      && updated_question.payload.state == "answered"
    )
    || (
      question.payload.resolution_disposition == "defer"
      && updated_question.payload.state == "deferred"
    )
    || (
      question.payload.resolution_disposition == "cancel"
      && updated_question.payload.state == "cancelled"
    )
  )
  && (
    question.payload.kind != "preferential"
    || updated_question.payload.state != "answered"
    || (
      present(decision)
      && decision.payload.kind == "scope"
      && decision.payload.effective_scope == updated_question.identity.revision_id
    )
  )
  && (
    (question.payload.kind == "empirical"
    && updated_question.payload.state == "answered")
    || present(decision)
  )
  && (
    !present(decision)
    || (
      count("resolved-question-revisions-for-decision@1", {decision: decision}) == 1
      && every("resolved-question-revisions-for-decision@1", {decision: decision},
        resolved => resolved == updated_question)
    )
  )
  && (
    updated_question.payload.state != "deferred"
    || (
      present(decision)
      && decision.payload.kind == "deferral"
      && decision.payload.effective_scope == updated_question.identity.revision_id
      && present(updated_question.payload.reactivation_condition)
    )
  )
  && (
    updated_question.payload.state != "cancelled"
    || (
      present(decision)
      && decision.payload.kind == "cancellation"
      && decision.payload.effective_scope == updated_question.identity.revision_id
    )
  )
resolves: [open-question-resolution]
prohibited_inputs: [unstated stakeholder answer, unsupported empirical conclusion]
batching: single
