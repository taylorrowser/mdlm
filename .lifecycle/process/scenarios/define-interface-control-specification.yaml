kind: scenario-definition
id: define-interface-control-specification
version: 1
description: Define one normative black-box boundary contract in exact architecture context.
phases: [phase-2-system-definition]
inputs:
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
outputs:
  - name: interface
    types: [ICSP]
    cardinality: one
    required_links:
      - {link: defines-interface-for, target: {input: architecture}}
  - {name: questions, types: [QST], cardinality: zero-or-more, required_links: []}
  - {name: decisions, types: [DEC], cardinality: zero-or-more, required_links: []}
prompt_ref: prompts/define-interface-control-specification.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && interface.payload.architecture_revision == architecture.identity.revision_id
initiation: explicit
resolves: []
prohibited_inputs: [private implementation details, mutable latest aliases, undocumented compatibility assumptions]
batching: single
