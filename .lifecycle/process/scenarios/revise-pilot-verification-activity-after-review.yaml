kind: scenario-definition
id: revise-pilot-verification-activity-after-review
version: 1
description: Correct one failed Phase 1 pilot verification activity while preserving its exact requirement and strategy boundary.
phases: [phase-1-product-assurance]
inputs:
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
    conditions: >-
      activity.payload.kind == "pilot"
      && exists("failing-reviews-for@1", {subject: activity})
      && none("newer-revisions-for@1", {subject: activity})
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: 'exists("matching-failing-review-for@1", {subject: activity, review: failed_reviews})'
  - name: requirement
    types: [STK]
    cardinality: one
    identity: revision
  - name: strategy
    types: [VSP]
    cardinality: one
    identity: revision
outputs:
  - name: replacement
    types: [VER]
    cardinality: one
    required_links:
      - {link: verifies, target: {input: requirement}}
      - {link: verifies-revision, target: {input: requirement}}
      - {link: governed-by, target: {input: strategy}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-pilot-verification-activity-after-review.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == activity.identity.id
  && replacement.identity.type == activity.identity.type
  && replacement.payload.kind == "pilot"
  && replacement.payload.claim.scope == "verification-design"
  && replacement.payload.claim.formal_evidence_eligible == false
  && exists("corrected-pilot-verification-activity-revisions-for@1", {activity: activity})
resolves: [pilot-verification-activity-review-correction-required]
prohibited_inputs: [mutation of failed activity or Review history, changed requirement or strategy boundary, product source, product unit tests]
batching: single
