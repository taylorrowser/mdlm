kind: scenario-definition
id: revise-pilot-verification-activity-after-review
version: 3
description: Correct one failed assurance pilot verification activity through bounded autonomous cycles and the same exact attended escalation interface.
phases: [phase-1-product-assurance, phase-2-system-definition, phase-3-component-definition]
inputs:
  - name: activity
    types: [VER]
    cardinality: one
    identity: revision
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
  - name: requirement
    types: [STK, SYS, CMP]
    cardinality: one
    identity: revision
  - name: strategy
    types: [VSP]
    cardinality: one
    identity: revision
  - name: intent_support
    types: [PSP]
    cardinality: zero-or-one
    identity: revision
outputs:
  - name: replacement
    types: [VER]
    cardinality: one
    identity_from: {input: activity}
    required_links:
      - {link: verifies, target: {input: requirement}}
      - {link: verifies-revision, target: {input: requirement}}
      - {link: governed-by, target: {input: strategy}}
      - {link: derived-from, target: {input: intent_support}}
      - {link: corrects-review, target: {input: failed_reviews}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-pilot-verification-activity-after-review.md@3
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-1-assurance-correction-participation@1
  arguments: {subject: activity}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == activity.identity.id
  && replacement.identity.type == activity.identity.type
  && replacement.payload.kind == "pilot"
  && replacement.payload.claim.scope == "verification-design"
  && replacement.payload.claim.formal_evidence_eligible == false
  && exists("corrected-pilot-verification-activity-revisions-for@1", {activity: activity})
  && (
    (policy("phase-1-assurance-correction-participation@1",
      {subject: activity}).authority_mode == "autonomous"
      && none("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}))
    || (policy("phase-1-assurance-correction-participation@1",
      {subject: activity}).authority_mode == "attended"
      && count("phase-1-assurance-correction-decisions-for@1",
        {replacement: replacement}) == 1)
  )
resolves: [pilot-verification-activity-review-correction-required]
prohibited_inputs: [mutation of failed activity or Review history, changed requirement or strategy boundary, unstated product behavior, product source, product unit tests]
batching: single
