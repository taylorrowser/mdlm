kind: scenario-definition
id: revise-gate-rejected-design-requirement
version: 1
description: Correct one exact gate-rejected design requirement in its original decomposition context.
phases: [phase-4-design-definition]
inputs:
  - {name: design, types: [DES], cardinality: one, identity: revision}
  - {name: gate_rejections, types: [DEC], cardinality: one-or-more, identity: revision}
  - {name: parents, types: [CMP], cardinality: one-or-more, identity: revision}
  - {name: plan, types: [DWP], cardinality: one, identity: revision}
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: interfaces, types: [ICSP], cardinality: zero-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DES]
    cardinality: one
    identity_from: {input: design}
    required_links:
      - {link: corrects-gate-rejection, target: {input: gate_rejections}}
      - {link: derived-from, target: {input: parents}}
      - {link: decomposes, target: {input: plan}}
      - {link: allocated-to, target: {input: architecture}}
      - {link: governed-by, target: {input: interfaces}}
prompt_ref: prompts/revise-gate-rejected-design-requirement.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == design.identity.id
  && replacement.identity.type == design.identity.type
  && exists("reviewed-gate-rejections-for-subject@1", {subject: design})
resolves: [gate-rejected-design-requirement-correction-required]
prohibited_inputs: [mutation of rejected evidence, unrelated subjects, scope expansion, mutable latest aliases]
batching: single
