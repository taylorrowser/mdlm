kind: scenario-definition
id: close-change-request
version: 4
description: Close one approved accepted-requirement Change Request and its originating Problem Report with exact selective replacement evidence.
phases: [phase-7-change-control]
inputs:
  - {name: change, types: [CHG], cardinality: one, identity: revision}
  - {name: problem, types: [PRB], cardinality: one, identity: revision}
  - {name: approval, types: [DEC], cardinality: one, identity: revision}
  - {name: source_evidence, types: [RUN, RES, REV, ART], cardinality: one-or-more, identity: revision}
  - {name: revised_requirements, types: [STK, SYS], cardinality: one-or-more, identity: revision}
  - {name: closure_evidence, types: [BSL, REV, RES], cardinality: one-or-more, identity: revision}
outputs:
  - name: closure
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: change}}
      - {link: confirms-revision, target: {input: revised_requirements}}
      - {link: closes-with, target: {input: closure_evidence}}
  - name: closed_problem
    types: [PRB]
    cardinality: one
    required_links:
      - {link: reports, target: {input: source_evidence}}
      - {link: resolved-by, target: {output: closure}}
prompt_ref: prompts/close-change-request.md@3
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && approval.payload.kind == "change-approval"
  && approval.payload.change_disposition == "approve"
  && approval.payload.effective_scope == change.identity.revision_id
  && closure.payload.kind == "change-closure"
  && closure.payload.effective_scope == change.identity.revision_id
  && closed_problem.identity.id == problem.identity.id
  && closed_problem.payload.disposition == "closed"
resolves: [change-closure-required]
prohibited_inputs: [missing replacement Review or candidate evidence, unrelated evidence, mutable latest aliases, implicit closure, rewriting accepted history]
batching: single
