kind: scenario-definition
id: create-phase-2-definition-context
version: 1
description: Freeze the earliest complete current SYS, ASP, ICSP, and planning-DWP set before independent simplification.
phases: [phase-2-system-definition]
inputs:
  - {name: plan, types: [DWP], cardinality: one, identity: revision}
  - {name: definition_members, types: [SYS, ASP, ICSP, DWP], cardinality: one-or-more, identity: revision}
outputs:
  - {name: context, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/create-phase-2-definition-context.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && context.payload.kind == "review-context"
  && context.payload.scope == plan.identity.revision_id
  && context.storage.frozen == true
  && count("phase-2-definition-context-members@1", {context: context})
    == count("phase-2-definition-members-for-plan@1", {plan: plan})
  && every("phase-2-definition-members-for-plan@1", {plan: plan}, member =>
    exists("baseline-contains-definition@1", {baseline: context, subject: member}))
resolves: [phase-2-definition-context-required]
prohibited_inputs: [unrelated lifecycle data, mutable latest aliases]
batching: coherent-batch
