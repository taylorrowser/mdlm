kind: scenario-definition
id: prepare-pilot-assessment-context
version: 1
description: Freeze exact Phase 0–2 lifecycle observations as one immutable pilot measurement context.
phases: [phase-2-pilot-assessment]
inputs:
  - {name: evidence, types: [MAP, ART, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, DEC], cardinality: one-or-more, identity: revision}
outputs:
  - {name: context, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/prepare-pilot-assessment-context.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && context.payload.kind == "pilot-assessment-context"
  && context.storage.frozen == true
resolves: []
prohibited_inputs: [mutable latest aliases, generated indexes or reports as lifecycle truth, estimates without durable source observations]
batching: coherent-batch
