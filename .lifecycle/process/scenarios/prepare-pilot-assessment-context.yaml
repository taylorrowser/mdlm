kind: scenario-definition
id: prepare-pilot-assessment-context
version: 1
description: Freeze every complete reviewed Phase 2 level candidate and exact durable observation as one immutable pilot assessment boundary.
phases: [phase-2-pilot-assessment]
inputs:
  - {name: candidates, types: [BSL], cardinality: one-or-more, identity: revision}
  - {name: observations, types: [DEC], cardinality: one-or-more, identity: revision}
outputs:
  - {name: context, types: [BSL], cardinality: one, required_links: []}
prompt_ref: prompts/prepare-pilot-assessment-context.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && context.payload.kind == "pilot-assessment-context"
  && context.storage.frozen == true
  && exists("matching-complete-pilot-assessment-context@1", {context: context})
resolves: [pilot-assessment-context-required]
prohibited_inputs: [mutable latest aliases, generated indexes or reports as lifecycle truth, estimates without durable source observations, formal promotion evidence]
batching: coherent-batch
