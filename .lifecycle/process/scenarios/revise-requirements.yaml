kind: scenario-definition
id: revise-requirements
version: 1
description: Revise the CLI-supplied approved frontier
phases:
- phase-0-tiny-product
inputs:
- name: subject
  types:
  - RQS
  cardinality: one
  identity: revision
- name: change
  types:
  - CHG
  cardinality: one
  identity: revision
  conditions: 'exists("pass-reviews@1", {subject: change}) && none("fail-reviews@1", {subject: change})'
outputs:
- name: requirements
  types:
  - REQ
  cardinality: zero-or-more
  required_links: []
  required_payload:
    publication: recorded
- name: decompositions
  types:
  - DCP
  cardinality: zero-or-more
  required_links: []
  required_payload:
    publication: recorded
- name: requirement_set
  types:
  - RQS
  cardinality: one
  required_links: []
  required_payload:
    publication: recorded
  identity_from:
    input: subject
prompt_ref: prompts/revise-requirements.md@5
review_policy_ref: review-applicability@1
completion: execution.integrity.contract_valid == true
resolves:
- approved-change-revision
prohibited_inputs: []
batching: single
