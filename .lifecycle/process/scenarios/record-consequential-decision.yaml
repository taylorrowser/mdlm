kind: scenario-definition
id: record-consequential-decision
version: 1
description: Record explicit stakeholder authorization for one exact scope, waiver, standing-delegation, retirement, or cancellation Decision.
initiation: explicit
phases: [phase-0-wayfinding, phase-1-product-assurance, phase-2-system-definition, phase-2-pilot-assessment, phase-7-change-control]
inputs:
  - {name: subject, types: [MAP, QST, DEC, ART, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS], cardinality: one, identity: revision}
outputs:
  - name: decision
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: subject}}
      - {link: waives, target: {payload: {output: decision, path: waiver.instance}}}
prompt_ref: prompts/record-consequential-decision.md@2
review_policy_ref: review-applicability@1
participation:
  policy_ref: consequential-decision-participation@1
  arguments: {subject: subject}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && decision.payload.kind in ["scope", "waiver", "authority-delegation", "retirement", "cancellation"]
  && decision.payload.effective_scope == subject.identity.revision_id
  && (
    decision.payload.kind != "waiver"
    || (
      decision.payload.waiver.subject == subject.identity.revision_id
      && present(decision.payload.waiver.instance)
    )
  )
resolves: []
prohibited_inputs: [implied approval, mutable latest aliases, unbounded delegation, unstated waiver]
batching: single
