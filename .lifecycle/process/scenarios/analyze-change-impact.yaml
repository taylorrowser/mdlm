kind: scenario-definition
id: analyze-change-impact
version: 2
description: Create one exact bounded Change Request for accepted STK intent with traceability-based selective impact.
phases: [phase-7-change-control]
inputs:
  - {name: problem, types: [PRB], cardinality: one, identity: revision}
outputs:
  - name: change
    types: [CHG]
    cardinality: one
    required_links:
      - {link: derived-from, target: {input: problem}}
prompt_ref: prompts/analyze-change-impact.md@2
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && change.payload.implementation_order == "requirements -> context -> reviews -> baselines -> verification"
  && count("impacted-requirements-for-change@2", {change: change})
    == count("accepted-stakeholder-requirements-for-change@1", {change: change})
  && count("accepted-stakeholder-requirements-for-change@1", {change: change}) == 1
  && count("accepted-intent-baselines-for-change@1", {change: change}) == 1
resolves: [change-impact-required]
prohibited_inputs: [mutable latest aliases, generated indexes as lifecycle truth, unbounded inferred impact]
batching: single
