kind: scenario-definition
id: revise-phase-2-candidate-after-review
version: 1
description: Replace one failed or reviewed-rejected Phase 2 group or level candidate while preserving unaffected evidence and substituting reviewed local Corrections.
phases: [phase-2-system-definition]
inputs:
  - {name: candidate, types: [BSL], cardinality: one, identity: revision}
  - {name: definition_members, types: [SYS, ASP, ICSP, DWP, VSP], cardinality: one-or-more, identity: revision}
  - {name: evidence, types: [REV, DEC], cardinality: zero-or-more, identity: revision}
  - {name: composed_groups, types: [BSL], cardinality: zero-or-more, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: gate_rejections, types: [DEC], cardinality: zero-or-more, identity: revision}
outputs:
  - name: replacement
    types: [BSL]
    cardinality: one
    required_links:
      - {link: supersedes, target: {input: candidate}}
      - {link: composes, target: {input: composed_groups}}
      - {link: corrects-review, target: {input: failed_reviews}}
      - {link: corrects-gate-rejection, target: {input: gate_rejections}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-phase-2-candidate-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-2-correction-participation@1
  arguments: {subject: candidate}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && exists("complete-superseding-phase-2-candidates-for@1",
    {candidate: candidate})
  && (
    (policy("phase-2-correction-participation@1",
      {subject: candidate}).authority_mode == "autonomous"
      && none("candidate-correction-decisions-for@1",
        {replacement: replacement}))
    || (policy("phase-2-correction-participation@1",
      {subject: candidate}).authority_mode == "attended"
      && count("candidate-correction-decisions-for@1",
        {replacement: replacement}) == 1
      && every("candidate-correction-decisions-for@1",
        {replacement: replacement}, authority =>
          authority.payload.kind == "scope"
          && authority.payload.effective_scope == replacement.identity.revision_id
          && state(authority, "disposition") == "active"
          && state(authority, "validity") == "valid"))
  )
resolves: [phase-2-candidate-correction-required]
prohibited_inputs: [mutation of prior candidate or judgment, omission of unaffected evidence, unreviewed member correction, unreviewed composed group replacement, inferred stop, inferred deferral, inferred cancellation, mutable latest aliases]
batching: single
