kind: scenario-definition
id: revise-wayfinding-map-after-review
version: 1
description: Replace one exact reviewed MAP while preserving correction history and indexing every current open Phase 0 product Question.
phases: [phase-0-wayfinding]
inputs:
  - {name: subject, types: [MAP], cardinality: one, identity: revision}
  - {name: prior_failed_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: simplification_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: gate_rejections, types: [DEC], cardinality: zero-or-more, identity: revision}
  - {name: open_product_questions, types: [QST], cardinality: zero-or-more, identity: revision}
  - {name: product_answer_decisions, types: [DEC], cardinality: zero-or-more, identity: revision}
outputs:
  - name: replacement
    types: [MAP]
    cardinality: one
    identity_from: {input: subject}
    required_links:
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
      - {link: corrects-review, target: {input: simplification_reviews}}
      - {link: corrects-gate-rejection, target: {input: gate_rejections}}
      - {link: indexes, target: {input: open_product_questions}}
      - {link: incorporates-answer, target: {input: product_answer_decisions}}
prompt_ref: prompts/revise-wayfinding-map-after-review.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && every("open-phase-0-gate-product-questions@1", {}, question =>
    exists("revision-links-question@1",
      {subject: replacement, question: question}))
  && every("incorporated-product-answer-decisions-for-foundation-subject@1",
    {subject: subject}, authority =>
      !every("incorporated-product-answer-decisions-for-foundation-subject@1",
        {subject: replacement}, replacement_authority =>
          replacement_authority != authority))
resolves: [wayfinding-map-review-correction-required]
prohibited_inputs: [mutation of the failed Revision, deletion of failed Review history, omission of current open product Questions, unrelated scope expansion]
batching: single
