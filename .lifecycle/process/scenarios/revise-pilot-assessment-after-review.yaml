kind: scenario-definition
id: revise-pilot-assessment-after-review
version: 1
description: Correct one failed pilot assessment while preserving its stable identity, exact context, and immutable Review history.
phases: [phase-2-pilot-assessment]
inputs:
  - name: assessment
    types: [PAS]
    cardinality: one
    identity: revision
    conditions: >-
      exists("failing-reviews-for@1", {subject: assessment})
      && none("newer-revisions-for@1", {subject: assessment})
  - name: failed_reviews
    types: [REV]
    cardinality: one-or-more
    identity: revision
    conditions: 'exists("matching-failing-review-for@1", {subject: assessment, review: failed_reviews})'
  - name: context
    types: [BSL]
    cardinality: one
    identity: revision
    conditions: >-
      count("pilot-assessment-context-for@1", {assessment: assessment}) == 1
      && context == one("pilot-assessment-context-for@1", {assessment: assessment})
outputs:
  - name: replacement
    types: [PAS]
    cardinality: one
    required_links:
      - {link: measures, target: {input: context}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-pilot-assessment-after-review.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == assessment.identity.id
  && replacement.payload.pilot_scope == "phase-0-through-2"
  && replacement.payload.measurements.evidence_reuse.explanations_correct == true
  && replacement.payload.measurements.loose_ends.useful == true
  && replacement.payload.measurements.verification_discrimination.discriminates == true
  && exists("corrected-pilot-assessments-for@1", {assessment: assessment})
resolves: [pilot-assessment-review-correction-required]
prohibited_inputs: [mutation of the failed assessment or Review, a different evidence boundary, mutable aliases, formal promotion evidence]
batching: single
