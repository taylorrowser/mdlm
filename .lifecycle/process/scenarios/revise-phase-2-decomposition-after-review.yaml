kind: scenario-definition
id: revise-phase-2-decomposition-after-review
version: 1
description: Correct one exact Phase 2 decomposition with every current primary and collateral Review cause.
phases: [phase-2-system-definition]
inputs:
  - {name: subject, types: [DWP], cardinality: one, identity: revision}
  - {name: reviews, types: [REV], cardinality: one-or-more, identity: revision}
  - {name: parents, types: [STK], cardinality: one-or-more, identity: revision}
  - {name: architecture, types: [ASP], cardinality: one, identity: revision}
  - {name: interfaces, types: [ICSP], cardinality: zero-or-more, identity: revision}
  - {name: verification_strategy, types: [VSP], cardinality: one, identity: revision}
  - {name: prior_plan, types: [DWP], cardinality: zero-or-one, identity: revision}
  - {name: outputs, types: [SYS], cardinality: zero-or-more, identity: revision}
  - {name: simplification_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DWP]
    cardinality: one
    identity_from: {input: subject}
    required_links:
      - {link: corrects-review, target: {input: reviews}}
      - {link: decomposes, target: {input: parents}}
      - {link: allocated-to, target: {input: architecture}}
      - {link: governed-by, target: {input: interfaces}}
      - {link: verified-under, target: {input: verification_strategy}}
      - {link: derived-from, target: {input: prior_plan}}
      - {link: produces, target: {input: outputs}}
      - {link: justifies, target: {input: simplification_reviews}}
  - name: decision
    types: [DEC]
    cardinality: zero-or-one
    required_links:
      - {link: justifies, target: {output: replacement}}
prompt_ref: prompts/revise-phase-2-decomposition-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: phase-2-correction-participation@1
  arguments: {subject: subject}
authority_evidence: {output: decision, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == subject.identity.id
  && replacement.identity.type == subject.identity.type
  && exists("valid-phase-2-dwp-review-correction@1", {replacement: replacement})
  && ((policy("phase-2-correction-participation@1", {subject: subject}).authority_mode == "autonomous"
      && none("phase-2-correction-decisions-for@1", {replacement: replacement}))
    || (policy("phase-2-correction-participation@1", {subject: subject}).authority_mode == "attended"
      && count("phase-2-correction-decisions-for@1", {replacement: replacement}) == 1
      && every("phase-2-correction-decisions-for@1", {replacement: replacement}, authority =>
        authority.payload.kind == "scope"
        && authority.payload.effective_scope == replacement.identity.revision_id
        && state(authority, "disposition") == "active"
        && state(authority, "validity") == "valid")))
resolves: [phase-2-decomposition-review-correction-required]
prohibited_inputs: [mutation of failed evidence, unrelated subjects, scope expansion, mutable latest aliases]
batching: single
