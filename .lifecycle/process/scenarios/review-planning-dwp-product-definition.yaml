kind: scenario-definition
id: review-planning-dwp-product-definition
version: 1
description: Independently judge one exact planning DWP against its product definition in one exact frozen baseline context.
phases: [phase-2-system-definition, phase-2-pilot-assessment, phase-3-component-definition, phase-4-design-definition, phase-5-implementation, phase-6-verification, phase-7-change-control]
inputs:
  - {name: subject, types: [DWP], cardinality: one, identity: revision, conditions: 'subject.payload.stage == "planning"'}
  - {name: review_context, types: [BSL], cardinality: one, identity: revision}
  - {name: context_members, types: [MAP, QST, DEC, ART, PSP, STK, SYS, CMP, DES, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, PRB, CHG, PAS], cardinality: zero-or-more, identity: revision}
outputs:
  - name: review
    types: [REV]
    cardinality: one
    required_payload: {review_kind: simplification-product-definition}
    required_links:
      - {link: reviews, target: {input: subject}}
      - {link: contextualizes, target: {input: review_context}}
prompt_ref: prompts/review-planning-dwp-product-definition.md@1
review_policy_ref: review-applicability@1
review_policy_arguments:
  subject: subject
participation:
  policy_ref: contextual-review-participation@1
  arguments:
    subject: subject
    review_context: review_context
authority_evidence: {output: review, type: REV}
standing_delegation:
  selector_ref: applicable-authority-delegations-for@1
  target_input: subject
  authority: stakeholder
  delegate: independent-reviewer
completion: >-
  execution.integrity.contract_valid == true
  && review_context.payload.kind == "review-context"
  && review_context.storage.frozen == true
  && review.payload.outcome in ["pass", "fail", "cancelled"]
  && (
    review.payload.outcome != "fail"
    || review.payload.correction_authority in ["stakeholder", "package-evidence"]
  )
  && review.payload.rubric_ref
    == policy("review-applicability@1", {subject: subject}).rubric_ref
  && exists("planning-dwp-matching-subject@1", {subject: subject})
  && exists("valid-dwp-product-simplification-reviews@1", {review: review})
resolves: [planning-dwp-product-definition-review-required]
prohibited_inputs: [unfrozen context, mutable latest aliases, prior review outcome as authority]
batching: coherent-batch
