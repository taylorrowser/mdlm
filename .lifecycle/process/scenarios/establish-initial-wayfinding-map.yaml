kind: scenario-definition
id: establish-initial-wayfinding-map
version: 2
description: Establish the initial Phase 0 frontier and its exact attended product-intent Question without inventing product commitments.
phases: [phase-0-wayfinding]
inputs: []
outputs:
  - name: map
    types: [MAP]
    cardinality: one
    required_links:
      - {link: indexes, target: {output: product_intent}}
      - {link: indexes, target: {output: questions}}
  - name: product_intent
    types: [QST]
    cardinality: one
    required_links: []
    required_payload:
      kind: preferential
      intent_scope: product
      state: open
  - name: questions
    types: [QST]
    cardinality: zero-or-more
    required_links: []
prompt_ref: prompts/establish-initial-wayfinding-map.md@3
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && map.payload.frontier != []
  && count("product-intent-questions-from-initial-map@1", {}) == 1
  && every("product-intent-questions-from-initial-map@1", {}, question =>
    question == product_intent)
  && product_intent.payload.question != ""
  && product_intent.payload.blocking_impact != ""
  && !present(product_intent.payload.attention_checkpoint)
  && !present(product_intent.payload.consolidation_group)
  && (
    !present(product_intent.payload.resolution_disposition)
    || product_intent.payload.resolution_disposition == "answer"
  )
resolves: [initial-wayfinding-map-required]
prohibited_inputs: [unstated stakeholder preferences, generated indexes as lifecycle truth]
batching: single
