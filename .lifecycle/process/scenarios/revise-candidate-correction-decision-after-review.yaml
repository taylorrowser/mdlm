kind: scenario-definition
id: revise-candidate-correction-decision-after-review
version: 1
description: Replace one failed candidate-correction Decision without changing its exact candidate scope.
phases: [phase-0-wayfinding]
inputs:
  - {name: decision, types: [DEC], cardinality: one, identity: revision}
  - {name: candidate, types: [BSL], cardinality: one, identity: revision}
  - {name: lineage, types: [DEC], cardinality: one-or-more, identity: revision}
  - {name: prior_failed_reviews, types: [REV], cardinality: zero-or-more, identity: revision}
  - {name: failed_reviews, types: [REV], cardinality: one-or-more, identity: revision}
outputs:
  - name: replacement
    types: [DEC]
    cardinality: one
    required_links:
      - {link: justifies, target: {input: candidate}}
      - {link: corrects-review, target: {input: prior_failed_reviews}}
      - {link: corrects-review, target: {input: failed_reviews}}
prompt_ref: prompts/revise-candidate-correction-decision-after-review.md@1
review_policy_ref: review-applicability@1
participation:
  policy_ref: consequential-decision-participation@1
  arguments: {subject: candidate}
authority_evidence: {output: replacement, type: DEC}
completion: >-
  execution.integrity.contract_valid == true
  && replacement.identity.id == decision.identity.id
  && replacement.payload.kind == "scope"
  && replacement.payload.effective_scope == candidate.identity.revision_id
  && exists("valid-candidate-correction-decision-replacements-for@1",
    {decision: decision})
resolves: [candidate-correction-decision-review-correction-required]
prohibited_inputs: [changed candidate, invented stakeholder preference, suppressed failed Review, mutation of immutable history]
batching: single
