kind: scenario-definition
id: define-verification-strategy
version: 1
description: Define a level strategy and named environment-capability profile for exact stakeholder commitments.
phases: [phase-1-product-assurance]
inputs:
  - {name: requirements, types: [STK], cardinality: one-or-more, identity: stable}
outputs:
  - name: strategy
    types: [VSP]
    cardinality: one
    required_links:
      - {link: governs, target: {input: requirements}}
prompt_ref: prompts/define-verification-strategy.md@1
review_policy_ref: review-applicability@1
completion: >-
  execution.integrity.contract_valid == true
  && strategy.payload.independence.boundary == "black-box"
resolves: []
prohibited_inputs: [product source code, product unit tests, unstated environment capabilities]
batching: coherent-batch
