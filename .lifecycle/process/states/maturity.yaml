kind: state-definition
id: maturity
version: 2
description: Historical authorization level derived from exact frozen baseline membership.
subject_as: subject
cardinality: exactly-one
default: draft
values: [accepted, candidate, review-frozen, draft]
rules:
  - value: accepted
    priority: 400
    when: >-
      exists("baselines-containing-with-role@1",
        {subject: subject, role: "accepted"})
    explanation: The exact revision belongs to a current or historical accepted baseline.
  - value: candidate
    priority: 300
    when: >-
      exists("baselines-containing-with-role@1",
        {subject: subject, role: "candidate"})
    explanation: The exact revision belongs to a candidate baseline and no accepted rule matched.
  - value: review-frozen
    priority: 200
    when: >-
      exists("baselines-containing-with-role@1",
        {subject: subject, role: "review-context"})
    explanation: The exact revision is frozen only as review context.
