kind: state-definition
id: validity
version: 2
description: Structural integrity and conservative dependency freshness for an exact revision.
subject_as: subject
cardinality: exactly-one
default: valid
values: [invalid, stale, valid]
rules:
  - value: invalid
    priority: 300
    when: >-
      subject.integrity.parseable == false
      || subject.integrity.schema_valid == false
      || subject.integrity.identity_valid == false
      || subject.integrity.references_valid == false
      || subject.integrity.hash_valid == false
    explanation: Parseability, schema, identity, reference, or frozen-byte integrity is broken.
  - value: stale
    priority: 200
    when: 'exists("dependency-changes-for@1", {subject: subject})'
    explanation: At least one conservatively classified dependency change requires reassessment.
