kind: state-definition
id: relationship-overlays
version: 2
description: Independent historical and provenance annotations that do not replace maturity or validity.
subject_as: subject
cardinality: zero-or-more
default: null
values: [superseded, newer-draft-exists, process-drift]
rules:
  - value: superseded
    priority: 300
    when:
      exists:
        selector: newer-accepted-revisions-for@1
        arguments: {subject: {var: subject}}
    explanation: A newer revision of the same stable datum is accepted.
  - value: newer-draft-exists
    priority: 200
    when:
      exists:
        selector: newer-editable-revisions-for@1
        arguments: {subject: {var: subject}}
    explanation: A later editable revision exists without changing historical maturity.
  - value: process-drift
    priority: 100
    when:
      compare:
        left: {path: {var: subject, field: provenance.process_ref}}
        operator: ne
        right: {path: {var: process, field: current_ref}}
    explanation: Current process provenance differs; this is informational and never causes staleness by itself.
