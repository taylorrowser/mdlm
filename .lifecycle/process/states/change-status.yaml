kind: state-definition
id: change-status
version: 2
description: Independent exact progress or terminal-disposition interpretation for Problem Reports and Change Requests.
subject_as: subject
cardinality: exactly-one
default: not-applicable
values: [not-applicable, reported, impact-analyzed, awaiting-approval, approved, implementation-in-progress, ready-to-close, closed]
rules:
  - value: closed
    priority: 800
    when: >-
      (subject.identity.type == "PRB"
        && subject.payload.disposition == "closed")
      || (subject.identity.type == "CHG"
        && (exists("change-closure-decisions-for@2", {change: subject})
          || exists("terminal-change-disposition-decisions-for@1", {change: subject})))
    explanation: Exact reviewed terminal disposition or exact replacement closure evidence closes the bounded change.
  - value: ready-to-close
    priority: 700
    when: >-
      subject.identity.type == "CHG"
      && exists("change-approval-decisions-for@2", {change: subject})
      && exists("revised-requirements-for-change@2", {change: subject})
      && exists("stakeholder-change-candidates-for@1", {change: subject})
      && every("stakeholder-change-candidates-for@1", {change: subject}, candidate =>
        exists("passing-reviews-for@1", {subject: candidate}))
    explanation: Approved replacement STK, Review, candidate, and candidate Review evidence are available.
  - value: implementation-in-progress
    priority: 600
    when: >-
      subject.identity.type == "CHG"
      && exists("change-approval-decisions-for@2", {change: subject})
      && exists("revised-requirements-for-change@2", {change: subject})
    explanation: Same-lineage STK replacement exists and downstream replacement evidence remains.
  - value: approved
    priority: 500
    when: >-
      subject.identity.type == "CHG"
      && exists("change-approval-decisions-for@2", {change: subject})
    explanation: A passing-reviewed attended Decision approves this exact reviewed Change Request.
  - value: awaiting-approval
    priority: 400
    when: 'subject.identity.type == "CHG"'
    explanation: Impact is exact but no applicable passing-reviewed disposition exists.
  - value: impact-analyzed
    priority: 300
    when: >-
      subject.identity.type == "PRB"
      && exists("change-requests-for-problem@1", {problem: subject})
    explanation: A bounded exact Change Request derives from this Problem Report.
  - value: reported
    priority: 200
    when: 'subject.identity.type == "PRB"'
    explanation: The exact observed condition is reported and awaits impact analysis.
