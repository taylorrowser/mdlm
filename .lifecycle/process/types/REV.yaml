kind: type-definition
id: REV
version: 1
description: Independent content Review
name: Independent content Review
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - outcome
  - findings
  properties:
    publication:
      const: recorded
    outcome:
      enum:
      - pass
      - fail
    findings:
      type: string
      minLength: 1
outgoing_links:
- id: reviews
  description: reviews
  targets:
  - kind: datum
    types:
    - REQ
    - IMP
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-reviews
- id: uses-evidence
  description: uses evidence
  targets:
  - kind: datum
    types:
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-uses-evidence
kernel_managed_payload_paths: []
