kind: type-definition
id: REV
version: 4
name: Review
description: Immutable judgment about one exact primary subject in one exact frozen context.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: outcome
  terminal_values: [pass, fail, cancelled]
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [rubric_ref, outcome]
  properties:
    review_kind: {enum: [contextual, simplification-product-definition, simplification-requirements, simplification-architecture-interfaces, cross-group, gate]}
    decomposition_plan_revision: {type: string, pattern: '^DWP-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    rubric_ref: {type: string, pattern: '^policies/rubrics/.+\.md@[1-9][0-9]*$'}
    findings:
      type: array
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [id, target, relationship, severity, summary]
        properties:
          id: {type: string, pattern: '^F-[0-9]{3,}$'}
          target: {type: string, pattern: '^[A-Z]{3,8}-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
          relationship: {enum: [primary, collateral]}
          severity: {enum: [blocking, needs-triage, advisory]}
          summary: {type: string, minLength: 1}
          evidence: {type: string, minLength: 1}
    simplification:
      description: One exact Phase 0 correction target with every blocking simplification finding that applies to it.
      type: object
      additionalProperties: false
      required: [target, findings]
      properties:
        target: {type: string, pattern: '^[A-Z]{3,8}-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
        findings:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [id, severity, summary]
            properties:
              id: {type: string, pattern: '^F-[0-9]{3,}$'}
              severity: {const: blocking}
              summary: {type: string, minLength: 1}
              evidence: {type: string, minLength: 1}
    definition_simplification:
      description: Exact Phase 2 subject or declared definition-consistency set selected by blocking simplification findings.
      type: object
      additionalProperties: false
      required: [primary_target, correction_set]
      properties:
        primary_target: {type: string, pattern: '^(SYS|ASP|ICSP|DWP)-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
        correction_set: {enum: [subject, definition-consistency]}
        scope_reduction:
          type: object
          additionalProperties: false
          required: [removed_targets, rationale]
          properties:
            removed_targets:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, pattern: '^(SYS|ASP|ICSP|DWP)-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
            rationale: {type: string, minLength: 1}
    correction_authority:
      description: Marks a failed Review whose correction would change stakeholder-owned intent; omission leaves package-bounded autonomous correction applicable.
      const: stakeholder
    outcome: {enum: [open, pass, fail, cancelled]}
    cancellation_reason: {type: string, minLength: 1}
  allOf:
    - if:
        properties:
          review_kind: {const: simplification-product-definition}
        required: [review_kind]
      then:
        not: {required: [findings]}
        allOf:
          - if:
              properties:
                outcome: {const: fail}
              required: [outcome]
            then: {required: [simplification]}
          - if:
              properties:
                outcome: {const: pass}
              required: [outcome]
            then: {not: {required: [simplification]}}
      else:
        required: [findings]
        not: {required: [simplification]}
    - if:
        properties:
          review_kind: {enum: [simplification-requirements, simplification-architecture-interfaces]}
        required: [review_kind]
      then:
        allOf:
          - if:
              properties:
                outcome: {const: fail}
              required: [outcome]
            then:
              required: [definition_simplification]
              properties:
                findings:
                  minItems: 1
                  contains:
                    type: object
                    required: [relationship, severity]
                    properties:
                      relationship: {const: primary}
                      severity: {const: blocking}
          - if:
              properties:
                outcome: {const: pass}
              required: [outcome]
            then:
              not: {required: [definition_simplification]}
              properties:
                findings:
                  not:
                    contains:
                      type: object
                      required: [severity]
                      properties:
                        severity: {const: blocking}
      else:
        not: {required: [definition_simplification]}
outgoing_links:
  - id: reviews
    description: The one exact primary artifact revision judged by this review.
    targets:
      - {kind: datum, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, DEC, PRB, CHG, PAS], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: reviewed-by
  - id: contextualizes
    description: Exact frozen review-context baseline used for judgment.
    targets:
      - {kind: datum, types: [BSL], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: context-for
  - id: depends-on
    description: Stable claim dependency used only to decide whether this exact historical Review remains reusable after change.
    targets:
      - {kind: datum, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, DEC, PRB, CHG, PAS], identity: stable}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: review-dependency
  - id: blocks
    description: Canonical exact candidate, member, or Phase 2 definition set selected by blocking simplification findings.
    targets:
      - {kind: datum, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, BSL], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: blocked-by-review
  - id: changed-under
    description: Exact approved Change Request requiring this replacement review evidence.
    targets:
      - {kind: datum, types: [CHG], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: changed-review
kernel_managed_payload_paths: []
