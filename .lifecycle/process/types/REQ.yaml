kind: type-definition
id: REQ
version: 1
description: Requirement set
name: Requirement set
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - intent
  - commitments
  - cases
  - source
  properties:
    publication:
      const: recorded
    intent: &id001
      type: string
      minLength: 1
    commitments:
      type: array
      minItems: 1
      items: *id001
    cases:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - stdin
        - stdout
        - stderr
        - exit_code
        properties:
          id: *id001
          stdin:
            type: string
          stdout:
            type: string
          stderr:
            type: string
          exit_code:
            type: integer
            minimum: 0
            maximum: 255
    source:
      type: string
      minLength: 1
outgoing_links:
- id: corrects
  description: corrects
  targets:
  - kind: datum
    types:
    - REV
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-corrects
kernel_managed_payload_paths: []
