kind: type-definition
id: VER
version: 3
name: Verification Activity
description: Source-independent specification of one qualification, pilot, or formal verification claim and its acceptance evidence.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, method, assessment_mode, claim, acceptance_criteria, evidence_requirements, expected_success_activity, expected_discrimination_activity]
  properties:
    kind: {enum: [qualification, pilot, formal]}
    method: {enum: [inspection, demonstration, test, analysis]}
    assessment_mode: {enum: [automatic, authored, witnessed, stakeholder]}
    claim:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, scope, formal_evidence_eligible]
          properties:
            kind: {const: qualification}
            scope: {const: environment-capability}
            formal_evidence_eligible: {const: false}
        - type: object
          additionalProperties: false
          required: [kind, scope, formal_evidence_eligible]
          properties:
            kind: {const: pilot}
            scope: {const: verification-design}
            formal_evidence_eligible: {const: false}
        - type: object
          additionalProperties: false
          required: [kind, scope, formal_evidence_eligible]
          properties:
            kind: {const: formal}
            scope: {const: requirement}
            formal_evidence_eligible: {const: true}
    acceptance_criteria: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    evidence_requirements: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    expected_success_activity: {type: string, minLength: 1}
    expected_discrimination_activity: {type: string, minLength: 1}
outgoing_links:
  - id: derived-from
    description: Exact accepted product specification Revision used to resolve relative terms in one pilot activity.
    targets:
      - {kind: datum, types: [PSP], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: supports-pilot-activity
  - id: corrects-review
    description: Exact failed Review findings addressed by this corrected verification activity Revision.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-assurance-revision
  - id: governed-by
    description: Exact verification strategy governing this activity.
    targets:
      - {kind: datum, types: [VSP], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: governs-activity
  - id: qualifies
    description: Exact environment whose declared capabilities a qualification activity establishes.
    targets:
      - {kind: datum, types: [ENV], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: qualified-by-activity
  - id: verifies
    description: Stable requirement exercised by a pilot or verified by a later formal activity.
    targets:
      - {kind: datum, types: [STK, SYS, CMP, DES], identity: stable}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: verification-activity
  - id: verifies-revision
    description: Exact stakeholder or system requirement Revision exercised by this verification activity.
    targets:
      - {kind: datum, types: [STK, SYS, CMP, DES], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: exact-verification-activity
kernel_managed_payload_paths: []
