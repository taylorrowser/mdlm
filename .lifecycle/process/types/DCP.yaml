kind: type-definition
id: DCP
version: 1
description: Exact parent and immediate child decomposition
name: Decomposition group
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  properties:
    publication:
      const: recorded
outgoing_links:
- id: parent
  description: parent
  targets:
  - kind: datum
    types:
    - REQ
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-parent
- id: child
  description: child
  targets:
  - kind: datum
    types:
    - REQ
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-child
- id: changes-under
  description: changes-under
  targets:
  - kind: datum
    types:
    - CHG
    identity: revision
  cardinality:
    minimum: 0
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-changes-under
kernel_managed_payload_paths: []
