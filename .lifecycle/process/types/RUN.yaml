kind: type-definition
id: RUN
version: 2
name: Verification Run
description: Immutable generated manifest for one coordinated qualification, pilot, or formal execution event.
extends: titled-datum@1
lifecycle:
  authorship: generated
  freeze_when: terminal-outcome
  terminal_payload_field: execution_state
  terminal_values: [completed, aborted, infrastructure-error]
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  allOf:
    - if:
        properties: {kind: {const: formal}}
        required: [kind]
      then: {required: [actual_observations]}
  required: [kind, started_at, completed_at, execution_state, execution_target, runner_ref, configuration_refs, activities_expected, activities_invoked, evidence_locations]
  properties:
    kind: {enum: [qualification, pilot, formal]}
    started_at: {type: string, format: date-time}
    completed_at: {type: string, format: date-time}
    execution_state: {enum: [completed, aborted, infrastructure-error]}
    execution_target:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: {enum: [environment, harness, prototype, component-build, product-build]}
        ref: {type: string, pattern: '^[A-Z]{3,8}-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    runner_ref: {type: string, minLength: 1}
    configuration_refs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    activities_expected: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    activities_invoked: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    evidence_locations: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    actual_observations:
      type: object
      minProperties: 1
      propertyNames: {type: string, minLength: 1}
      additionalProperties:
        type: object
        additionalProperties: false
        required: [stdin_base64, stdout_base64, stderr_base64, timed_out, truncated]
        allOf:
          - oneOf:
              - {required: [exit_status], not: {required: [signal]}}
              - {required: [signal], not: {required: [exit_status]}}
        properties:
          stdin_base64: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}
          stdout_base64: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}
          stderr_base64: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}
          exit_status: {type: integer}
          signal: {type: string, minLength: 1}
          timed_out: {type: boolean}
          truncated: {type: boolean}
    control_observations:
      type: object
      additionalProperties: false
      properties:
        known_good:
          type: object
          additionalProperties: false
          required: [artifact_ref, control, activity_ref, argv, working_directory, stdin, stdout, stderr, timed_out, truncated]
          allOf:
            - oneOf:
                - {required: [exit_status], not: {required: [signal]}}
                - {required: [signal], not: {required: [exit_status]}}
          properties:
            artifact_ref: {type: string, pattern: '^ART-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
            control: {const: known_good}
            activity_ref: {type: string, pattern: '^VER-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
            argv:
              type: array
              minItems: 1
              prefixItems:
                - {type: string, minLength: 1, pattern: '^[^/\\]+$'}
              items: {type: string}
            working_directory: {const: fresh-temporary-directory}
            stdin: {type: object, additionalProperties: false, required: [encoding, bytes], properties: {encoding: {const: base64}, bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}}}
            stdout: {type: object, additionalProperties: false, required: [encoding, bytes], properties: {encoding: {const: base64}, bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}}}
            stderr: {type: object, additionalProperties: false, required: [encoding, bytes], properties: {encoding: {const: base64}, bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}}}
            exit_status: {type: integer}
            signal: {type: string, minLength: 1}
            timed_out: {type: boolean}
            truncated: {type: boolean}
        known_bad:
          type: object
          additionalProperties: false
          required: [artifact_ref, control, activity_ref, argv, working_directory, stdin, stdout, stderr, timed_out, truncated]
          allOf:
            - oneOf:
                - {required: [exit_status], not: {required: [signal]}}
                - {required: [signal], not: {required: [exit_status]}}
          properties:
            artifact_ref: {type: string, pattern: '^ART-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
            control: {const: known_bad}
            activity_ref: {type: string, pattern: '^VER-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
            argv:
              type: array
              minItems: 1
              prefixItems:
                - {type: string, minLength: 1, pattern: '^[^/\\]+$'}
              items: {type: string}
            working_directory: {const: fresh-temporary-directory}
            stdin: {type: object, additionalProperties: false, required: [encoding, bytes], properties: {encoding: {const: base64}, bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}}}
            stdout: {type: object, additionalProperties: false, required: [encoding, bytes], properties: {encoding: {const: base64}, bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}}}
            stderr: {type: object, additionalProperties: false, required: [encoding, bytes], properties: {encoding: {const: base64}, bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}}}
            exit_status: {type: integer}
            signal: {type: string, minLength: 1}
            timed_out: {type: boolean}
            truncated: {type: boolean}
outgoing_links:
  - id: executes
    description: Exact verification implementation executed by this run.
    targets:
      - {kind: datum, types: [VAI], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: executed-by
  - id: uses
    description: Exact environment used by this run.
    targets:
      - {kind: datum, types: [ENV], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: used-in-run
  - id: targets
    description: Exact environment or bounded artifact execution target.
    targets:
      - {kind: datum, types: [ENV, ART], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: run-target
  - id: produces
    description: Exact scoped result generated by this run.
    targets:
      - {kind: datum, types: [RES], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: produced-by
kernel_managed_payload_paths: []
