kind: type-definition
id: STK
version: 5
name: Stakeholder Requirement
description: Singular stakeholder-visible product commitment derived from an exact product specification context.
extends: requirement@2
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [stakeholder, priority, system_context]
  properties:
    stakeholder: {type: string, minLength: 1}
    priority: {enum: [must, should, could]}
    system_context:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,62}$'
      description: Solution-independent responsibility and trust-context routing key shared by commitments that should enter one architecture context.
outgoing_links:
  - id: incorporates-answer
    description: Exact reviewed product-answer Decisions incorporated by this stakeholder requirement Revision.
    targets:
      - {kind: datum, types: [DEC], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: incorporated-by-stakeholder-requirement
  - id: derived-from
    description: Product specification intent from which this stakeholder commitment is derived.
    targets:
      - {kind: datum, types: [PSP], identity: stable}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: exact-revision
    inverse_label: derives
kernel_managed_payload_paths: []
