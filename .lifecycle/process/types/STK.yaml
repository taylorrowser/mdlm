kind: type-definition
id: STK
version: 2
name: Stakeholder Requirement
description: Singular stakeholder-visible product commitment derived from an exact product specification context.
extends: requirement@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [stakeholder, priority]
  properties:
    stakeholder: {type: string, minLength: 1}
    priority: {enum: [must, should, could]}
outgoing_links:
  - id: derived-from
    description: Product specification intent from which this stakeholder commitment is derived.
    targets:
      - {kind: datum, types: [PSP], identity: stable}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: exact-revision
    inverse_label: derives
kernel_managed_payload_paths: []
