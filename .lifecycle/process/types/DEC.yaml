kind: type-definition
id: DEC
version: 3
name: Decision Record
description: Consequential decision, assumption, waiver, scope outcome, deferral, standing authority delegation, disposition, or exact gate sign-off.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, decision, alternatives, effective_scope]
  properties:
    kind: {enum: [decision, assumption, scope, waiver, deferral, authority-delegation, gate-signoff, change-approval, change-closure, pilot-expansion, retirement, cancellation]}
    decision: {type: string, minLength: 1}
    alternatives:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    effective_scope: {type: string, minLength: 1}
    gate_outcome: {enum: [approve, reject]}
    delegation:
      type: object
      additionalProperties: false
      required: [authority, delegate, scenario, expires_when, reactivation_requires]
      properties:
        authority: {type: string, minLength: 1}
        delegate: {type: string, minLength: 1}
        scenario: {type: string, pattern: '^[a-z][a-z0-9-]*@[1-9][0-9]*$'}
        expires_when: {const: target-revised}
        reactivation_requires: {const: new-delegation-decision}
    waiver:
      type: object
      additionalProperties: false
      required: [instance, obligation, subject, scope, expires_when]
      properties:
        instance: {type: string, minLength: 1}
        obligation: {type: string, minLength: 1}
        subject: {type: string, minLength: 1}
        scope: {enum: [this-revision, this-baseline, one-execution]}
        expires_when:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [subject-revised, dependency-revised, baseline-superseded, process-explicitly-reassessed]}
  allOf:
    - if:
        properties:
          kind: {const: gate-signoff}
        required: [kind]
      then: {required: [gate_outcome]}
    - if: {required: [gate_outcome]}
      then:
        properties:
          kind: {const: gate-signoff}
    - if:
        properties:
          kind: {const: authority-delegation}
        required: [kind]
      then: {required: [delegation]}
    - if: {required: [delegation]}
      then:
        properties:
          kind: {const: authority-delegation}
outgoing_links:
  - id: resolves
    description: Exact question revision answered, deferred, or cancelled by this decision.
    targets:
      - {kind: datum, types: [QST], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: resolved-by
  - id: justifies
    description: Exact lifecycle claim for which this decision supplies rationale or authorization.
    targets:
      - {kind: datum, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, QST, DEC, ART, PRB, CHG, PAS], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: justified-by
  - id: confirms-revision
    description: Exact replacement requirement Revisions confirmed by a change-closure Decision.
    targets:
      - {kind: datum, types: [SYS], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: confirmed-by-closure
  - id: closes-with
    description: Exact replacement context, Review, baseline, and verification evidence cited by a change-closure Decision.
    targets:
      - {kind: datum, types: [BSL, REV, RES], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: closure-evidence
  - id: relies-on-review
    description: Exact passing Review whose judgment authorizes this Decision.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: relied-on-by-decision
  - id: waives
    description: Exact computed obligation instance suppressed by this structured waiver.
    targets:
      - {kind: obligation-instance, identity: exact-obligation-instance}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: not-applicable
    inverse_label: waived-by
kernel_managed_payload_paths: []
