kind: type-definition
id: DEC
version: 7
name: Decision Record
description: Consequential decision, assumption, waiver, scope outcome, deferral, standing authority delegation, disposition, or exact gate sign-off.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, decision, alternatives, effective_scope]
  properties:
    kind: {enum: [decision, assumption, scope, waiver, deferral, authority-delegation, gate-signoff, change-approval, change-closure, pilot-observation, pilot-expansion, retirement, cancellation]}
    change_disposition: {enum: [approve, reject, defer, cancel]}
    change_reactivation_condition: {type: string, minLength: 1}
    decision: {type: string, minLength: 1}
    alternatives:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    effective_scope: {type: string, minLength: 1}
    attended_answer_change:
      type: object
      additionalProperties: false
      required: [disposition, rationale]
      properties:
        disposition: {enum: [narrow, defer, remove]}
        rationale: {type: string, minLength: 1}
    scope_correction:
      type: object
      additionalProperties: false
      required: [disposition, options, necessity]
      properties:
        disposition: {enum: [bound, defer-or-remove, retain]}
        options:
          type: object
          additionalProperties: false
          required: [bounded, defer_or_remove, retain]
          properties:
            bounded: {type: string, minLength: 1}
            defer_or_remove: {type: string, minLength: 1}
            retain: {type: string, minLength: 1}
        necessity: {type: string, minLength: 1}
        reactivation_condition: {type: string, minLength: 1}
      allOf:
        - if:
            properties:
              disposition: {const: defer-or-remove}
            required: [disposition]
          then: {required: [reactivation_condition]}
    pilot_observation:
      type: object
      additionalProperties: false
      required: [availability, review, agent_effort, evidence_reuse, loose_ends, gate_ceremony, environment_profiles, verification_discrimination, scope_reduction]
      properties:
        availability:
          type: object
          additionalProperties: false
          required: [review, agent_effort, evidence_reuse, loose_ends, gate_ceremony, environment_profiles, verification_discrimination, scope_reduction]
          properties:
            review: {enum: [observed, unavailable]}
            agent_effort: {enum: [observed, unavailable]}
            evidence_reuse: {enum: [observed, unavailable]}
            loose_ends: {enum: [observed, unavailable]}
            gate_ceremony: {enum: [observed, unavailable]}
            environment_profiles: {enum: [observed, unavailable]}
            verification_discrimination: {enum: [observed, unavailable]}
            scope_reduction: {enum: [observed, unavailable]}
        review:
          type: object
          additionalProperties: false
          required: [contexts, completed_reviews, findings, quality_improved, volume_assessment]
          properties:
            contexts: {type: integer, minimum: 0}
            completed_reviews: {type: integer, minimum: 0}
            findings: {type: integer, minimum: 0}
            quality_improved: {type: boolean}
            volume_assessment: {enum: [low, acceptable, high]}
        agent_effort:
          type: object
          additionalProperties: false
          required: [tracer_issues, implementation_commits, implementation_commit_refs, effort_assessment]
          properties:
            tracer_issues: {type: integer, minimum: 0}
            implementation_commits: {type: integer, minimum: 0}
            implementation_commit_refs:
              type: array
              uniqueItems: true
              items: {type: string, pattern: '^git:[0-9a-f]{40}$'}
            effort_assessment: {enum: [low, acceptable, high]}
          allOf:
            - if:
                properties:
                  implementation_commits: {const: 0}
                required: [implementation_commits]
              then:
                properties:
                  implementation_commit_refs: {maxItems: 0}
            - if:
                properties:
                  implementation_commits: {minimum: 1}
                required: [implementation_commits]
              then:
                properties:
                  implementation_commit_refs: {minItems: 1}
        evidence_reuse:
          type: object
          additionalProperties: false
          required: [eligible, reused, stale, explanation_checks, explanations_correct]
          properties:
            eligible: {type: integer, minimum: 0}
            reused: {type: integer, minimum: 0}
            stale: {type: integer, minimum: 0}
            explanation_checks: {type: integer, minimum: 0}
            explanations_correct: {type: boolean}
        loose_ends:
          type: object
          additionalProperties: false
          required: [sampled, actionable, useful, assessment]
          properties:
            sampled: {type: integer, minimum: 0}
            actionable: {type: integer, minimum: 0}
            useful: {type: boolean}
            assessment: {type: string, minLength: 1}
        gate_ceremony:
          type: object
          additionalProperties: false
          required: [gates, signoffs, decision_reviews, proportionate]
          properties:
            gates: {type: integer, minimum: 0}
            signoffs: {type: integer, minimum: 0}
            decision_reviews: {type: integer, minimum: 0}
            proportionate: {type: boolean}
        environment_profiles:
          type: object
          additionalProperties: false
          required: [profiles_assessed, sufficient]
          properties:
            profiles_assessed: {type: integer, minimum: 0}
            sufficient: {type: boolean}
        verification_discrimination:
          type: object
          additionalProperties: false
          required: [supported_successes, unsupported_rejections, discriminates]
          properties:
            supported_successes: {type: integer, minimum: 0}
            unsupported_rejections: {type: integer, minimum: 0}
            discriminates: {type: boolean}
        scope_reduction:
          type: object
          additionalProperties: false
          required: [proposed_items, removed_items, retained_items, demonstrated]
          properties:
            proposed_items: {type: integer, minimum: 0}
            removed_items: {type: integer, minimum: 0}
            retained_items: {type: integer, minimum: 0}
            demonstrated: {type: boolean}
    gate_outcome: {enum: [approve, reject]}
    gate_rejection:
      type: object
      additionalProperties: false
      required: [findings]
      properties:
        findings:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [id, summary]
            properties:
              id: {type: string, pattern: '^G-[0-9]{3,}$'}
              summary: {type: string, minLength: 1}
    delegation:
      type: object
      additionalProperties: false
      required: [authority, delegate, scenario, expires_when, reactivation_requires]
      properties:
        authority: {type: string, minLength: 1}
        delegate: {type: string, minLength: 1}
        scenario: {type: string, pattern: '^[a-z][a-z0-9-]*@[1-9][0-9]*$'}
        expires_when: {const: target-revised}
        reactivation_requires: {const: new-delegation-decision}
    waiver:
      type: object
      additionalProperties: false
      required: [instance, obligation, subject, scope, expires_when]
      properties:
        instance: {type: string, minLength: 1}
        obligation: {type: string, minLength: 1}
        subject: {type: string, minLength: 1}
        scope: {enum: [this-revision, this-baseline, one-execution]}
        expires_when:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [subject-revised, dependency-revised, baseline-superseded, process-explicitly-reassessed]}
  allOf:
    - if:
        properties:
          kind: {const: pilot-observation}
        required: [kind]
      then: {required: [pilot_observation]}
    - if: {required: [pilot_observation]}
      then:
        properties:
          kind: {const: pilot-observation}
    - if:
        properties:
          kind: {const: gate-signoff}
        required: [kind]
      then: {required: [gate_outcome]}
    - if: {required: [gate_outcome]}
      then:
        properties:
          kind: {const: gate-signoff}
    - if:
        properties:
          gate_outcome: {const: reject}
        required: [gate_outcome]
      then: {required: [gate_rejection]}
    - if: {required: [gate_rejection]}
      then:
        properties:
          kind: {const: gate-signoff}
          gate_outcome: {const: reject}
    - if:
        properties:
          kind: {const: change-approval}
        required: [kind]
      then: {required: [change_disposition]}
    - if: {required: [change_disposition]}
      then:
        properties:
          kind: {const: change-approval}
    - if:
        properties:
          change_disposition: {const: defer}
        required: [change_disposition]
      then: {required: [change_reactivation_condition]}
    - if: {required: [change_reactivation_condition]}
      then:
        properties:
          kind: {const: change-approval}
          change_disposition: {const: defer}
    - if:
        properties:
          kind: {const: authority-delegation}
        required: [kind]
      then: {required: [delegation]}
    - if: {required: [delegation]}
      then:
        properties:
          kind: {const: authority-delegation}
outgoing_links:
  - id: resolves
    description: Exact question revision answered, deferred, or cancelled by this decision.
    targets:
      - {kind: datum, types: [QST], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: resolved-by
  - id: justifies
    description: Exact lifecycle claim for which this decision supplies rationale or authorization.
    targets:
      - {kind: datum, types: [MAP, PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, RUN, RES, REV, BSL, QST, DEC, ART, PRB, CHG, PAS], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: justified-by
  - id: blocks
    description: Exact candidate or permitted candidate member implicated by this gate rejection.
    targets:
      - {kind: datum, types: [MAP, PSP, STK, BSL], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: blocked-by-gate-rejection
  - id: corrects-review
    description: Exact failed Reviews whose blocking findings this replacement Decision Revision addresses.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-decision
  - id: confirms-revision
    description: Exact replacement requirement Revisions confirmed by a change-closure Decision.
    targets:
      - {kind: datum, types: [STK, SYS], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: confirmed-by-closure
  - id: closes-with
    description: Exact replacement context, Review, baseline, and verification evidence cited by a change-closure Decision.
    targets:
      - {kind: datum, types: [BSL, REV, RES], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: closure-evidence
  - id: relies-on-review
    description: Exact passing Review whose judgment authorizes this Decision.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: relied-on-by-decision
  - id: waives
    description: Exact computed obligation instance suppressed by this structured waiver.
    targets:
      - {kind: obligation-instance, identity: exact-obligation-instance}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: not-applicable
    inverse_label: waived-by
kernel_managed_payload_paths: []
