kind: type-definition
id: VSP
version: 1
name: Verification Strategy Specification
description: Level verification strategy, independence boundary, evidence policy, and one bounded bootstrap environment-capability profile.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [level, permitted_methods, independence, evidence_policy, assessment_policy, environment_profile]
  properties:
    level: {enum: [stakeholder, system]}
    permitted_methods:
      type: array
      minItems: 1
      uniqueItems: true
      items: {enum: [inspection, demonstration, test, analysis]}
    independence:
      type: object
      additionalProperties: false
      required: [boundary, prohibited_inputs]
      properties:
        boundary: {enum: [black-box]}
        prohibited_inputs:
          const: [product source code, product unit tests, private implementation details, uncontrolled implementation shortcuts]
    evidence_policy: {type: string, minLength: 1}
    assessment_policy: {type: string, minLength: 1}
    environment_profile:
      type: object
      additionalProperties: false
      required: [id, purpose, capabilities]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        purpose: {type: string, minLength: 1}
        capabilities:
          type: object
          additionalProperties: false
          required: [controllability, observability, external_services, timing]
          properties:
            controllability: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
            observability: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
            external_services: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            timing: {type: string, minLength: 1}
outgoing_links:
  - id: corrects-review
    description: Exact failed Review findings addressed by this corrected verification strategy Revision.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-assurance-revision
  - id: governs
    description: Stable stakeholder or system commitments governed by this level strategy.
    targets:
      - {kind: datum, types: [STK, SYS], identity: stable}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: governed-by
  - id: governs-revision
    description: Exact requirement Revisions covered by this strategy Revision.
    targets:
      - {kind: datum, types: [STK, SYS], identity: revision}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: already-exact
    inverse_label: governed-exactly-by
kernel_managed_payload_paths: []
