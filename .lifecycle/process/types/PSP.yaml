kind: type-definition
id: PSP
version: 2
name: Product Specification
description: Concise product intent covering problem, users, goals, exclusions, workflows, success, scope, and constraints.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [problem, users, goals, non_goals, success_measures]
  properties:
    problem: {type: string, minLength: 1}
    users:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    goals:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    non_goals:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    workflows:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    success_measures:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    scope:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    constraints:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
outgoing_links: []
kernel_managed_payload_paths: []
