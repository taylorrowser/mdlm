kind: type-definition
id: DWP
version: 3
name: Decomposition Work Package
description: Durable planning and completion account for one bounded many-to-many decomposition from exact parent revisions to exact child revisions.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [stage, architecture_element, target_child_type, behavioral_slice, expected_coverage, exclusions, dependencies, required_review_policy]
  properties:
    stage: {enum: [planning, completion]}
    architecture_element: {type: string, pattern: '^AEL-[0-9A-HJKMNP-TV-Z]{10,12}$'}
    target_child_type: {const: SYS}
    behavioral_slice: {type: string, minLength: 1}
    expected_coverage: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    exclusions: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    dependencies:
      type: array
      uniqueItems: true
      items: {type: string, pattern: '^[A-Z]{3,8}-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    required_review_policy: {type: string, const: review-applicability@1}
    parent_coverage_status: {enum: [complete, gaps]}
    deferred_questions:
      type: array
      uniqueItems: true
      items: {type: string, pattern: '^QST-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    cross_group_dependencies: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    output_reviews_complete: {type: boolean}
    simplification_disposition: {enum: [retained, reduced, revised]}
  allOf:
    - if:
        properties: {stage: {const: completion}}
        required: [stage]
      then:
        required: [parent_coverage_status, deferred_questions, cross_group_dependencies, output_reviews_complete, simplification_disposition]
        properties:
          output_reviews_complete: {const: true}
outgoing_links:
  - id: corrects-review
    description: Exact failed Reviews whose blocking simplification findings this replacement decomposition Revision addresses.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by
  - id: changed-under
    description: Exact approved Change Requests requiring this replacement consumer coverage Revision, including preserved prior and current replacement-parent causes.
    targets:
      - {kind: datum, types: [CHG], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: changed-consumer-coverage
  - id: decomposes
    description: Exact stakeholder or shared system requirement Revisions whose bounded slices this work package accounts for.
    targets:
      - {kind: datum, types: [STK, SYS], identity: revision}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: already-exact
    inverse_label: decomposed-by
  - id: allocated-to
    description: Exact architecture Revision bounding this work package.
    targets:
      - {kind: datum, types: [ASP], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: decomposition-architecture-for
  - id: governed-by
    description: Exact interface Revisions constraining this work package.
    targets:
      - {kind: datum, types: [ICSP], identity: revision}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: already-exact
    inverse_label: governs-decomposition
  - id: verified-under
    description: Exact verification strategy Revision constraining this decomposition.
    targets:
      - {kind: datum, types: [VSP], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: strategy-for-decomposition
  - id: derived-from
    description: Exact planning Revision whose reviewed evidence this completion records.
    targets:
      - {kind: datum, types: [DWP], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: completed-by
  - id: produces
    description: Exact system requirement revisions produced by this work package completion.
    targets:
      - {kind: datum, types: [SYS], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: produced-by
  - id: justifies
    description: Exact simplification reviews supporting the completion account.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: justifies-completion
kernel_managed_payload_paths: []
