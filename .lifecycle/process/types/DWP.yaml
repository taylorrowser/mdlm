kind: type-definition
id: DWP
version: 1
name: Decomposition Work Package
description: Durable planning and completion account for one bounded many-to-many decomposition from exact parent revisions to exact child revisions.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [stage, parent_revisions, architecture_context, target_child_type, behavioral_slice, expected_coverage, exclusions, interface_context, verification_strategy_revision, dependencies, required_review_policy]
  properties:
    stage: {enum: [planning, completion]}
    parent_revisions:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: '^STK-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    architecture_context:
      type: object
      additionalProperties: false
      required: [revision, element]
      properties:
        revision: {type: string, pattern: '^ASP-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
        element: {type: string, pattern: '^AEL-[0-9A-HJKMNP-TV-Z]{10,12}$'}
    target_child_type: {const: SYS}
    behavioral_slice: {type: string, minLength: 1}
    expected_coverage: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    exclusions: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    interface_context:
      type: array
      uniqueItems: true
      items: {type: string, pattern: '^ICSP-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    verification_strategy_revision: {type: string, pattern: '^VSP-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    dependencies:
      type: array
      uniqueItems: true
      items: {type: string, pattern: '^[A-Z]{3,8}-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    required_review_policy: {type: string, const: review-applicability@1}
    child_revisions:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: '^SYS-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    parent_coverage_status: {enum: [complete, gaps, waived]}
    coverage_account:
      type: array
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [parent_revision, child_revisions, disposition]
        properties:
          parent_revision: {type: string, pattern: '^STK-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
          child_revisions:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, pattern: '^SYS-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
          disposition: {enum: [covered, terminated, waived]}
    deferred_questions:
      type: array
      uniqueItems: true
      items: {type: string, pattern: '^QST-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    cross_group_dependencies: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    output_reviews_complete: {type: boolean}
    simplification_disposition: {enum: [retained, reduced, revised]}
  allOf:
    - if:
        properties: {stage: {const: completion}}
        required: [stage]
      then:
        required: [child_revisions, parent_coverage_status, coverage_account, deferred_questions, cross_group_dependencies, output_reviews_complete, simplification_disposition]
        properties:
          output_reviews_complete: {const: true}
outgoing_links:
  - id: decomposes
    description: Exact stakeholder requirement revisions whose bounded slices this work package accounts for.
    targets:
      - {kind: datum, types: [STK], identity: revision}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: already-exact
    inverse_label: decomposed-by
  - id: produces
    description: Exact system requirement revisions produced by this work package completion.
    targets:
      - {kind: datum, types: [SYS], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: produced-by
  - id: justifies
    description: Exact simplification reviews supporting the completion account.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: justifies-completion
kernel_managed_payload_paths: []
