kind: type-definition
id: SYS
version: 2
name: System Requirement
description: Singular solution-independent system behavior or constraint derived from stakeholder requirements.
extends: requirement@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
outgoing_links:
