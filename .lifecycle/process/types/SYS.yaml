    description: Stakeholder commitments whose necessary system behavior this requirement expresses.
    targets:
      - {kind: datum, types: [STK], identity: stable}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: derives
kernel_managed_payload_paths: []
