kind: type-definition
id: IMP
version: 1
description: Implementation
name: Implementation
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - command
  - product_files
  - source_commit
  - repository_path
  - verification_image
  - verification_command
  - verification_script
  - verification_coverage
  properties:
    publication:
      const: recorded
    command:
      type: array
      minItems: 1
      items: &id001
        type: string
        minLength: 1
    product_files:
      type: array
      minItems: 1
      uniqueItems: true
      items: *id001
    source_commit:
      type: string
      pattern: ^[0-9a-f]{40}$
    repository_path:
      type: string
      pattern: ^/
    verification_image:
      type: string
      pattern: ^[^\s]+@sha256:[0-9a-f]{64}$
    verification_command:
      type: array
      minItems: 1
      items: *id001
    verification_script:
      type: string
      minLength: 1
      pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
    verification_coverage:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - commitment_id
        - method
        - file
        - locator
        properties:
          commitment_id:
            type: string
            minLength: 1
            pattern: ^[A-Za-z][A-Za-z0-9_-]*$
          method:
            enum:
            - test
            - inspection
            type: string
          file:
            type: string
            minLength: 1
            pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
          locator:
            type: string
            minLength: 1
outgoing_links:
- id: implements
  description: implements
  targets:
  - kind: datum
    types:
    - REQ
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-implements
- id: corrects
  description: corrects
  targets:
  - kind: datum
    types:
    - REV
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-corrects
kernel_managed_payload_paths: []
payload_collections:
- path: verification_coverage
  references:
  - field: commitment_id
    target: commitments
    key: id
    link: implements
    covered: true
payload_views:
- title: Declared evidence mapping, subject to content review
  path: verification_coverage
  columns:
  - title: Commitment
    fragments:
    - field: commitment_id
  - title: Method
    fragments:
    - field: method
  - title: File
    fragments:
    - field: file
  - title: Location
    fragments:
    - field: locator
