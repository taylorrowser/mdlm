kind: type-definition
id: IMP
version: 1
description: Implementation
name: Implementation
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - command
  - product_files
  - source_commit
  - repository_path
  - verification_image
  - verification_command
  - verification_script
  - file_roles
  - source_inventory
  properties:
    publication:
      const: recorded
    command:
      type: array
      minItems: 1
      items: &id001
        type: string
        minLength: 1
    product_files:
      type: array
      minItems: 1
      uniqueItems: true
      items: *id001
    source_commit:
      type: string
      pattern: ^[0-9a-f]{40}$
    repository_path:
      type: string
      pattern: ^/
    verification_image:
      type: string
      pattern: ^[^\s]+@sha256:[0-9a-f]{64}$
    verification_command:
      type: array
      minItems: 1
      items: *id001
    verification_script:
      type: string
      minLength: 1
      pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
    file_roles:
      type: object
      minProperties: 1
      propertyNames:
        pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
      additionalProperties:
        type: string
        enum:
        - production
        - verification
        - documentation
        - build
        - configuration
    source_inventory:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - path
        - mode
        - blob
        - role
        - lineCount
        properties:
          path:
            type: string
            minLength: 1
          mode:
            type: string
            minLength: 1
          blob:
            type: string
            pattern: ^[0-9a-f]{40}$
          role:
            type: string
            enum:
            - production
            - verification
            - documentation
            - build
            - configuration
          lineCount:
            type: integer
            minimum: 0
          blankRanges:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [start, end]
              properties:
                start:
                  type: integer
                  minimum: 1
                end:
                  type: integer
                  minimum: 1
    source_changes:
      type: object
      additionalProperties: false
      required:
      - baseline_implementation
      - files
      properties:
        baseline_implementation:
          type:
          - string
          - 'null'
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - added_ranges
            - inherited_added_ranges
            properties:
              path:
                type: string
                minLength: 1
              added_ranges: &id002
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - start
                  - end
                  properties:
                    start:
                      type: integer
                      minimum: 1
                    end:
                      type: integer
                      minimum: 1
              inherited_added_ranges: *id002
outgoing_links:
- id: implements
  description: implements
  targets:
  - kind: datum
    types:
    - RQS
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-implements
- id: corrects
  description: corrects
  targets:
  - kind: datum
    types:
    - REV
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-corrects
kernel_managed_payload_paths:
- product_files
- source_inventory
- source_changes
