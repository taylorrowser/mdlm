kind: type-definition
id: IMP
version: 1
description: Implementation
name: Implementation
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - command
  - product_files
  - source_commit
  - repository_path
  - verification_image
  - verification_command
  - verification_script
  properties:
    publication:
      const: recorded
    command:
      type: array
      minItems: 1
      items: &id001
        type: string
        minLength: 1
    product_files:
      type: array
      minItems: 1
      uniqueItems: true
      items: *id001
    source_commit:
      type: string
      pattern: ^[0-9a-f]{40}$
    repository_path:
      type: string
      pattern: ^/
    verification_image:
      type: string
      pattern: ^[^\s]+@sha256:[0-9a-f]{64}$
    verification_command:
      type: array
      minItems: 1
      items: *id001
    verification_script:
      type: string
      minLength: 1
      pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
outgoing_links:
- id: implements
  description: implements
  targets:
  - kind: datum
    types:
    - REQ
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-implements
- id: corrects
  description: corrects
  targets:
  - kind: datum
    types:
    - REV
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-corrects
kernel_managed_payload_paths: []
