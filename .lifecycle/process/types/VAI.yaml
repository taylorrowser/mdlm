kind: type-definition
id: VAI
version: 1
name: Verification Activity Implementation
description: Exact executable or procedural implementation of one verification activity with recorded independence provenance.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, implementation_ref, independence_mode, authoring_input_refs, prohibited_inputs_observed, activity_bindings, target_behavior]
  allOf:
    - if:
        properties:
          kind: {const: pilot}
          independence_mode: {const: source-blind}
        required: [kind, independence_mode]
      then: {required: [execution_procedure]}
  properties:
    kind: {enum: [qualification, pilot, formal]}
    implementation_ref: {type: string, pattern: '^(git:[a-f0-9]{40}|procedure:sha256:[a-f0-9]{64})$'}
    independence_mode: {enum: [environment-capability, source-blind]}
    authoring_input_refs:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    prohibited_inputs_observed:
      const: [product source code, product unit tests, private implementation details, uncontrolled implementation shortcuts]
    activity_bindings: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    target_behavior:
      type: object
      additionalProperties: false
      required: [supported, intentionally_unsupported]
      properties:
        supported: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        intentionally_unsupported: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    execution_procedure:
      type: object
      additionalProperties: false
      required: [deadlines_ms, deadline_claim, timeout_recovery, cleanup, aggregation]
      properties:
        deadlines_ms:
          type: object
          additionalProperties: false
          required: [checkout, environment_check, product_case]
          properties:
            checkout: {type: integer, minimum: 1, maximum: 3600000}
            environment_check: {type: integer, minimum: 1, maximum: 3600000}
            product_case: {type: integer, minimum: 1, maximum: 3600000}
        deadline_claim: {const: infrastructure-safety-only}
        timeout_recovery:
          type: object
          additionalProperties: false
          required: [terminate, graceful_signal, force_after_ms, force_signal, reap, capture_partial_raw_observation]
          properties:
            terminate: {const: process-group}
            graceful_signal: {const: SIGTERM}
            force_after_ms: {type: integer, minimum: 1, maximum: 60000}
            force_signal: {const: SIGKILL}
            reap: {const: all-descendants}
            capture_partial_raw_observation: {const: true}
        cleanup: {const: guaranteed}
        aggregation: {const: continue-through-all-cases}
outgoing_links:
  - id: corrects-review
    description: Exact failed Review findings addressed by this corrected verification implementation Revision.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-implementation-revision
  - id: realizes
    description: Exact verification activity implemented by this executable or procedure.
    targets:
      - {kind: datum, types: [VER], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: realized-by
  - id: uses
    description: Exact verification environment used by this implementation.
    targets:
      - {kind: datum, types: [ENV], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: used-by
  - id: targets
    description: Exact environment or bounded artifact execution target.
    targets:
      - {kind: datum, types: [ENV, ART], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: targeted-by
kernel_managed_payload_paths: []
