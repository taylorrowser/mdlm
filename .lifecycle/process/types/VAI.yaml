kind: type-definition
id: VAI
version: 1
name: Verification Activity Implementation
description: Exact executable or procedural implementation of one verification activity with recorded independence provenance.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, implementation_ref, independence_mode, authoring_input_refs, prohibited_inputs_observed, activity_bindings, target_behavior]
  properties:
    kind: {enum: [qualification, pilot, formal]}
    implementation_ref: {type: string, pattern: '^(git:[a-f0-9]{40}|procedure:sha256:[a-f0-9]{64})$'}
    independence_mode: {enum: [environment-capability, source-blind]}
    authoring_input_refs:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    prohibited_inputs_observed:
      const: [product source code, product unit tests, private implementation details, uncontrolled implementation shortcuts]
    activity_bindings: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    target_behavior:
      type: object
      additionalProperties: false
      required: [supported, intentionally_unsupported]
      properties:
        supported: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        intentionally_unsupported: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
outgoing_links:
  - id: realizes
    description: Exact verification activity implemented by this executable or procedure.
    targets:
      - {kind: datum, types: [VER], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: realized-by
  - id: uses
    description: Exact verification environment used by this implementation.
    targets:
      - {kind: datum, types: [ENV], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: used-by
  - id: targets
    description: Exact environment or bounded artifact execution target.
    targets:
      - {kind: datum, types: [ENV, ART], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: targeted-by
kernel_managed_payload_paths: []
