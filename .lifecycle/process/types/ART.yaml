kind: type-definition
id: ART
version: 3
name: Code Pointer or Prototype Artifact
description: Exact repository pointer or inline disposable pilot-control pair with its declared behavioral boundary.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, supported_behavior, unsupported_behavior]
  allOf:
    - if:
        properties: {kind: {const: implementation}}
        required: [kind]
      then:
        required: [repository_ref, public_interface, design_path_mapping]
    - if: {required: [prototype_controls]}
      then:
        properties: {kind: {const: prototype}}
        not:
          anyOf:
            - {required: [repository_ref]}
            - {required: [public_interface]}
      else: {required: [repository_ref]}
  properties:
    kind: {enum: [implementation, prototype]}
    repository_ref: {type: string, pattern: '^git:[0-9a-f]{40}$'}
    supported_behavior:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    unsupported_behavior:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    evidence_refs:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    design_path_mapping:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [design_revision, paths]
        properties:
          design_revision: {type: string, pattern: '^DES-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
          paths:
            type: array
            minItems: 1
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              minLength: 1
              pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*//).+$'
    prototype_controls:
      type: object
      additionalProperties: false
      required: [activity_ref, working_directory, known_good, known_bad]
      $defs:
        exact_bytes:
          type: object
          additionalProperties: false
          required: [encoding, bytes]
          properties:
            encoding: {const: base64}
            bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}
        exact_observation:
          type: object
          additionalProperties: false
          required: [exit_status, stdout, stderr]
          properties:
            exit_status: {type: integer}
            stdout: {$ref: '#/properties/prototype_controls/$defs/exact_bytes'}
            stderr: {$ref: '#/properties/prototype_controls/$defs/exact_bytes'}
      properties:
        activity_ref: {type: string, pattern: '^VER-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
        working_directory: {const: fresh-temporary-directory}
        known_good:
          type: object
          additionalProperties: false
          required: [argv, expected_observation, expected_verification_outcome]
          properties:
            argv:
              type: array
              minItems: 1
              prefixItems:
                - {type: string, minLength: 1, pattern: '^[^/\\]+$'}
              items: {type: string}
            expected_observation: {$ref: '#/properties/prototype_controls/$defs/exact_observation'}
            expected_verification_outcome: {const: pass}
        known_bad:
          type: object
          additionalProperties: false
          required: [argv, expected_observation, expected_verification_outcome, fault]
          properties:
            argv:
              type: array
              minItems: 1
              prefixItems:
                - {type: string, minLength: 1, pattern: '^[^/\\]+$'}
              items: {type: string}
            expected_observation: {$ref: '#/properties/prototype_controls/$defs/exact_observation'}
            expected_verification_outcome: {const: fail}
            fault: {type: string, minLength: 1}
    public_interface:
      type: object
      additionalProperties: false
      required: [repository_locator, command, argument_cases, working_directory]
      allOf:
        - if:
            properties:
              command:
                contains: {type: object, required: [parameter]}
            required: [command]
          then:
            properties:
              command:
                allOf:
                  - contains:
                      type: object
                      required: [parameter]
                      properties:
                        parameter:
                          type: object
                          required: [case_tokens]
                          properties:
                            case_tokens:
                              type: object
                              required: [raw-malformed]
                              properties:
                                raw-malformed: {$ref: '#/properties/public_interface/$defs/raw_value'}
                    minContains: 1
                  - contains:
                      type: object
                      required: [parameter]
                      properties:
                        parameter:
                          type: object
                          required: [case_tokens]
                          properties:
                            case_tokens:
                              type: object
                              required: [omitted-argument]
                              properties:
                                omitted-argument:
                                  type: object
                                  required: [omitted]
                                  properties: {omitted: {const: true}}
                    minContains: 1
                  - contains: {type: object, required: [extra_argument]}
                    minContains: 1
              argument_cases:
                minItems: 4
                maxItems: 4
                allOf:
                  - {contains: {type: object, properties: {kind: {const: normal}}, required: [kind]}, minContains: 1, maxContains: 1}
                  - {contains: {type: object, properties: {kind: {const: raw-malformed}}, required: [kind]}, minContains: 1, maxContains: 1}
                  - {contains: {type: object, properties: {kind: {const: omitted-argument}}, required: [kind]}, minContains: 1, maxContains: 1}
                  - {contains: {type: object, properties: {kind: {const: extra-argument}}, required: [kind]}, minContains: 1, maxContains: 1}
          else:
            properties:
              command:
                contains: {type: object, required: [extra_argument]}
                minContains: 1
              argument_cases:
                minItems: 2
                maxItems: 2
                allOf:
                  - {contains: {type: object, properties: {kind: {const: normal}}, required: [kind]}, minContains: 1, maxContains: 1}
                  - {contains: {type: object, properties: {kind: {const: extra-argument}}, required: [kind]}, minContains: 1, maxContains: 1}
      $defs:
        exact_bytes:
          type: object
          additionalProperties: false
          required: [encoding, bytes]
          properties:
            encoding: {const: base64}
            bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}
        supplied_value:
          type: object
          additionalProperties: false
          required: [value]
          properties: {value: {type: string}}
        raw_value:
          type: object
          additionalProperties: false
          required: [raw]
          properties:
            raw:
              type: object
              additionalProperties: false
              required: [encoding, value]
              properties:
                encoding: {const: utf-8}
                value: {type: string}
        command_token:
          oneOf:
            - type: object
              additionalProperties: false
              required: [literal]
              properties: {literal: {type: string, minLength: 1}}
            - type: object
              additionalProperties: false
              required: [checkout_path]
              properties: {checkout_path: {type: string, minLength: 1}}
            - type: object
              additionalProperties: false
              required: [parameter]
              properties:
                parameter:
                  type: object
                  additionalProperties: false
                  required: [name, encoding, case_tokens]
                  properties:
                    name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
                    encoding: {type: string, minLength: 1}
                    case_tokens:
                      type: object
                      additionalProperties: false
                      required: [normal, raw-malformed, omitted-argument, extra-argument]
                      properties:
                        normal: {$ref: '#/properties/public_interface/$defs/supplied_value'}
                        raw-malformed:
                          oneOf:
                            - {$ref: '#/properties/public_interface/$defs/supplied_value'}
                            - {$ref: '#/properties/public_interface/$defs/raw_value'}
                        omitted-argument:
                          oneOf:
                            - {$ref: '#/properties/public_interface/$defs/supplied_value'}
                            - type: object
                              additionalProperties: false
                              required: [omitted]
                              properties: {omitted: {const: true}}
                        extra-argument: {$ref: '#/properties/public_interface/$defs/supplied_value'}
            - type: object
              additionalProperties: false
              required: [extra_argument]
              properties:
                extra_argument: {$ref: '#/properties/public_interface/$defs/raw_value'}
        exact_observation:
          type: object
          additionalProperties: false
          required: [classification, exit_status, stdout, stderr]
          properties:
            classification: {enum: [success, automatic-rejection]}
            exit_status: {type: integer}
            stdout: {$ref: '#/properties/public_interface/$defs/exact_bytes'}
            stderr: {$ref: '#/properties/public_interface/$defs/exact_bytes'}
      properties:
        repository_locator: {type: string, minLength: 1}
        command:
          type: array
          minItems: 2
          items: {$ref: '#/properties/public_interface/$defs/command_token'}
        argument_cases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, expected_observation]
            properties:
              id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
              kind: {enum: [normal, raw-malformed, omitted-argument, extra-argument]}
              expected_observation: {$ref: '#/properties/public_interface/$defs/exact_observation'}
            allOf:
              - if: {properties: {kind: {const: normal}}, required: [kind]}
                then:
                  properties:
                    expected_observation:
                      properties: {classification: {const: success}, exit_status: {const: 0}}
                else:
                  properties:
                    expected_observation:
                      properties:
                        classification: {const: automatic-rejection}
                        exit_status: {type: integer, not: {const: 0}}
        working_directory: {const: fresh-temporary-directory}
outgoing_links:
  - id: corrects-review
    description: Exact failed implementation-artifact Review addressed by this same-lineage replacement.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-implementation-artifact
  - id: implements
    description: Exact design requirement Revisions implemented by this controlled product artifact.
    targets:
      - {kind: datum, types: [DES], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: implemented-by
  - id: realizes-candidate
    description: Exact reviewed and gate-approved design candidate realized by this controlled product artifact.
    targets:
      - {kind: datum, types: [BSL], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: realized-by-product-artifact
  - id: corrects-pilot-result
    description: Exact unfavorable pilot results causally addressed by this replacement artifact Revision.
    targets:
      - {kind: datum, types: [RES], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by-artifact-revision
  - id: derived-from
    description: Exact question, decision, product-intent, or system-requirement revision that motivated this artifact.
    targets:
      - {kind: datum, types: [QST, DEC, PSP, STK, SYS, CMP, DES], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: prototype-evidence
kernel_managed_payload_paths: []
