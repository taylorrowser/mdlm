kind: type-definition
id: ART
version: 1
name: Code Pointer or Prototype Artifact
description: Exact repository pointer to implementation or exploratory prototype code and its declared behavioral boundary.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, repository_ref, supported_behavior, unsupported_behavior]
  properties:
    kind: {enum: [implementation, prototype]}
    repository_ref: {type: string, pattern: '^git:[0-9a-f]{40}$'}
    supported_behavior:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    unsupported_behavior:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    evidence_refs:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    public_interface:
      type: object
      additionalProperties: false
      required: [repository_locator, command, working_directory, observation_protocol]
      $defs:
        exact_bytes:
          type: object
          additionalProperties: false
          required: [encoding, bytes]
          properties:
            encoding: {const: base64}
            bytes:
              type: string
              pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
        argument_case_token:
          oneOf:
            - type: object
              additionalProperties: false
              required: [literal]
              properties: {literal: {type: string, minLength: 1}}
            - type: object
              additionalProperties: false
              required: [checkout_path]
              properties: {checkout_path: {type: string, minLength: 1}}
            - type: object
              additionalProperties: false
              required: [parameter]
              properties:
                parameter:
                  type: object
                  additionalProperties: false
                  required: [name, encoding, value]
                  properties:
                    name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
                    encoding: {type: string, minLength: 1}
                    value: {type: string}
            - type: object
              additionalProperties: false
              required: [raw]
              properties:
                raw:
                  type: object
                  additionalProperties: false
                  required: [encoding, value]
                  properties:
                    encoding: {const: utf-8}
                    value: {type: string}
        exact_case_observation:
          type: object
          additionalProperties: false
          required: [classification, exit_status, stdout, stderr]
          properties:
            classification: {enum: [success, automatic-rejection]}
            exit_status: {type: integer}
            stdout: {$ref: '#/properties/public_interface/$defs/exact_bytes'}
            stderr: {$ref: '#/properties/public_interface/$defs/exact_bytes'}
      allOf:
        - if:
            properties: {interface_version: {const: 1}}
            required: [interface_version]
          then: {required: [parameters, parameter_encodings]}
        - if:
            properties: {interface_version: {const: 2}}
            required: [interface_version]
          then:
            required: [argument_cases]
            properties:
              parameters: false
              parameter_encodings: false
              command:
                items:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [literal]
                      properties: {literal: {type: string, minLength: 1}}
                    - type: object
                      additionalProperties: false
                      required: [checkout_path]
                      properties: {checkout_path: {type: string, minLength: 1}}
                    - type: object
                      additionalProperties: false
                      required: [parameter]
                      properties:
                        parameter:
                          type: object
                          additionalProperties: false
                          required: [name, encoding]
                          properties:
                            name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
                            encoding: {type: string, minLength: 1}
      properties:
        interface_version: {enum: [1, 2]}
        repository_locator: {type: string, minLength: 1}
        command:
          type: array
          minItems: 2
          items:
            oneOf:
              - {type: string, minLength: 1}
              - type: object
                minProperties: 1
        parameters:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        parameter_encodings:
          type: object
          minProperties: 1
          additionalProperties: {type: string, minLength: 1}
        argument_cases:
          type: array
          minItems: 4
          allOf:
            - contains:
                type: object
                properties: {kind: {const: normal}}
                required: [kind]
              minContains: 1
            - contains:
                type: object
                properties: {kind: {const: raw-malformed}}
                required: [kind]
              minContains: 1
            - contains:
                type: object
                properties: {kind: {const: omitted-argument}}
                required: [kind]
              minContains: 1
            - contains:
                type: object
                properties: {kind: {const: extra-argument}}
                required: [kind]
              minContains: 1
          items:
            type: object
            additionalProperties: false
            required: [id, kind, tokens, expected_observation]
            properties:
              id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
              kind: {enum: [normal, raw-malformed, omitted-argument, extra-argument]}
              tokens:
                type: array
                minItems: 2
                items: {$ref: '#/properties/public_interface/$defs/argument_case_token'}
              raw_token_positions:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: integer, minimum: 0}
              omitted_parameters:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
              extra_token_positions:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: integer, minimum: 0}
              expected_observation: {$ref: '#/properties/public_interface/$defs/exact_case_observation'}
            allOf:
              - if:
                  properties: {kind: {const: normal}}
                  required: [kind]
                then:
                  properties:
                    expected_observation:
                      properties:
                        classification: {const: success}
                        exit_status: {const: 0}
              - if:
                  properties: {kind: {const: raw-malformed}}
                  required: [kind]
                then:
                  required: [raw_token_positions]
                  properties:
                    expected_observation:
                      properties:
                        classification: {const: automatic-rejection}
                        exit_status: {type: integer, not: {const: 0}}
              - if:
                  properties: {kind: {const: omitted-argument}}
                  required: [kind]
                then:
                  required: [omitted_parameters]
                  properties:
                    expected_observation:
                      properties:
                        classification: {const: automatic-rejection}
                        exit_status: {type: integer, not: {const: 0}}
              - if:
                  properties: {kind: {const: extra-argument}}
                  required: [kind]
                then:
                  required: [extra_token_positions]
                  properties:
                    expected_observation:
                      properties:
                        classification: {const: automatic-rejection}
                        exit_status: {type: integer, not: {const: 0}}
        working_directory: {enum: [fresh-temporary-directory]}
        observation_protocol:
          type: object
          additionalProperties: false
          required: [success, rejection]
          properties:
            success:
              type: object
              additionalProperties: false
              required: [exit_status, stdout_contract, stderr_contract]
              properties:
                exit_status: {const: 0}
                stdout_contract: {type: string, minLength: 1}
                stderr_contract: {type: string, minLength: 1}
            rejection:
              type: object
              additionalProperties: false
              required: [exit_status, stdout_contract, stderr_contract]
              properties:
                exit_status: {type: integer, not: {const: 0}}
                stdout_contract: {type: string, minLength: 1}
                stderr_contract: {type: string, minLength: 1}
outgoing_links:
  - id: derived-from
    description: Exact question, decision, or product-intent revision that motivated this artifact.
    targets:
      - {kind: datum, types: [QST, DEC, PSP, STK], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: prototype-evidence
kernel_managed_payload_paths: []
