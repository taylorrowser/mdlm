kind: type-definition
id: ART
version: 1
name: Code Pointer or Prototype Artifact
description: Exact repository pointer to implementation or exploratory prototype code and its declared behavioral boundary.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, repository_ref, supported_behavior, unsupported_behavior]
  properties:
    kind: {enum: [implementation, prototype]}
    repository_ref: {type: string, pattern: '^git:[0-9a-f]{40}$'}
    supported_behavior:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    unsupported_behavior:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    evidence_refs:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
    public_interface:
      type: object
      additionalProperties: false
      required: [repository_locator, command, argument_cases, working_directory]
      $defs:
        exact_bytes:
          type: object
          additionalProperties: false
          required: [encoding, bytes]
          properties:
            encoding: {const: base64}
            bytes: {type: string, pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'}
        command_token:
          oneOf:
            - type: object
              additionalProperties: false
              required: [literal]
              properties: {literal: {type: string, minLength: 1}}
            - type: object
              additionalProperties: false
              required: [checkout_path]
              properties: {checkout_path: {type: string, minLength: 1}}
            - type: object
              additionalProperties: false
              required: [parameter]
              properties:
                parameter:
                  type: object
                  additionalProperties: false
                  required: [name, encoding]
                  properties:
                    name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
                    encoding: {type: string, minLength: 1}
        case_token:
          oneOf:
            - {$ref: '#/properties/public_interface/$defs/command_token/oneOf/0'}
            - {$ref: '#/properties/public_interface/$defs/command_token/oneOf/1'}
            - type: object
              additionalProperties: false
              required: [parameter]
              properties:
                parameter:
                  type: object
                  additionalProperties: false
                  required: [name, encoding, value]
                  properties:
                    name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
                    encoding: {type: string, minLength: 1}
                    value: {type: string}
            - type: object
              additionalProperties: false
              required: [raw]
              properties:
                raw:
                  type: object
                  additionalProperties: false
                  required: [encoding, value, role]
                  properties:
                    encoding: {const: utf-8}
                    value: {type: string}
                    role: {enum: [malformed, extra]}
        exact_observation:
          type: object
          additionalProperties: false
          required: [classification, exit_status, stdout, stderr]
          properties:
            classification: {enum: [success, automatic-rejection]}
            exit_status: {type: integer}
            stdout: {$ref: '#/properties/public_interface/$defs/exact_bytes'}
            stderr: {$ref: '#/properties/public_interface/$defs/exact_bytes'}
      properties:
        repository_locator: {type: string, minLength: 1}
        command:
          type: array
          minItems: 2
          items: {$ref: '#/properties/public_interface/$defs/command_token'}
        argument_cases:
          type: array
          minItems: 4
          allOf:
            - {contains: {type: object, properties: {kind: {const: normal}}, required: [kind]}, minContains: 1}
            - {contains: {type: object, properties: {kind: {const: raw-malformed}}, required: [kind]}, minContains: 1}
            - {contains: {type: object, properties: {kind: {const: omitted-argument}}, required: [kind]}, minContains: 1}
            - {contains: {type: object, properties: {kind: {const: extra-argument}}, required: [kind]}, minContains: 1}
          items:
            type: object
            additionalProperties: false
            required: [id, kind, tokens, expected_observation]
            properties:
              id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
              kind: {enum: [normal, raw-malformed, omitted-argument, extra-argument]}
              tokens:
                type: array
                minItems: 2
                items: {$ref: '#/properties/public_interface/$defs/case_token'}
              omitted_parameters:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
              expected_observation: {$ref: '#/properties/public_interface/$defs/exact_observation'}
            allOf:
              - if: {properties: {kind: {const: normal}}, required: [kind]}
                then:
                  properties:
                    tokens: {not: {contains: {type: object, required: [raw]}}}
                    expected_observation:
                      properties: {classification: {const: success}, exit_status: {const: 0}}
                else:
                  properties:
                    expected_observation:
                      properties:
                        classification: {const: automatic-rejection}
                        exit_status: {type: integer, not: {const: 0}}
              - if: {properties: {kind: {const: raw-malformed}}, required: [kind]}
                then:
                  properties:
                    tokens:
                      contains:
                        type: object
                        required: [raw]
                        properties: {raw: {type: object, properties: {role: {const: malformed}}, required: [role]}}
              - if: {properties: {kind: {const: omitted-argument}}, required: [kind]}
                then: {required: [omitted_parameters]}
              - if: {properties: {kind: {const: extra-argument}}, required: [kind]}
                then:
                  properties:
                    tokens:
                      contains:
                        type: object
                        required: [raw]
                        properties: {raw: {type: object, properties: {role: {const: extra}}, required: [role]}}
        working_directory: {const: fresh-temporary-directory}
outgoing_links:
  - id: derived-from
    description: Exact question, decision, or product-intent revision that motivated this artifact.
    targets:
      - {kind: datum, types: [QST, DEC, PSP, STK], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: prototype-evidence
kernel_managed_payload_paths: []
