kind: type-definition
id: ICSP
version: 1
name: Interface Control Specification
description: Normative externally observable contract across one controlled architecture boundary.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [architecture_revision, boundary, operations, schemas, units, timing, errors, security, ordering, compatibility, interface_version]
  properties:
    architecture_revision: {type: string, pattern: '^ASP-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    boundary:
      type: object
      additionalProperties: false
      required: [from_element, to_element]
      properties:
        from_element: {type: string, pattern: '^AEL-[0-9A-HJKMNP-TV-Z]{10,12}$'}
        to_element: {type: string, pattern: '^AEL-[0-9A-HJKMNP-TV-Z]{10,12}$'}
    operations: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    schemas: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    units: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    timing: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    errors: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    security: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    ordering: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
    compatibility: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    interface_version: {type: string, minLength: 1}
outgoing_links:
  - id: defines-interface-for
    description: Exact architecture, requirements, and decomposition plans governed by this boundary contract.
    targets:
      - {kind: datum, types: [ASP, SYS, DWP], identity: revision}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: already-exact
    inverse_label: interface-defined-by
kernel_managed_payload_paths: []
