kind: type-definition
id: RES
version: 2
name: Verification Result
description: Immutable generated outcome and evidence for one scoped qualification, pilot, or formal verification claim.
extends: titled-datum@1
lifecycle:
  authorship: generated
  freeze_when: terminal-outcome
  terminal_payload_field: claim.outcome
  terminal_values: [pass, fail, suitable, unsuitable, inconclusive]
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [claim, assessment_state, observations, evidence_refs, assessor_ref]
  properties:
    claim:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, scope, outcome, formal_evidence_eligible]
          properties:
            kind: {const: qualification}
            scope: {const: environment-capability}
            outcome: {enum: [pass, fail]}
            formal_evidence_eligible: {const: false}
        - type: object
          additionalProperties: false
          required: [kind, scope, outcome, formal_evidence_eligible]
          properties:
            kind: {const: pilot}
            scope: {const: verification-design}
            outcome: {enum: [suitable, unsuitable, inconclusive]}
            formal_evidence_eligible: {const: false}
        - type: object
          additionalProperties: false
          required: [kind, scope, outcome, formal_evidence_eligible]
          properties:
            kind: {const: formal}
            scope: {const: requirement}
            outcome: {enum: [pass, fail, inconclusive]}
            formal_evidence_eligible: {const: true}
    assessment_state: {enum: [recorded, assessment-required, accepted, rejected, inconclusive]}
    observations:
      type: object
      additionalProperties: false
      required: [expected_success_observed, expected_discrimination_observed, details]
      properties:
        expected_success_observed: {type: boolean}
        expected_discrimination_observed: {type: boolean}
        details: {type: string, minLength: 1}
    control_judgments:
      type: object
      additionalProperties: false
      required: [known_good, known_bad]
      properties:
        known_good:
          type: object
          additionalProperties: false
          required: [observation_ref, outcome]
          properties:
            observation_ref: {const: known_good}
            outcome: {const: pass}
        known_bad:
          type: object
          additionalProperties: false
          required: [observation_ref, outcome]
          properties:
            observation_ref: {const: known_bad}
            outcome: {const: fail}
    evidence_refs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    assessor_ref: {type: string, minLength: 1}
outgoing_links:
  - id: assessed-in
    description: Exact environment in which this immutable result was produced.
    targets:
      - {kind: datum, types: [ENV], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: assessment-result
  - id: verifies
    description: Stable requirement claims assessed by this exact result; freeze-time baselines preserve the exact resolution.
    targets:
      - {kind: datum, types: [STK, SYS], identity: stable}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: verified-by-result
  - id: changed-under
    description: Exact approved Change Request requiring this replacement verification evidence.
    targets:
      - {kind: datum, types: [CHG], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: changed-verification-evidence
kernel_managed_payload_paths: []
