kind: type-definition
id: RES
version: 1
description: Verification observations
name: Verification observations
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - observations
  - evidence
  - correction_target
  properties:
    publication:
      const: recorded
    observations:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - stdin
        - stdout
        - stderr
        - exit_code
        properties:
          id: &id001
            type: string
            minLength: 1
          stdin:
            type: string
          stdout:
            type: string
          stderr:
            type: string
          exit_code:
            type: integer
            minimum: 0
            maximum: 255
    evidence: *id001
    correction_target:
      enum:
      - none
      - requirements
      - implementation
outgoing_links:
- id: verifies
  description: verifies
  targets:
  - kind: datum
    types:
    - REQ
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-verifies
- id: executes
  description: executes
  targets:
  - kind: datum
    types:
    - IMP
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-executes
kernel_managed_payload_paths: []
