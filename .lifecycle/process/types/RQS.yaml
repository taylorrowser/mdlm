  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  properties:
    publication:
      const: recorded
outgoing_links:
- id: contains
  description: contains
  targets:
  - kind: datum
    types:
    - REQ
    identity: revision
  cardinality:
    minimum: 1
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-contains
- id: corrects
  description: corrects
  targets:
  - kind: datum
    types:
    - REV
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-corrects
kernel_managed_payload_paths:
- title
