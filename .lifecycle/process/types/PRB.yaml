kind: type-definition
id: PRB
version: 1
name: Problem Report
description: Exact report of a failure or unexpected condition and the evidence in which it was observed.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [condition, severity, disposition, evidence_refs]
  properties:
    condition: {type: string, minLength: 1}
    severity: {enum: [critical, major, minor, observation]}
    disposition: {enum: [open, change-planned, dismissed, closed]}
    evidence_refs:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: '^(RUN|RES|REV|ART)-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}$'}
    closure_summary: {type: string, minLength: 1}
outgoing_links:
  - id: reports
    description: Exact run, result, review, or implementation evidence in which the condition was observed.
    targets:
      - {kind: datum, types: [RUN, RES, REV, ART], identity: revision}
    cardinality: {minimum: 1, maximum: many}
    freeze_resolution: already-exact
    inverse_label: reported-by
  - id: resolved-by
    description: Exact closure Decision resolving this reported condition.
    targets:
      - {kind: datum, types: [DEC], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: resolves-problem
kernel_managed_payload_paths: []
