kind: type-definition
id: QST
version: 4
name: Question
description: Preferential or empirical question whose unresolved answer blocks or defers lifecycle work.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [kind, question, state, blocking_impact]
  properties:
    kind: {enum: [preferential, empirical]}
    intent_scope: {enum: [product]}
    question: {type: string, minLength: 1}
    attended_answer: {type: string, minLength: 1}
    state: {enum: [open, answered, deferred, cancelled]}
    blocking_impact: {type: string, minLength: 1}
    reactivation_condition: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
    evidence_available: {type: boolean}
    resolution_disposition: {enum: [answer, defer, cancel]}
    attention_checkpoint: {enum: [phase-0-gate, phase-2-system-gate]}
    consolidation_group: {enum: [phase-0-stakeholder-questions, phase-2-system-stakeholder-questions]}
    resolution_evidence: {enum: [prototype]}
    prototype_evidence:
      type: object
      additionalProperties: false
      required: [repository_ref, supported_behavior, unsupported_behavior, finding_if_supported, finding_if_not_supported]
      properties:
        repository_ref: {type: string, pattern: '^git:[0-9a-f]{40}$'}
        supported_behavior:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        unsupported_behavior:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        finding_if_supported: {type: string, minLength: 1}
        finding_if_not_supported: {type: string, minLength: 1}
  dependentRequired:
    attention_checkpoint: [consolidation_group]
    consolidation_group: [attention_checkpoint]
    resolution_evidence: [prototype_evidence]
    prototype_evidence: [resolution_evidence]
  allOf:
    - if:
        properties:
          kind: {const: preferential}
          intent_scope: {const: product}
          state: {const: answered}
        required: [kind, intent_scope, state]
      then:
        required: [attended_answer]
    - if: {required: [attended_answer]}
      then:
        properties:
          kind: {const: preferential}
          state: {const: answered}
    - if:
        properties:
          state: {const: deferred}
        required: [state]
      then:
        required: [reactivation_condition]
    - if: {required: [evidence_available]}
      then:
        properties:
          kind: {const: empirical}
    - if:
        anyOf:
          - {required: [attention_checkpoint]}
          - {required: [consolidation_group]}
      then:
        properties:
          kind: {const: preferential}
    - if: {required: [resolution_evidence]}
      then:
        properties:
          kind: {const: empirical}
outgoing_links:
  - id: blocks
    description: Lifecycle concepts whose progress depends on this open question.
    targets:
      - {kind: datum, types: [PSP, STK, SYS, ASP, ICSP, DWP, VSP, ENV, VER, VAI, BSL, QST, DEC], identity: stable}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: blocked-by
kernel_managed_payload_paths: []
