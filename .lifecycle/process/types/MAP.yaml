kind: type-definition
id: MAP
version: 3
name: Wayfinding Map
description: Linked index of decision areas, exact questions, prototype evidence, and product-intent data without restating their claims.
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [purpose, frontier]
  properties:
    purpose: {type: string, minLength: 1}
    frontier:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
outgoing_links:
  - id: indexes
    description: Stable lifecycle concepts indexed by this wayfinding map.
    targets:
      - {kind: datum, types: [QST, DEC, ART, PSP, STK], identity: stable}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: exact-revision
    inverse_label: indexed-by
  - id: incorporates-answer
    description: Exact reviewed product-answer Decisions incorporated by this wayfinding-map Revision.
    targets:
      - {kind: datum, types: [DEC], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: incorporated-by-wayfinding-map
  - id: corrects-review
    description: Exact failed Reviews whose blocking findings this replacement map Revision addresses.
    targets:
      - {kind: datum, types: [REV], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-by
  - id: corrects-gate-rejection
    description: Exact reviewed gate rejection Decisions whose findings this replacement map Revision addresses.
    targets:
      - {kind: datum, types: [DEC], identity: revision}
    cardinality: {minimum: 0, maximum: many}
    freeze_resolution: already-exact
    inverse_label: corrected-after-gate-rejection
kernel_managed_payload_paths: []
