kind: type-definition
id: ENV
version: 1
name: Verification Environment
description: Reproducible realization of exact named verification-strategy environment profiles.
extends: rationale-bearing@1
lifecycle:
  authorship: authored
  freeze_when: baseline-frozen
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [profile_refs, capabilities, reproducibility]
  properties:
    profile_refs:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: '^VSP-[0-9A-HJKMNP-TV-Z]{10,12}-r[0-9]{5}#[a-z][a-z0-9-]*$'}
    capabilities:
      type: object
      additionalProperties: false
      required: [controllability, observability, external_services, timing]
      properties:
        controllability: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        observability: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        external_services: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
        timing: {type: string, minLength: 1}
    reproducibility:
      type: object
      additionalProperties: false
      required: [environment_ref, configuration_digest, reconstruction]
      properties:
        environment_ref: {type: string, minLength: 1}
        configuration_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        reconstruction: {type: string, minLength: 1}
outgoing_links:
  - id: realizes
    description: Exact strategy revision whose named profiles this environment realizes.
    targets:
      - {kind: datum, types: [VSP], identity: revision}
    cardinality: {minimum: 1, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: realized-by
  - id: qualified-by
    description: Exact passing qualification result establishing this environment's declared capabilities.
    targets:
      - {kind: datum, types: [RES], identity: revision}
    cardinality: {minimum: 0, maximum: 1}
    freeze_resolution: already-exact
    inverse_label: qualifies-environment
kernel_managed_payload_paths: []
