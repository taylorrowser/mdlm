kind: policy-definition
id: review-applicability
version: 1
description: Determines whether an exact revision requires independent review and selects its rubric.
parameters:
  - {name: subject, kind: revision}
result_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [required, rubric_ref]
  properties:
    required: {type: boolean}
    rubric_ref: {type: [string, 'null']}
default:
  required: false
  rubric_ref: null
rules:
  - priority: 300
    when:
      compare:
        left: {path: {var: subject, field: identity.type}}
        operator: in
        right: {literal: [PSP, STK, SYS]}
    result:
      required: true
      rubric_ref: policies/rubrics/bootstrap-review.md@1
  - priority: 200
    when:
      all:
        - compare:
            left: {path: {var: subject, field: identity.type}}
            operator: eq
            right: {literal: BSL}
        - compare:
            left: {path: {var: subject, field: payload.role}}
            operator: eq
            right: {literal: candidate}
    result:
      required: true
      rubric_ref: policies/rubrics/bootstrap-review.md@1
  - priority: 100
    when:
      all:
        - compare:
            left: {path: {var: subject, field: identity.type}}
            operator: eq
            right: {literal: DEC}
        - compare:
            left: {path: {var: subject, field: payload.kind}}
            operator: in
            right: {literal: [scope, waiver, deferral, gate-signoff, retirement, cancellation]}
    result:
      required: true
      rubric_ref: policies/rubrics/bootstrap-review.md@1
