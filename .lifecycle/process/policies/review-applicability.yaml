kind: policy-definition
id: review-applicability
version: 1
description: Determines whether an exact revision requires independent review and selects its rubric.
parameters:
  - {name: subject, kind: revision}
result_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [required, rubric_ref]
  properties:
    required: {type: boolean}
    rubric_ref: {type: [string, 'null']}
default:
  required: false
  rubric_ref: null
rules:
  - priority: 300
    when: 'subject.identity.type in ["PSP", "STK", "SYS"]'
    result:
      required: true
      rubric_ref: policies/rubrics/bootstrap-review.md@1
  - priority: 200
    when: >-
      subject.identity.type == "BSL"
      && subject.payload.role == "candidate"
    result:
      required: true
      rubric_ref: policies/rubrics/bootstrap-review.md@1
  - priority: 100
    when: >-
      subject.identity.type == "DEC"
      && subject.payload.kind in ["scope", "waiver", "deferral", "gate-signoff", "retirement", "cancellation"]
    result:
      required: true
      rubric_ref: policies/rubrics/bootstrap-review.md@1
