kind: type-definition
id: TRY
version: 5
name: Prototype trial
description: Prototype trial
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - repository_path
  - source_commit
  - command
  properties:
    publication:
      const: recorded
    repository_path:
      type: string
      pattern: ^/
    source_commit:
      type: string
      pattern: ^[0-9a-f]{40}$
    command:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
outgoing_links:
- id: uses-interface
  description: Exact interface context; necessary obligations remain explicit requirements
  targets:
  - kind: datum
    types:
    - ICD
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-uses-interface
- id: explores
  description: explores
  targets:
  - kind: datum
    types:
    - EXP
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-explores
- id: responds-to
  description: responds-to
  targets:
  - kind: datum
    types:
    - FDB
    - OBS
    identity: revision
  cardinality:
    minimum: 0
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-responds-to
- id: verification
  description: verification
  targets:
  - kind: datum
    types:
    - VFY
    identity: revision
  cardinality:
    minimum: 1
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-verification
kernel_managed_payload_paths: []
