kind: type-definition
id: RES
version: 2
description: Verification result
name: Verification result
extends: titled-datum@1
lifecycle:
  authorship: authored
  freeze_when: terminal-outcome
  terminal_payload_field: publication
  terminal_values:
  - recorded
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - publication
  - outcome
  - receipt
  - assessment
  - correction_target
  - case_results
  - artifacts
  properties:
    publication:
      const: recorded
    outcome:
      enum:
      - pass
      - fail
      - error
    receipt:
      type: string
      minLength: 1
    assessment:
      type: string
      minLength: 1
    correction_target:
      enum:
      - none
      - requirements
      - implementation
      - verification
    case_results:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - case_id
        - outcome
        - actual_results
        - evidence_refs
        properties:
          case_id: &id001
            type: string
            minLength: 1
          outcome:
            enum:
            - pass
            - fail
            - error
            - skipped
          actual_results:
            type: array
            minItems: 1
            items: *id001
          evidence_refs:
            type: array
            items: *id001
    artifacts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - path
        - sha256
        - bytes
        properties:
          path:
            type: string
            minLength: 1
          sha256:
            type: string
            minLength: 1
          bytes:
            type: integer
            minimum: 0
outgoing_links:
- id: verifies
  description: verifies
  targets:
  - kind: datum
    types:
    - RQS
    - EXP
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-verifies
- id: executes
  description: executes
  targets:
  - kind: datum
    types:
    - IMP
    - TRY
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-executes
- id: evaluates
  description: evaluates
  targets:
  - kind: datum
    types:
    - VFY
    identity: revision
  cardinality:
    minimum: 1
    maximum: 1
  freeze_resolution: already-exact
  inverse_label: incoming-evaluates
- id: supersedes
  description: supersedes
  targets:
  - kind: datum
    types:
    - RES
    identity: revision
  cardinality:
    minimum: 0
    maximum: many
  freeze_resolution: already-exact
  inverse_label: incoming-supersedes
kernel_managed_payload_paths:
- outcome
- receipt
- case_results
- artifacts
