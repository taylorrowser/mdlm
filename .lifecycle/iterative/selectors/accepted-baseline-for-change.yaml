kind: selector-definition
id: accepted-baseline-for-change
version: 1
description: Exact valid stakeholder acceptance named by a change
parameters:
- name: change
  kind: revision
  types: [CHG]
result_kind: revision
query:
  from:
    relation: "outgoing-links"
    of: "change"
    link: "baseline"
    emit: "target"
    types: ["ACC"]
  as: item
  where: "state(item, \"validity\") == \"valid\" && item.integrity.transaction_valid == true && item.payload.decision == \"accept\""
  distinct: true
  order_by:
  - identity.revision_id
