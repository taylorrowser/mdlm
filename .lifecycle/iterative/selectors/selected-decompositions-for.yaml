kind: selector-definition
id: selected-decompositions-for
version: 1
description: Exact selected graph members in revision order
parameters:
- name: requirements
  kind: revision
  types: [RQS]
result_kind: revision
query:
  from:
    relation: "outgoing-links"
    of: "requirements"
    link: "decomposition"
    emit: "target"
    types: ["DCP"]
  as: item
  distinct: true
  order_by:
  - identity.revision_id
