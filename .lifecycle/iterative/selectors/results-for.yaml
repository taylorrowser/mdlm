kind: selector-definition
id: results-for
version: 1
description: results for
parameters:
- name: implementation
  kind: revision
  types:
  - IMP
result_kind: revision
query:
  from:
    relation: incoming-links
    of: implementation
    link: executes
    emit: source
    types:
    - RES
  as: item
  where: state(item, "validity") == "valid"
  distinct: true
  order_by:
  - identity.revision_id
