kind: selector-definition
id: reviewed-current-product-for-set
version: 1
description: Current implementation reviewed against this exact current requirement selection
parameters:
- name: review
  kind: revision
  types:
  - REV
- name: requirements
  kind: revision
  types:
  - RQS
result_kind: revision
query:
  from:
    relation: outgoing-links
    of: review
    link: reviews
    emit: target
    types:
    - IMP
  as: item
  where: 'state(item, "validity") == "valid" && none("newer-revisions@1", {subject: item}) && exists("requirements-for@1", {implementation: item}) && every("requirements-for@1", {implementation: item}, selected => selected.identity.revision_id == requirements.identity.revision_id)'
  distinct: true
  order_by:
  - identity.revision_id
