kind: selector-definition
id: revision-observations
version: 2
description: Revision observations whose trial has no accepted successor
parameters:
  - name: experiment
    kind: revision
    types:
      - EXP
result_kind: revision
query:
  from:
    relation: incoming-links
    of: experiment
    link: against
    emit: source
    types:
      - OBS
  as: item
  where: 'item.payload.recommendation == "revise" &&
    every("trial-for-observation@1", {observation: item}, trial =>
    none("newer-revisions@1", {subject: trial}))'
  distinct: true
  order_by:
    - identity.revision_id
