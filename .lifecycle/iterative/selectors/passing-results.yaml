kind: selector-definition
id: passing-results
version: 1
description: passing results
parameters:
- name: implementation
  kind: revision
  types:
  - IMP
result_kind: revision
query:
  from:
    relation: incoming-links
    of: implementation
    link: executes
    emit: source
    types:
    - RES
  as: item
  where: 'state(item, "validity") == "valid" && exists("requirements-for-result@1", {result: item}) && item.payload.outcome
    == "pass" && none("superseding-results@1", {result: item})'
  distinct: true
  order_by:
  - identity.revision_id
