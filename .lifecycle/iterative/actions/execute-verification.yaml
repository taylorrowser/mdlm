kind: action-definition
id: execute-verification
version: 1
description: Run committed Docker verification
capability: verification-result
prompt_ref: prompts/execute-verification.md@1
types:
- RES
subjects: select("current-implementations@1", {})
inputs:
  implementation: subject
  requirements: 'one("requirements-for@1", {implementation: subject})'
when: '!(exists("results-for@1", {implementation: subject})) && (true)'
priority: 100
links:
  RES:
    executes: implementation
    verifies: requirements
fixed_payload:
  RES:
    publication: recorded
    title: Verification result
