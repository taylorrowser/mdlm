kind: action-definition
id: review-implementation
version: 2
description: Review implementation and execution evidence
capability: review
prompt_ref: prompts/review-implementation.md@14
types:
- REV
subjects: select("current-implementations@1", {})
inputs:
  interfaces: 'select("selected-interfaces@1", {requirements: one("requirements-for@1", {implementation: subject})})'
  subject: subject
  requirements: 'one("requirements-for@1", {implementation: subject})'
  activities: 'select("selected-verification-activities@1", {product: subject})'
  results: 'select("results-for@1", {implementation: subject})'
when: '(!(exists("reviews-for@1", {subject: subject})) && (exists("passing-results@1", {implementation: subject})))
  && (exists("selected-verification-activities@1", {product: subject}) && every("selected-verification-activities@1",
  {product: subject}, activity => exists("pass-reviews@1", {subject: activity}) && none("fail-reviews@1", {subject:
  activity}) && exists("passing-activity-results@1", {activity: activity, product: subject})))'
priority: 100
links:
  REV:
    reviews: subject
    uses-evidence: results
fixed_payload:
  REV:
    publication: recorded
authority:
  kind: independent-review
  name: independent-reviewer
