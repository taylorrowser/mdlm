kind: action-definition
id: review-implementation
version: 1
description: Review implementation and execution evidence
capability: review
prompt_ref: prompts/review-implementation.md@9
types:
- REV
subjects: select("current-implementations@1", {})
inputs:
  subject: subject
  requirements: 'one("requirements-for@1", {implementation: subject})'
  result: 'one("passing-results@1", {implementation: subject})'
when: '!(exists("reviews-for@1", {subject: subject})) && (exists("passing-results@1", {implementation:
  subject}))'
priority: 100
links:
  REV:
    reviews: subject
    uses-evidence: result
fixed_payload:
  REV:
    publication: recorded
authority:
  kind: independent-review
  name: independent-reviewer
