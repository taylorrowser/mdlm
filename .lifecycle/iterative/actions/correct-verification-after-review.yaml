kind: action-definition
id: correct-verification-after-review
version: 5
description: Correct a verification activity after a failed adequacy review
capability: verification-activity
prompt_ref: prompts/plan-verification.md@20
types:
- VFY
subjects: select("current-verification-activities@1", {})
inputs:
  activity: subject
  failure: 'one("fail-reviews@1", {subject: subject})'
when: 'exists("fail-reviews@1", {subject: subject})'
priority: 90
links: {}
fixed_payload:
  VFY:
    publication: recorded
revises:
  VFY: activity
