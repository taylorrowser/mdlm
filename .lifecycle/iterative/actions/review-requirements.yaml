kind: action-definition
id: review-requirements
version: 2
description: Review requirements
capability: review
prompt_ref: prompts/review-requirements.md@6
types:
- REV
subjects: select("current-requirements@1", {})
inputs:
  subject: subject
when: '!(exists("reviews-for@1", {subject: subject})) && none("reusable-requirements-review@1", {requirements: subject})'
priority: 100
links:
  REV:
    reviews: subject
fixed_payload:
  REV:
    publication: recorded
authority:
  kind: independent-review
  name: independent-reviewer
