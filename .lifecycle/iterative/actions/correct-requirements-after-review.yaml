kind: action-definition
id: correct-requirements-after-review
version: 12
description: Correct requirements after set or implementation Review
capability: requirements
prompt_ref: prompts/correct-requirements-after-review.md@18
types:
- REQ
- DCP
- RQS
subjects: select("current-requirements@1", {})
inputs:
  subject: subject
  failure: 'one("requirement-correction-reviews@1", {requirements: subject})'
when: '!(none("requirement-correction-reviews@1", {requirements: subject})) && (exists("requirement-correction-reviews@1", {requirements: subject})
  && every("requirement-correction-reviews@1", {requirements: subject}, failed => failed.payload.scope_amendment_required ==
  false))'
priority: 100
links:
  RQS:
    corrects: failure
revises:
  RQS: subject
fixed_payload:
  REQ:
    publication: recorded
  DCP:
    publication: recorded
  RQS:
    publication: recorded
