kind: action-definition
id: revise-experiment
version: 4
description: revise-experiment
capability: experiment
prompt_ref: prompts/revise-experiment.md@5
types:
- EXP
subjects: select("current-experiments@1", {})
inputs:
  subject: subject
  observation: 'one("revision-observations@2", {experiment: subject})'
  baseline: 'select("comparison-baseline-for@1", {experiment: subject})'
when: 'exists("revision-observations@2", {experiment: subject})'
priority: 100
links:
  EXP:
    responds-to: observation
    compares-to: baseline
revises:
  EXP: subject
fixed_payload:
  EXP:
    publication: recorded
