kind: action-definition
id: correct-expectations
version: 6
description: Correct a wrong acceptance expectation
capability: requirements
prompt_ref: prompts/correct-expectations.md@12
types:
- REQ
- DCP
- RQS
subjects: select("expectation-failures@1", {})
inputs:
  failure: subject
  subject: 'one("requirements-for-result@1", {result: subject})'
when: '!(false) && (true)'
priority: 100
links:
  RQS:
    corrects: failure
revises:
  RQS: subject
fixed_payload:
  REQ:
    publication: recorded
  DCP:
    publication: recorded
  RQS:
    publication: recorded
