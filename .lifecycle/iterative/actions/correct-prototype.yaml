kind: action-definition
id: correct-prototype
version: 2
description: Correct product source after a revise observation under the unchanged experiment and verification
capability: prototype
prompt_ref: prompts/correct-prototype.md@1
types: [TRY]
subjects: select("current-experiments@1", {})
inputs:
  experiment: subject
  observation: 'one("revision-observations@3", {experiment: subject})'
  product: 'one("trial-for-observation@1", {observation: one("revision-observations@3", {experiment: subject})})'
  verification: 'select("selected-verification-activities@1", {product: one("trial-for-observation@1", {observation: one("revision-observations@3", {experiment: subject})})})'
  interfaces: 'select("interfaces-for@1", {subject: one("trial-for-observation@1", {observation: one("revision-observations@3", {experiment: subject})})})'
when: 'exists("revision-observations@3", {experiment: subject})'
priority: 100
links:
  TRY:
    explores: experiment
    responds-to: observation
    verification: verification
    uses-interface: interfaces
revises:
  TRY: product
fixed_payload:
  TRY:
    publication: recorded
