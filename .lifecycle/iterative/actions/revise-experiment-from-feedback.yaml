kind: action-definition
id: revise-experiment-from-feedback
version: 2
description: revise-experiment
capability: experiment
prompt_ref: prompts/revise-experiment.md@3
types:
- EXP
subjects: select("criteria-feedback@1", {})
inputs:
  subject: 'one("experiment-for-observation@1", {observation: one("observation-for-feedback@1", {feedback:
    subject})})'
  observation: subject
  baseline: 'select("comparison-baseline-for@1", {experiment: one("experiment-for-observation@1", {observation: one("observation-for-feedback@1", {feedback: subject})})})'
when: '!(exists("experiment-responses-for@1", {feedback: subject})) && (true)'
priority: 100
links:
  EXP:
    responds-to: observation
    compares-to: baseline
revises:
  EXP: subject
fixed_payload:
  EXP:
    publication: recorded
